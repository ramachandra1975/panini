   2-3-3-2-2-3-4-4-3-2-2-3-4</pre><p>The pattern has a clear structure. It begins with the jaṭā of the first pair (1-2-2-1-1-2), then runs on to the third word and goes back to the start (3-3-2-1), and then rebuilds forward (1-2-3). Each triple is thus checked in several orders. The ends of a verse have special closing patterns, which this short program does not reproduce.</p><p>The ghana is long. Each triple takes thirteen words, so that a verse of <i>n</i> words recites about <i>13(n − 2)</i> words. A student who has learned the ghana of a text has learned it in a form in which almost any local error would break the pattern. The ghana is the form for which a reciter has the highest honour, and the title <i>ghanapāṭhī</i> is still used for those who have mastered it.</p>`],
['Fidelity of Oral Transmission','Counting the Recitations',`<p>The recitation forms multiply the amount to be learned. A short program counts the words recited in each form for verses of different lengths.</p><pre class="code">from pathas import krama, jata, ghana

for n in (4, 8, 12):
    w = list(range(1, n + 1))
    k = sum(len(r) for r in krama(w))
    j = sum(len(r) for r in jata(w))
    g = sum(len(r) for r in ghana(w))
    print(n, "words: samhita", n, " krama", k, " jata", j, " ghana", g)</pre><pre class="code out">4 words: samhita 4  krama 6  jata 18  ghana 26
8 words: samhita 8  krama 14  jata 42  ghana 78
12 words: samhita 12  krama 22  jata 66  ghana 130</pre><p>For a verse of twelve words, the jaṭā is more than five times the length of the plain text, and the ghana more than ten times. The numbers show why these forms were treated as advanced study. They also show the principle of the design: the cost of checking is paid by the learner, who memorises all the forms, and the benefit is paid to the tradition, which gets a text that resists change.</p><p>Calculations of the amount of time needed give a rough sense. A reciter who knows the whole Ṛgveda, about ten thousand verses, in the samhita, pada, krama, jaṭā, and ghana forms has memorised many times the length of the plain text, and the years of study are understandable.</p><p>These numbers are exact for the simplified patterns used in the code. The traditional recitations have special rules for the ends of verses and for compounds, and so real counts are somewhat larger.</p>`],
['Fidelity of Oral Transmission','Error Detection by Redundancy',`<p>Engineers who read about the recitation orders often recognise an idea from their own work. To keep data safe in storage or in transit, they add <b>redundant</b> information, extra material that can be used to check the rest. The simplest example is a <b>parity bit</b>: one extra bit, set so that the total number of ones in the message is even. If one bit is flipped by accident, the total becomes odd and the error shows.</p><pre class="code">def parity(bits):
    return sum(bits) % 2

data = [1, 0, 1, 1, 0, 1, 0]
sent = data + [parity(data)]            # add one check bit
print(sent, "parity ok:", parity(sent) == 0)
sent[2] ^= 1                            # flip one bit in transit
print(sent, "parity ok:", parity(sent) == 0)
sent[4] ^= 1                            # flip a second bit
print(sent, "parity ok:", parity(sent) == 0)</pre><pre class="code out">[1, 0, 1, 1, 0, 1, 0, 0] parity ok: True
[1, 0, 0, 1, 0, 1, 0, 0] parity ok: False
[1, 0, 0, 1, 1, 1, 0, 0] parity ok: True</pre><p>The third line is a warning. Two flipped bits cancel in the parity check, so the error is missed. Real systems use stronger codes, such as checksums and error-correcting codes, which can catch several errors and even repair them.</p><p>The recitation orders work in the same spirit, but they are not literally parity bits or checksums. They are overlapping rearrangements of the same words, and an error is found when the arrangements disagree.</p>`],
['Fidelity of Oral Transmission','A Worked Error',`<p>The mechanism can be shown with a short example. Take the first four words of the Ṛgveda. Suppose a reciter mishears the second word, <i>īḷe</i>, as <i>īle</i>, a one-letter change. The krama pairs of the heard version are compared with those of the original.</p><pre class="code">original = ["agnim", "īḷe", "purohitam", "yajñasya"]
heard    = ["agnim", "īle", "purohitam", "yajñasya"]   # one wrong syllable

def pairs(words):
    return [(words[i], words[i + 1]) for i in range(len(words) - 1)]

pada_ok = original                      # the word-by-word form, learned apart
for i, (a, b) in enumerate(pairs(heard)):
    expected = pairs(original)[i]
    print(i + 1, "ok" if (a, b) == expected else "MISMATCH", (a, b))
print("pada form disagrees at word", [i + 1 for i, (x, y) in enumerate(zip(heard, pada_ok)) if x != y])</pre><pre class="code out">1 MISMATCH ('agnim', 'īle')
2 MISMATCH ('īle', 'purohitam')
3 ok ('purohitam', 'yajñasya')
pada form disagrees at word [2]</pre><p>The single wrong word shows up in two of the three pairs and in the word-by-word form. A reciter who knows the pairs, or a teacher who checks, has three separate chances to hear the fault. In real recitation the checking is done by ear and memory, and not by a program, but the logic is the same.</p><p>An error in the middle of a verse is the easiest kind to find. Errors near the beginning or end of a line, which are touched by fewer pairs, are somewhat harder, and the traditional forms add closing patterns to strengthen them.</p>`],
['Fidelity of Oral Transmission','What Redundancy Cannot Catch',`<p>No method is perfect, and it is better to say what this one cannot do.</p><p><b>Systematic errors.</b> If a whole school teaches a wrong form consistently, every recitation order will agree with the others, since all were learned from the same source. Redundancy catches random mistakes. It does not catch an error that has been learned as correct.</p><p><b>Two matching errors.</b> As with the parity bit, two errors that are consistent with each other could escape.</p><p><b>Errors before the system.</b> If a text was already corrupt when the recitation forms were fixed, they would preserve the corruption faithfully.</p><p><b>Meaning.</b> The system preserves sounds, not understanding, and the meaning of a hymn could be lost while its sounds were kept. Some Vedic passages were already obscure to the commentators of the first millennium.</p><p><b>Loss of whole texts.</b> The method protects the texts that are learned. It does not save those that are not taught. A later page describes how many branches of the Veda were lost.</p><p>These limits matter because the strongest claims for the tradition say that it gave "perfect" transmission. The better statement is that it gave an unusually high degree of fidelity for the texts it kept, and that the evidence for this is strong but not absolute.</p>`],
['Fidelity of Oral Transmission','Phonetic Rigidity: The Śikṣā Tradition',`<p><i>Śikṣā</i>, "instruction", is the science of pronunciation, one of the six limbs of the Veda. It describes, for each sound, the place of articulation (throat, palate, roof of the mouth, teeth, lips), the effort of the organs, the duration, and the pitch. A student learns the sounds as a set of precise physical actions.</p><p>The tradition was thorough. It classified the consonants by place and by manner, the vowels by length and nasality, and the accents by pitch, and it taught the faults to avoid, such as swallowing a syllable, hissing, or speaking too fast. The <i>Pāṇinīya Śikṣā</i>, a short text in verse, is one of the well-known manuals.</p><p>This precision had two effects for transmission. It gave teachers and pupils a common standard against which any recitation could be judged. And it made the sounds of the Veda teachable as a skill, so that a pupil in Kerala and a pupil in Kashmir who were taught by the same method would produce the same sounds.</p><p>Modern phoneticians have studied the system with respect, and have noted that its classification of sounds is, in many respects, close to the standards of modern articulatory phonetics, which was established in Europe much later.</p>`],
['Fidelity of Oral Transmission','The Prātiśākhyas',`<p>The <i>Prātiśākhyas</i> are manuals attached to the individual schools (<i>śākhā</i>) of the Veda. Each lists exactly how the continuous text of that school is derived from the word-by-word text, giving the rules of sandhi and accent as they apply to that Veda, and the exceptions.</p><p>The best known is the <i>Ṛgveda Prātiśākhya</i>, attributed to Śaunaka, and there are others for the Yajurveda and Atharvaveda schools, such as the <i>Taittirīya Prātiśākhya</i> and the <i>Vājasaneyi Prātiśākhya</i>. They are older than Pāṇini, or at least reflect the earlier tradition, and many of Pāṇini's methods, such as precise definition of terms and ordering of rules, appear in them in an earlier form.</p><p>For transmission, the Prātiśākhyas worked as a rule-book against which the text could be checked. If a reciter's saṃhitā text did not follow from the pada text by the rules of the manual, something was wrong. The system thus had a written or memorised standard and not just the habits of a school.</p><p>The Prātiśākhyas are also important for the history of linguistics. They show that Indian scholars had worked out a detailed theory of sound change in context, which Pāṇini later put into a more compact and general form.</p>`],
['Fidelity of Oral Transmission','Accent and Hand Gestures',`<p>The pitch accent of the Veda is difficult to keep by ear alone, and different traditions developed ways to support it. In the recitation of the Sāmaveda, melodies are tied to the text, and the accents are marked by the notes. In the recitation of the Ṛgveda and Yajurveda, some schools use movements of the hand and head to mark the accents. The hand rises for the high pitch, drops for the low, and makes a particular movement for the falling pitch.</p><p>This practice is best known from the Nambudiri Brahmins of Kerala, whose recitation has been recorded and studied. The gestures help the teacher to see, as well as hear, whether the pupil has the right accent, and the pupil has a physical aid to remember it.</p><p>In written texts the accents are marked by short lines placed above and below the letters, in a system that differs somewhat among the schools. The marks are an addition to the written form, made so that a reader can recover the accents, and they date from the time when the texts began to be written down.</p><p>The importance of accent is shown by the story, told in the previous chapter, of the word <i>indraśatru</i>, in which a wrong accent changed the meaning. The tradition thus treated accent as part of the text, and trained its reciters to keep it.</p>`],
['Fidelity of Oral Transmission','Duration and Measure: Mātrā',`<p>Besides place and pitch, the tradition fixed the <i>duration</i> of each sound. The unit is the <i>mātrā</i>, the time taken to say a short vowel. A long vowel takes two mātrās, a protracted (<i>pluta</i>) vowel three, and a consonant half a mātrā. The term is the same as the one used for the units of metre and for the beats of music, as the chapter on Tāla in the main book described.</p><p>The distinction is not a detail. A change in the length of a vowel can change a word, and in verse it changes the metre. In a metre such as the <i>anuṣṭubh</i>, with its fixed count of syllables, a wrongly lengthened or shortened syllable breaks the pattern of the line, and the ear catches it.</p><p>Metre is thus another check. The Vedic metres, such as the <i>gāyatrī</i> with three lines of eight syllables, fix the length of each line, so that a missing or extra syllable is evident. Modern scholars use the metre to find where the transmitted text has been altered, as the later page on linguistic tests describes.</p><p>Metre, accent, duration, and the word-by-word and woven recitations together make a system with many independent checks.</p>`],
['Fidelity of Oral Transmission','The Nambudiri Reciters and Frits Staal',`<p>The Nambudiri Brahmins of Kerala have kept the Vedic tradition, in several schools, to the present day. In 1975 an Agnicayana, a very old Vedic ritual of building a fire altar in the shape of a bird, was performed at Panjal in Kerala, and it was recorded in detail by a team led by the philosopher and Sanskritist Frits Staal. Staal's book <i>Agni: The Vedic Ritual of the Fire Altar</i> (1983) and a film and recordings document the ritual and its chants.</p><p>Staal also studied the oral transmission in a paper in 1986, "The Fidelity of Oral Tradition and the Origins of Science", in which he argued that the Vedic tradition had kept its texts with a fidelity remarkable by any standard, and that the training had effects of its own, such as the development of precise methods of analysis.</p><p>Staal's work is valuable because it is based on observation of living reciters. His recordings allow comparison between schools and give a record of how the texts sound. His strong claims about the fidelity of the tradition have been influential, and have been supported by much other work, though some scholars hold that transmission has been less perfect than he suggested, as the next pages show.</p>`],
['Fidelity of Oral Transmission','Vedic Chanting and UNESCO',`<p>In 2003 UNESCO proclaimed the tradition of Vedic chanting a "Masterpiece of the Oral and Intangible Heritage of Humanity", and in 2008 it was included in the Representative List of the Intangible Cultural Heritage of Humanity. The recognition covered the whole tradition of chanting the four Vedas by the schools that keep it, including the methods of transmission described in this chapter.</p><p>The listing recognised the age of the tradition and its methods, and it also drew attention to the risk to it. The number of trained reciters has fallen sharply. The long years of study, the lack of employment, and the pressures of modern schooling have discouraged families from sending sons to the traditional schools, and many branches survive with only a few experts.</p><p>In response, government bodies, universities, and private foundations in India have supported Vedic schools, with scholarships, recordings, and exams. The Telugu states have had several such centres, including those linked with temples and with the Vedic schools of Andhra and Telangana, which keep the recitation of the Yajurveda in particular.</p><p>The recognition is a reason to treat the tradition as a living one, whose preservation depends on teachers and pupils now, and not only as a subject of history.</p>`],
['Fidelity of Oral Transmission','Comparing Manuscripts Across Regions',`<p>One strong test of fidelity is to compare copies made in different places, which were not in contact. If the texts agree closely, transmission was reliable. Nineteenth-century scholars, among them Max Müller in his edition of the Ṛgveda with the commentary of Sāyaṇa (published from 1849), collected manuscripts from different regions of India, including Kashmir, Kerala, Bengal, and Nepal, and from different schools.</p><p>They found that the manuscripts of the Śākala recension of the Ṛgveda agree to a very high degree. The text, including the accents where they are marked, is almost identical, in copies from places far apart and written centuries apart. This is strong evidence that the oral tradition behind them had kept the text with remarkable accuracy.</p><p>The phrase "almost identical" must be taken literally. The agreement is very high, but it is not complete, and scholars do note variant readings, copying mistakes, and differences in the accent marks. Statements that the manuscripts agree "100%" are an overstatement, though a common one.</p><p>The comparison also needs care. The manuscripts that survive are mostly from the last thousand years, since the climate destroys old palm leaf and paper. The agreement shows the fidelity of the transmission over that period, and inference to earlier centuries rests on other evidence, such as the linguistic tests.</p>`],
['Fidelity of Oral Transmission','Recensions and Variants',`<p>The Vedas are not single texts. Each exists in several <i>śākhās</i>, recensions kept by different schools, which differ in details. The Ṛgveda is known mainly in the Śākala recension, and a second, the Bāṣkala, survives only in fragments. The Yajurveda has the Black (Kṛṣṇa) and White (Śukla) schools, and the Atharvaveda survives in two main recensions, the Śaunaka and the Paippalāda. The latter was rediscovered in Kashmir and Odisha in the nineteenth and twentieth centuries and differs in many places from the Śaunaka.</p><p>These differences are real. They show that the tradition kept more than one version, each of which was transmitted with care within its school. The variants between recensions are not errors of transmission but reflect separate lines from an early period, and they give evidence of how the texts developed.</p><p>The existence of recensions limits the claim of perfect fidelity. The claim holds within each school, and not across schools. A text is faithful to its own lineage, and the lineages differ.</p><p>The Atharvaveda recensions show that the difference can be large, as the Paippalāda has many hymns that are not in the Śaunaka. Scholars use the comparison to reconstruct the history of the text, and to judge how much each tradition has changed or kept.</p>`],
['Fidelity of Oral Transmission','Preserved Archaic Features',`<p>A different kind of evidence comes from the language itself. When a text is passed on by memory, languages change, and speakers tend to modernise what they recite. The Vedic texts, however, keep features that had disappeared from speech long before. Four are especially important.</p><p><b>Pitch accent.</b> The Vedic accent was lost in the spoken language. Yet it is preserved in the recitation, and it corresponds closely to the accent of Ancient Greek and of other Indo-European languages, in a way that the comparative linguists of the nineteenth century (Verner and others) used to establish laws of sound change. The agreement is strong evidence that the Vedic accent is old and was kept.</p><p><b>Vowel sequences.</b> The metre of the Ṛgveda requires some sequences of vowels to be pronounced as two syllables, where later Sanskrit has one. Reading the text with these older pronunciations restores the verse. This shows that the original sounds were kept in the recitation, even though they were no longer natural to speakers.</p><p><b>Verb forms.</b> Forms such as the subjunctive, which classical Sanskrit lost, are kept.</p><p><b>Words.</b> Rare words, some unclear in meaning, are kept unchanged.</p><p>A transmission that modernised the text would have lost these. Their survival is good evidence of conservatism, which linguists accept.</p>`],
['Fidelity of Oral Transmission','Linguistic Tests of Fidelity',`<p>Historical linguists have tools for testing whether a text has been kept intact, and they support the tradition's claim in many respects.</p><p><b>Metre.</b> The Ṛgveda hymns follow strict metres. Where the transmitted text has the wrong number of syllables, scholars like Hermann Oldenberg, in the late nineteenth century, showed that restoring older pronunciations fixed the verse, which means the text had been kept in the older form. Where a line fails even after restoration, the problem may be a real corruption, and these places are few.</p><p><b>Comparison with related languages.</b> The Vedic forms agree in systematic ways with those of the Avestan texts of Iran, which are also oral and also very old, and with Greek and other languages. The correspondences would be hard to explain if the Vedic text had been much altered.</p><p><b>Internal consistency.</b> The recitation forms, the Prātiśākhya rules, and the text agree with one another to a high degree.</p><p>These tests do not prove that nothing changed. They show that changes were few, and that the main features of the language of the hymns were kept for a very long time. This is a strong result, and it is the one that scholars generally accept.</p>`],
['Fidelity of Oral Transmission','The Transmission of the Aṣṭādhyāyī',`<p>Pāṇini's grammar was passed on by methods like those of the Veda. The sūtras were learned by heart, and the text has been preserved in a form that scholars regard as very close to the original. This is helped by two facts: the grammar is extremely compact, so that a change shows, and the commentaries, from Kātyāyana and Patañjali on, quote the rules and discuss each word, so that the commentators act as a check.</p><p>The text is not free of variation. Different lines of manuscripts have small differences, such as the count of rules, which varies by a few depending on the commentary followed. Some rules are quoted in slightly different forms. There are also places where later scholars argued that Kātyāyana's notes show that Pāṇini's rule was changed or understood differently.</p><p>The grammar's structure helps it resist corruption. Because the rules refer to one another by position and by shared terms, a change in one rule creates an inconsistency in the system. Scholars have found that the received text is internally coherent to a degree that argues against much alteration.</p><p>It is a fair conclusion that the <i>Aṣṭādhyāyī</i> as we have it is very close to the work of Pāṇini, though small differences in count and reading remain.</p>`],
['Fidelity of Oral Transmission','The Science of Memory',`<p>Modern psychology has studied how experts remember vast amounts of material, and several findings help to explain what the Vedic reciters did.</p><p><b>Chunking.</b> Experts break long material into units that can be held and linked. The word and the pair are such units in the recitation forms.</p><p><b>Rhythm and melody.</b> Material set to a regular rhythm or tune is retained better than plain speech. The Vedic texts are chanted with fixed rhythm and, in the Sāmaveda, with elaborate melody.</p><p><b>Overlearning and spaced repetition.</b> Repeating material long after it seems learned, and at intervals, fixes it for the long term. The daily recitation of the whole text is overlearning in this sense.</p><p><b>Multiple routes to the same material.</b> Storing the same content in several forms provides several ways to retrieve it. The pāṭhas do this on purpose.</p><p>Studies of trained reciters, including brain imaging, have been reported, and suggest that long training in memorisation is associated with differences in brain structure and with very strong recall. Such studies are small, and their results should be treated as suggestive. They do support the general view that long, structured practice produces capacities that ordinary experience does not.</p>`],
['Fidelity of Oral Transmission','The Role of Writing and Palm Leaves',`<p>Writing did not replace oral transmission, but it came to support it. Palm-leaf and paper manuscripts of the Vedas were made from the early centuries of the second millennium CE, and many were copied by Brahmins who also knew the text by heart. Manuscripts served as a record, and as a backup in case a school failed.</p><p>The oldest dated manuscripts of Vedic texts are from the last thousand years. Climate destroys palm leaf quickly, and they were copied and recopied. The age of the texts is therefore far greater than the age of any manuscript, and it is not possible to compare manuscripts of the first millennium BCE, because none survives.</p><p>Manuscripts bring a different kind of risk. A copyist can introduce errors that the oral check does not catch, and manuscripts of non-Vedic texts, which were not guarded by such methods, show many more variants, so that critical editions such as the Mahābhārata of Pune have to compare hundreds of copies.</p><p>The best-preserved texts are those that had both a strong oral tradition and manuscripts. The combination gave the Vedic texts two independent lines of preservation, which is why the agreement between them is useful as a test.</p>`],
['Fidelity of Oral Transmission','Where the Oral Tradition Failed',`<p>The strongest argument against the idea of perfect preservation is the number of texts that were lost. Patañjali, in the <i>Mahābhāṣya</i>, says that the Veda has many branches: twenty-one of the Ṛgveda, a hundred and one of the Yajurveda, a thousand of the Sāmaveda, and nine of the Atharvaveda, a total of 1,131. The figure is traditional and is not a census, but the tradition certainly knew of many schools.</p><p>Only a few survive. For the Ṛgveda, the Śākala school is the main one, with a trace of the Bāṣkala. For the Sāmaveda, three schools are known to have survived in some form, and for the Yajurveda several, of which the Taittirīya and the Vājasaneyi are the best known. Most of the schools Patañjali listed are known only by name, or not at all. Their texts, accents, and rituals were lost.</p><p>This shows that oral tradition is protected only as long as there are teachers and pupils. A school that loses its pupils for a generation loses its texts. The system did not prevent decay in the number of lines. It prevented distortion within the lines that continued.</p><p>The point is a fair balance to the claims of fidelity. The method was effective at keeping what it kept, and the losses show how fragile the whole system was. Its achievement lies in the long survival of the schools that did last, and in their accuracy.</p>`],
['Fidelity of Oral Transmission','The Verdict: Established and Overstated',`<p>Putting the evidence together, the claims can be sorted.</p><table class="ex sm"><tr><td>Claim</td><td>Standing</td></tr><tr><td>Vedic texts were kept by memory using rigorous methods</td><td>established</td></tr><tr><td>The pāṭhas work by redundancy and make errors easy to detect</td><td>established</td></tr><tr><td>Archaic accents, forms, and metre were preserved</td><td>established; supported by comparative linguistics</td></tr><tr><td>Copies from distant regions agree to a very high degree</td><td>established; "near identical", not "100%"</td></tr><tr><td>The method is equivalent to parity bits or checksums</td><td>an analogy; not literally true</td></tr><tr><td>Transmission was "perfect" and "distortion-free"</td><td>overstated; recensions differ, texts were lost, errors occurred</td></tr><tr><td>The preservation is "definitive proof" of a particular date</td><td>overstated; it shows fidelity, not a date by itself</td></tr></table><p>The honest statement is that the Vedic tradition had one of the most effective systems of oral transmission known, that it kept its texts with a very high accuracy over a very long time, and that linguistic evidence confirms this. It is a great achievement, and it is quite enough without the words "perfect" or "definitive".</p>`],
['Fidelity of Oral Transmission','Lessons for Data Systems',`<p>The recitation orders are an early example of principles that modern engineers use for the storage and transmission of information.</p><p><b>Redundancy.</b> Keep the same information in more than one form, so that damage to one shows in another. Modern systems do this with checksums, error-correcting codes (the first of which was published by Richard Hamming in 1950), and disk arrays that store the same data in several places.</p><p><b>Independent checks.</b> The forms are learned separately and compared, as separate copies of a database are compared.</p><p><b>Standard references.</b> The Prātiśākhyas are the rule-books against which the text is checked, as a specification is used to test software.</p><p><b>Human factors.</b> The system works because of the training, the status of reciters, and the school. A technical design needs people who keep it going.</p><p><b>Known limits.</b> The method catches random errors and not shared ones, as modern systems also fail when every copy is wrong in the same way.</p><p>A student of computing can take from this a lasting lesson: reliability is built from simple parts, put together with care, and kept up by practice. The comparison should be stated modestly. The tradition did not invent error-correcting codes, and the modern field has its own mathematics. What the tradition shows is that the need for fidelity gave rise, long ago, to ingenious designs.</p>`],
['Fidelity of Oral Transmission','Summary of the Chapter',`<p>This chapter began with the problem of keeping a long text without writing. It described the training of the Vedic student, the distinction between śruti and smṛti, and the recitation forms: the continuous saṃhitā, the word-by-word pada, and the woven krama, jaṭā, and ghana. Short programs generated the patterns, counted the recitations, and showed how a wrong word is caught. The comparison to parity bits was made and limited. The chapter then described phonetics, the Prātiśākhyas, accent, and measure, the work of Frits Staal, the recognition by UNESCO, the comparison of manuscripts, the recensions, the archaic features, the linguistic tests, and the transmission of the grammar.</p><p>The conclusions are these. The Vedic method of transmission was designed to detect errors and did so effectively. Its results, confirmed by comparison of manuscripts and by historical linguistics, show a very high fidelity. They do not show perfection: recensions differ, errors occurred, and many branches were lost. And the idea that the recitations are literally checksums is an analogy.</p><p>The next chapter turns to a different kind of precision: the algorithms in the work of the astronomer-mathematician Āryabhaṭa, written about 1,500 years ago.</p>`]
);

PP.push(
['Āryabhaṭa: The Algorithms','Āryabhaṭa and His Time',`<p>Āryabhaṭa was an Indian mathematician and astronomer who was born, by his own statement, in 476 CE. He tells us that he was twenty-three years old when he wrote his work, which gives the date 499 CE, about 1,500 years before our time. He names Kusumapura, usually identified with Pāṭaliputra (modern Patna), as the place of his study, and the centre of learning where he worked.</p><p>He lived in the Gupta age, when Sanskrit scholarship, poetry, and science flourished together. His single surviving work, the <i>Āryabhaṭīya</i>, is short, a little over a hundred verses, and it set out in a compressed form the mathematics and astronomy of his school. It was widely studied and commented on for a thousand years.</p><p>The comparison with Pāṇini is natural, and this chapter makes it carefully. Both authors wrote compact, memorised texts, in which the rules are short and the commentary is long. Both gave procedures. Pāṇini's concern was the correct derivation of Sanskrit words, and Āryabhaṭa's was the correct computation of numbers and the positions of the heavens. They worked about a thousand years apart, but the habits of mind are alike, and the pages ahead show the algorithms of Āryabhaṭa in code, as the earlier chapters did for Pāṇini.</p>`],
['Āryabhaṭa: The Algorithms','The Structure of the Āryabhaṭīya',`<p>The <i>Āryabhaṭīya</i> has 121 verses, divided into four sections (<i>pāda</i>). The first, the <i>Gītikāpāda</i>, has thirteen verses in the <i>gīti</i> metre. It states the units of time, the number of revolutions of the planets in a great age, the table of sines, and the number notation. The second, the <i>Gaṇitapāda</i> ("mathematics"), has thirty-three verses on arithmetic, geometry, series, and the solution of equations. The third, the <i>Kālakriyāpāda</i> ("reckoning of time"), has twenty-five verses on the divisions of time and the motions of the planets. The fourth, the <i>Golapāda</i> ("the sphere"), has fifty verses on the celestial sphere, the Earth, and eclipses.</p><table class="ex"><tr><td>Section</td><td>Verses</td><td>Subject</td></tr><tr><td>Gītikāpāda</td><td>13</td><td>constants, sines, numerals</td></tr><tr><td>Gaṇitapāda</td><td>33</td><td>mathematics</td></tr><tr><td>Kālakriyāpāda</td><td>25</td><td>time and planetary motion</td></tr><tr><td>Golapāda</td><td>50</td><td>sphere, Earth, eclipses</td></tr></table><p>The total is 13 + 33 + 25 + 50 = 121. The work includes an invocation of one of the verses, and counts vary slightly in some descriptions, since the introductory verse is sometimes counted separately. The main point is the plan: constants first, then methods, then their application to time and the heavens.</p>`],
['Āryabhaṭa: The Algorithms','A Text Written for Memory',`<p>Like Pāṇini's grammar, the <i>Āryabhaṭīya</i> was meant to be learned by heart and explained by a teacher. It is in verse, mostly in the <i>āryā</i> metre, from which the author is sometimes said to take his name, though this is only a guess. The verses state a rule in the fewest words possible, and an expert supplies the reasoning and the worked examples.</p><p>To fit numbers into verse he invented a way of writing them with letters, described in the next pages. A large number, such as the number of years in a great age, can be put into a single word of a few syllables, with the vowels and consonants carrying the value. The method saves space and makes numbers easier to remember than a list of digits.</p><p>The compactness has a cost. Many verses cannot be understood without a commentary, and some of the most debated passages in the history of Indian science are verses of a few words that scholars still interpret in different ways. The commentary of Bhāskara I, written in 629 CE, is the earliest surviving and the most valuable.</p><p>Here is a point of kinship with the grammar. Both works depend on a tradition of teaching and commentary for their meaning. Taken alone, each is a set of formulas. Taken with the tradition, each is a complete system.</p>`],
['Āryabhaṭa: The Algorithms','The Letter-Numeral System',`<p>Āryabhaṭa wrote numbers with the letters of the Sanskrit alphabet. Each consonant has a value, and each vowel a place, a power of ten.</p><table class="ex sm"><tr><td>Consonants</td><td>Values</td></tr><tr><td>ka, kha, ga, gha, ṅa</td><td>1, 2, 3, 4, 5</td></tr><tr><td>ca, cha, ja, jha, ña</td><td>6, 7, 8, 9, 10</td></tr><tr><td>ṭa, ṭha, ḍa, ḍha, ṇa</td><td>11 to 15</td></tr><tr><td>ta, tha, da, dha, na</td><td>16 to 20</td></tr><tr><td>pa, pha, ba, bha, ma</td><td>21 to 25</td></tr><tr><td>ya, ra, la, va, śa, ṣa, sa, ha</td><td>30, 40, 50, 60, 70, 80, 90, 100</td></tr></table><table class="ex sm"><tr><td>Vowels</td><td>a</td><td>i</td><td>u</td><td>ṛ</td><td>ḷ</td><td>e</td><td>ai</td><td>o</td><td>au</td></tr><tr><td>Place</td><td>10<sup>0</sup></td><td>10<sup>2</sup></td><td>10<sup>4</sup></td><td>10<sup>6</sup></td><td>10<sup>8</sup></td><td>10<sup>10</sup></td><td>10<sup>12</sup></td><td>10<sup>14</sup></td><td>10<sup>16</sup></td></tr></table><p>A syllable stands for the sum of its consonants multiplied by its vowel's place. A string of letters is the sum of its syllables. The skipping of every other power of ten, with the vowel places going up by hundreds, is a feature of the system, and it gives room for the big numbers that astronomy needs.</p>`],
['Āryabhaṭa: The Algorithms','Decoding Numbers in Code',`<p>A short program reads a word in this system and returns its number. The example is the word that gives the length of a <i>mahāyuga</i>, the great age of the astronomers.</p><pre class="code">CONS = {}
for base, row in enumerate(["k kh g gh ṅ", "c ch j jh ñ", "ṭ ṭh ḍ ḍh ṇ",
                            "t th d dh n", "p ph b bh m"]):
    for i, c in enumerate(row.split()):
        CONS[c] = base * 5 + i + 1
for c, v in zip("y r l v ś ṣ s h".split(), range(30, 101, 10)):
    CONS[c] = v
VOW = {"a": 1, "i": 10**2, "u": 10**4, "ṛ": 10**6, "ḷ": 10**8,
       "e": 10**10, "ai": 10**12, "o": 10**14, "au": 10**16}
TOKENS = sorted(list(CONS) + list(VOW), key=len, reverse=True)

def value(text):
    total, group, i = 0, 0, 0
    while i &lt; len(text):
        tok = next(t for t in TOKENS if text.startswith(t, i))
        i += len(tok)
        if tok in VOW:
            total += group * VOW[tok]
            group = 0
        else:
            group += CONS[tok]
    return total

print(value("khyughṛ"))</pre><pre class="code out">4320000</pre>`],
['Āryabhaṭa: The Algorithms','Place Value and Decimal Notation',`<p>Āryabhaṭa's letter system is built on place value, the idea that the value of a symbol depends on its position. He also uses the word <i>sthāna</i>, "place", and states that each place is ten times the one before: <i>sthānāt sthānaṃ daśaguṇam</i>, "from place to place, ten times".</p><p>The decimal system, with a symbol for zero, developed in India. The earliest dated inscription with a decimal numeral and a zero is later than Āryabhaṭa. An inscription from Gwalior of 876 CE shows the zero as a small circle, and earlier records in Cambodia, of 683 CE, are also cited. A Sanskrit text in the Bakhshali manuscript, which has been radiocarbon dated to several centuries in the first millennium, uses a dot for zero. The exact date of the first use of zero remains a subject of study.</p><p>Āryabhaṭa's own system does not need a symbol for zero, because the letters carry the place. But his verses on the extraction of roots, in the Gaṇitapāda, assume a clear place-value system, and they would be hard to explain otherwise.</p><p>The numerals that spread from India to the Arab world and then to Europe became the numbers used worldwide today. Their transmission is attributed in part to Arabic translations of Indian works in the eighth and ninth centuries.</p>`],
['Āryabhaṭa: The Algorithms','The Square-Root Algorithm',`<p>The Gaṇitapāda gives a method for finding square roots by hand, digit by digit. The verses describe the steps for dividing the number into pairs of digits, subtracting the square of the first digit of the root, doubling what has been found, and continuing. It is the same method that was taught in schools until pocket calculators arrived.</p><pre class="code">def isqrt_digits(n):
    pairs, root, rem = [], 0, 0
    s = str(n)
    if len(s) % 2:
        s = "0" + s
    for i in range(0, len(s), 2):
        rem = rem * 100 + int(s[i:i + 2])
        d = 9
        while (20 * root + d) * d &gt; rem:
            d -= 1
        rem -= (20 * root + d) * d
        root = root * 10 + d
    return root

print(isqrt_digits(15129), isqrt_digits(998001))</pre><pre class="code out">123 999</pre><p>The code finds the square roots of 15129 and 998001, which are 123 and 999. In each step it takes the next two digits, finds the largest digit <i>d</i> such that (20 × root + <i>d</i>) × <i>d</i> does not exceed the remainder, and subtracts. The number 20 comes from doubling the root and shifting it by one place.</p><p>An algorithm of this kind has three features that make it a good example. It is <b>finite</b>, ending when the digits run out. It is <b>mechanical</b>, needing no cleverness at each step. And it is <b>general</b>, working for any number.</p>`],
['Āryabhaṭa: The Algorithms','Geometry: Areas and Volumes',`<p>The Gaṇitapāda treats the areas of triangles, circles, and trapezoids, the volumes of some solids, the properties of the right triangle, and the construction of figures using the shadow of a gnomon. It states the area of a triangle as half the base times the height, and the area of a circle as half the circumference times half the diameter, a correct form that avoids needing π separately.</p><p>Not every statement is correct, and it is useful to say so. The rule he gives for the volume of a pyramid, and of a sphere, is wrong: for the sphere he states, in effect, the area of a circle times its square root. Later mathematicians, such as Brahmagupta, noticed the error, and the correct formula for a sphere was given by Bhāskara II in the twelfth century.</p><p>The mistakes are instructive. They show that the work was not an infallible authority and that it was open to criticism. An exact and compact text of this kind exposes its errors to anyone who checks, which is a virtue.</p><p>The tradition also used geometric methods that go back to the <i>Śulba Sūtras</i>, the manuals for building Vedic altars, which contain the rule now called the Pythagorean theorem and a good approximation of the square root of two. Geometry in India thus has a long ritual history behind Āryabhaṭa's brief rules.</p>`],
['Āryabhaṭa: The Algorithms','The Value of π',`<p>The Gaṇitapāda gives a rule for the ratio of the circumference to the diameter of a circle. In translation: add 4 to 100, multiply by 8, and add 62,000. The result is the approximate circumference of a circle whose diameter is 20,000.</p><pre class="code">circumference = (100 + 4) * 8 + 62000     # Āryabhaṭīya 2.10
diameter = 20000
print(circumference, circumference / diameter)</pre><pre class="code out">62832 3.1416</pre><p>The ratio is 62,832 to 20,000, which is 3.1416, correct to four decimal places. The true value is 3.14159265, so the error is about one part in a hundred thousand.</p><p>Āryabhaṭa uses the word <i>āsanna</i>, "approximate", for this value, which suggests that he understood that it was not exact. Later commentators, such as Nīlakaṇṭha in the fifteenth century, took this to mean that π is irrational, that is, that no exact ratio of whole numbers exists. This reading of the word is an inference, and not all scholars agree that Āryabhaṭa meant it. The fact of the accurate value is not in doubt.</p><p>The value 3.1416 was used by Indian astronomers for centuries. It is more accurate than the value of 22/7 (3.1428) in common use elsewhere, and equal to the value Archimedes' method can reach with a polygon of many sides. Later, in Kerala, Mādhava of Saṅgamagrāma (about 1350 to 1425) found an infinite series for π and gave a value correct to eleven decimal places.</p>`],
['Āryabhaṭa: The Algorithms','The Table of Sines',`<p>In astronomy, the main calculation is that of angles, and for that Indian astronomers used the <i>jyā</i>, "chord" or "bowstring", which is the origin of the word sine. Āryabhaṭa gives a table of the sine at twenty-four equal steps of 3 degrees 45 minutes, up to 90 degrees. He gives not the sines but their first differences, in a verse made of letters, with the radius taken as 3,438 minutes of arc, the number of minutes in a radian.</p><table class="ex sm"><tr><td>Differences</td><td>225, 224, 222, 219, 215, 210, 205, 199, 191, 183, 174, 164</td></tr><tr><td></td><td>154, 143, 131, 119, 106, 93, 79, 65, 51, 37, 22, 7</td></tr></table><p>The sum of the twenty-four differences is 3,438, the sine of 90 degrees, which is the radius. The sine of the first step is 225, the second 449, and so on. A program can check the table against the exact values from modern mathematics.</p><pre class="code">s = 0
for k, d in enumerate(D, 1):
    s += d
    exact = 3438 * math.sin(math.radians(3.75 * k))
    if k in (1, 6, 12, 18, 24):
        print(k, s, round(exact, 1), round(s - exact, 1))</pre><pre class="code out">1 225 224.9 0.1
6 1315 1315.7 -0.7
12 2431 2431.0 -0.0
18 3177 3176.3 0.7
24 3438 3438.0 0.0</pre><p>The columns give the step number, the value in Āryabhaṭa's table, the exact value, and the difference. The largest error is under one unit in 3,438, about three hundredths of a percent.</p>`],
['Āryabhaṭa: The Algorithms','Making the Table by a Recurrence',`<p>Āryabhaṭa also states a rule for finding the differences in turn, so that one need not remember them all. In substance, the next difference equals the present difference minus the sine reached so far, divided by the first difference, 225.</p><pre class="code">import math

D = [225, 224, 222, 219, 215, 210, 205, 199, 191, 183, 174, 164,
     154, 143, 131, 119, 106, 93, 79, 65, 51, 37, 22, 7]
print(sum(D))                              # the radius, 3438

# Rule: next difference = this difference - (sine so far) / 225
d, s, made = 225.0, 0.0, []
for _ in range(24):
    s += d
    made.append(round(d))
    d -= s / 225
print(made[:8])
print(D[:8])
print("largest gap:", max(abs(a - b) for a, b in zip(made, D)))</pre><pre class="code out">3438
[225, 224, 222, 219, 215, 210, 204, 198]
[225, 224, 222, 219, 215, 210, 205, 199]
largest gap: 6</pre><p>The first six differences come out exactly. After that the rule drifts, and the largest gap from the table is six units. This is a useful result for two reasons.</p><p>First, it shows what the rule is: a second-order recurrence, which is an approximation to the true behaviour of the sine, in which the second difference is proportional to the sine itself. The constant 225 is close to the true value, but not exact, and errors build up.</p>`],
['Āryabhaṭa: The Algorithms','Comparing with Exact Values',`<p>Modern scholars compared the table of Āryabhaṭa with those of earlier and later works. The earlier Indian table, in the <i>Sūrya Siddhānta</i> and the <i>Pañcasiddhāntikā</i>, used the same interval of 3 degrees 45 minutes and similar values. The Greek table of chords, in Ptolemy's <i>Almagest</i> of the second century CE, used a different quantity, the chord of the whole angle, and an interval of half a degree.</p><p>The Indian sine, the half-chord, was a simpler quantity for calculation, since it is used directly in right triangles, and it passed to the Arab astronomers, who called it <i>jība</i> (a transliteration of <i>jīvā</i>, a synonym of <i>jyā</i>). In writing, the Arabic word without vowels was read as <i>jayb</i>, "pocket" or "fold", and the medieval translators into Latin rendered it as <i>sinus</i>, from which the word sine comes. The history of the word is thus a trail from the Sanskrit through Arabic to Latin.</p><p>Āryabhaṭa's table is the first full sine table that survives, and it was in use for centuries. Its accuracy was not matched in Europe until much later. The work of the Kerala school, from the fourteenth century, improved the values with infinite series, and gave sines accurate to many places.</p>`],
['Āryabhaṭa: The Algorithms','Between the Table Entries: Interpolation',`<p>The table gives sines at steps of 3 degrees 45 minutes. For an angle between two entries, an astronomer must interpolate. The usual rule, stated by Āryabhaṭa and later authors, is to take the difference between the two neighbouring entries and add the share of it that the angle's excess over the lower entry bears to the step.</p><p>An example shows the method. To find the sine of 5 degrees, take the entries for 3.75 degrees (225) and 7.5 degrees (449). The difference is 224. The angle is 1.25 degrees above the lower entry, which is one third of the step of 3.75 degrees. So the sine is 225 + 224 / 3, which is about 299.67.</p><p>The exact value, 3,438 times the sine of 5 degrees, is about 299.64. The interpolated value is within three hundredths of a unit, an error of one part in ten thousand. Linear interpolation works well here because the sine is nearly a straight line over so short a step.</p><p>Interpolation is a standard idea of numerical computing, and it shows that the table was designed for use. A table of twenty-four entries, with a rule for reading between them, is enough to give any sine to useful accuracy. Later Indian astronomers refined the rule with a second-order correction, which brought the accuracy still higher.</p><p>The idea of storing a few values and computing the rest from a rule is the same economy of memory that the grammar uses when it states few rules and derives many forms.</p>`],
['Āryabhaṭa: The Algorithms','Series and Sums',`<p>Āryabhaṭa states formulas for the sums of arithmetic series, and of the squares and cubes of the first <i>n</i> natural numbers. In modern form they are the following.</p><table class="ex"><tr><td>Sum of 1 to n</td><td>n(n + 1) / 2</td></tr><tr><td>Sum of squares</td><td>n(n + 1)(2n + 1) / 6</td></tr><tr><td>Sum of cubes</td><td>(n(n + 1) / 2)<sup>2</sup></td></tr></table><p>The verse for the sum of the cubes states the remarkable fact that it is the square of the sum of the numbers themselves. For example, the cubes of 1, 2, 3, 4 add to 1 + 8 + 27 + 64 = 100, and the numbers add to 10, whose square is 100.</p><p>He also gives a rule for the sum of an arithmetic series in terms of its first term, common difference, and number of terms, and a rule for finding the number of terms from the sum.</p><p>These results are of interest as exact general formulas given without proof, as was usual in this kind of text. Their proof was supplied later by commentators. The same formulas were rediscovered and proved in Europe in the seventeenth century.</p><p>The cube-sum rule is a good test of algorithmic thinking. A program that adds the cubes one by one, and a formula that does it in a single step, give the same answer, and the formula is faster for large <i>n</i>, a point of lasting importance in computing.</p>`],
['Āryabhaṭa: The Algorithms','The Kuṭṭaka: The Pulveriser',`<p>One of the most important algorithms in the <i>Āryabhaṭīya</i> is the <i>kuṭṭaka</i>, "pulveriser", a method for solving equations of the form <i>ax + b = cy</i> in whole numbers. Such problems arise in astronomy. They answer questions like "after how many days will two cycles of different lengths coincide again at a given point?", which is the sort of thing a calendar maker needs.</p><p>The verse is very short, and its meaning is explained by the commentators. The method is to apply the process of repeated division, called the Euclidean algorithm in the West, to the two numbers <i>a</i> and <i>c</i>, noting the quotients, and then to work backward through the quotients to build the solution. The name suggests that the numbers are ground down, step by step, to smaller and smaller ones.</p><p>It is a general algorithm for linear equations in integers, and it solves the same problem as the modern extended Euclidean algorithm. In India it was developed further by Brahmagupta in the seventh century, and by Bhāskara II in the twelfth, and took a special place in Indian mathematics. In Europe, the solution to the problem was found by Bachet de Méziriac in the seventeenth century, and it is the basis of much of modern cryptography.</p><p>The kuṭṭaka thus deserves a place among the great algorithms of the ancient world.</p>`],
['Āryabhaṭa: The Algorithms','The Kuṭṭaka in Code',`<p>The modern form of the algorithm, the extended Euclidean algorithm, finds numbers <i>x</i> and <i>y</i> such that <i>ax + by</i> equals the greatest common divisor of <i>a</i> and <i>b</i>. From it one can solve problems about remainders. The following program uses it to solve a classic puzzle: find a number that leaves remainder 5 when divided by 8, remainder 4 when divided by 9, and remainder 1 when divided by 7.</p><pre class="code">def egcd(a, b):
    if b == 0:
        return a, 1, 0
    g, x, y = egcd(b, a % b)
    return g, y, x - (a // b) * y

def crt(pairs):
    x, m = 0, 1
    for r, n in pairs:
        g, p, q = egcd(m, n)
        x = (x + m * ((r - x) // g) * p) % (m * n // g)
        m = m * n // g
    return x, m

print(crt([(5, 8), (4, 9), (1, 7)]))</pre><pre class="code out">(85, 504)</pre><p>The answer is 85, and every number that is 85 plus a multiple of 504 also works, since 504 is 8 × 9 × 7. Checking: 85 divided by 8 gives 10 and remainder 5; by 9 gives 9 and remainder 4; by 7 gives 12 and remainder 1.</p><p>The function <i>egcd</i> carries out the repeated division and works back, and the function <i>crt</i> uses it to combine one condition after another. The name <i>crt</i> stands for the Chinese remainder theorem, which states that such systems have a solution when the moduli are coprime.</p>`],
['Āryabhaṭa: The Algorithms','Time and the Large Numbers of the Yugas',`<p>Indian astronomy measures time in great cycles, the <i>yugas</i>. In Āryabhaṭa's scheme, a <i>mahāyuga</i> contains 4,320,000 years, divided into four equal parts, each of 1,080,000 years. One thousand mahāyugas make a day of Brahmā, called a <i>kalpa</i>. These numbers are partly mythological, and Āryabhaṭa's presentation is more technical than the Purāṇic.</p><p>He uses the great cycle as a frame in which to state the motions of the heavenly bodies as whole numbers. In one mahāyuga, the Sun makes 4,320,000 revolutions, the Moon 57,753,336, and the Earth turns 1,582,237,500 times on its axis. By stating the numbers for a whole age, the fractions of the true periods become whole numbers, which are easier to handle.</p><p>The device is like the choice of a large unit that makes all quantities integers. It was a clever technical choice, and it is the reason why Indian astronomical constants are so large. A set of ratios of large integers can reproduce very accurately the periods that are known by observation.</p><p>It should be said that such numbers should not be taken as claims about the age of the universe. They are mathematical conventions for the calculation of periods, and the myth of immense time is a separate layer on the same numbers.</p>`],
['Āryabhaṭa: The Algorithms','Counting Revolutions',`<p>The method is easy to describe. If a body makes <i>R</i> revolutions in <i>N</i> days, its period is <i>N / R</i> days. The same method can be applied to any planet. Āryabhaṭa gives the number of revolutions of each of the planets in a mahāyuga, and the number of days in the same cycle, and from them the period of each is found by division.</p><p>For the Sun, the ratio of days to revolutions is the length of the sidereal year. For the Moon, it is the sidereal month. For the planets, it gives the sidereal period of revolution, the time to return to the same star. The accuracy depends on the integers chosen, and the Indian values are generally close to the modern ones.</p><p>The idea has a modern parallel in the way rates are stored as integer ratios, avoiding the errors that fractions bring in decimal calculations. Calendar makers in many cultures use the same device: the Metonic cycle of nineteen years and 235 lunar months is one example.</p><p>The page that follows computes the length of the year from the Āryabhaṭan numbers, and the one after it computes the length of a day. The constants are those found in the text, and the results can be compared with the modern values.</p>`],
['Āryabhaṭa: The Algorithms','The Length of the Year',`<p>In Āryabhaṭa's system a mahāyuga has 4,320,000 years and 1,577,917,500 civil days. Dividing days by years gives the length of the year.</p><pre class="code">YUGA_YEARS = 4_320_000
CIVIL_DAYS = 1_577_917_500
EARTH_ROTATIONS = 1_582_237_500

year = CIVIL_DAYS / YUGA_YEARS
print(round(year, 5))</pre><pre class="code out">365.25868</pre><p>This is 365 days and about 6 hours, 12 minutes, and 30 seconds. The modern value of the sidereal year, the time for the Sun to return to the same position among the stars, is 365.25636 days. Āryabhaṭa's year is longer by about 0.0023 days, or about 3 minutes and 20 seconds. The tropical year, the one that governs the seasons, is shorter, at 365.2422 days, and so the Indian sidereal year is close to the real one, and not designed to match the seasons.</p><p>The difference of a few minutes may seem small, but over many centuries it adds up, and Indian calendars based on the sidereal year slowly drift from the seasons. The reform of the Indian national calendar in 1957, and the continued use of different <i>ayanāṃśa</i> values by astrologers, are ways of dealing with this.</p><p>The point for this book is the method: a small program takes constants from a text of the year 499 and reproduces a value that agrees with modern measurement to one part in about a hundred thousand.</p>`],
['Āryabhaṭa: The Algorithms','The Rotation of the Earth',`<p>Among Āryabhaṭa's views, the best known is that the Earth rotates on its axis, and that the daily motion of the stars is only apparent. He compares it to a person in a boat moving forward who sees the stationary objects on the bank move backward. He also states the number of rotations in a mahāyuga, 1,582,237,500, and from it the length of the sidereal day can be found.</p><pre class="code">YUGA_YEARS = 4_320_000
CIVIL_DAYS = 1_577_917_500
EARTH_ROTATIONS = 1_582_237_500

year = CIVIL_DAYS / YUGA_YEARS
print(round(year, 5))
rot_per_year = EARTH_ROTATIONS / YUGA_YEARS
day = year / rot_per_year                  # days per turn of the Earth
secs = day * 86400
print(round(rot_per_year, 4), int(secs // 3600), int(secs % 3600 // 60), round(secs % 60, 1))</pre><pre class="code out">366.2587 23 56 4.1</pre><p>The first number is the number of rotations of the Earth in one sidereal year, 366.2587. The program divides the length of the year by this number and converts the result to hours, minutes, and seconds: 23 hours 56 minutes 4.1 seconds. This is the length of the sidereal day, which is the time for the Earth to turn once relative to the stars. The modern value is 23 hours 56 minutes 4.091 seconds.</p><p>The agreement is extremely close, within a tenth of a second.</p>`],
['Āryabhaṭa: The Algorithms','How the Earth\'s Rotation Was Received',`<p>Āryabhaṭa's statement that the Earth rotates was not generally accepted by later Indian astronomers. Brahmagupta, in the seventh century, argued against it on physical grounds: if the Earth turned, he said, then birds would be left behind, and objects thrown upwards would fall to the west of where they started. These are the same arguments that opponents of the idea used in Europe.</p><p>Some later writers defended Āryabhaṭa, and some changed his words to say the opposite. Bhāskara I, his early commentator, seems to have accepted the rotation. Later commentators, in the Kerala school, treated it as a theory to be taken seriously, and it was discussed in the fifteenth and sixteenth centuries.</p><p>The episode shows that Indian science had a tradition of open criticism, in which a major authority could be challenged by a successor with reasoned arguments. It also shows that Āryabhaṭa was in some respects ahead of his time, and that his view was a minority one for a long time.</p><p>It is wise to keep the claim modest. Āryabhaṭa proposed that the Earth rotates, as did some Greek thinkers before him, such as Heraclides of Pontus. The fact that his model was geocentric in other respects, as the next pages explain, should not be forgotten.</p>`],
['Āryabhaṭa: The Algorithms','Eclipses Explained',`<p>The Golapāda gives an account of eclipses that is based on shadows and not on myth. A lunar eclipse happens when the Moon enters the shadow of the Earth, and a solar eclipse when the Moon comes between the Sun and the Earth and covers part of the Sun's disc. He states that the Moon and the planets shine by reflected sunlight, comparing them to a mirror, and gives rules for the size of the shadow and the extent of the eclipse.</p><p>In the older Indian popular tradition, eclipses were caused by the demon Rāhu swallowing the Sun or the Moon. Āryabhaṭa's text mentions the popular belief, and then gives the geometrical explanation. The mythical and the scientific explanations existed together in Indian culture, as in other cultures, and the astronomical works used the scientific one for calculation.</p><p>Calculating an eclipse requires several steps: finding the positions of the Sun, the Moon, and the lunar node at the time of opposition or conjunction, measuring the angular distance between the Moon and the node, finding the size of the shadow at the Moon's distance, and comparing. Each step is an algorithm in the sense of this chapter, and Indian astronomers used these procedures to predict eclipses with useful accuracy.</p><p>Predictions of eclipses were of practical importance because of their ritual significance, and they were checked against observation.</p>`],
['Āryabhaṭa: The Algorithms','Planetary Models: Epicycles',`<p>To predict the positions of the planets, Indian astronomers used a model of circles carried on circles, the epicycles, as the Greeks did. The mean position of a planet was found from its number of revolutions, and then corrected by two adjustments. The first, called the <i>manda</i> correction, is for the planet's own varying speed. The second, the <i>śīghra</i> correction, is for the effect of the Earth's motion about the Sun.</p><p>Āryabhaṭa's models differ in detail from those of Ptolemy, and from those of later Indian works. He used epicycles whose size changed with time, a feature later adopted by some commentators. He expressed the sizes of the epicycles as numbers of degrees, and gave tables for the planets.</p><p>The mathematics of this process is that of a sum of two circular motions, and calculating a position requires several sine evaluations, with the table given above, and some interpolation between them. The algorithm has a fixed series of steps for each planet, and is in this way a program. It was run by hand, with the aid of tables, and the results were recorded in the almanacs.</p><p>The accuracy of these models was good for naked-eye observation, and sufficient for the calendar and for casting horoscopes, the main practical uses of astronomy in India. The refinement of the models was a continuing project, taken up by later astronomers.</p>`],
['Āryabhaṭa: The Algorithms','Did Āryabhaṭa Propose a Heliocentric System?',`<p>A common modern statement is that Āryabhaṭa proposed that the Earth goes around the Sun. The evidence is mixed, and the claim is disputed.</p><p>The case in favour rests on his planetary models. The śīghra epicycles of the planets have periods that match the periods of the planets' motion relative to the Sun, or of the Earth's motion about the Sun. The Dutch mathematician B. L. van der Waerden argued in 1970 that this feature suggests that his model derived from a heliocentric one. Other historians agreed with him and developed the argument.</p><p>The case against is that Āryabhaṭa nowhere states that the Earth goes around the Sun. His text treats the Earth as the centre of the system, with the Sun and the Moon revolving around it, and the planets going round the Sun in epicycles. This arrangement is the one later called the Tychonic system, in which the planets circle the Sun and the Sun circles the Earth. Most historians of astronomy, including Noel Swerdlow and Kim Plofker, take the view that the evidence is not enough to say that he held a heliocentric theory.</p><p>The responsible statement is that some features of his planetary models are consistent with a heliocentric origin, and that the matter is debated. Neither "he discovered heliocentrism" nor "he knew nothing of it" is established.</p>`],
['Āryabhaṭa: The Algorithms','Commentators and Successors',`<p>The <i>Āryabhaṭīya</i> was studied for a thousand years. Bhāskara I, in 629 CE, wrote the earliest surviving commentary, and a separate work, the <i>Mahābhāskarīya</i>, which explains Āryabhaṭa's methods. Brahmagupta, in 628 CE, wrote his own <i>Brāhmasphuṭasiddhānta</i>, criticising Āryabhaṭa on some points while building on his mathematics. Later commentators include Parameśvara (fifteenth century) and Nīlakaṇṭha Somayājī (1444 to 1545), who wrote a major commentary and developed Āryabhaṭa's planetary model in his own work, the <i>Tantrasaṅgraha</i> (1500).</p><p>Nīlakaṇṭha belonged to the Kerala school of mathematics and astronomy, founded by Mādhava of Saṅgamagrāma. This school, from the fourteenth to the seventeenth century, found infinite series for the sine, cosine, and arctangent, which are in modern terms the Taylor series for these functions, and derived series for π. Their work continued directly from the tradition of Āryabhaṭa.</p><p>The school's methods spread in the Malayalam and Sanskrit manuscripts of Kerala, and the question whether they reached Europe is debated. There is no direct evidence of transmission, and the claim of a link is not established, although Jesuit missionaries were in Kerala in the sixteenth century.</p><p>The Āryabhaṭan tradition is therefore an unbroken line of working mathematics and astronomy that lasted from the fifth to the seventeenth century.</p>`],
['Āryabhaṭa: The Algorithms','Transmission to the Arabic World',`<p>Indian astronomy and mathematics passed to the Islamic world in the eighth and ninth centuries. In the reign of the caliph al-Manṣūr, about 770 CE, an Indian astronomical work, the <i>Sindhind</i>, was translated into Arabic at Baghdad, and the astronomer al-Khwārizmī used it as the basis of his own tables, the <i>Zīj al-Sindhind</i>, around 820 CE. Al-Khwārizmī also wrote a book on Indian arithmetic that introduced the decimal system to the Arabic world, and that was later translated into Latin, from which the word <i>algorithm</i> is derived from his name.</p><p>Āryabhaṭa's work was known by name in the Arab world. An Arabic work called <i>Zīj al-Arjabhar</i>, "the tables of Arjabhar", is a version of Indian methods based on his school, and the name Arjabhar is a form of Āryabhaṭa. The scholar al-Bīrūnī, who studied Indian science in the eleventh century, discusses Āryabhaṭa and compares his views with others.</p><p>Through these channels, the sine, the decimal numerals, and several Indian algorithms became part of the mathematics of the Middle East and, through Spain and Sicily, of Europe. The history of the word "algorithm" is itself a record of this exchange, in which the Sanskrit sources, the Arabic translations, and the Latin versions each had a part.</p>`],
['Āryabhaṭa: The Algorithms','Āryabhaṭa Today',`<p>India's first satellite, launched from the Soviet Union on 19 April 1975, was named Aryabhata in his honour. A crater on the Moon bears his name, and several institutions, including a university in Patna, a research institute for observational sciences in Nainital (the Aryabhatta Research Institute of Observational Sciences), and awards for mathematics, are named after him.</p><p>His memory is also kept in popular culture, and sometimes in exaggerated claims. It is sometimes said that he discovered zero, or that he proved heliocentrism, or that he computed π to the accuracy of a computer. None of these is quite true. He used a place-value system, gave an accurate approximation of π, suggested that the Earth rotates, and wrote a compact and original treatise. These are major achievements and need no exaggeration.</p><p>In schools and colleges, the <i>Āryabhaṭīya</i> is studied as a source of the history of mathematics, and several translations are available, including the English translation of Walter Clark (1930) and the critical edition of K. S. Shukla and K. V. Sarma (1976). The mathematician Kim Plofker's book <i>Mathematics in India</i> (2009) is a good guide to the whole tradition.</p><p>For the reader in the Telugu states, the memory of Āryabhaṭa is a link between the literary and the scientific traditions of India, and a reminder that the same culture produced both the grammar and the algorithm.</p>`],
['Āryabhaṭa: The Algorithms','Code in What Sense?',`<p>The phrase "1,500-year-old code" is a popular way of describing Āryabhaṭa's work, and it is worth examining. In one sense it is accurate: the text is a compressed encoding of procedures and constants, in a notation that needs decoding. The letter-numeral system is a true encoding of numbers, and the verses are a compact way of storing and transmitting a body of method.</p><p>In another sense the phrase misleads. The <i>Āryabhaṭīya</i> is not computer code. It does not run, and its algorithms were carried out by people, with pen, board, or sand, and the aid of tables. The word "code" is used as a metaphor, as when one speaks of the "genetic code".</p><p>The comparison is nevertheless useful. An algorithm is a finite procedure for solving a class of problems, and in this sense the square-root procedure, the kuṭṭaka, and the sine-table recurrence are algorithms. When a modern programmer reads them, translates them into a language such as Python, and runs them, as this chapter has done, the results confirm that the procedures work.</p><p>A good use of the metaphor keeps both sides in view. The old text is a record of mathematical thinking, and the programs are a way of testing and teaching it.</p>`],
['Āryabhaṭa: The Algorithms','Two Systems of Rules: Āryabhaṭa and Pāṇini',`<p>The two authors worked on different subjects, a thousand years apart, but their works share a type of thinking.</p><table class="ex sm"><tr><td>Feature</td><td>Pāṇini</td><td>Āryabhaṭa</td></tr><tr><td>Subject</td><td>language</td><td>numbers and the heavens</td></tr><tr><td>Form</td><td>sūtras</td><td>verses in āryā metre</td></tr><tr><td>Aim</td><td>derive correct words</td><td>compute correct values</td></tr><tr><td>Compression</td><td>very high; markers, class names</td><td>high; letter-numerals</td></tr><tr><td>Notation</td><td>pratyāhāras</td><td>letter values</td></tr><tr><td>Method</td><td>ordered rules</td><td>stepwise procedures</td></tr><tr><td>Teaching</td><td>commentary (Kātyāyana, Patañjali)</td><td>commentary (Bhāskara I)</td></tr><tr><td>Transmission</td><td>memorised</td><td>memorised, with tables</td></tr></table><p>Both authors state a general procedure compactly and rely on a teacher to unpack it. Both devise a private notation to save space, which is itself an encoding. Both had a long history of commentary that clarified and corrected. And both were judged by whether their procedures worked: the grammar by whether it produced the right forms, the astronomy by whether it predicted the right sky.</p><p>The comparison shows a tradition in which the compact, rule-based statement of knowledge was a common ideal. It does not show influence of one author on the other.</p>`],
['Āryabhaṭa: The Algorithms','Summary of the Chapter',`<p>This chapter introduced Āryabhaṭa and the structure of the <i>Āryabhaṭīya</i>, and explained that it was written for memory. It showed the letter-numeral system and decoded the number 4,320,000 in code. It described the square-root algorithm, geometry and its errors, the value of π, and the sine table, which a program tested against exact values. It showed that the recurrence for making the table is an approximation that drifts from the table by up to six units. It described the formulas for series, the kuṭṭaka and a program that solves a classical remainder puzzle, the yuga system, the length of the year and of the sidereal day, the reception of the rotation of the Earth, eclipses, planetary models, the debate about heliocentrism, commentators, transmission to the Arabs, and modern memory of Āryabhaṭa.</p><p>Four conclusions follow. The text contains genuine and exact algorithms. The numerical values agree remarkably well with modern ones. Some claims made for Āryabhaṭa are exaggerated, in particular about zero and heliocentrism, and some of his rules were wrong. And "code" is a metaphor, useful when its limits are stated.</p><p>The next chapter returns to Pāṇini and takes thirty of his rules apart one by one.</p>`]
);

PP.push(
['Thirty Rules Taken Apart','1.1.1 vṛddhir ādaic',`<p><b>Sūtra.</b> <i>vṛddhir ādaic</i>. <b>Words.</b> <i>vṛddhiḥ</i> (the term "vṛddhi"), <i>āt</i> (long ā) and <i>aic</i> (the pratyāhāra for <i>ai, au</i>).</p><p><b>Meaning.</b> "Vṛddhi" means <i>ā, ai, au</i>.</p><p><b>Type.</b> A <i>saṃjñā</i> rule: it gives a technical name. It is the very first rule of the grammar.</p><p><b>Reading.</b> The rule is a definition by listing. The name <i>vṛddhi</i> is given to three sounds, and from now on any rule that says "vṛddhi" means one of them. Using one word in place of three saves space in every later rule that needs them.</p><p><b>Example.</b> When <i>a</i> meets <i>e</i> in <i>sadā + eva</i>, the result is <i>ai</i>, a vṛddhi vowel, giving <i>sadaiva</i>. The rule that says so (6.1.88) names the result only by the word "vṛddhi", which is defined here.</p><p><b>Role in the system.</b> It sets up the vocabulary. A grammar written in a compressed notation must define its terms before it uses them, and Pāṇini begins with the definition of a term that he will need hundreds of times.</p>`],
['Thirty Rules Taken Apart','1.1.2 adeṅ guṇaḥ',`<p><b>Sūtra.</b> <i>adeṅ guṇaḥ</i>. <b>Words.</b> <i>at</i> (short a), <i>eṅ</i> (the pratyāhāra for <i>e, o</i>), <i>guṇaḥ</i> (the term "guṇa").</p><p><b>Meaning.</b> "Guṇa" means <i>a, e, o</i>.</p><p><b>Type.</b> A <i>saṃjñā</i> rule, the companion of the first.</p><p><b>Reading.</b> Guṇa is the first grade of vowel strengthening, and vṛddhi the second. The three grades of a vowel run, for the <i>i</i> series, from <i>i</i> to <i>e</i> to <i>ai</i>, and for the <i>u</i> series from <i>u</i> to <i>o</i> to <i>au</i>. The first two rules of the grammar set the names for the second and first grades.</p><p><b>Example.</b> In <i>deva + indra</i> the result is <i>e</i>, giving <i>devendra</i>. In the verb <i>bhū</i>, the root vowel <i>ū</i> becomes <i>o</i>, as in <i>bhavati</i>, which is guṇa applied by 7.3.84.</p><p><b>Role in the system.</b> With 1.1.1 it supplies the two terms that govern most vowel change in Sanskrit. The exceptions, the rules that block guṇa after certain markers, such as 1.1.5, are another subject.</p>`],
['Thirty Rules Taken Apart','1.1.9 tulyāsyaprayatnaṃ savarṇam',`<p><b>Sūtra.</b> <i>tulyāsyaprayatnaṃ savarṇam</i>. <b>Words.</b> <i>tulya</i> (same), <i>āsya</i> (place in the mouth), <i>prayatna</i> (effort), <i>savarṇam</i> (of the same kind).</p><p><b>Meaning.</b> Sounds that have the same place of articulation and the same effort are called <i>savarṇa</i>.</p><p><b>Type.</b> A <i>saṃjñā</i> rule, defining similarity of sounds.</p><p><b>Reading.</b> This rule turns the phonetics of the <i>Śikṣā</i> into a term of the grammar. Two sounds are alike if they are made in the same place with the same effort. Short and long <i>a</i> qualify, and so do <i>i</i> and <i>ī</i>. Certain pairs are excluded by other rules, as when the effort differs.</p><p><b>Example.</b> In <i>deva + ālaya</i>, the final <i>a</i> and the initial <i>ā</i> are savarṇa, so 6.1.101 merges them into one long vowel: <i>devālaya</i>.</p><p><b>Role in the system.</b> Many rules say "when a similar sound follows" or "in place of a similar sound". This definition makes those rules short. It is the way the grammar keeps its phonetics inside the rules, without listing every pair of sounds.</p>`],
['Thirty Rules Taken Apart','1.1.11 īdūded dvivacanaṃ pragṛhyam',`<p><b>Sūtra.</b> <i>īdūded dvivacanaṃ pragṛhyam</i>. <b>Words.</b> <i>īt, ūt, et</i> (the vowels ī, ū, e), <i>dvivacanam</i> (dual ending), <i>pragṛhyam</i> (held apart).</p><p><b>Meaning.</b> A dual ending that is <i>ī, ū,</i> or <i>e</i> is called <i>pragṛhya</i>.</p><p><b>Type.</b> A <i>saṃjñā</i> rule, with an effect that is a prohibition: a pragṛhya vowel does not undergo sandhi (1.1.11 together with 6.1.125).</p><p><b>Reading.</b> The rule defines a class of forms that are protected from the normal joining of sounds. The reason is sound: the dual ending carries the meaning "two", and if it merged with a following vowel the meaning would be lost.</p><p><b>Example.</b> <i>hari + etau</i> stays <i>hari etau</i>, "these two Haris", not <i>harayetau</i> or <i>hariyetau</i>. Likewise <i>kavī + iha</i> stays <i>kavī iha</i>.</p><p><b>Role in the system.</b> It is a clear case of an exception that protects meaning. Sandhi rules apply by default, and a few classes of word are shielded from them. The rule shows the grammar balancing sound change against clarity of grammatical information.</p>`],
['Thirty Rules Taken Apart','1.1.49 ṣaṣṭhī sthāneyogā',`<p><b>Sūtra.</b> <i>ṣaṣṭhī sthāneyogā</i>. <b>Words.</b> <i>ṣaṣṭhī</i> (the sixth case, the genitive), <i>sthāneyogā</i> (connected with "in place of").</p><p><b>Meaning.</b> A word in the genitive case in a rule means "in place of it".</p><p><b>Type.</b> A <i>paribhāṣā</i>, a rule of interpretation.</p><p><b>Reading.</b> This is the grammar's assignment operator. In <i>iko yaṇ aci</i> the word <i>ikaḥ</i> is in the genitive, so the rule says that <i>yaṇ</i> comes "in place of <i>ik</i>". Without this convention a reader would not know how to take the genitive in Pāṇini's rules, since the genitive in ordinary Sanskrit has many meanings.</p><p><b>Example.</b> In 6.1.77, <i>iko yaṇ aci</i>, the word <i>ikaḥ</i> is in the genitive, so <i>yaṇ</i> replaces <i>ik</i>. In 8.4.40, <i>stoḥ ścunā ścuḥ</i>, the genitive <i>stoḥ</i> names what is replaced, and <i>ścuḥ</i> what replaces it.</p><p><b>Role in the system.</b> It gives case endings a fixed meaning inside the metalanguage. The same method is used in the rules that follow (1.1.66 and 1.1.67). A reader who knows the conventions can read any sūtra without ambiguity.</p>`],
['Thirty Rules Taken Apart','1.1.56 sthānivad ādeśo \'nalvidhau',`<p><b>Sūtra.</b> <i>sthānivad ādeśo 'nalvidhau</i>. <b>Words.</b> <i>sthānivat</i> (like the one in whose place), <i>ādeśaḥ</i> (substitute), <i>anal-vidhau</i> (in operations that are not about a single sound).</p><p><b>Meaning.</b> A substitute behaves like the original, except where the rule concerns the sounds themselves.</p><p><b>Type.</b> An <i>atideśa</i>, a rule of extension.</p><p><b>Reading.</b> When one element replaces another, later rules may need to treat the new element as if it were the old one. For instance, if an ending <i>X</i> is replaced by another form, the grammar treats the new form as still carrying the marks and properties of <i>X</i>, so that rules written for <i>X</i> still apply. The exception is where a rule depends on the sound itself.</p><p><b>Example.</b> The ending <i>ṭā</i> (instrumental singular) is replaced by <i>ina</i> after stems in <i>a</i>. The replacement is still treated as the third-case ending, and so later rules for that case still see it.</p><p><b>Role in the system.</b> Substitution is the main operation of the grammar, and this rule gives it a clear semantics. It is a close relative of the idea in programming that a replaced object should keep its type. The rule is also the source of long discussions in the commentaries about its limits.</p>`],
['Thirty Rules Taken Apart','1.1.71 ādir antyena sahetā',`<p><b>Sūtra.</b> <i>ādir antyena sahetā</i>. <b>Words.</b> <i>ādiḥ</i> (the first), <i>antyena</i> (with the last), <i>sa-hetā</i> (together with the marker).</p><p><b>Meaning.</b> A first letter, taken together with a final marker, stands for itself and all the letters in between.</p><p><b>Type.</b> A <i>saṃjñā</i> rule that defines the <i>pratyāhāra</i>.</p><p><b>Reading.</b> This is the formula for the abbreviations used throughout the grammar. Given the ordered list of the Śiva Sūtras, a pair (first sound, marker) names a stretch. The marker belongs to the name but not to the sounds.</p><p><b>Example.</b> <i>ac</i> means every sound from <i>a</i> to the marker <i>c</i>, which is all the vowels; <i>hal</i> means all consonants; <i>yaṇ</i> means <i>y, v, r, l</i>.</p><p><b>Role in the system.</b> It lets the grammar speak of large classes of sounds in two letters. In programming terms it is a range specification over an ordered alphabet. The code on an earlier page gives a function that implements this rule exactly.</p><p><b>A detail.</b> The marker <i>ṇ</i> occurs twice in the list, so that <i>aṇ</i> and <i>iṇ</i> could be read in two ways. The commentators resolve such cases by additional rules, such as 1.1.69.</p>`],
