['Thirty Rules Taken Apart','1.2.45 arthavad adhātur apratyayaḥ prātipadikam',`<p><b>Sūtra.</b> <i>arthavad adhātur apratyayaḥ prātipadikam</i>. <b>Words.</b> <i>arthavat</i> (having meaning), <i>adhātuḥ</i> (not a root), <i>apratyayaḥ</i> (not an affix), <i>prātipadikam</i> (stem).</p><p><b>Meaning.</b> A meaningful form that is neither a root nor an affix is called a stem.</p><p><b>Type.</b> A <i>saṃjñā</i> rule.</p><p><b>Reading.</b> This definition gives the class of items to which noun endings are added. It defines the stem by exclusion: it has meaning, so a stray syllable is not a stem, and it is not a root, which belongs to verbs, and not an affix. A stem like <i>rāma</i> qualifies.</p><p><b>Example.</b> <i>rāma</i> is a stem, and takes the endings <i>su, au, jas</i>, and the rest. <i>bhū</i> is a root, and <i>tip</i> is an affix, so neither is a stem under this definition.</p><p><b>Role in the system.</b> It supplies the input type for the whole noun system. The grammar of nouns, beginning at 4.1.1, adds endings to stems, and so a clear definition of what a stem is has to come earlier. It illustrates the grammar's attention to types: each operation has a defined kind of input.</p>`],
['Thirty Rules Taken Apart','1.3.3 halantyam',`<p><b>Sūtra.</b> <i>halantyam</i>. <b>Words.</b> <i>hal</i> (consonant), <i>antyam</i> (final).</p><p><b>Meaning.</b> A final consonant of an item taught in the grammar is an <i>it</i>, a marker.</p><p><b>Type.</b> A rule of marking, one of the group in 1.3.2 to 1.3.9.</p><p><b>Reading.</b> Items taught in the grammar, such as affixes and roots, are given with extra letters attached. These letters carry information for the rules and are not part of the spoken form. This rule says that a consonant at the end is such a letter.</p><p><b>Example.</b> The ending <i>tip</i> has the final <i>p</i> as a marker. The ending is therefore spoken as <i>ti</i>, and the marker <i>p</i> tells rules, such as 1.2.4, how the ending behaves.</p><p><b>Role in the system.</b> It is the mechanism for the markers, the flags that I described earlier as like attributes on a data item. The markers are the grammar's way to attach information to elements without a separate table. The next rule, 1.3.9, says what happens to them.</p><p><b>Note.</b> Rule 1.3.2 deals with nasal vowels, and others in the same group mark initial elements such as <i>ṭu</i> and <i>ḍu</i> and the consonant clusters at the start of affixes.</p>`],
['Thirty Rules Taken Apart','1.3.9 tasya lopaḥ',`<p><b>Sūtra.</b> <i>tasya lopaḥ</i>. <b>Words.</b> <i>tasya</i> (of that), <i>lopaḥ</i> (deletion).</p><p><b>Meaning.</b> That marker is deleted.</p><p><b>Type.</b> A <i>vidhi</i> rule, an operation. It completes the system begun in 1.3.2 to 1.3.8.</p><p><b>Reading.</b> The word <i>tasya</i> refers back to the marker (<i>it</i>) named in the preceding rules. Once the marker has done its work in telling other rules how to behave, it is removed, so that it does not appear in the spoken word.</p><p><b>Example.</b> The affix <i>śap</i> has markers <i>ś</i> and <i>p</i>. After they have served, they are deleted, and the remainder is the vowel <i>a</i>. In <i>bhavati</i> this <i>a</i> is the vowel between the root and the ending.</p><p><b>Role in the system.</b> This rule is the cleanup step. Programmers will see an analogy with temporary variables or compiler annotations that are used during processing and removed from the output. The principle is the same: keep extra information for as long as it is needed, then drop it.</p><p><b>An observation.</b> The pair 1.3.3 and 1.3.9 shows that Pāṇini designs his grammar as a pipeline with distinct stages of marking and cleaning.</p>`],
['Thirty Rules Taken Apart','1.4.2 vipratiṣedhe paraṃ kāryam',`<p><b>Sūtra.</b> <i>vipratiṣedhe paraṃ kāryam</i>. <b>Words.</b> <i>vipratiṣedhe</i> (in a conflict), <i>param</i> (the later one), <i>kāryam</i> (is to be applied).</p><p><b>Meaning.</b> When two rules conflict, the later one in the text applies.</p><p><b>Type.</b> A <i>paribhāṣā</i>, a rule of interpretation, for settling conflicts.</p><p><b>Reading.</b> The rule gives a default: if two rules are of equal standing and both apply, the one that stands later in the grammar wins. Its force depends on the rules being "of equal strength", and a more specific rule, an <i>apavāda</i>, beats a general one regardless of position.</p><p><b>Example.</b> Two rules could change the same vowel. If neither is an exception to the other, the one that comes later in the book is used.</p><p><b>Role in the system.</b> The order of the rules in the book becomes part of the program. The same principle appears in programming where later definitions override earlier ones, as with later style rules in a style sheet or a later assignment to a variable.</p><p><b>A debate.</b> The exact scope of the rule has been argued for centuries. The 2022 proposal mentioned earlier concerned a different principle for conflicts between rules that apply to different parts of a word.</p>`],
['Thirty Rules Taken Apart','1.4.14 suptiṅantaṃ padam',`<p><b>Sūtra.</b> <i>suptiṅantaṃ padam</i>. <b>Words.</b> <i>sup-tiṅ-antam</i> (ending in a noun ending or a verb ending), <i>padam</i> (a word).</p><p><b>Meaning.</b> A form that ends in a <i>sup</i> or <i>tiṅ</i> affix is called a <i>pada</i>, a word.</p><p><b>Type.</b> A <i>saṃjñā</i> rule.</p><p><b>Reading.</b> The grammar's definition of a word is by its ending: something is a word if it carries a noun ending or a verb ending. It is a formal definition, and it does not depend on meaning. The rule matters for sandhi, since many rules apply "at the end of a word" (<i>padānta</i>), and this definition tells what counts as a word.</p><p><b>Example.</b> <i>rāmaḥ</i> is a word, since it ends in the case ending <i>su</i> (after the changes). <i>rāma</i> alone is a stem, not a word, until an ending is added.</p><p><b>Role in the system.</b> It marks the boundary between the formation of words and the rules that apply between words. The distinction is the one between morphology and sandhi, and its sharp definition allows the later rules to refer to word edges. In programming terms, it defines a token.</p>`],
['Thirty Rules Taken Apart','1.4.23 kārake',`<p><b>Sūtra.</b> <i>kārake</i>. <b>Words.</b> <i>kārake</i> (in the matter of kāraka, the roles).</p><p><b>Meaning.</b> A heading: the rules that follow, up to 1.4.55, define the roles of nouns in relation to the verb.</p><p><b>Type.</b> An <i>adhikāra</i>, a governing heading.</p><p><b>Reading.</b> This one-word sūtra opens a block. Every rule from here to the end of the block is read with the word <i>kārake</i> understood, so that each of them defines a role. The mechanism is <i>anuvṛtti</i>, as described earlier, and the heading is the way the grammar sets a scope without repeating a word.</p><p><b>Example.</b> The rule that follows, <i>dhruvam apāye 'pādānam</i> (1.4.24), is read as "in the matter of roles, the fixed point from which separation occurs is called the <i>apādāna</i>".</p><p><b>Role in the system.</b> It organises the grammar's theory of meaning. The kāraka definitions are the link between the structure of a sentence and the situation it describes. In programming terms, the heading is like a block that opens a scope, inside which each statement inherits the context.</p>`],
['Thirty Rules Taken Apart','1.4.54 svatantraḥ kartā',`<p><b>Sūtra.</b> <i>svatantraḥ kartā</i>. <b>Words.</b> <i>svatantraḥ</i> (independent), <i>kartā</i> (agent).</p><p><b>Meaning.</b> The one who is independent in the action is called the <i>kartṛ</i>, the agent.</p><p><b>Type.</b> A <i>saṃjñā</i> rule, within the kāraka block.</p><p><b>Reading.</b> The definition is by function, not by grammatical form. The agent is the one who is "independent", that is, who initiates and controls the action. It is not defined as "the subject of the sentence", which in other grammars is a matter of position or case. The commentators explain that an agent may be a person, an animal, or an instrument seen as acting, as in "the knife cuts", where the knife is treated as independent.</p><p><b>Example.</b> In <i>Rāmaḥ vane mṛgaṃ hanti</i>, Rāma is the agent. In the passive, <i>Rāmeṇa mṛgo hanyate</i>, Rāma is still the agent, although the case is now the instrumental.</p><p><b>Role in the system.</b> The role stays the same while the case changes, which is the reason for having roles at all. The distinction lets the grammar state once how verb forms govern roles, and then how roles are expressed in each construction. In software, it is the separation of the abstract argument from the way it is written in a call.</p>`],
['Thirty Rules Taken Apart','2.1.1 samarthaḥ padavidhiḥ',`<p><b>Sūtra.</b> <i>samarthaḥ padavidhiḥ</i>. <b>Words.</b> <i>samarthaḥ</i> (having a connected meaning), <i>pada-vidhiḥ</i> (a rule about words).</p><p><b>Meaning.</b> A rule that operates on words applies to words that are connected in meaning.</p><p><b>Type.</b> A <i>paribhāṣā</i> and <i>adhikāra</i>, governing the rules for compounds and some others.</p><p><b>Reading.</b> The condition is called <i>sāmarthya</i>, "mutual fitness". Words may be combined by the rules only if their meanings fit together. For example, the words <i>rājñaḥ</i> ("of the king") and <i>puruṣaḥ</i> ("man") are connected in meaning, and so can form <i>rājapuruṣa</i>. Two unrelated words cannot.</p><p><b>Example.</b> The compound <i>rājapuruṣa</i> is allowed because the words are related, as possessor and possessed. A pair like <i>rājñaḥ</i> and an unrelated word fails the test.</p><p><b>Role in the system.</b> This rule brings meaning into a system that is mostly about form. It is a type check: the rules for compounds say what forms to build, and this rule says that they apply only where the pieces make sense together. It answers the question of what keeps a rewriting system from producing nonsense.</p>`],
['Thirty Rules Taken Apart','2.2.23 śeṣo bahuvrīhiḥ',`<p><b>Sūtra.</b> <i>śeṣo bahuvrīhiḥ</i>. <b>Words.</b> <i>śeṣaḥ</i> (the remainder), <i>bahuvrīhiḥ</i> (the term "bahuvrīhi").</p><p><b>Meaning.</b> The compound that is left, after the other types have been defined, is called bahuvrīhi.</p><p><b>Type.</b> A <i>saṃjñā</i> rule, by exclusion.</p><p><b>Reading.</b> The rule defines the type by what it is not. Having defined avyayībhāva, tatpuruṣa, and (just after) dvandva, Pāṇini names the rest. The next rule, 2.2.24, <i>anekam anyapadārthe</i>, gives the positive description: several words that stand for something other than their own meaning.</p><p><b>Example.</b> <i>pītāmbara</i> is not an adverb, not a case-relation compound, and not a pair joined by "and". It is the remainder, a compound that points to something outside itself: one who has yellow cloth.</p><p><b>Role in the system.</b> A default class defined as the complement of the others is an old and economical device. In a program it is the <i>else</i> branch. It ensures that every compound falls into some category, and so that the rules for compounds cover all cases.</p>`],
['Thirty Rules Taken Apart','2.2.29 cārthe dvandvaḥ',`<p><b>Sūtra.</b> <i>cārthe dvandvaḥ</i>. <b>Words.</b> <i>ca-arthe</i> (in the sense of "and"), <i>dvandvaḥ</i> (the term "dvandva").</p><p><b>Meaning.</b> A compound in the sense of "and" is called dvandva.</p><p><b>Type.</b> A <i>saṃjñā</i> rule.</p><p><b>Reading.</b> The rule defines the dvandva by meaning. The word <i>ca</i> ("and") stands for a relation of joining, and a compound that has this meaning is a dvandva. The commentators distinguish two kinds: the <i>itaretara</i> dvandva, in which the items are counted separately, and the <i>samāhāra</i> dvandva, in which they are taken as a collection.</p><p><b>Example.</b> <i>Rāma-Lakṣmaṇau</i> is "Rāma and Lakṣmaṇa", a dual, as an itaretara dvandva. <i>pāṇipādam</i> is "hands and feet", a neuter singular, as a samāhāra dvandva.</p><p><b>Role in the system.</b> It shows how the grammar defines a form by a semantic condition. The same device is used throughout the rules for compounds: each type is introduced with its meaning. A modern grammar might call this a semantic feature that selects a rule.</p>`],
['Thirty Rules Taken Apart','2.3.2 karmaṇi dvitīyā',`<p><b>Sūtra.</b> <i>karmaṇi dvitīyā</i>. <b>Words.</b> <i>karmaṇi</i> (in the sense of karman, the object), <i>dvitīyā</i> (the second case).</p><p><b>Meaning.</b> The second case, the accusative, is used for the object.</p><p><b>Type.</b> A <i>vidhi</i> rule, assigning a case to a role. It operates under the condition of 2.3.1, <i>anabhihite</i>, "when the role has not already been expressed".</p><p><b>Reading.</b> This is the link between the kāraka theory and the case endings. The role of object, defined in 1.4.49, takes the second case unless the verb has already expressed it, as in the passive.</p><p><b>Example.</b> <i>Rāmaḥ mṛgaṃ hanti</i>: the object <i>mṛga</i> takes the accusative <i>mṛgam</i>. In <i>Rāmeṇa mṛgo hanyate</i> the verb is passive and expresses the object, so the object takes the nominative.</p><p><b>Role in the system.</b> It is the bridge between meaning and form. The rule is a clean separation of levels: the roles are defined first, and the case endings are then assigned by a short list of rules. A reader who knows type systems can think of it as a mapping from semantic types to surface forms.</p>`],
['Thirty Rules Taken Apart','2.4.71 supo dhātuprātipadikayoḥ',`<p><b>Sūtra.</b> <i>supo dhātuprātipadikayoḥ</i>. <b>Words.</b> <i>supaḥ</i> (of the noun ending), <i>dhātu-prātipadikayoḥ</i> (in a root or a stem).</p><p><b>Meaning.</b> The noun ending is deleted when it stands inside a root or a stem, that is, within a compound or a derived form.</p><p><b>Type.</b> A <i>vidhi</i> rule of deletion, in the group of rules on <i>luk</i>, "complete deletion".</p><p><b>Reading.</b> When words are joined into a compound, the first word's case ending is no longer wanted, since the whole will take one ending at its end. This rule removes it. Without it the compound would carry the endings of all its members.</p><p><b>Example.</b> In <i>rājñaḥ puruṣaḥ</i>, the genitive ending of <i>rājan</i> and the nominative of <i>puruṣa</i> are both deleted when the compound is formed, leaving <i>rājan + puruṣa</i>, and the final form is <i>rājapuruṣa</i>.</p><p><b>Role in the system.</b> It enforces the rule that a compound is a single word. It is the step that turns a phrase into a unit, and in programming terms it flattens a list of tokens into a single token. The exceptions, where the ending is kept (<i>aluk</i> compounds such as <i>yudhiṣṭhira</i>), are handled by other rules.</p>`],
['Thirty Rules Taken Apart','3.1.68 kartari śap',`<p><b>Sūtra.</b> <i>kartari śap</i>. <b>Words.</b> <i>kartari</i> (when the agent is expressed), <i>śap</i> (the affix śap).</p><p><b>Meaning.</b> When the verb expresses the agent, the affix <i>śap</i> is placed after the root, before a sārvadhātuka ending.</p><p><b>Type.</b> A <i>vidhi</i> rule: an insertion.</p><p><b>Reading.</b> The affix <i>śap</i> has the markers <i>ś</i> and <i>p</i>, and after their deletion it is the vowel <i>a</i>. It is the sign of the first class of roots, the largest. Other classes use other insertions, such as <i>śnu</i> and <i>śa</i>. The rule has the condition <i>kartari</i>, so that in the passive, which does not express the agent through the verb, a different element, <i>yak</i>, is inserted instead.</p><p><b>Example.</b> <i>bhū + tip</i> becomes <i>bhū + śap + ti</i>, then <i>bho + a + ti</i>, then <i>bhavati</i>.</p><p><b>Role in the system.</b> It is a typical derivation rule. It checks a condition (the voice), inserts an element, and leaves the later rules to work on the markers it carries. The marker <i>p</i> makes the ending behave in a certain way with regard to guṇa, and the marker <i>ś</i> marks the affix as one of the sārvadhātuka class.</p>`],
['Thirty Rules Taken Apart','3.2.123 vartamāne laṭ',`<p><b>Sūtra.</b> <i>vartamāne laṭ</i>. <b>Words.</b> <i>vartamāne</i> (in the sense of present time), <i>laṭ</i> (the affix laṭ).</p><p><b>Meaning.</b> The present tense affix <i>laṭ</i> is used after a root to express an action in progress.</p><p><b>Type.</b> A <i>vidhi</i> rule that connects a meaning to an affix.</p><p><b>Reading.</b> The rule is the start of a derivation of a present verb form. It says that, when the meaning is "present", a <i>laṭ</i> affix is added to the root. At this point <i>laṭ</i> is an abstract placeholder, not a spoken ending. It will be replaced by one of the personal endings in the next stage, by 3.4.78.</p><p><b>Example.</b> For the root <i>bhū</i> with a present meaning, the derivation starts with <i>bhū + laṭ</i>.</p><p><b>Role in the system.</b> The rule shows how the grammar starts from meaning and builds toward form. A meaning (present time) triggers an abstract affix, which is then filled in. It is similar to the way a compiler might select an abstract instruction first and choose the machine-specific encoding later. The separation of meaning and form is a main design choice of the grammar.</p>`],
['Thirty Rules Taken Apart','4.1.92 tasyāpatyam',`<p><b>Sūtra.</b> <i>tasyāpatyam</i>. <b>Words.</b> <i>tasya</i> (his, of him), <i>apatyam</i> (offspring).</p><p><b>Meaning.</b> A taddhita affix is added to a word to express "the descendant of that person".</p><p><b>Type.</b> A <i>vidhi</i> rule, introducing a meaning for the taddhita affixes. It heads a block of rules for patronymics.</p><p><b>Reading.</b> The rule is brief but it opens a large family. The general affix is <i>aṇ</i> (4.1.83), and others replace it for particular classes of names: <i>iñ</i> after stems in <i>a</i> (4.1.95), <i>yañ</i> for the <i>garga</i> group (4.1.105), and so on.</p><p><b>Example.</b> <i>Upagu</i> gives <i>Aupagava</i>; <i>Pāṇḍu</i> gives <i>Pāṇḍava</i>; <i>Daśaratha</i> gives <i>Dāśarathi</i>; <i>Garga</i> gives <i>Gārgya</i>.</p><p><b>Role in the system.</b> It shows the grammar's method for derivational morphology: state the meaning, give a default affix, and list the exceptions. The family names of the epics are generated by this one rule and its relatives. In programming terms, it is a template with overrides.</p>`],
['Thirty Rules Taken Apart','6.1.77 iko yaṇ aci',`<p><b>Sūtra.</b> <i>iko yaṇ aci</i>. <b>Words.</b> <i>ikaḥ</i> (of ik), <i>yaṇ</i> (yaṇ), <i>aci</i> (when ac follows).</p><p><b>Meaning.</b> The vowels <i>i, u, ṛ, ḷ</i> are replaced by the semivowels <i>y, v, r, l</i> when a vowel follows.</p><p><b>Type.</b> A <i>vidhi</i> rule of substitution.</p><p><b>Reading.</b> The two pratyāhāras correspond in order, so that <i>i</i> goes to <i>y</i>, <i>u</i> to <i>v</i>, <i>ṛ</i> to <i>r</i>, and <i>ḷ</i> to <i>l</i>. The rule is in the sandhi section, under the heading <i>saṃhitāyām</i>, "in close contact" (6.1.72), which is carried forward.</p><p><b>Example.</b> <i>iti + ādi</i> gives <i>ityādi</i>; <i>su + āgata</i> gives <i>svāgata</i>; <i>pitṛ + anumati</i> gives <i>pitranumati</i>.</p><p><b>Role in the system.</b> It is the model of a sound-change rule: a target class, a result class, and a right context. The earlier chapters implemented it in Python and in JavaScript. It also shows the strength of the pratyāhāra device: one short sūtra covers four sound changes and every context in which they occur.</p>`],
['Thirty Rules Taken Apart','6.1.87 ād guṇaḥ',`<p><b>Sūtra.</b> <i>ād guṇaḥ</i>. <b>Words.</b> <i>āt</i> (after a), <i>guṇaḥ</i> (guṇa).</p><p><b>Meaning.</b> When a vowel follows <i>a</i> or <i>ā</i>, the guṇa vowel takes the place of both.</p><p><b>Type.</b> A <i>vidhi</i> rule, with the context from the heading <i>ac</i> and the condition of a following vowel carried forward from earlier rules.</p><p><b>Reading.</b> The two sounds that meet, <i>a</i> or <i>ā</i> on the left and a vowel on the right, are replaced together by a single guṇa vowel. The guṇa vowel is determined by the second sound: <i>i</i> gives <i>e</i>, <i>u</i> gives <i>o</i>, <i>ṛ</i> gives <i>ar</i>. The rule 6.1.84 states that the replacement stands for both the preceding and the following sound.</p><p><b>Example.</b> <i>deva + indra</i> gives <i>devendra</i>; <i>sūrya + udaya</i> gives <i>sūryodaya</i>; <i>mahā + ṛṣi</i> gives <i>maharṣi</i>.</p><p><b>Role in the system.</b> It works together with 6.1.101 and 6.1.88, forming the vowel-sandhi trio. When two rules could apply to the same pair, the conflict principles decide: the rule for similar vowels applies when the vowels are alike, and this rule when they differ.</p>`],
['Thirty Rules Taken Apart','6.1.101 akaḥ savarṇe dīrghaḥ',`<p><b>Sūtra.</b> <i>akaḥ savarṇe dīrghaḥ</i>. <b>Words.</b> <i>akaḥ</i> (of an ak vowel), <i>savarṇe</i> (when a similar sound follows), <i>dīrghaḥ</i> (the long vowel).</p><p><b>Meaning.</b> An <i>ak</i> vowel followed by a similar vowel is replaced, together with it, by the long vowel.</p><p><b>Type.</b> A <i>vidhi</i> rule.</p><p><b>Reading.</b> Here the pratyāhāra <i>ak</i> stands for <i>a, i, u, ṛ, ḷ</i>, and the definition of <i>savarṇa</i> in 1.1.9 decides what counts as similar. The rule thus brings two earlier devices together, and the result is a very short statement of a common pattern.</p><p><b>Example.</b> <i>deva + ālaya</i> gives <i>devālaya</i>; <i>kavi + indra</i> gives <i>kavīndra</i>; <i>sādhu + ūrjita</i> gives <i>sādhūrjita</i>.</p><p><b>Role in the system.</b> It is the most general of the vowel-sandhi rules. It is checked first in the code of the earlier chapter, because it covers pairs that other rules would otherwise misprocess. Reading the rule shows how definitions made early in the grammar (1.1.9) and abbreviations made at its start (the Śiva Sūtras) are used late, as parts of a single statement.</p>`],
['Thirty Rules Taken Apart','7.3.84 sārvadhātukārdhadhātukayoḥ',`<p><b>Sūtra.</b> <i>sārvadhātukārdhadhātukayoḥ</i>. <b>Words.</b> <i>sārvadhātuka-ārdhadhātukayoḥ</i> (before a sārvadhātuka or ārdhadhātuka affix).</p><p><b>Meaning.</b> Before an affix of either of these two classes, the final vowel of the stem (aṅga) is given guṇa.</p><p><b>Type.</b> A <i>vidhi</i> rule, with the target and the replacement (guṇa) carried forward from the surrounding rules.</p><p><b>Reading.</b> The two classes between them cover all verb affixes, so the rule is general. A sārvadhātuka affix is one of the endings that follow the present stem. An ārdhadhātuka is one that follows the bare root, such as those of the future. The strengthening of the vowel is blocked when the affix has the marker <i>k</i> or <i>ṅ</i> (1.1.5).</p><p><b>Example.</b> <i>bhū + a + ti</i> becomes <i>bho + a + ti</i>. The root vowel <i>ū</i> is strengthened to <i>o</i>.</p><p><b>Role in the system.</b> It is one of the main rules in the stem operations of the seventh chapter. Its generality and its dependence on markers show the style of the grammar: a short rule applied to a large class, with the exceptions handled by flags on the affixes.</p>`],
['Thirty Rules Taken Apart','8.2.1 pūrvatrāsiddham',`<p><b>Sūtra.</b> <i>pūrvatrāsiddham</i>. <b>Words.</b> <i>pūrvatra</i> (with respect to what is earlier), <i>asiddham</i> (not accomplished, treated as not having happened).</p><p><b>Meaning.</b> The rules that follow, to the end of the grammar, are treated as not having applied when one considers the rules before them.</p><p><b>Type.</b> A <i>paribhāṣā</i> and <i>adhikāra</i>, governing the last three sections (the tripādī).</p><p><b>Reading.</b> This rule makes the last part of the grammar a separate stage. The changes made there, at the edges of words, are invisible to the rules that came before. So the earlier rules apply as if those changes had not happened.</p><p><b>Example.</b> The change of a final <i>s</i> to <i>ru</i> (8.2.66) is made in this stage. It does not affect the rules that decide, for example, where vowels are strengthened in the stem, because those rules do not see it.</p><p><b>Role in the system.</b> It is a layering rule. It prevents later phonetic adjustments from interfering with earlier word-building. In compiler terms, it makes the final sound changes a separate pass, whose output the earlier passes do not see. It is also at the centre of the debates over how to implement the grammar, since the interaction of this rule with the order of rules is subtle.</p>`],
['Thirty Rules Taken Apart','8.2.66 sasajuṣo ruḥ',`<p><b>Sūtra.</b> <i>sasajuṣo ruḥ</i>. <b>Words.</b> <i>sa-sajuṣoḥ</i> (of the final s of a word, and of the word <i>sajuṣ</i>), <i>ruḥ</i> (ru).</p><p><b>Meaning.</b> The final <i>s</i> of a word, and the final of <i>sajuṣ</i>, is replaced by <i>ru</i>.</p><p><b>Type.</b> A <i>vidhi</i> rule, in the tripādī.</p><p><b>Reading.</b> The unit <i>ru</i> is an abstract element, a placeholder whose <i>u</i> is a marker and whose real content is the <i>r</i>. Later rules decide what it becomes: a visarga at the end of a phrase (8.3.15), a long vowel or <i>o</i> before a voiced sound (6.1.113 and 6.1.114), or <i>r</i> before a vowel.</p><p><b>Example.</b> <i>rāmas</i> becomes <i>rāmaru</i>, and then <i>rāmaḥ</i> at the end of a phrase, <i>rāmo</i> before <i>gacchati</i>, or <i>rāma</i> before a vowel word such as <i>iti</i>.</p><p><b>Role in the system.</b> It is a good example of an abstract intermediate form that makes a set of rules shorter. The grammar does not state separate rules for every ending and every following sound. It sends all of them through the intermediate <i>ru</i>, and the rules after it handle the outcome. The same idea is used in compilers: an intermediate representation that simplifies later stages.</p>`],
['Thirty Rules Taken Apart','8.4.40 stoḥ ścunā ścuḥ',`<p><b>Sūtra.</b> <i>stoḥ ścunā ścuḥ</i>. <b>Words.</b> <i>stoḥ</i> (of s and the t-group), <i>ścunā</i> (with the ś and the c-group), <i>ścuḥ</i> (the ś and c-group).</p><p><b>Meaning.</b> When a dental (<i>s</i> or the <i>t</i>-class) is in contact with a palatal (<i>ś</i> or the <i>c</i>-class), it is replaced by the palatal.</p><p><b>Type.</b> A <i>vidhi</i> rule of assimilation, in the tripādī.</p><p><b>Reading.</b> Here the sounds are named by their classes. The rule says that a dental changes to the palatal of the same kind (matching by position in the class) when it touches a palatal on either side. The mapping between the classes is by correspondence.</p><p><b>Example.</b> <i>sat + cit</i> gives <i>saccit</i>; <i>sat + jana</i> gives <i>sajjana</i>; <i>rāmas + ca</i>, with the visarga treated as <i>s</i>, gives <i>rāmaś ca</i>.</p><p><b>Role in the system.</b> It is a rule of assimilation, a sound taking on a feature of its neighbour. It is paired with 8.4.41 for the retroflexes. The compact form, naming whole classes of sounds on both sides, is a good example of how Pāṇini covers many cases with a single rule.</p>`],
['Thirty Rules Taken Apart','8.4.68 a a',`<p><b>Sūtra.</b> <i>a a</i>. <b>Words.</b> Two letters, <i>a</i> and <i>a</i>.</p><p><b>Meaning.</b> The open (<i>vivṛta</i>) short <i>a</i> of the grammar's notation is, in use, the closed (<i>saṃvṛta</i>) short <i>a</i> of speech.</p><p><b>Type.</b> A rule of the metalanguage, an <i>atideśa</i> or closing statement, with the final operation that makes the notation exact.</p><p><b>Reading.</b> In the grammar's own notation the short <i>a</i> is treated as an open vowel, like <i>ā</i>, so that the two count as similar and one rule can cover both. In actual speech the short <i>a</i> is a closed vowel. The commentators explain that the last sūtra, <i>a a</i>, tells us that the open <i>a</i> of the notation is to be understood as the closed <i>a</i> of speech. It lies in the final stage of the grammar, where its effect does not disturb the earlier rules.</p><p><b>Role in the system.</b> It is the final line, and it fixes a detail of the notation. It shows that Pāṇini treats his own metalanguage as something that needs exact definition, and that the grammar ends with a statement about how to read itself. It is a fitting close to a text so concerned with precision.</p>`]
);

PP.push(
['The Generative Architecture','What Generative Means',`<p>A <b>generative</b> grammar is a finite set of rules that produces the sentences or words of a language. It does not list them; it builds them. Because the rules can be applied again and again, a small system can produce an unlimited number of forms. The term is associated with Noam Chomsky's work of the 1950s, but the idea is much older, and the <i>Aṣṭādhyāyī</i> is the earliest complete example known.</p><p>The user's notes speak of the "architecture of a generative rule system", and this chapter takes the phrase literally. It asks how Pāṇini's roughly four thousand rules are arranged: which rules come first, how they are grouped, what each group takes in and gives out, and how conflicts are settled. It is the view from above, to complement the earlier chapter that looked at thirty rules one by one.</p><p>The answer has a clear shape. The grammar is a pipeline of layers, from a metalanguage and a lexicon through word-building and compounding to the final sounds. Control is provided by a small number of general principles. The chapter describes each layer, the principles, and several full derivations, and then compares the design with modern generative grammar.</p>`],
['The Generative Architecture','The Input: Roots, Stems, and Meanings',`<p>A generative system needs an input. For the <i>Aṣṭādhyāyī</i> the input is a set of basic elements and a statement of what is to be expressed.</p><p><b>Roots.</b> The <i>Dhātupāṭha</i> lists about two thousand verbal roots with their meanings and markers. These are the starting points of verbs and of many nouns.</p><p><b>Stems.</b> A smaller set of nominal stems, listed in part by the <i>Gaṇapāṭha</i> and in part assumed from the language, is the input to the noun system. The <i>Uṇādi</i> lists give further stems derived from roots.</p><p><b>Meanings.</b> The grammar begins from meaning. Rules say "when the meaning is present time", or "when the meaning is offspring", and select the affix on that basis. Pāṇini does not define the meanings themselves, which he takes as given by the speaker's intention. What he supplies is the translation of intention into form.</p><p>The consequence is a grammar that is <b>onomasiological</b>: it starts with what one wants to say and ends with the word. A parser, in contrast, starts with the word. The same knowledge serves both, but the direction of the rules is from meaning to sound.</p>`],
['The Generative Architecture','The Output: Correct Words',`<p>The output is a correct Sanskrit word, in the sense of the speech of the learned. The grammar aims to produce all correct forms and no incorrect ones. This is a very strong requirement, and it is the ideal that modern grammars also state, though few reach it.</p><p>In practice the grammar has to allow for variation. Some forms are optional, and the rules say so with <i>vā</i> or <i>vibhāṣā</i>. Some belong to the Veda only, and are marked <i>chandasi</i>. Some are irregular, and are admitted by listing. The output is therefore a set of forms with their conditions, not a single form.</p><p>The notion of correctness is tied to the speech of cultivated people, the <i>śiṣṭa</i>, whom Patañjali describes as those who speak Sanskrit by habit and need no grammar to do so. The grammar is thus descriptive of an existing standard, and not an invention. Patañjali also says that the purpose of studying grammar is to know which forms are right and to avoid wrong ones, the equivalent of a quality check.</p><p>The architecture can be summarised as a function: it takes a root or stem, the grammatical features wanted, and the meaning, and returns the correct form, with a trace of the rules used.</p>`],
['The Generative Architecture','Layer 0: The Metalanguage',`<p>Before any word is made, the grammar defines the language in which it is written. This is the work of the first chapter and of the Śiva Sūtras, which together form <b>layer 0</b>. It contains the ordered alphabet, the pratyāhāras, the technical terms such as <i>vṛddhi</i>, <i>guṇa</i>, <i>pada</i>, and <i>aṅga</i>, and the interpretive rules such as 1.1.49 and 1.1.56.</p><p>This layer has no output of its own. It supplies the notation, the vocabulary, and the conventions for reading the rules. It is comparable to the header files and macro definitions in a program, or to the definitions of a grammar's terminal and non-terminal symbols.</p><p>The importance of the layer is clear from what it makes possible. Without the pratyāhāras every rule would need long lists of sounds. Without the technical terms every rule would repeat definitions. The compactness for which the grammar is known depends on this foundation.</p><p>The layer also records a design choice. Pāṇini prefers to define a term once, early, and use it many times, even when the definition is far from the rules that use it. The reader pays by having to remember the definitions, and the grammar gains economy. This is the opposite of the style of modern programming, which prefers definitions near their use, and it is a reason why the grammar is hard to read without a guide.</p>`],
['The Generative Architecture','Layer 1: Roots and Affixes',`<p>The second layer, beginning at 3.1.1, introduces the elements out of which words are built. The heading <i>pratyayaḥ</i> ("affix") governs the whole of the third to fifth chapters, together with <i>paraś ca</i> ("and it comes after") and <i>ādyudāttaś ca</i> ("and it has the high pitch on its first vowel").</p><p>Under this heading the grammar states which affix is added to which base, with which meaning. An affix is something that comes after the base, so the order is determined: base first, affix second. The affix has a marker that sets its behaviour, and a meaning that justifies its use.</p><p>Layer 1 is where meaning enters the derivation. A rule such as 3.2.123 connects the meaning "present" to the affix <i>laṭ</i>, and 4.1.92 connects "offspring" to a taddhita affix. The rules in this layer are the interface between the semantic and the formal sides of the grammar.</p><p>The derivation at this point has a skeleton: a base plus one or more affixes, each with markers, and no sounds changed yet. The later layers turn the skeleton into a spoken word. The separation of the skeleton from its phonetic realisation is one of the main design ideas of the grammar and is the same as the separation between deep and surface structure in later linguistics.</p>`],
['The Generative Architecture','Layer 2: Derivational Morphology',`<p>The next layer makes new bases from old ones. It has three families.</p><p><b>Kṛt affixes</b> (3.1 to 3.4) make nouns, adjectives, and participles from verbal roots: <i>kartṛ</i> "doer", <i>kṛti</i> "work", <i>gata</i> "gone", <i>gantavya</i> "to be gone to".</p><p><b>Taddhita affixes</b> (4.1 to 5.4) make new nouns and adjectives from nouns: <i>Pāṇḍava</i> "son of Pāṇḍu", <i>gurutva</i> "heaviness", <i>śrīmat</i> "fortunate".</p><p><b>Feminine and secondary affixes</b> (4.1) make feminine stems, such as <i>ajā</i> from <i>aja</i>.</p><p>Derived roots, such as causatives, desideratives, and intensives (3.1), also belong here. The result is that the vocabulary of the language grows from a small stock of roots and stems by a small set of affixes, each with a defined meaning.</p><p>This layer is where the grammar's productivity is most visible. A single root can yield dozens of related words, and a native speaker, or a student, who knows the affixes can understand a new word by analysing it. For computing, this is the property that makes it possible to build morphological analysers that cover large vocabularies with small rule sets.</p>`],
['The Generative Architecture','Layer 3: Inflection',`<p>When a base is complete it takes the endings that show its role in a sentence. For nouns these are the twenty-one <i>sup</i> endings (4.1.2). For verbs, the ten <i>lakāras</i> are placeholders that give way to the eighteen <i>tiṅ</i> endings (3.4.77, 3.4.78).</p><p>The assignment of endings follows the meaning and the grammatical features of the sentence. The case of a noun depends on its role, by the rules of 2.3, and the person and number of a verb agree with its agent, as given by the rules of 1.4 and 3.4. In the grammar the agreement is not stated as a separate matter. It follows from the roles and from the choice of the endings.</p><p>At this layer the derivation has a base, its derivational affixes, and an inflectional ending, each with markers. The sounds are still not final. The ending may need to be replaced by another form (7.1.12, 7.1.9), and the base may need to change.</p><p>The layer shows the grammar's economy in a clear form. The nominal and verbal systems each have a few dozen basic endings. The differences between the declensions, which fill pages in textbooks, are produced by the rules of the next layer, not by separate tables.</p>`],
['The Generative Architecture','Layer 4: Operations on the Stem',`<p>The seventh chapter and parts of the sixth are devoted to what happens to the stem (<i>aṅga</i>) when an ending is added. Vowels are strengthened (guṇa, vṛddhi), lengthened, shortened, or replaced, consonants are changed, and augments such as the <i>iṭ</i> are inserted.</p><p>These operations depend on the marker of the ending. An ending with a <i>k</i> or <i>ṅ</i> marker blocks strengthening (1.1.5), while one with <i>ṇ</i> triggers vṛddhi (7.2.115). The ending, by its markers, tells the stem how to change. This is a clean mechanism: the information needed is carried by the affix and read by the rules, with no need for separate lists for each combination.</p><p>The operations are conditioned also by the sounds on either side, by the class of the root, and by the meaning in a few cases. The rules are many, and they form the largest block of the grammar. Their effect is to turn a skeleton into a stem-plus-ending whose sounds are almost right.</p><p>In program terms, this layer is the main computation. The earlier layers choose elements, and this one adjusts them to fit. It is the part of the system where the interactions between rules are most complicated, and where the principles of ordering and priority are most used.</p>`],
['The Generative Architecture','Layer 5: Compounds',`<p>The compounding rules of the second chapter act on words, in contrast to the layers that build and inflect single bases. Two or more words that are connected in meaning (2.1.1) are joined into one, their case endings are deleted (2.4.71), and the compound is treated as a new stem to which the endings of the whole are then added.</p><p>The rules define the four main types and their sub-types, set the order of the members, and fix the gender, number, and accent of the result. Compounds can contain other compounds, so that the layer is recursive: the output of one application can be the input of the next.</p><p>The placement of compounding in the architecture is instructive. It comes after the inflection of the individual words, in the sense that the members start as inflected words (that is why the vigraha is a full phrase), and before the final sound changes, so that the sandhi at the joints is done by the last layer. The compound is made, its internal case endings deleted, and its internal sounds adjusted later.</p><p>The layer shows the grammar's handling of recursion. A finite set of rules can generate compounds of any length, which is the formal basis of the long compounds of classical prose.</p>`],
['The Generative Architecture','Layer 6: Sandhi and Final Sounds',`<p>The last stage of the grammar adjusts the sounds at the joints of elements and at the edges of words. Part of it is in the sixth chapter, where the vowel rules apply (6.1.77 to 6.1.101), and part is in the last three sections, the <i>tripādī</i>, where consonants and visarga are treated (8.2 to 8.4).</p><p>This layer takes a skeleton of morphemes, with their markers removed, and makes it speakable. It applies the changes that are due to sound contact: merging, replacing, voicing, assimilating, and so on. It is done last because it depends on the final shape of the word, including all prior changes, and because the earlier rules should not be disturbed by it.</p><p>The ordering device is the principle <i>pūrvatrāsiddham</i> (8.2.1), which makes the tripādī a one-way stage. The effect is that the last layer is a transformation from one string to another that cannot feed back. For this reason, as the formal chapter noted, its rules can be run as a finite-state machine, which is a convenient property for implementation.</p><p>The output of this layer is the surface form: the spoken word, ready to be uttered with its accent.</p>`],
['The Generative Architecture','Layer 7: Accent',`<p>Accent is handled alongside the other operations and is not a separate pass at the end. Each affix has a marker indicating where the high pitch falls, and the rules of the sixth chapter move or erase the accent in particular cases. The general rule (6.1.158) is that a word has a single high-pitched syllable, with the others low.</p><p>The accent rules interact with compounds and with sandhi. Compounds have an accent by type (6.1.223, 6.2.1), and sandhi can create the falling pitch (<i>svarita</i>) from a high vowel merging with a low one.</p><p>Accent matters for the Veda, where it is part of the meaning, and much less for the spoken language of Pāṇini's time, as far as the grammar shows. The grammar therefore has rules for accent in the Vedic sections and many fewer for the ordinary language.</p><p>From the standpoint of architecture, accent shows the grammar's ability to carry one more kind of information on the derivation. The markers on the elements set the accent, as they set the behaviour of vowels, and the rules read them. The extension of the system to a new feature, pitch, did not need a new machinery. It needed more markers, and more rules that read them.</p>`],
['The Generative Architecture','How the Layers Connect',`<p>The layers can be set out as a pipeline, with the output of each as the input of the next.</p><table class="ex sm"><tr><td>Stage</td><td>Takes in</td><td>Gives out</td></tr><tr><td>0 Metalanguage</td><td>(none)</td><td>notation, terms, conventions</td></tr><tr><td>1 Roots and affixes</td><td>root, meaning</td><td>base + affix skeleton</td></tr><tr><td>2 Derivation</td><td>base</td><td>derived bases</td></tr><tr><td>3 Inflection</td><td>base, features</td><td>base + endings</td></tr><tr><td>4 Stem operations</td><td>base + endings with markers</td><td>adjusted stem and ending</td></tr><tr><td>5 Compounds</td><td>inflected words</td><td>compound stems</td></tr><tr><td>6 Sandhi, final sounds</td><td>morpheme string</td><td>surface sounds</td></tr><tr><td>7 Accent</td><td>derivation with markers</td><td>pitch pattern</td></tr></table><p>The pipeline is not strictly linear in the text, since rules of different layers are interleaved in the book, and some rules apply at several stages. But as a model of what happens in a derivation, it is accurate: first the elements are chosen, then built, then adjusted, then joined, then spoken.</p><p>This structure explains the order of the chapters. It also explains why a derivation needs a clear record of its state, with the elements and their markers, at each step. The "program" of the grammar acts on a data structure that is richer than a string.</p>`],
['The Generative Architecture','Control: Order and Priority',`<p>A pipeline of layers needs control: within a layer, which rule applies when several could? The grammar has four main devices, discussed in earlier chapters, and the architecture view puts them together.</p><p><b>Specificity.</b> A special rule beats a general one (the <i>apavāda</i> principle).</p><p><b>Order in the text.</b> If two rules are of equal standing, the later wins (1.4.2).</p><p><b>Layering.</b> Rules in the tripādī are invisible to those before (8.2.1), and a block in the sixth chapter likewise (6.4.22).</p><p><b>Interpretive rules.</b> Principles such as <i>antaraṅga</i> over <i>bahiraṅga</i> (inner conditions before outer) and <i>nitya</i> (the rule that applies in every case) are applied by later commentators, in the ranking of Nāgeśa.</p><p>Together these give a deterministic system: given an input, one derivation follows. The control is not a separate program. It is built into the order and wording of the rules, and into a few statements of principle. This is why the grammar cannot be understood by reading rules in isolation. The control knowledge is as much a part of it as the rules themselves.</p><p>The next pages take up two of these principles in detail, with code and examples.</p>`],
['The Generative Architecture','The Elsewhere Principle',`<p>In 1973 the linguist Paul Kiparsky published a paper called "'Elsewhere' in phonology", in which he argued that the principle of the special over the general, which he found in Pāṇini, is a general law of grammars. He called it the <b>Elsewhere Condition</b>, and it is sometimes known as Pāṇini's principle. It says that if two rules could apply to the same input, and one is more specific than the other, the specific one applies and the general one applies "elsewhere", to the cases the specific one does not cover.</p><p>A short program makes the logic clear. Each rule lists the features an input must have. A rule is more specific if it needs a larger set of features, and among the rules that fit, the most specific is chosen.</p><pre class="code">RULES = [
    {"id": "general rule",  "needs": {"vowel"},          "result": "X"},
    {"id": "special rule",  "needs": {"vowel", "short"}, "result": "Y"},
]

def pick(features):
    fits = [r for r in RULES if r["needs"] &lt;= features]
    return max(fits, key=lambda r: len(r["needs"]))["id"]

print(pick({"vowel", "long"}))
print(pick({"vowel", "short"}))</pre><pre class="code out">general rule
special rule</pre><p>An input that is only a long vowel fits the general rule only. An input that is a short vowel fits both, and the special rule, which needs more features, wins.</p>`],
['The Generative Architecture','Feeding and Bleeding',`<p>When rules are applied in order, they can interact in two main ways. A rule <b>feeds</b> another if its output creates a situation in which the other can apply. A rule <b>bleeds</b> another if its output removes a situation in which the other would have applied. The terms were introduced by Kiparsky in the late 1960s and early 1970s, and are used to describe rule orders in any system.</p><p>An example of feeding is in the verb. The insertion of <i>śap</i> (3.1.68) creates the context in which the strengthening of the root vowel (7.3.84) applies, and the strengthened vowel creates the context for the change of <i>o</i> to <i>av</i> (6.1.78). Each step prepares the next, and the order of the rules matches the order of dependence.</p><p>An example of bleeding is in the pragṛhya rule. The dual ending <i>ī</i> or <i>e</i> would normally merge with a following vowel, but 1.1.11 protects it, so that the merging rules never apply. The protective rule bleeds the merging rules.</p><p>A designer of a rule system must decide the order with these relations in mind. Some orders give correct results and others do not, and the order that Pāṇini chose, and the conventions about invisibility, can be read as a solution to this design problem for the whole of Sanskrit. For computing, the same questions arise in any system of ordered rewrite rules.</p>`],
['The Generative Architecture','Asiddha: Layers of Invisibility',`<p>The principle of <i>asiddhatva</i>, "being treated as not done", is among the most subtle of the grammar. In its basic form (8.2.1) it says that the rules of the last three sections are invisible to earlier rules. In practice this means that when an earlier rule tests the condition for its application, it looks at the word as if the later changes had not yet occurred.</p><p>The reason is easy to see. Many of the final changes are surface phonetic adjustments: the final consonant of a word is voiced or devoiced, a visarga is made, a nasal changes place. If the earlier rules could see these changes, they might apply or fail to apply in a different way. For example, the rule that deletes a final <i>n</i> in a stem (8.2.7) would make some later rules about stems inapplicable if they were allowed to see the result. Invisibility lets each stage work on a clean input.</p><p>The idea has a close parallel in compilers. The later passes, such as register allocation and assembly, are not visible to the earlier passes, such as type checking and optimisation, and the earlier passes cannot depend on details that the later ones will decide. A layered design prevents cross-talk.</p><p>The principle is also a source of difficulty. It makes the grammar hard to implement, since a program must keep track of which rules see which state. The need to implement it faithfully has been a main topic in the computational study of the grammar.</p>`],
['The Generative Architecture','A Chain of Rules: Visarga',`<p>A chain of rules is the best way to see layers and control working together. Take the word <i>rāmaḥ</i> before <i>gacchati</i>.</p><table class="ex sm"><tr><td>Step</td><td>Form</td><td>Rule</td></tr><tr><td>1</td><td>rāma + su</td><td>stem and noun ending (4.1.2)</td></tr><tr><td>2</td><td>rāma + s</td><td>marker <i>u</i> deleted (1.3.9)</td></tr><tr><td>3</td><td>rāma + ru</td><td>final <i>s</i> becomes ru (8.2.66)</td></tr><tr><td>4</td><td>rāma + u</td><td>ru before a voiced sound loses r (6.1.114)</td></tr><tr><td>5</td><td>rāmo</td><td>a + u gives o (6.1.87 and the treatment of ru)</td></tr></table><p>The first two steps belong to the layers of inflection and markers. The remaining steps are in the final layers, and they show the intermediate unit <i>ru</i>, which is used to unify the endings in <i>s</i> and in <i>r</i>. The steps are summarised as in the commentaries and are, for teaching, simplified. The exact ordering of 6.1.113 and 6.1.114 against the invisible rules of the tripādī is one of the finer points debated in the tradition.</p><p>What the chain shows is the architecture in miniature: a morphological start, intermediate abstract elements, and a phonetic finish.</p>`],
['The Generative Architecture','Anuvṛtti as Compression',`<p>The device of carrying words forward from earlier rules, <i>anuvṛtti</i>, is the main source of the grammar's compactness, and in the architecture it plays the part of inheritance. A heading sets a context, and the following rules inherit it until it is cancelled or replaced.</p><p>The effect can be measured. A rule such as 6.1.87, <i>ād guṇaḥ</i>, has two words, but its full meaning needs, in addition, the heading "in close contact" (6.1.72), the condition "when a vowel follows" (from the preceding rules), and the statement that the replacement takes the place of both sounds (6.1.84). In full, the rule would run to a dozen or more words.</p><p>The savings are so great that a reader who does not know which words are carried forward cannot read the rules. The commentators therefore supply the list of words in force at each rule, and modern editions, such as Sharma's, do the same, rule by rule.</p><p>For software, anuvṛtti is the point that most affects implementation. A program must either store the carried words with each rule, as a table built from the commentary, or compute them from the structure of headings. Doing so correctly is a large part of the labour of making the grammar machine-readable. The device is, in a sense, a form of compression whose decompression needs an expert.</p>`],
['The Generative Architecture','Markers as Types',`<p>The marker letters attached to affixes and roots work like a type system or a set of flags. Some of the most important are the following.</p><table class="ex sm"><tr><td>Marker</td><td>Effect</td><td>Rule</td></tr><tr><td>k, ṅ</td><td>block guṇa and vṛddhi of the stem</td><td>1.1.5</td></tr><tr><td>ṇ, ñ</td><td>call for vṛddhi of the stem</td><td>7.2.115</td></tr><tr><td>p</td><td>affix without p behaves like ṅ</td><td>1.2.4</td></tr><tr><td>ś</td><td>marks the affix as sārvadhātuka</td><td>3.4.113 and others</td></tr><tr><td>ṭ</td><td>used in feminine and tense affixes</td><td>various</td></tr></table><p>A marker is a piece of information that a rule attached to an element and that other rules read. The system never needs to spell out all the combinations of affix and root, because the affixes carry the information about how they behave.</p><p>An analogy is the way object-oriented languages attach a type to a value. A rule can say "for any affix of type <i>kit</i>" instead of listing every affix. The flags are deleted at the end (1.3.9), like type annotations erased at run time.</p><p>The economy is considerable. With a few dozen markers, the grammar encodes the behaviour of hundreds of affixes, and the rules that read the markers apply to all of them. This is one of the best examples of Pāṇini's use of metadata, and of how an old text anticipated a pattern that programmers now regard as standard practice.</p>`],
['The Generative Architecture','A Taxonomy of Rule Types',`<p>The architecture also has a taxonomy of rules, which was given in an earlier chapter in the traditional terms. In engineering terms it can be put as follows.</p><table class="ex sm"><tr><td>Traditional</td><td>Role in the architecture</td><td>Programming analogy</td></tr><tr><td>saṃjñā</td><td>defines a term</td><td>constant, type definition</td></tr><tr><td>paribhāṣā</td><td>interprets other rules</td><td>language semantics, compiler flag</td></tr><tr><td>vidhi</td><td>performs an operation</td><td>statement, rewrite rule</td></tr><tr><td>niyama</td><td>restricts an operation</td><td>guard, precondition</td></tr><tr><td>atideśa</td><td>extends a property</td><td>inheritance, alias</td></tr><tr><td>adhikāra</td><td>sets a scope</td><td>block, namespace</td></tr><tr><td>niṣedha</td><td>forbids</td><td>assertion, exclusion</td></tr><tr><td>vibhāṣā</td><td>makes optional</td><td>branch, nondeterminism</td></tr><tr><td>apavāda</td><td>overrides a general rule</td><td>specialisation, override</td></tr></table><p>The analogy should be used with care, since the grammar is not a program in a modern language. But each type has a function in the system, and recognising it helps a student to read a rule: ask what the rule is doing, defining, interpreting, operating, limiting, extending, scoping, forbidding, or making optional, and the reading becomes easier.</p>`],
['The Generative Architecture','Derivation I: rāmaḥ',`<p>The first of seven worked derivations is the nominative singular of <i>rāma</i>, in a context where the word stands at the end of a phrase.</p><table class="ex sm"><tr><td>1</td><td>rāma</td><td>stem (1.2.45)</td></tr><tr><td>2</td><td>rāma + su</td><td>first case, singular: the ending <i>su</i> (2.3.46 and 4.1.2)</td></tr><tr><td>3</td><td>rāma + s</td><td>the marker <i>u</i> is deleted (1.3.2 and 1.3.9)</td></tr><tr><td>4</td><td>rāma + ru</td><td>final s becomes ru (8.2.66)</td></tr><tr><td>5</td><td>rāma + ḥ</td><td>ru becomes visarga at a pause (8.3.15)</td></tr><tr><td>6</td><td>rāmaḥ</td><td>joined</td></tr></table><p>Steps 1 to 3 are the work of the layers of inflection and markers. Steps 4 and 5 are in the tripādī. In a continuous sentence, step 5 would be replaced by the rules that treat <i>ru</i> before the following sound, as the previous chain showed.</p><p>The derivation is short, and it shows the grammar's habit of going through an abstract unit (<i>ru</i>) in order to deal with many endings at once. The same unit appears in <i>hariḥ</i>, <i>guruḥ</i>, and the verb endings in <i>s</i>, and the same two rules, 8.2.66 and 8.3.15, complete all of them.</p>`],
['The Generative Architecture','Derivation II: rāmeṇa',`<p>The instrumental singular of <i>rāma</i> is a good example of substitution and a distant sound change.</p><table class="ex sm"><tr><td>1</td><td>rāma + ṭā</td><td>third case singular ending (2.3.18, 4.1.2)</td></tr><tr><td>2</td><td>rāma + ina</td><td><i>ṭā</i> becomes <i>ina</i> after a stem in a (7.1.12)</td></tr><tr><td>3</td><td>rām(a + i)na</td><td>the stem-final a and the i meet</td></tr><tr><td>4</td><td>rāmena</td><td>a + i gives e (6.1.87)</td></tr><tr><td>5</td><td>rāmeṇa</td><td>n becomes ṇ after r (8.4.1)</td></tr></table><p>Step 2 shows a substitution that is treated as the original ending (1.1.56), so that the case remains third. Step 4 is guṇa sandhi, the same rule as in <i>devendra</i>. Step 5 is a long-distance rule: the <i>n</i> becomes <i>ṇ</i> because an <i>r</i> stands earlier in the word with only non-blocking sounds between.</p><p>The distance matters. The rule does not require the <i>r</i> and the <i>n</i> to be adjacent. It permits a stretch of vowels and certain consonants between them, and it fails if a blocking sound, such as a retroflex or dental consonant, intervenes. The Python function <i>nattva</i> of the earlier chapter implements exactly this scan.</p><p>The derivation thus uses rules from three layers: inflection, stem operations, and final sounds.</p>`],
['The Generative Architecture','Derivation III: devendra',`<p>The compound <i>devendra</i>, "lord of the gods", is made of two words and one sandhi.</p><table class="ex sm"><tr><td>1</td><td>devānām + indraḥ</td><td>two words in a genitive relation</td></tr><tr><td>2</td><td>deva + indra</td><td>the case endings are deleted, and the stems are put together (2.1.1, 2.2.8, 2.4.71)</td></tr><tr><td>3</td><td>dev(a + i)ndra</td><td>the two vowels meet inside the compound</td></tr><tr><td>4</td><td>devendra</td><td>a + i gives e (6.1.87)</td></tr></table><p>The compound is a tatpuruṣa of the genitive kind. The vigraha, <i>devānām indraḥ</i>, is the phrase that explains it. In the derivation, the grammar starts with the phrase, checks that the words are connected in meaning, and deletes the endings of the first member. A last stage of vowel sandhi finishes it.</p><p>The example shows the order of layers: compounding first, then sandhi. The same sandhi rule would apply between two words that are not in a compound, if the sentence called for a joined form. The rule does not care what produced the adjacent vowels.</p><p>This independence is a virtue of the layered design. Compounding and sandhi are separate problems, and each is solved once. A program can reuse its sandhi function for compounds, as the earlier chapter did.</p>`],
['The Generative Architecture','Derivation IV: tacchiva',`<p>The joining of <i>tat</i> and <i>śiva</i> is an example of two consonant rules working in sequence.</p><table class="ex sm"><tr><td>1</td><td>tat + śiva</td><td>two words in contact</td></tr><tr><td>2</td><td>tac + śiva</td><td>t before ś becomes c (8.4.40)</td></tr><tr><td>3</td><td>tac + chiva</td><td>ś after a stop may become ch (8.4.63)</td></tr><tr><td>4</td><td>tacchiva</td><td>joined</td></tr></table><p>The first rule changes a dental to a palatal because of the following palatal sibilant. The second, which is optional, hardens the sibilant to <i>ch</i>. The result is <i>tacchiva</i>, or without the second step, <i>tac śiva</i>.</p><p>The order here is essential. The rule 8.4.63 refers to the sound <i>c</i>, which exists only after 8.4.40 has applied. This is a case of feeding: the first rule creates the condition for the second. The grammar's order of rules in the text agrees with the order of application, and no special device is needed.</p><p>The derivation also shows the grammar's use of optionality. The second step can be skipped, and so there are two correct forms. A program must output both, as the earlier chapter's optional-rule code did.</p>`],
['The Generative Architecture','Derivation V: rājapuruṣa',`<p>The compound <i>rājapuruṣa</i>, "the king's man", was shown earlier as a list of steps. Here it appears with the layers marked.</p><table class="ex sm"><tr><td>Layer</td><td>Step</td></tr><tr><td>3 inflection</td><td>rājan + ṅas (genitive), puruṣa + su (nominative)</td></tr><tr><td>5 compounds</td><td>the words are connected in meaning (2.1.1) and in the genitive relation (2.2.8)</td></tr><tr><td>5 compounds</td><td>the first member is placed first (2.2.30); the endings are deleted (2.4.71)</td></tr><tr><td>4 stem operations</td><td>the stem rājan, at the end of a compound, takes the affix ṭac (5.4.91) and becomes rāja</td></tr><tr><td>3 inflection</td><td>the whole takes the ending <i>su</i></td></tr><tr><td>6 final sounds</td><td>rājapuruṣa + su becomes rājapuruṣaḥ</td></tr></table><p>The table shows the layers interleaved: the compound is made after the members are inflected, takes new endings as a whole, and ends with the final sounds. The step with <i>ṭac</i> is one of the compound-final affixes, discussed in the fifth chapter.</p><p>The point of the example is that a compound passes through several layers more than once. It is both an output of the inflection stage, as a phrase, and an input to it again, as a word. This recursion is a normal feature of the architecture.</p>`],
['The Generative Architecture','Derivation VI: gacchati',`<p>The verb <i>gacchati</i>, "goes", has an irregular stem, which the grammar handles with a special rule.</p><table class="ex sm"><tr><td>1</td><td>gam + laṭ</td><td>present meaning (3.2.123)</td></tr><tr><td>2</td><td>gam + tip</td><td>laṭ becomes tip (3.4.78)</td></tr><tr><td>3</td><td>gam + śap + ti</td><td>śap is inserted (3.1.68)</td></tr><tr><td>4</td><td>gam + a + ti</td><td>markers removed</td></tr><tr><td>5</td><td>gaccha + a + ti</td><td>the final m of gam becomes ccha before a śit affix (7.3.77, <i>iṣugamiyamāṃ chaḥ</i>)</td></tr><tr><td>6</td><td>gacch + a + ti</td><td>the stem-final a is dropped before the following a (6.1.97)</td></tr><tr><td>7</td><td>gacchati</td><td>joined</td></tr></table><p>The special step is 7.3.77. The rule names three roots, <i>iṣ, gam,</i> and <i>yam</i>, whose final sound becomes <i>ccha</i> before the affix <i>śap</i>. It is a rule keyed to specific roots, and it is an example of the grammar listing exceptions where no general principle can be stated.</p><p>The root <i>gam</i> does not take guṇa in this derivation, since its vowel is already <i>a</i>. Compare <i>bhavati</i>, in which the root vowel is strengthened. The same layers and rules apply to both roots, and the difference between them lies in the rules that name the root.</p>`],
['The Generative Architecture','Derivation VII: pāvaka',`<p>The agent noun <i>pāvaka</i>, "purifier" or "fire", is made from the root <i>pū</i>, "purify", with a taddhita-like kṛt affix.</p><table class="ex sm"><tr><td>1</td><td>pū + ṇvul</td><td>the agent affix <i>ṇvul</i> (3.1.133)</td></tr><tr><td>2</td><td>pū + vu</td><td>markers <i>ṇ</i> and <i>l</i> removed (1.3.3, 1.3.9)</td></tr><tr><td>3</td><td>pū + aka</td><td><i>vu</i> becomes <i>aka</i> (7.1.1)</td></tr><tr><td>4</td><td>pau + aka</td><td>vṛddhi of the root vowel because of the marker ṇ (7.2.115)</td></tr><tr><td>5</td><td>pāv + aka</td><td><i>au</i> before a vowel becomes <i>āv</i> (6.1.78)</td></tr><tr><td>6</td><td>pāvaka</td><td>joined</td></tr></table><p>The marker <i>ṇ</i> does not appear in the final word, but it caused the vowel to be strengthened to vṛddhi. This is a clear example of the use of a marker as a flag: the information that the affix needs vṛddhi was stored in the marker and read by the rule (7.2.115) after the marker had served its purpose in the earlier step. Compare <i>gāyaka</i> from <i>gai</i>.</p><p>The derivation uses rules from four layers: affixation, derivation, stem operation, and sandhi. It also illustrates the substitution of <i>vu</i> by <i>aka</i>, one of the groups of replacements for affixes in the seventh chapter.</p>`],
['The Generative Architecture','Compared with Modern Generative Grammar',`<p>Chomsky's generative grammar, beginning with <i>Syntactic Structures</i> (1957), had its own architecture: a set of base rules producing deep structures, transformations changing them, and rules of phonology giving the sounds. The comparison with Pāṇini is natural, and it has been made by many scholars. Some points of likeness and difference follow.</p><table class="ex sm"><tr><td>Feature</td><td>Pāṇini</td><td>Early generative grammar</td></tr><tr><td>Goal</td><td>correct forms of a language</td><td>all and only the grammatical sentences</td></tr><tr><td>Basic unit</td><td>words, morphemes, sounds</td><td>sentences, syntax</td></tr><tr><td>Strength</td><td>morphology, sound</td><td>syntax</td></tr><tr><td>Rule order</td><td>explicit, with principles</td><td>explicit for phonology</td></tr><tr><td>Notation</td><td>natural-language metalanguage</td><td>symbolic formulas</td></tr><tr><td>Meaning</td><td>drives the choice of affixes</td><td>kept separate, at first</td></tr></table><p>The two projects share the aim of a finite set of rules for an unbounded set of forms, a layered derivation, and ordered rules. They differ in emphasis: Pāṇini's grammar is much more complete for word-formation and sound, while syntax, in the modern sense of sentence structure, is treated only lightly, through the kāraka theory and the rules for agreement.</p><p>It is fair to say that Pāṇini anticipated several central ideas of generative grammar, and that the modern theory was developed independently and with different tools. Chomsky and others have acknowledged the earlier work.</p>`],
['The Generative Architecture','Strengths and Limits of the Architecture',`<p>The architecture has strengths that explain its long life.</p><p><b>Economy.</b> A few thousand rules, with markers and classes, cover a vast language.</p><p><b>Modularity.</b> Layers have clear roles, and compounding and sandhi, for instance, are solved once and reused.</p><p><b>Explicitness.</b> Every form has a derivation that can be checked.</p><p><b>Extensibility.</b> New roots and words are added by lists, without new rules.</p><p><b>Priority principles.</b> A small set of principles handles conflicts.</p><p>It also has limits that should be stated.</p><p><b>Dependence on conventions.</b> The rules cannot be read without the interpretive rules, the carried words, and the commentaries.</p><p><b>Subtle ordering.</b> The interaction of order, priority, and invisibility is complex and still debated.</p><p><b>Coverage.</b> Syntax and the meaning of whole sentences are handled lightly, and idiom, style, and discourse are outside it.</p><p><b>A description of one stage.</b> It describes a particular form of the language at a particular time, and later usage went beyond it, so that the later grammarians added rules and notes.</p><p>These limits do not reduce the achievement. They define the kind of thing it is: a masterly description of the forms of a language, built as a generative system, and handed on with a tradition of commentary.</p>`],
['The Generative Architecture','Summary of the Chapter',`<p>This chapter viewed the <i>Aṣṭādhyāyī</i> from above. It began with the meaning of generative, and the input (roots, stems, meanings) and output (correct words). It described eight layers in order: the metalanguage, roots and affixes, derivation, inflection, stem operations, compounds, sandhi and final sounds, and accent, and set out how they connect in a pipeline. It described the controls that decide between rules: specificity (the Elsewhere condition, with a program), order in the text, layering by invisibility, and the commentators' ranking. It explained feeding and bleeding, anuvṛtti as compression, markers as types, and a taxonomy of rule types. Seven worked derivations followed: <i>rāmaḥ, rāmeṇa, devendra, tacchiva, rājapuruṣa, gacchati,</i> and <i>pāvaka</i>. The chapter ended with a comparison to modern generative grammar and a statement of strengths and limits.</p><p>The main lesson is that the grammar is a designed system with a clear architecture, and that its design choices, layers, markers, defaults with exceptions, and explicit order, are the ones that engineers and linguists still use. The next and last chapter of this part compares the Sanskrit tradition with the Tamil grammatical tradition and gives a method for weighing the kinds of claims met in this book.</p>`]
);

PP.push(
['Two Grammatical Traditions and Weighing Claims','Two Traditions, One Country',`<p>India has more than one old grammatical tradition. Alongside Pāṇini's Sanskrit grammar stands the <i>Tolkāppiyam</i>, the oldest surviving grammar of Tamil, composed in the Tamil country in the same sūtra-like manner. The two works arose in different languages, regions, and families of speech, and each is the foundation of a long line of study.</p><p>This chapter places them side by side. It describes the Tolkāppiyam, compares it with the Aṣṭādhyāyī in structure and aim, considers whether one influenced the other, and then turns to a larger question: how a reader should weigh the claims made about the age and achievements of such traditions, including those in the notes on which this part of the book is based.</p><p>The attitude is the one adopted throughout. Each tradition is presented on its own evidence and judged by the same standards. The comparison is for understanding, not for ranking, and the reader is encouraged to enjoy both: the compact, formal precision of the Sanskrit grammar and the grammar of the Tamil tradition, with its unusual attention to the content of poetry.</p>`],
['Two Grammatical Traditions and Weighing Claims','The Tolkāppiyam at a Glance',`<p>The <i>Tolkāppiyam</i> is a work of about sixteen hundred short verses, called <i>nūṟpā</i> (the Tamil counterpart of the sūtra), in three books. Each book has nine chapters, <i>iyal</i>, so that there are twenty-seven in all.</p><table class="ex"><tr><td>Book</td><td>Subject</td><td>Chapters</td></tr><tr><td>Eḻuttatikāram</td><td>letters, sounds, and their combination</td><td>9</td></tr><tr><td>Collatikāram</td><td>words: cases, nouns, verbs, particles</td><td>9</td></tr><tr><td>Poruḷatikāram</td><td>subject-matter: love, war, conduct, poetic form</td><td>9</td></tr></table><p>The plan is more inclusive than that of Pāṇini. Where the Sanskrit grammar treats the forms of words and sounds, the Tamil work adds a third book on the content and conventions of poetry, so that grammar, poetics, and a theory of life are in a single treatise.</p><p>The text is written in the style of the early Tamil poetry, with rhymed and metrical verses of a type called <i>nūṟpā</i>. The verses are short, though not as compressed as Pāṇini's, and they were also learned by heart.</p><p>The number of verses is given variously, from about 1,600 to 1,610, depending on the commentator whose division is followed, and the exact figure is less important than the scale.</p>`],
['Two Grammatical Traditions and Weighing Claims','Eḻuttatikāram: Letters and Sounds',`<p>The first book treats the sounds of Tamil. It lists the letters: twelve vowels (<i>uyir</i>, "life"), eighteen consonants (<i>mey</i>, "body"), and a special sign, the <i>āytam</i>, a total of thirty-one basic letters. It describes their places of articulation, their lengths measured in <i>mātrai</i>, the same measure of time as in Sanskrit phonetics, and the ways in which letters combine into words.</p><p>The book states rules of sound change at the joints of words, the Tamil counterpart of sandhi. In Tamil the changes are of three kinds: when a consonant doubles, when a sound is inserted, and when a sound is dropped. For example, the final consonant of one word may double before a vowel in the next, or a nasal may change to match the following sound.</p><p>The book also describes the ways in which sounds are grouped into syllables and the rules for the first and last letters of a word. A Tamil word may not begin with certain consonants, and the grammar says which.</p><p>For a reader who knows Pāṇini, the likenesses are plain: a classification of sounds by place and length, and rules for the joining of sounds. The Tamil rules are written for the structure of Tamil, which is an agglutinative language, in which words are built by adding suffixes one after another.</p>`],
['Two Grammatical Traditions and Weighing Claims','Collatikāram: Words and Their Forms',`<p>The second book deals with words. It classifies them into four kinds: names (<i>peyar</i>), verbs (<i>viṉai</i>), particles (<i>iṭai</i>), and a class of qualifying words (<i>uri</i>). It gives the cases of nouns, eight in all, with the vocative as the eighth, and shows the endings that mark them.</p><p>The treatment of cases is an important point of contact with Sanskrit grammar. The Tamil cases are close in number and in function to the Sanskrit ones, and the terms for them in the commentaries follow the Sanskrit order. Whether this is due to the influence of the Sanskrit tradition or to a similar analysis of similar facts is discussed later.</p><p>The book also studies the verb: its tense, person, number, and gender, which in Tamil is marked on the verb by suffixes that agree with the subject. It describes the rules of agreement, the use of particles, and a good deal of what would be called syntax, such as the order of words in a sentence and the meanings of the forms.</p><p>The second book is, with the first, the part of the Tolkāppiyam that is most nearly parallel to Pāṇini. It treats the forms of the language in a systematic way, with rules and exceptions. It does not use a metalanguage as compact as Pāṇini's, and the commentators supply much of the explanation.</p>`],
['Two Grammatical Traditions and Weighing Claims','Poruḷatikāram: The Subject-Matter of Poetry',`<p>The third book is the most original in comparison with Sanskrit grammar. <i>Poruḷ</i> means "matter" or "content", and the book treats what poems are about and how they are composed. It sets out the system of Tamil poetry, with its conventions, in its nine chapters: on <i>akam</i> (love), <i>puṟam</i> (war and public life), the stages of love, marriage, the themes of poetry, the expression of feeling, similes, the forms of verse, and the traditions of usage.</p><p>This book is the basis of the classification of Sangam poetry. It says that each poem is of the inner or outer kind, that each is set in one of five landscapes, each with its characteristic flowers, birds, time of day, and mood, and that the poems follow conventions of speech: who may speak, to whom, and about what.</p><p>The inclusion of poetics is characteristic of the Tamil tradition. In Sanskrit these topics belong to another body of work, the <i>alaṅkāra śāstra</i>, as the main book's chapter on poetics described, and to the <i>Nāṭyaśāstra</i>. The Tolkāppiyam brings them under the grammar.</p><p>It is partly for this reason that the Tolkāppiyam is read both as a grammar and as a theory of literature and, through its account of the habits of the people, as a source for early Tamil society.</p>`],
['Two Grammatical Traditions and Weighing Claims','Akam and Puṟam',`<p>The distinction of <i>akam</i> and <i>puṟam</i> is the main organising idea of the Tamil poetic tradition, and the grammar gives it its theory.</p><p><b>Akam</b>, "the inner", is the poetry of love, of the private feelings of lovers and families. It names no real persons. The hero and heroine are not identified, and the poem is spoken by one of a small set of characters: the heroine, her friend, her mother, the hero, or his companion.</p><p><b>Puṟam</b>, "the outer", is the poetry of public life: war, kingship, generosity, and death. It names real kings and chieftains, and places and battles.</p><p>The grammar describes the matching of the five love-situations with the five landscapes: union in the hills (<i>kuṟiñci</i>), waiting in the forest (<i>mullai</i>), quarrel in the farmland (<i>marutam</i>), separation by the sea (<i>neytal</i>), and elopement through the desert (<i>pālai</i>). In the outer poetry, the themes correspond to the plucking of flowers by an army, such as the <i>vetci</i> flower for cattle-raiding and the <i>vañci</i> for invasion.</p><p>This careful system, which the Sangam poems follow, is a feature of Tamil literature without a close parallel in Sanskrit grammar, and is among the chief claims of the tradition to originality.</p>`],
['Two Grammatical Traditions and Weighing Claims','Author and Tradition',`<p>The <i>Tolkāppiyam</i> is attributed to a sage called Tolkāppiyar, whose personal name was probably Tiraṇadhūmāgni. Tradition makes him a student of the sage Agastya, to whom the Tamil tradition also attributes an earlier grammar, the <i>Akattiyam</i>, which has not survived.</p><p>A preface in verse by Panamparanar, a scholar who is said to have been a fellow student of Tolkāppiyar, praises the work. The preface is the main source for an early view of the author, and it contains a famous line describing him as one who was skilled in the <i>Aintiram</i>, usually understood as the school of Sanskrit grammar called Aindra. This has been taken as evidence that the author knew of Sanskrit grammatical traditions, and is discussed in a later page.</p><p>The traditions about the author, the preface, and the legendary academy at which the work was approved are of interest as the history that the Tamil tradition tells about itself. Modern scholars treat them with care. The date of the preface and its reliability are matters of debate, and the identity and dates of the author are uncertain.</p><p>What the text gives, on its own evidence, is a grammar of an early stage of Tamil, composed by someone who knew the poetry of the time and some of the Indian grammatical tradition.</p>`],
['Two Grammatical Traditions and Weighing Claims','The Commentators',`<p>Like the <i>Aṣṭādhyāyī</i>, the Tolkāppiyam is read with commentaries, and these are the main means by which it has been understood. The earliest surviving commentators belong to the period from about the eleventh to the fourteenth century, long after the text.</p><table class="ex sm"><tr><td>Commentator</td><td>Approximate date</td><td>Notes</td></tr><tr><td>Iḷampūraṇar</td><td>11th to 12th century</td><td>commented on all three books; called "the commentator"</td></tr><tr><td>Cēṉāvaraiyar</td><td>13th century</td><td>commented on the second book</td></tr><tr><td>Pērāciriyar</td><td>13th century</td><td>commented on the third book in part</td></tr><tr><td>Nacciṉārkkiniyar</td><td>14th century</td><td>commented on much of the work; much valued</td></tr><tr><td>Teyvaccilaiyar, Kallāṭanār</td><td>medieval</td><td>commented on the second book</td></tr></table><p>The commentaries preserve earlier opinions, quote lost works, and explain the sūtras with examples from the poetry. They also record the interpretation of each age.</p><p>A parallel can be drawn with Kātyāyana and Patañjali on Pāṇini, although the gap of centuries between the Tamil text and its earliest surviving commentary is longer than in the Sanskrit case. This means that the text was transmitted for a long period before a full commentary was written, and the early history of the interpretation of the Tolkāppiyam is partly lost.</p>`],
