['Compilers and Language Design','Priority Rules in Everyday Systems',`<p>The problem of choosing between overlapping rules is everywhere in computing, and designers have settled on a handful of answers that match Pāṇini's own.</p><table class="ex sm"><tr><td>System</td><td>How a conflict is settled</td><td>Closest principle</td></tr><tr><td>CSS style sheets</td><td>more specific selector wins; then later rule</td><td>apavāda, then para</td></tr><tr><td>Firewall rule lists</td><td>first matching rule applies</td><td>order of the text</td></tr><tr><td>Pattern matching in ML-family languages</td><td>first matching case is used</td><td>order of the text</td></tr><tr><td>Prolog</td><td>clauses are tried from the top</td><td>order of the text</td></tr><tr><td>Operator precedence</td><td>higher level binds first</td><td>levels of rules</td></tr></table><p>The CSS rule is the closest. When two style rules apply to one element, the browser prefers the one with the more specific selector, and if they are equally specific, the later one. This is almost exactly the pair of principles "the special over the general" and "the later over the earlier". The designers of CSS came to this by practical experience and not from Pāṇini.</p><p>That several independent systems arrive at the same answer is good evidence that it is a natural one. A designer who must resolve conflicts will usually choose specificity first, order second.</p>`],
['Compilers and Language Design','Declarative and Procedural Styles',`<p>A <b>procedural</b> program says how to do something, step by step. A <b>declarative</b> program says what is wanted and leaves the method to the system. SQL is declarative: a query states which rows are wanted, and the database decides how to find them. The <i>Aṣṭādhyāyī</i> is a mixture. Its rules are declarative statements, each true on its own, but the grammar also fixes an order of application, which is a control strategy.</p><p>Computer science has studied this mixture under the name of <b>production systems</b>. A production system has a store of facts and a set of rules of the form "if this pattern is present, do that". An engine repeatedly selects an applicable rule and fires it. Expert systems of the 1970s and 1980s, such as those built with the OPS5 language, worked this way, and Charles Forgy's Rete algorithm of 1979 made the matching efficient. Logic programming languages, such as Prolog, and the related Datalog, are declarative systems with a fixed search order.</p><p>A Pāṇinian engine can be seen as a production system whose facts are the pieces of a word and whose rules are the sūtras. The commentaries supply the control strategy: which rule to prefer, and when a derivation is finished. The same split between rules and strategy appears in modern rule engines used in business software, and the engineering problems are the same.</p>`],
['Compilers and Language Design','Designing a Small Rule Language',`<p>A designer inspired by the grammar might write a language in which each rule names a class of sounds to change, what to change them to, and what must follow. The program below is a tiny interpreter for such a language. Each rule is a pair, the class to change and the class that must follow it, with the replacements held in a separate table.</p><pre class="code">CLASS = {"ac": set("aāiīuūṛṝḷeo"), "ik": set("iuṛḷ")}
SUBST = {"ik": {"i": "y", "u": "v", "ṛ": "r", "ḷ": "l"}}
RULES = [("ik", "ac")]            # ik -&gt; yaṇ / _ ac   (6.1.77)

def run(text):
    chars = list(text.replace(" ", ""))
    for target, right in RULES:
        for i in range(len(chars) - 1):
            if chars[i] in CLASS[target] and chars[i + 1] in CLASS[right]:
                chars[i] = SUBST[target][chars[i]]
    return "".join(chars)

print(run("iti ādi"))
print(run("su āgata"))</pre><pre class="code out">ityādi
svāgata</pre><p>The rule list holds one entry, standing for <i>ik → yaṇ / _ ac</i>. Adding another rule needs one new entry in each table and no new code. That is the advantage of the design: the rules are data, and the engine is general.</p><p>This is only a sketch. It ignores the word boundary, does not handle two-letter vowels, and applies rules in a single pass. But the sketch shows the structure that the grammar has: a small, uniform rule format, read by a small engine.</p>`],
['Compilers and Language Design','Lessons for Language Designers',`<p>What can a designer of programming languages learn from a grammar that is two and a half thousand years old? Not code, but principles that have stood a long test.</p><p><b>Separate rules from data.</b> The lists of roots and words kept the sūtras short and let the language be extended.</p><p><b>Name classes with short labels.</b> The pratyāhāras let one rule cover many cases without listing them.</p><p><b>State defaults and exceptions together.</b> The general rule and its exception stand side by side, with a clear principle for which wins.</p><p><b>Use markers for hidden information.</b> Tags that are used and then removed are like annotations in a compiler, which help the derivation but do not appear in the output.</p><p><b>Make order explicit.</b> The grammar's three-stage design, with word-building first and final sound changes last, is the same idea as the passes of a compiler.</p><p><b>Document the cost of economy.</b> The grammar needed a continuous tradition of commentary to remain usable. A modern rule language needs documentation, examples, and tests from the beginning.</p><p>These are old lessons for engineers, and the grammar is an unusually early and complete example of them. Studying it is good for understanding design, whatever one thinks of the claims made for it.</p>`]
);

PP.push(
['Sanskrit Language Technology','The Tasks of Sanskrit Language Processing',`<p>Natural language processing (NLP) is the field that teaches computers to handle human language. For Sanskrit it has the usual tasks, and some of them are harder than for English because of sandhi, rich word-formation, and free word order.</p><table class="ex sm"><tr><td>Task</td><td>What it does</td><td>Why it is hard in Sanskrit</td></tr><tr><td>Word segmentation</td><td>cut a string into words</td><td>sandhi changes the letters at the cut</td></tr><tr><td>Compound splitting</td><td>divide a compound</td><td>many possible cuts and groupings</td></tr><tr><td>Morphological analysis</td><td>give root, ending, features</td><td>thousands of forms per root</td></tr><tr><td>Tagging</td><td>label each word's part of speech</td><td>one form may have several analyses</td></tr><tr><td>Parsing</td><td>find relations between words</td><td>word order is free; roles come from endings</td></tr><tr><td>Translation</td><td>convert to another language</td><td>few parallel texts</td></tr></table><p>Free word order is a good example. The sentences <i>Rāmaḥ mṛgaṃ hanti</i> and <i>mṛgaṃ Rāmaḥ hanti</i> mean the same, because the case endings, not the position, show who does what to whom. A parser that relies on position, as English parsers do, is not suited to this. A parser built on the kāraka roles is.</p><p>The following pages describe what has been done for each task, and where the difficulties lie.</p>`],
['Sanskrit Language Technology','Morphological Analysers',`<p>A <b>morphological analyser</b> reads one word and returns its possible analyses: the root or stem, the ending, and the grammatical features such as case, number, gender, tense, and person. For a rich language it is the foundation of everything else.</p><p>There are two main designs. One is <b>paradigm-based</b>: the developer writes out the declension and conjugation tables for each class of word, as the earlier chapters did for <i>rāma</i> and <i>bhū</i>, and the program looks up forms. The other is <b>rule-based</b>, in the Pāṇinian manner: the program stores roots and affixes and generates the forms by applying the rules, so that the tables need not be written by hand. The first is easier to build and check, and the second is closer to the grammar and more complete.</p><p>Notable work includes the Sanskrit Heritage tools by Gérard Huet in France, which combine a lexicon, finite-state methods, and a reader of text. In India, the Saṃsādhanī platform developed by Amba Kulkarni and colleagues at the University of Hyderabad offers morphological analysis, sandhi splitting, and parsing of Sanskrit and has been used in teaching. Oliver Hellwig's Digital Corpus of Sanskrit provides a large collection of texts tagged with analyses, which is also a main resource for training programs.</p><p>All of these are reference points for the student who wishes to compare a hand-made program with a professional one.</p>`],
['Sanskrit Language Technology','Methods for Splitting Sandhi',`<p>Splitting is the first task in reading real Sanskrit text, and several methods have been tried. <b>Rule-based</b> splitters reverse the sandhi rules and check each candidate against a dictionary, as the simple program in the earlier chapter does. They are exact but depend on a complete dictionary and rule set. <b>Statistical</b> splitters learn from examples which cuts are likely, using the frequencies of words. <b>Neural</b> splitters train a network on pairs of joined text and its correct segmentation.</p><p>Oliver Hellwig and Sebastian Nehrdich published a neural method for Sanskrit word segmentation in 2018, using a network that reads the text character by character, and reported results better than earlier systems on large test sets. Others have built on their approach and on rule-based tools, and combinations of rules and learning often do best.</p><p>Systems are judged by <b>precision</b> and <b>recall</b>. Precision is the share of the cuts the system proposed that are correct. Recall is the share of the correct cuts that it found. A system can score high on one and low on the other, and so the two are usually reported together. A careful reader of a paper on segmentation should ask what text was used for the test, whether that text was also used in training, and whether the answers were checked by experts.</p>`],
['Sanskrit Language Technology','Dependency Parsing and the Kārakas',`<p>A <b>dependency parser</b> finds, for each word in a sentence, the word it depends on and the kind of relation. Many modern parsers use a small fixed set of relations, such as subject and object. For Sanskrit and other Indian languages, a different set is natural: the <b>kāraka</b> relations from Pāṇini.</p><p>The best-known work in this direction came from Akshar Bharati, Vineet Chaitanya, and Rajeev Sangal at the Indian Institute of Technology Kanpur and later the International Institute of Information Technology (IIIT), Hyderabad. Their book <i>Natural Language Processing: A Paninian Perspective</i> (1995) set out a framework in which the case endings and postpositions of Indian languages are used to assign kāraka roles to words, and the roles then give the structure of the sentence. The approach was applied to Hindi and other languages and gave rise to a dependency treebank format widely used for Indian languages.</p><p>The attraction of this method is that it matches the grammar of the languages. Case endings and verb features carry the relations, and the parser reads them, instead of guessing from the order of words. The result is a framework that handles free word order with little special treatment.</p><p>It is an example of a computational method based directly on an ancient grammatical idea and tested on real data.</p>`],
['Sanskrit Language Technology','Machine Translation and Anusaaraka',`<p>Translation between Indian languages has been a goal of Indian language technology since the 1980s. One system based on Pāṇinian ideas was <b>Anusaaraka</b>, developed by the group of Akshar Bharati, Rajeev Sangal, and colleagues, first at IIT Kanpur and then at the University of Hyderabad and IIIT Hyderabad. The name means "one that follows", and the system was designed as a language accessor, a tool that helps a reader of one language to read text in another, and not as a fully automatic translator.</p><p>The design is cautious. Because exact translation is hard, the system reproduces the structure of the source text as far as it can, marks the places where it is unsure, and leaves the reader to choose. It uses the grammatical analysis of the source language, including the kāraka relations, and then generates text in the target language. It has been used for translation between several Indian languages.</p><p>Newer approaches use neural networks trained on large collections of parallel text. They give fluent results where data is plentiful, but they do not give reasons for their choices, and for languages with little data, such as Sanskrit, they do less well. Government programmes for Indian-language technology, including the National Language Translation Mission, support work of both kinds.</p><p>A sound plan combines the two: statistical methods for fluency and rule-based analysis for accuracy and for explaining the result.</p>`],
['Sanskrit Language Technology','Sanskrit and Knowledge Representation',`<p>In 1985 Rick Briggs, working at NASA's Ames Research Center, published a short paper in <i>AI Magazine</i> called "Knowledge Representation in Sanskrit and Artificial Intelligence". It compared the way Sanskrit grammarians analyse a sentence with the methods used in artificial intelligence to represent meaning, and argued that the old Indian analysis was rich enough to serve as a model. The paper drew on the tradition of <i>śābdabodha</i>, the theory of how a sentence produces knowledge, as developed by the Navya-Nyāya school.</p><p>His example was a simple sentence, "Caitra cooks rice in a pot", which the Sanskrit method analyses as a structure of agent, object, instrument, and location, much as a modern system would. He suggested that such an analysis was less ambiguous than the paraphrases used in AI at the time.</p><p>The paper has been widely quoted, and not always carefully. It made a modest and interesting claim, that traditional Indian analysis of meaning is comparable to the frame-based representations of 1980s AI, and that it deserves study. It did not claim that Sanskrit was a perfect language for computers, or that any machine used it. Later scholars have also pointed out that the analysis he described applies to a carefully regularised form of Sanskrit prose, not to ordinary text.</p>`],
['Sanskrit Language Technology','The "Sanskrit Is the Best Language for Computers" Claim',`<p>A claim often repeated in articles and videos is that Sanskrit is the best language for computers, or that NASA has said so, or that it is used in artificial intelligence because it has no ambiguity. These statements are not supported, and a careful reader should know why.</p><p>Briggs's paper, described on the previous page, is the usual source, and it says something much more limited. No statement by NASA as an organisation has been found to the effect that Sanskrit is the best language for computing, and no machine is known to run on Sanskrit. Classical Sanskrit is not free of ambiguity: compounds, for example, are famous for it, and the same form may have several analyses. Whatever its virtues, it is a natural language like any other, spoken and written by people.</p><p>A true statement of the case is this. Sanskrit grammar is unusually explicit, and its tradition produced an exact description of the language that is still valuable to linguists. Its logic of meaning, developed by Nyāya thinkers, is of interest to the study of knowledge representation. Tools built on the grammar can analyse Sanskrit well. None of this requires saying that the language is better than others for programming or for machines.</p><p>The achievements are real and need no exaggeration. Accurate claims also protect the tradition from being dismissed because of the false ones.</p>`],
['Sanskrit Language Technology','Large Language Models and Sanskrit',`<p>Large language models (LLMs), the systems behind modern chatbots, are trained on vast amounts of text. They handle Sanskrit to a limited extent, and the reasons illustrate the topics of this book.</p><p><b>Tokenisation.</b> A model splits text into pieces called tokens before processing. Many tokenisers are built mainly from English and similar text, and break Devanagari or accented IAST into many small pieces, so that a Sanskrit word may take far more tokens than an English one. This makes the text costly and the patterns harder to learn.</p><p><b>Sandhi and compounds.</b> Long compounds and merged words give the model few clear boundaries, and errors in joining or splitting are common.</p><p><b>Data.</b> There is much less digitised Sanskrit than English, and what exists is dominated by a few kinds of text, so a model may do well on the <i>Gītā</i> and badly on technical prose.</p><p><b>Reliability.</b> A model produces fluent text whether or not it is correct. It may invent a rule number, a verse, or a derivation that looks right. A rule-based program, by contrast, gives a result that can be checked, and a combined system can use the program to verify what the model says. The page on hybrid systems shows a very small example.</p><p>For students, the advice is plain: use such tools as helpers, and check every rule and form against the text.</p>`],
['Sanskrit Language Technology','Encoding Sanskrit for Computers',`<p>Before any program can handle Sanskrit, the text must be stored in a form it can read, and several systems are in use. <b>Unicode</b> is the international standard, and its Devanagari block (U+0900 to U+097F) holds the letters of the script, with other blocks for Telugu and the other Indian scripts. Text in Unicode can be searched, sorted, and displayed on any modern system.</p><p>Scholars also use roman transliterations. <b>IAST</b>, fixed in 1894, uses marks above and below letters, as this book does. <b>Harvard–Kyoto</b> uses only plain capital and small letters, so that <i>ā</i> is written <i>A</i> and <i>ṣ</i> is <i>S</i>. <b>ITRANS</b> is a similar plain-text scheme. <b>SLP1</b>, the Sanskrit Library Phonetic basic encoding, gives each sound exactly one ASCII character and is popular for computing because it avoids ambiguity.</p><table class="ex"><tr><td>Sound</td><td>IAST</td><td>Harvard–Kyoto</td><td>SLP1</td></tr><tr><td>long a</td><td>ā</td><td>A</td><td>A</td></tr><tr><td>retroflex ṣ</td><td>ṣ</td><td>S</td><td>z</td></tr><tr><td>palatal ś</td><td>ś</td><td>z</td><td>S</td></tr><tr><td>vocalic ṛ</td><td>ṛ</td><td>R</td><td>f</td></tr></table><p>Conversion tools exist between all of these, and a program should convert to a single internal form at the start and back at the end. The programs in this book use IAST in strings for readability.</p>`],
['Sanskrit Language Technology','Evaluation and Open Problems',`<p>Progress in this field is measured against <b>gold data</b>, examples whose answers have been checked by experts. Sanskrit has several such resources, including treebanks that give the correct structure for a sample of sentences, and the tagged texts of the Digital Corpus of Sanskrit. They are much smaller than those for English, which limits the methods that can be trained and tested.</p><p>Several problems remain open. A complete and tested computer version of the <i>Aṣṭādhyāyī</i> is still a research goal, as the rules for conflict and order are debated. Splitting very long compounds and sandhi in verse remains error-prone. Resolving the many meanings of a word in context needs more data and better lexicons. And the use of the grammar's own explanations, as a way of teaching and of checking neural output, has had little systematic study.</p><p>There is also a practical need for open tools and data. Many of the best resources are held by a few groups, and a new student must often rebuild basic components. Shared, well-documented, openly licensed code and corpora would help students and researchers in India, including the Telugu states, to take part. A reader who builds even a small tested program, and shares it, adds to this stock.</p><p>The next chapter gives ten such projects, from the very small to the more ambitious, each with code that has been run.</p>`]
);
