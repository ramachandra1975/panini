['Verbs in Depth','The Ten Classes of Roots',`<p>The roots of the <i>Dhātupāṭha</i> fall into ten classes, each named after its first root. The class determines which small element, the <i>vikaraṇa</i>, is inserted between the root and the ending in the present system. The grammar states each insertion in a short rule.</p><table class="ex sm"><tr><td>Class</td><td>Root</td><td>Element</td><td>3rd sg. present</td></tr><tr><td>1 bhvādi</td><td>bhū "be"</td><td>śap (3.1.68)</td><td>bhavati</td></tr><tr><td>2 adādi</td><td>ad "eat"</td><td>śap deleted (2.4.72)</td><td>atti</td></tr><tr><td>3 juhotyādi</td><td>hu "offer"</td><td>śap deleted, doubling (2.4.75)</td><td>juhoti</td></tr><tr><td>4 divādi</td><td>div "play"</td><td>śyan (3.1.69)</td><td>dīvyati</td></tr><tr><td>5 svādi</td><td>su "press"</td><td>śnu (3.1.73)</td><td>sunoti</td></tr><tr><td>6 tudādi</td><td>tud "strike"</td><td>śa (3.1.77)</td><td>tudati</td></tr><tr><td>7 rudhādi</td><td>rudh "obstruct"</td><td>śnam (3.1.78)</td><td>ruṇaddhi</td></tr><tr><td>8 tanādi</td><td>tan "stretch"</td><td>u (3.1.79)</td><td>tanoti</td></tr><tr><td>9 kryādi</td><td>krī "buy"</td><td>śnā (3.1.81)</td><td>krīṇāti</td></tr><tr><td>10 curādi</td><td>cur "steal"</td><td>ṇic (3.1.25)</td><td>corayati</td></tr></table><p>The first, fourth, sixth, and tenth classes take <i>a</i> after the root, and the others have other vowels or nasals. The classes matter only for the present, imperfect, imperative, and optative. For other tenses most roots behave alike.</p>`],
['Verbs in Depth','Tenses and Moods',`<p>The ten <i>lakāras</i> were listed earlier as abstract affixes. Each is introduced by a rule that states its meaning. The present, <i>laṭ</i>, is for what is going on now (3.2.123). The imperfect, <i>laṅ</i>, is for a past event not of today (3.2.111). The perfect, <i>liṭ</i>, is for the remote past, an event not seen by the speaker (3.2.115). The aorist, <i>luṅ</i>, is a general past (3.2.110). The future, <i>lṛṭ</i>, is for what will be (3.3.13), and the periphrastic future, <i>luṭ</i>, for a definite future not of today (3.3.15).</p><table class="ex"><tr><td>laṭ</td><td>gacchati</td><td>goes</td></tr><tr><td>laṅ</td><td>agacchat</td><td>went</td></tr><tr><td>liṭ</td><td>jagāma</td><td>went (long ago)</td></tr><tr><td>luṅ</td><td>agamat</td><td>went (aorist)</td></tr><tr><td>lṛṭ</td><td>gamiṣyati</td><td>will go</td></tr><tr><td>luṭ</td><td>gantā</td><td>will go (periphrastic)</td></tr><tr><td>loṭ</td><td>gacchatu</td><td>let him go</td></tr><tr><td>liṅ</td><td>gacchet</td><td>he should go</td></tr></table><p>The root is <i>gam</i>, "go". The tenses are distinguished by time and by the speaker's relation to the event, not only by time. The conditional, <i>lṛṅ</i>, as in <i>agamiṣyat</i>, "he would have gone", expresses an unfulfilled condition. The tenses of Sanskrit were already merging in the classical language: the perfect and aorist are rarer in later prose, and a participle with <i>-ta</i> often takes the place of the past tenses.</p>`],
['Verbs in Depth','Conjugating bhū',`<p>The root <i>bhū</i> is the model for the first class, and its forms show how the endings combine. The present, <i>laṭ</i>, active:</p><table class="ex"><tr><td></td><td>Sing.</td><td>Dual</td><td>Plural</td></tr><tr><td>3rd</td><td>bhavati</td><td>bhavataḥ</td><td>bhavanti</td></tr><tr><td>2nd</td><td>bhavasi</td><td>bhavathaḥ</td><td>bhavatha</td></tr><tr><td>1st</td><td>bhavāmi</td><td>bhavāvaḥ</td><td>bhavāmaḥ</td></tr></table><p>The root is <i>bhū</i>, strengthened to <i>bho</i> and then, before the vowel of <i>śap</i>, to <i>bhav</i>, as in the earlier derivation. The ending <i>jhi</i> becomes <i>anti</i> by 7.1.3, <i>jho 'ntaḥ</i>, which gives <i>bhavanti</i>. Before endings beginning with <i>v</i> or <i>m</i>, the final <i>a</i> of the stem is lengthened (7.3.101, <i>ato dīrgho yañi</i>), which explains <i>bhavāmi, bhavāvaḥ,</i> and <i>bhavāmaḥ</i>.</p><table class="ex"><tr><td>laṅ (imperfect)</td><td>abhavat, abhavaḥ, abhavam</td></tr><tr><td>loṭ (imperative)</td><td>bhavatu, bhava, bhavāni</td></tr><tr><td>liṅ (optative)</td><td>bhavet, bhaveḥ, bhaveyam</td></tr></table><p>In the imperfect, an augment <i>a</i> is placed before the root (6.4.71, <i>luṅlaṅlṛṅkṣv aḍudāttaḥ</i>), a mark of past time that also appears in the aorist and conditional. The forms for other roots of the first class follow the same pattern, and the whole table is learnt by writing it out many times.</p>`],
['Verbs in Depth','Voices: Active, Middle, and Passive',`<p>A Sanskrit verb has two sets of endings. The <i>parasmaipada</i>, "word for another", and the <i>ātmanepada</i>, "word for oneself", are historically the active and middle voices. A root may take one set, the other, or both, as the first chapter's rules and the <i>Dhātupāṭha</i> markers decide. For example, <i>bhū</i> takes only the first set, <i>edh</i>, "grow", takes only the second (<i>edhate</i>), and <i>kṛ</i>, "do", takes both (<i>karoti, kurute</i>).</p><p>The passive uses the middle endings and an inserted <i>ya</i>. Rule 1.3.13, <i>bhāvakarmaṇoḥ</i>, selects the middle endings when the verb expresses the action itself (impersonal) or the object, and 3.1.67, <i>sārvadhātuke yak</i>, inserts <i>yak</i>. The agent then takes the third case and the object, being already expressed, takes the first.</p><table class="ex"><tr><td>Rāmaḥ grāmaṃ gacchati</td><td>Rāma goes to the village.</td></tr><tr><td>Rāmeṇa grāmo gamyate</td><td>The village is gone to by Rāma.</td></tr><tr><td>mayā supyate</td><td>It is slept by me (I sleep).</td></tr></table><p>The last example is an impersonal passive, the action alone being expressed, and it is a common way of speaking in Sanskrit. The system lets one verb form describe the action, the doer, or the thing done to, depending on which is selected as the main role. This is the feature that allowed the grammarians to build the theory of the kārakas on the verb.</p>`],
['Verbs in Depth','Derived Verbs',`<p>From a basic root the grammar derives further roots by adding affixes, and each new root takes all the usual endings. The <i>causative</i> uses <i>ṇic</i> (3.1.26, <i>hetumati ca</i>), which applies when someone causes another to act. From <i>kṛ</i>, "do", comes <i>kārayati</i>, "causes to do", and from <i>paṭh</i>, "read", comes <i>pāṭhayati</i>, "teaches to read".</p><p>The <i>desiderative</i> uses <i>san</i> (3.1.7), to express a wish to do the action. The root is doubled and an <i>s</i> element is added: from <i>jñā</i>, "know", comes <i>jijñāsati</i>, "wishes to know", and its noun <i>jijñāsā</i>, "inquiry", the word with which Vedānta begins: <i>athāto brahmajijñāsā</i>, "now, therefore, the inquiry into Brahman". The <i>intensive</i> uses <i>yaṅ</i> (3.1.22) for repeated or intense action, as in <i>pāpacyate</i>, "cooks again and again".</p><table class="ex"><tr><td>pibati</td><td>drinks</td><td>pipāsati</td><td>wishes to drink</td></tr><tr><td>karoti</td><td>does</td><td>kārayati</td><td>causes to do</td></tr><tr><td>jānāti</td><td>knows</td><td>jijñāsate</td><td>wishes to know</td></tr></table><p>A fourth type is the denominative verb, made from a noun. By 3.1.8, <i>supa ātmanaḥ kyac</i>, <i>putra</i>, "son", gives <i>putrīyati</i>, "desires a son for oneself". Together these affixes allow Sanskrit to build a very large vocabulary of verbs from a few hundred roots and to express shades of meaning by derivation rather than by separate words.</p>`],
['Verbs in Depth','Participles and Gerunds',`<p>Many Sanskrit sentences use no finite verb at all. They use participles and indeclinable verb forms made from roots by <i>kṛt</i> affixes. The past participle uses <i>kta</i>, and its active form uses <i>ktavatu</i>. Rule 1.1.26, <i>ktaktavatū niṣṭhā</i>, gives both a common name. The present active participle uses <i>śatṛ</i> (3.2.124).</p><table class="ex sm"><tr><td>Form</td><td>Root gam, "go"</td><td>Root kṛ, "do"</td></tr><tr><td>past participle</td><td>gataḥ, gone</td><td>kṛtaḥ, done</td></tr><tr><td>past active</td><td>gatavān, who has gone</td><td>kṛtavān, who has done</td></tr><tr><td>present participle</td><td>gacchan, going</td><td>kurvan, doing</td></tr><tr><td>gerund with ktvā</td><td>gatvā, having gone</td><td>kṛtvā, having done</td></tr><tr><td>gerund after prefix</td><td>āgatya, having come</td><td>vikṛtya, having altered</td></tr><tr><td>infinitive</td><td>gantum, to go</td><td>kartum, to do</td></tr><tr><td>fut. passive part.</td><td>gantavya, gamanīya</td><td>kartavya, karaṇīya</td></tr></table><p>The gerund in <i>ktvā</i> is used when the same agent does two actions in sequence (3.4.21): "having gone, he sat". With a prefix it becomes <i>lyap</i> (7.1.37). The infinitive in <i>tumun</i> expresses purpose (3.3.10). The forms in <i>tavya</i> and <i>anīya</i> (3.1.96) mean "to be done", as in <i>kartavya</i>, "duty". A long Sanskrit sentence is often a chain of such forms, ending with a single finite verb.</p>`]
);

PP.push(
['Word Formation','Agent Nouns from Roots',`<p>The <i>kṛt</i> affixes make nouns and adjectives from roots, and the commonest group names the doer. Rule 3.1.133, <i>ṇvultṛcau</i>, gives two affixes for the agent. The affix <i>ṇvul</i> becomes <i>aka</i>, and <i>tṛc</i> becomes <i>tṛ</i>. Each is attached to the root after the usual strengthening of the vowel.</p><table class="ex"><tr><td>kṛ "do"</td><td>kartṛ</td><td>doer, maker</td></tr><tr><td>dā "give"</td><td>dātṛ</td><td>giver</td></tr><tr><td>jñā "know"</td><td>jñātṛ</td><td>knower</td></tr><tr><td>paṭh "read"</td><td>pāṭhaka</td><td>reader</td></tr><tr><td>gai "sing"</td><td>gāyaka</td><td>singer</td></tr><tr><td>nṛt "dance"</td><td>nartaka</td><td>dancer</td></tr></table><p>The last three use <i>aka</i>, and the vowel of the root is lengthened (<i>vṛddhi</i>) in <i>pāṭhaka</i> and <i>gāyaka</i> or strengthened (<i>guṇa</i>) in <i>nartaka</i>, according to rules in the seventh chapter. The word <i>gāyaka</i> shows a sandhi from earlier: <i>gai + aka</i> becomes <i>gāy + aka</i> by 6.1.78.</p><p>Nouns made with <i>tṛ</i> are declined in a pattern of their own, with a long <i>ā</i> in the nominative singular: <i>kartā</i>, <i>dātā</i>. These agent nouns, and the periphrastic future that is built on them, show how nouns and verbs share their material. In the Telugu and other Indian languages, many words for professions and doers still use Sanskrit agent nouns, such as <i>gāyaka</i> and <i>nartaki</i>, "female dancer".</p>`],
['Word Formation','Nouns of Action and Instrument',`<p>Another group of affixes gives the name of the action itself. The affix <i>ghañ</i>, with the sense of action (3.3.18), makes <i>pāka</i>, "cooking", from <i>pac</i>, and <i>tyāga</i>, "giving up", from <i>tyaj</i>. The affix <i>lyuṭ</i> (3.3.115), which becomes <i>ana</i>, gives neuter nouns of action, such as <i>gamana</i>, "going", <i>bhojana</i>, "eating", and <i>darśana</i>, "seeing", a word that has also come to mean a philosophical view. The affix <i>ktin</i> (3.3.94) makes feminine nouns, such as <i>kṛti</i>, "work", <i>gati</i>, "going", and <i>mati</i>, "thought".</p><table class="ex"><tr><td>pac</td><td>pāka</td><td>cooking</td><td>ghañ</td></tr><tr><td>gam</td><td>gamana</td><td>going</td><td>lyuṭ</td></tr><tr><td>kṛ</td><td>kṛti</td><td>work, creation</td><td>ktin</td></tr><tr><td>dṛś</td><td>darśana</td><td>seeing, view</td><td>lyuṭ</td></tr></table><p>Instruments are named by another affix. The suffix <i>tra</i> makes words for the means of an action: <i>nī</i>, "lead", gives <i>netra</i>, "eye" or "leader"; <i>pā</i>, "drink", gives <i>pātra</i>, "vessel"; <i>śas</i>, "cut", gives <i>śastra</i>, "weapon"; and <i>pū</i>, "purify", gives <i>pavitra</i>, "sacred, cleansing".</p><p>The point is the way in which the same root yields a doer, an action, and an instrument, each by a separate affix. A reader who knows the affixes can guess the meaning of an unfamiliar word, and this is the basis of the traditional dictionary method, by which meanings are derived from roots.</p>`],
['Word Formation','Secondary Derivation: Names and Descendants',`<p>The <i>taddhita</i> affixes make new nouns from nouns. The best known meaning is descent. By 4.1.92, <i>tasyāpatyam</i>, "his offspring", an affix is added to a father's name. The general affix is <i>aṇ</i> (4.1.83), and it brings a strengthening of the first vowel of the base (7.2.117, <i>taddhiteṣv acām ādeḥ</i>). Others are <i>iñ</i> after stems in <i>a</i> (4.1.95) and <i>yañ</i> for the Garga group (4.1.105).</p><table class="ex"><tr><td>Pāṇḍu</td><td>Pāṇḍava</td><td>son of Pāṇḍu</td></tr><tr><td>Kuru</td><td>Kaurava</td><td>descendant of Kuru</td></tr><tr><td>Daśaratha</td><td>Dāśarathi</td><td>son of Daśaratha (Rāma)</td></tr><tr><td>Garga</td><td>Gārgya</td><td>descendant of Garga</td></tr><tr><td>Upagu</td><td>Aupagava</td><td>descendant of Upagu</td></tr></table><p>The same affixes make adjectives of belonging. The word <i>Śaiva</i>, "devoted to Śiva", is <i>Śiva</i> plus <i>aṇ</i>, with the first vowel strengthened from <i>i</i> to <i>ai</i>. Likewise <i>Vaiṣṇava</i> is from <i>Viṣṇu</i>. Names for peoples and places follow the same method, such as <i>Bhārata</i>, "of Bharata", and <i>Māgadha</i>, "of Magadha".</p><p>In these derivations three rules work together: the choice of affix, the strengthening of the first vowel, and the deletion of the base's final vowel before the affix. Seeing the pattern makes the family names of the epics, which often look unrelated, easy to read as simple derivations.</p>`],
['Word Formation','Abstract, Possessive, and Comparative Forms',`<p>Several taddhita affixes are used constantly. The abstract noun is formed by <i>tva</i> or <i>tā</i> (5.1.119, <i>tasya bhāvas tvatalau</i>): <i>guru</i>, "heavy", gives <i>gurutva</i>, "heaviness"; <i>mānava</i>, "human", gives <i>mānavatā</i>, "humanity". The possessive uses <i>matup</i> or <i>vatup</i> (5.2.94), which become <i>mat</i> and <i>vat</i>: <i>śrī</i>, "fortune", gives <i>śrīmat</i>, "fortunate"; <i>bhaga</i>, "fortune", gives <i>bhagavat</i>, "blessed, Lord". The affix <i>in</i> (5.2.115) gives <i>dhanin</i>, "wealthy", and <i>balin</i>, "strong". The affix <i>vat</i> in the sense of "like" (5.1.115) gives <i>rājavat</i>, "like a king".</p><p>Comparison is made by two pairs of affixes. By 5.3.55 and 5.3.57 the comparative and superlative are <i>tara</i> and <i>tama</i> or <i>īyas</i> and <i>iṣṭha</i>.</p><table class="ex"><tr><td>guru</td><td>gurutara</td><td>gurutama</td></tr><tr><td>laghu "light"</td><td>laghīyas</td><td>laghiṣṭha</td></tr><tr><td>sundara "beautiful"</td><td>sundaratara</td><td>sundaratama</td></tr></table><p>Adverbs of place and time are formed in the same way: <i>tatra</i>, "there", <i>yatra</i>, "where", <i>sarvatra</i>, "everywhere", <i>tadā</i>, "then", <i>kadā</i>, "when", <i>sarvadā</i>, "always". The vocabulary of abstract thought, such as <i>satya</i> and <i>satyatā</i>, <i>jñāna</i> and <i>jñānin</i>, is built with these few affixes.</p>`],
['Word Formation','Doubling: Reduplication',`<p>Many verb forms double part of the root. The general rule, 6.1.1, <i>ekāco dve prathamasya</i>, doubles the first one-syllable part of the root, and 6.1.8 applies it in the perfect, <i>liṭ</i>. The doubled syllable, the <i>abhyāsa</i>, is then reduced by several rules. Only the first consonant is kept (7.4.60, <i>halādiḥ śeṣaḥ</i>), a guttural becomes palatal (7.4.62, <i>kuhoś cuḥ</i>), and an aspirated sound loses its breath, as <i>bh</i> becomes <i>b</i>. The vowel may also be changed, for example <i>ṛ</i> becomes <i>a</i> (7.4.66, <i>ur at</i>).</p><table class="ex"><tr><td>bhū "be"</td><td>babhūva</td><td>he was</td></tr><tr><td>kṛ "do"</td><td>cakāra</td><td>he did</td></tr><tr><td>gam "go"</td><td>jagāma</td><td>he went</td></tr><tr><td>pac "cook"</td><td>papāca</td><td>he cooked</td></tr><tr><td>dā "give"</td><td>dadau</td><td>he gave</td></tr><tr><td>sthā "stand"</td><td>tasthau</td><td>he stood</td></tr></table><p>In <i>cakāra</i> the doubled <i>k</i> has become <i>c</i>, and in <i>jagāma</i> the doubled <i>g</i> has become <i>j</i>, by the guttural-to-palatal rule. Doubling is also used in the third class of verbs, as in <i>dadāti</i>, "gives", in the desiderative, as in <i>jijñāsati</i>, and in the intensive. Outside the verb, rule 8.1.1, <i>sarvasya dve</i>, doubles whole words for meanings of repetition, such as <i>gṛhe gṛhe</i>, "in every house".</p>`],
['Word Formation','Irregular and Listed Forms',`<p>No rule system covers every word, and Pāṇini acknowledges this. His grammar has several ways of dealing with forms that do not follow the main rules. The first is the word-list, the <i>gaṇa</i>. A rule may say that something applies to "the group beginning with <i>X</i>", and the list of that group is given in the <i>Gaṇapāṭha</i>. Words are put in a list when they behave alike but share no feature that a rule could state. The class of pronouns, <i>sarvādi</i>, and the group of words forming compounds with <i>pṛṣodara</i> are of this kind.</p><p>The second is the escape rule at 6.3.109, <i>pṛṣodarādīni yathopadiṣṭam</i>, which admits a set of irregular forms "as they are taught". The name comes from the first word, <i>pṛṣodara</i>, "having a spotted belly", which is itself irregular, since a regular formation would be <i>pṛṣadudara</i>. The rule thus legitimises words that are known to be in use and that no general rule can derive.</p><p>The third is the set of <i>Uṇādi</i> affixes, which derive many ordinary nouns, such as <i>kāru</i>, "craftsman", and <i>vāyu</i>, "wind", from roots by affixes that fit no pattern. Grammarians debated whether these words should be analysed at all. Some, like Śākaṭāyana, said all nouns come from roots. Others, like Gārgya, said many do not.</p><p>For a user of the grammar, the lists are as important as the rules. A system of rules with a clear way of listing its exceptions is easier to trust than one that claims to have none.</p>`],
['Accent and the Veda','Pitch Accent: Udātta, Anudātta, Svarita',`<p>Vedic Sanskrit has a pitch accent, and Pāṇini describes it. Rule 1.2.29, <i>uccair udāttaḥ</i>, defines the <i>udātta</i> as the high pitch. Rule 1.2.30, <i>nīcair anudāttaḥ</i>, defines the <i>anudātta</i> as the low pitch. Rule 1.2.31, <i>samāhāraḥ svaritaḥ</i>, defines the <i>svarita</i> as the combination, a falling pitch that follows a high one. In a word usually only one syllable is high and the others are low, as stated in 6.1.158, <i>anudāttaṃ padam ekavarjam</i>.</p><p>In printed Vedic texts the accents are marked with lines. A horizontal line under a syllable marks a low pitch, and a vertical line over a syllable marks the falling pitch. The high pitch is left unmarked. The marks are placed with great care in the Ṛgveda and Yajurveda, and the schools of recitation preserve them in the oral tradition.</p><p>Accent can change meaning. The standard example is the word <i>indraśatru</i>. With the accent on the first syllable it means "one whose enemy is Indra", and with the accent on the last syllable it means "the enemy, or killer, of Indra". The Brāhmaṇa texts and Patañjali tell that a priest, wishing to produce a son who would kill Indra, said the word with the wrong accent, and the son was instead killed by Indra. The story shows how seriously the tradition took accent.</p><p>Classical Sanskrit lost the pitch accent in speech, but the rules remain in the grammar.</p>`],
['Accent and the Veda','Accent in Words and Compounds',`<p>The accent of each word is part of its derivation. The affixes are marked with letters that tell the grammar where the high pitch falls. In general an affix is high on its first vowel (3.1.3, <i>ādyudāttaś ca</i>), and rules in the sixth chapter move or cancel the accent in specific cases. Verbs, for instance, lose their accent in the main clause of a sentence, and nouns have different accents by class.</p><p>Compounds have an accent that depends on their type, and this is why the early grammarians could tell the type by the sound. In a compound as a whole, the last syllable is usually high (6.1.223, <i>samāsasya</i>). But in a bahuvrīhi the first member keeps its own accent (6.2.1, <i>bahuvrīhau prakṛtyā pūrvapadam</i>). The result is that a spoken Vedic compound could reveal whether it was a bahuvrīhi or a tatpuruṣa without any context, as the story of <i>indraśatru</i> shows.</p><table class="ex"><tr><td>bahuvrīhi</td><td>first member keeps its accent</td></tr><tr><td>tatpuruṣa</td><td>usually the final syllable is high</td></tr><tr><td>dvandva</td><td>the first member's accent is usual</td></tr></table><p>The accent rules are the part of the grammar that is least used by modern readers, who study classical texts without pitch, and most important for students of the Veda. They are also an example of how thoroughly the grammar treats the spoken form of the language as a whole, with melody as well as sounds.</p>`],
['Accent and the Veda','The Language of the Veda',`<p>Pāṇini describes two registers of Sanskrit: <i>bhāṣā</i>, the spoken language of his day, and <i>chandas</i>, the language of the Veda. Many rules carry the words <i>chandasi</i>, "in the Veda", or <i>bahulam chandasi</i>, "variously in the Veda", to mark an older or looser usage. Others say <i>vibhāṣā</i>, "optionally". The grammar thus describes the classical language and then lists the ways in which Vedic differs.</p><p>The differences are many. Vedic has a subjunctive mood, <i>leṭ</i>, which the classical language lost. It has several infinitives, such as those ending in <i>-tave</i>. Its case endings vary, and some words have older forms, such as <i>-ebhiḥ</i> for the instrumental plural of <i>a</i> stems, in place of the classical <i>-aiḥ</i>. Its sandhi is less strict, and it has the letter <i>ḷ</i> for <i>ḍ</i> between vowels, as in the first words of the Ṛgveda.</p><table class="ex"><tr><td>agnim īḷe purohitam</td><td>I praise Agni, the one placed in front, the household priest</td></tr><tr><td>agnim</td><td>accusative singular of <i>agni</i></td></tr><tr><td>īḷe</td><td>"I praise", first singular middle; classical <i>īḍe</i></td></tr><tr><td>purohitam</td><td>accusative: "placed in front", the priest</td></tr></table><p>The first line of the Ṛgveda is the earliest text in the Sanskrit tradition, and the grammar's treatment of the Veda shows that Pāṇini regarded it as the older form of the language, understood by the learned of his time. Later grammarians added more rules for Vedic, and Patañjali's discussion of these gave the tradition a way of reading the sacred texts with the same precision as ordinary speech.</p>`],
['Accent and the Veda','Why the Veda Needed a Grammar',`<p>The oldest reason for grammar in India was the protection of the Veda. Patañjali gives five purposes for the study of grammar at the opening of the <i>Mahābhāṣya</i>: <i>rakṣā</i>, protection of the texts; <i>ūha</i>, the adjustment of formulas for new ritual use; <i>āgama</i>, the duty to learn the Veda with its limbs; <i>laghu</i>, ease of learning; and <i>asandeha</i>, freedom from doubt. The first three concern the sacred text, and the last two are of general use.</p><p>Grammar was one of the six auxiliary subjects, the <i>vedāṅga</i>, together with phonetics, metre, etymology, astronomy, and ritual, and was called the mouth of the Veda. The Veda was learnt by ear and recited exactly, as the chapter on Vedic studies in the main book described. A change of accent, a lost syllable, or a wrong sandhi was thought to spoil the rite. Grammar gave a means of checking that a text was correct and that a form used in a mantra was proper.</p><p>The same concern helps explain the form of the <i>Aṣṭādhyāyī</i>. It was composed to be learnt by heart, in a society that trusted memory above writing, and its compression suits recitation. The Śiva Sūtras, the markers, and the rules of carrying words forward were conveniences for memory as much as devices of logic.</p><p>The link between grammar and the Veda continued for many centuries, and it gave the study of Sanskrit its place in the education of priests and scholars. It also gave the language its name, <i>saṃskṛta</i>, "perfected, put together", the refined speech.</p>`]
);

PP.push(
['Commentary and Debate','Kātyāyana’s Vārttikas',`<p>The first reader of Pāṇini whose work survives, even in part, is Kātyāyana. His <i>vārttikas</i> are short notes attached to particular rules. The tradition defines a vārttika as an inquiry into what has been said, what has not been said, and what has been said badly (<i>uktānuktaduruktacintā</i>). Kātyāyana's notes accordingly do three things. They point out cases that a rule misses, cases where it gives a wrong result, and places where a rule can be shortened or improved.</p><p>A typical note adds a condition or an exception. If a rule says that a change happens "after a vowel", Kātyāyana may ask what happens after a vowel that has itself just been produced by another rule, and then state the answer. The notes also test whether a rule is needed at all, by showing that a more general rule already gives the result. A large part of his work is thus an audit of the grammar's economy.</p><p>The vārttikas became part of the received text in the sense that later authors treated them with respect. The tradition's rule of "later authority" gives a note by Kātyāyana more weight than Pāṇini where the two differ, and a remark by Patañjali more than either. This is unusual for a sacred text and shows the practical attitude of the grammarians. They treated the grammar as an instrument to be corrected, not a revelation.</p><p>The vārttikas are known mainly because Patañjali quotes and discusses them in the <i>Mahābhāṣya</i>.</p>`],
['Commentary and Debate','Patañjali’s Mahābhāṣya',`<p>The <i>Mahābhāṣya</i>, "the great commentary", of the second century BCE is written in the form of a debate. It is arranged in 85 <i>āhnikas</i>, "daily lessons", each discussing a number of rules and notes, and it proceeds by question and answer, objection and reply. A student who raises a doubt is answered by the teacher, and the questions are often more interesting than the replies.</p><p>The work opens with the words <i>atha śabdānuśāsanam</i>, "now, the teaching of words". It then asks what a "word" is, why one should study grammar, and what the relation of word and meaning is, which it treats as already established (<i>siddhe śabdārthasambandhe</i>). The five reasons for studying grammar, <i>rakṣohāgamalaghvasandehāḥ</i>, are given in its first lesson.</p><p>Patañjali is often the clearest guide to the logic of the rules. He explains why a rule is placed where it is, what each word in a rule contributes, and whether a word is superfluous. He also supplies examples from living speech, and his discussions contain a good deal of social and cultural information, from the habits of cooks and weavers to the differences between the speech of east and west.</p><table class="ex"><tr><td>Pāṇini</td><td>the rules, c. 5th to 4th century BCE</td></tr><tr><td>Kātyāyana</td><td>the notes, perhaps 3rd century BCE</td></tr><tr><td>Patañjali</td><td>the debate, c. 2nd century BCE</td></tr></table><p>For centuries afterwards, grammar was learnt by reading these three together.</p>`],
['Commentary and Debate','Word, Meaning, and Sphoṭa',`<p>The grammarians did not only write rules. They asked what language is. One question was whether a word is eternal. Patañjali discusses the view that <i>śabda</i>, "word", is permanent and the sounds uttered are only its manifestations, as different lamps show the same object. Another question was how a sentence gets its meaning when its sounds come one after another and each is gone before the next is heard.</p><p>The best-known answer is the doctrine of <i>sphoṭa</i>, developed most fully by Bhartṛhari in his <i>Vākyapadīya</i>, perhaps of the fifth century CE. In this view, the meaning is carried by an indivisible whole, the sphoṭa, which is revealed by the sounds in sequence and grasped by the mind at the end of the series. For Bhartṛhari the sentence is the real unit of meaning, and words are abstractions made for analysis.</p><p>He also described language at three levels. The <i>vaikharī</i> is the spoken sound, the <i>madhyamā</i> is the inner speech of thought, and the <i>paśyantī</i> is the "seeing" stage at which meaning is whole and undivided. These ideas were taken up in later philosophy and in the Tantric traditions, and they are the roots of the theories of sound discussed in the main book's chapters on Nāda Yoga and Sanskrit.</p><p>Other schools disagreed. The Mīmāṃsakas defended the eternity of sounds but not the sphoṭa, and the Buddhists denied both. The debate shows that grammar in India was connected to philosophy and was a main place where theories of meaning were formed.</p>`],
['Commentary and Debate','Rules for Choosing Between Rules',`<p>Later grammarians collected the principles by which conflicts are resolved into short sayings, the <i>paribhāṣās</i>. The best known is a ranking, given by Nāgeśa Bhaṭṭa in the eighteenth century: <i>pūrvaparanityāntaraṅgāpavādānām uttarottaraṃ balīyaḥ</i>, "of these, each later one is stronger than the one before". It lists five kinds of rule in increasing strength.</p><table class="ex"><tr><td>1</td><td>pūrva</td><td>an earlier rule in the text</td></tr><tr><td>2</td><td>para</td><td>a later rule (wins over an earlier one, 1.4.2)</td></tr><tr><td>3</td><td>nitya</td><td>a rule that applies in any case</td></tr><tr><td>4</td><td>antaraṅga</td><td>a rule whose conditions are internal</td></tr><tr><td>5</td><td>apavāda</td><td>a specific exception</td></tr></table><p>The ranking works like a priority list in a program. If two rules apply, the grammar asks first whether one is an exception to the other. If not, it asks whether one rule's conditions are closer to the item, that is, internal to the stem and not dependent on other words (<i>antaraṅga</i>, "inner", against <i>bahiraṅga</i>, "outer"). If not, whether one applies whatever the order of other rules (<i>nitya</i>). If still undecided, the later rule in the text wins.</p><p>Other sayings tell how to treat replacements, as in <i>sthānivad ādeśaḥ</i>, "a replacement is like the original", and what happens when a condition disappears. These sayings are not in Pāṇini himself but are inferences from his practice made by his commentators. Some hold that they are a genuine reconstruction of his method, and others that they are later patches. The question remains open, as does the proposal of 2022 mentioned earlier.</p>`],
['Commentary and Debate','Later Schools and Rival Grammars',`<p>Pāṇini's grammar was not the only one. Other schools arose, often for the sake of shorter or easier teaching. The <i>Kātantra</i> grammar, also known as the <i>Kalāpa</i>, was composed as a simpler introduction and became widely used in Bengal, Kashmir, and parts of South India. Candragomin, a Buddhist scholar of about the fifth century CE, wrote the <i>Cāndra</i> grammar, which follows Pāṇini closely but rearranges the rules and drops the Vedic part. The Jain scholar Hemacandra, in the twelfth century, wrote the <i>Siddhahema</i>, which treated Prakrit as well as Sanskrit.</p><p>Within the Pāṇinian tradition, later authors rearranged the rules to make them easier to learn. Vāmana and Jayāditya's <i>Kāśikā</i> of about the seventh century explains each rule in order. Bhaṭṭoji Dīkṣita's <i>Siddhāntakaumudī</i>, in the seventeenth century, collects the rules by topic, so that a student studies nouns, then verbs, then compounds. Varadarāja made a shorter version, the <i>Laghusiddhāntakaumudī</i>, which has been the standard textbook for beginners.</p><p>Nāgeśa Bhaṭṭa, who lived in the eighteenth century, wrote the <i>Paribhāṣenduśekhara</i>, a work on the rules of interpretation, and further works on the philosophy of grammar. After him the tradition was largely commentary. In the nineteenth and twentieth centuries, scholars from Europe and India edited and translated the texts, and the study of the grammar entered the universities, as the later part of this book described.</p><p>All these schools show a common wish to make a vast body of rules teachable and to keep it accurate.</p>`],
['Learning and Using Pāṇini','Pāṇini and the Telugu Tradition',`<p>The Telugu grammatical tradition was shaped by Sanskrit grammar. The first work on Telugu grammar is traditionally attributed to Nannaya, the eleventh-century translator of the Mahābhārata, and is called <i>Āndhra Śabda Cintāmaṇi</i>. It is written in Sanskrit verses and uses the method of the sūtras to describe Telugu. Later grammarians followed. Kētana, in the thirteenth century, wrote the <i>Āndhra Bhāṣā Bhūṣaṇamu</i>, and Kākunūri Appakavi wrote the <i>Appakavīyam</i> in the seventeenth century, a work in verse on Telugu prosody and grammar.</p><p>In the nineteenth century, Paravastu Chinnayasūri wrote <i>Bālavyākaraṇamu</i>, published in 1855, which became the standard school grammar of Telugu. It uses the terms and arrangement of Sanskrit grammar, with Telugu forms. Charles Philip Brown, whose work on Telugu dictionaries was mentioned in the main book, published a Telugu grammar in 1840 for English readers.</p><p>The Telugu language has its own structure, with consonant stems ending in vowels, and the older grammars distinguish <i>tatsama</i> words, borrowed unchanged from Sanskrit, from <i>tadbhava</i> words, which have changed. The Sanskrit sandhi rules in this book are often the same as those applied in Telugu, such as <i>guṇa</i> and <i>savarṇa-dīrgha</i>. A Telugu reader who knows the rules of their own language will find many of the patterns in Pāṇini familiar.</p>`],
['Learning and Using Pāṇini','How Students Learn the Grammar',`<p>The traditional student of Pāṇini begins as a child, memorising the <i>Śiva Sūtras</i> and then the <i>Aṣṭādhyāyī</i> itself, at least in the strictest schools. The sūtras are learnt by chanting, in the manner of the Vedic recitation, and the student may know the whole text before understanding it. The meaning is then learnt from a teacher, with the help of the <i>Kāśikā</i> or, more often today, the <i>Siddhāntakaumudī</i> or its shorter version.</p><p>A modern course in Sanskrit grammar differs. The student starts with the forms: the declension of <i>rāma</i>, the conjugation of <i>bhū</i>, and the rules of sandhi, in the order of a textbook. Pāṇini's own rules are introduced gradually, often in the order of topics, and not of the text. Sanskrit colleges and universities, such as those in Varanasi, Tirupati, and Mysore, offer courses in <i>vyākaraṇa</i> at many levels.</p><p>Three skills matter most. The first is to know the basic paradigms by heart, since every reading depends on them. The second is to learn to undo sandhi quickly, to find the words in a sentence. The third is to know the roots and their classes, to recognise a verb in a changed form. The study of Pāṇini's rules themselves then explains why the forms are as they are and allows the student to handle rare words by derivation.</p><p>The next pages give exercises in sandhi and in compounds, with answers, so that a reader may test the patterns of this book.</p>`],
['Learning and Using Pāṇini','Exercises: Joining Sounds',`<p>Join the following pairs of words by the rules of sandhi. The answers and the rules are on the next page. Try each one before looking.</p><table class="ex"><tr><td>1</td><td>tathā + eva</td></tr><tr><td>2</td><td>iti + eva</td></tr><tr><td>3</td><td>mahā + īśa</td></tr><tr><td>4</td><td>vidyā + arthī</td></tr><tr><td>5</td><td>su + ukta</td></tr><tr><td>6</td><td>ne + ana</td></tr><tr><td>7</td><td>tat + ca</td></tr><tr><td>8</td><td>vāk + dāna</td></tr><tr><td>9</td><td>sat + jana</td></tr><tr><td>10</td><td>rāmaḥ + gacchati</td></tr><tr><td>11</td><td>hariḥ + api</td></tr><tr><td>12</td><td>sam + yoga</td></tr></table><p>Hints. Ask first whether the first word ends in a vowel, a consonant, or a visarga, and then what the first sound of the second word is. For vowels, decide whether the meeting gives a long vowel, <i>guṇa</i>, <i>vṛddhi</i>, a semivowel, or <i>ayādi</i>. For consonants, look at the place and voicing of the second sound. For visarga, ask whether the next sound is voiced or voiceless, and whether it is a vowel.</p><p>The twelve examples cover each main type shown earlier in the book. If a result seems wrong, look back at the page on that type.</p>`],
['Learning and Using Pāṇini','Answers: Joining Sounds',`<table class="ex sm"><tr><td>1</td><td>tathaiva</td><td>a + e gives vṛddhi ai (6.1.88)</td></tr><tr><td>2</td><td>ityeva</td><td>i before a vowel becomes y (6.1.77)</td></tr><tr><td>3</td><td>maheśa</td><td>a + ī gives guṇa e (6.1.87)</td></tr><tr><td>4</td><td>vidyārthī</td><td>ā + a merge into long ā (6.1.101)</td></tr><tr><td>5</td><td>sūkta</td><td>u + u merge into long ū (6.1.101)</td></tr><tr><td>6</td><td>nayana</td><td>e before a vowel becomes ay (6.1.78)</td></tr><tr><td>7</td><td>tac ca</td><td>t before c becomes c (8.4.40)</td></tr><tr><td>8</td><td>vāgdāna</td><td>final k before a voiced sound becomes g (8.2.39)</td></tr><tr><td>9</td><td>sajjana</td><td>t before j becomes j (8.4.40)</td></tr><tr><td>10</td><td>rāmo gacchati</td><td>aḥ before a voiced sound becomes o (6.1.113 and 6.1.114)</td></tr><tr><td>11</td><td>harir api</td><td>iḥ before a vowel becomes ir (8.2.66)</td></tr><tr><td>12</td><td>saṃyoga</td><td>m before a semivowel becomes anusvāra (8.3.23)</td></tr></table><p>Two notes. In 5, the result of <i>su + ukta</i> is <i>sūkta</i>, "well said", and from it comes <i>sūkta</i>, "hymn". In 12, the word <i>saṃyoga</i> is written with the anusvāra.</p><p>If you got ten or more right, the patterns are in hand. If fewer, return to the pages on vowel, consonant, and visarga sandhi and try the unfamiliar ones again with the hint.</p>`],
['Learning and Using Pāṇini','Exercises: Compounds',`<p>Name the type of each compound and give its meaning. Answers are on the next page.</p><table class="ex"><tr><td>1</td><td>rājaputra</td></tr><tr><td>2</td><td>pītāmbara</td></tr><tr><td>3</td><td>nīlakamala</td></tr><tr><td>4</td><td>mātāpitarau</td></tr><tr><td>5</td><td>pratidinam</td></tr><tr><td>6</td><td>trilokī</td></tr><tr><td>7</td><td>dharmajña</td></tr><tr><td>8</td><td>abrāhmaṇa</td></tr><tr><td>9</td><td>candramukha</td></tr><tr><td>10</td><td>pāṇipāda</td></tr></table><p>Method. First give the vigraha, the explaining phrase, in each case. Then ask these questions. Is the first member an indeclinable that governs the whole, so that the compound is an adverb? That is an avyayībhāva. Does the compound refer to something outside it? That is a bahuvrīhi. Are the members joined by "and"? That is a dvandva. Does the first member begin with a number? That is a dvigu. Do the two members refer to the same thing, one describing the other? That is a karmadhāraya. Otherwise the first member is in a case relation to the second, and the compound is a tatpuruṣa.</p><p>Answers follow.</p>`],
['Learning and Using Pāṇini','Answers: Compounds',`<table class="ex sm"><tr><td>1</td><td>rājaputra</td><td>tatpuruṣa (6th case): rājñaḥ putraḥ, the king's son</td></tr><tr><td>2</td><td>pītāmbara</td><td>bahuvrīhi: pītam ambaraṃ yasya saḥ, having yellow cloth (Viṣṇu)</td></tr><tr><td>3</td><td>nīlakamala</td><td>karmadhāraya: nīlaṃ kamalam, a blue lotus</td></tr><tr><td>4</td><td>mātāpitarau</td><td>dvandva: mātā ca pitā ca, mother and father</td></tr><tr><td>5</td><td>pratidinam</td><td>avyayībhāva: dinaṃ dinaṃ prati, every day</td></tr><tr><td>6</td><td>trilokī</td><td>dvigu: trayāṇāṃ lokānāṃ samāhāraḥ, the three worlds</td></tr><tr><td>7</td><td>dharmajña</td><td>upapada tatpuruṣa: dharmaṃ jānāti, knower of duty</td></tr><tr><td>8</td><td>abrāhmaṇa</td><td>nañ tatpuruṣa: na brāhmaṇaḥ, a non-Brahmin</td></tr><tr><td>9</td><td>candramukha</td><td>karmadhāraya (moon-like face) or bahuvrīhi (one with a face like the moon)</td></tr><tr><td>10</td><td>pāṇipāda</td><td>dvandva (samāhāra): hands and feet, a neuter singular</td></tr></table><p>The ninth shows an ambiguity that is common. <i>Candramukha</i>, "moon-face", can describe the face itself or the person who has it. Context decides, and commentators may give both. For <i>mātāpitarau</i>, the dual is the sign of an itaretara dvandva. In 6, the sense is collective, so the word is a feminine in <i>-ī</i>.</p><p>With these, the main types have been revisited. For further practice, take the compounds in any Sanskrit verse and give the vigraha for each, as traditional teachers do.</p>`],
['Learning and Using Pāṇini','A Plan for Further Study',`<p>A reader who wishes to go on with Pāṇini can follow a simple plan over several months. First, learn the alphabet and its order, the Śiva Sūtras and the pratyāhāras, and the places of articulation. These give the vocabulary of the whole grammar and should be memorised. Second, learn the paradigms: the declension of <i>rāma, hari, guru, ramā, nadī, phala,</i> and a consonant stem, and the present, imperfect, imperative, and optative of <i>bhū</i>. Third, practise sandhi with short lists of examples until the main types are easy.</p><p>Fourth, read a short text with a translation, such as a chapter of the <i>Bhagavad Gītā</i> or a section of the <i>Pañcatantra</i>, and identify the compounds and verb forms. Fifth, read the <i>Laghusiddhāntakaumudī</i> or a modern introduction, and look up each rule in the <i>Aṣṭādhyāyī</i> with its commentary. Sixth, study the derivation of ten common forms step by step, as in the example of <i>bhavati</i>, until the logic of order is clear. Software tools, such as those mentioned earlier, can check your derivations.</p><p>The best companions are a teacher, a study group, and a good translation. Several universities, including those of Hyderabad, Tirupati, and Pune, and many online courses teach Sanskrit grammar, and a number of Sanskrit societies hold classes. The sources listed at the end of the book give the standard editions.</p><p>Above all, work with the text itself. A rule that has been written out, applied to a word, and checked against a commentary is learnt in a way that reading alone does not give.</p>`]
);

PP.push(
['Formal Languages and Rewriting','Strings and Rewriting',`<p>Computer science begins its study of language with very plain objects. An <b>alphabet</b> is a finite set of symbols. A <b>string</b> is a finite sequence of them. A language is any set of strings. Sanskrit words, written in IAST, are strings over an alphabet of about fifty symbols, and a sentence is a longer string with spaces.</p><p>A <b>rewriting rule</b> says that one substring may be replaced by another. The rule <i>a + a → ā</i>, read as "two short a's join into long ā", is a rewriting rule. A <b>derivation</b> is a sequence of strings in which each step applies one rule to the one before. The derivation of <i>bhavati</i> in an earlier chapter is exactly this: a sequence of strings, from <i>bhū + laṭ</i> to <i>bhavati</i>, with a rule justifying each step.</p><p>The idea has a history in mathematics. Axel Thue studied string replacement in 1914. Emil Post, in the 1920s and 1940s, showed that systems of such rules can describe any computation. Andrey Markov's "normal algorithms", from the 1940s, add an ordering: the rules are tried from the top of the list, and the first one that applies is used. This is close to the way Pāṇini's rules are ordered, and it explains why computer scientists who meet the grammar recognise its structure.</p><p>The comparison is one of structure. Pāṇini worked more than two thousand years earlier and for a practical purpose, the correct description of his language.</p>`],
['Formal Languages and Rewriting','The Shape of a Rule: A becomes B between C and D',`<p>Modern linguistics writes a sound-change rule in a fixed format: <i>A → B / C _ D</i>. It reads: A becomes B when it follows C and precedes D. The format was made standard in the generative phonology of Noam Chomsky and Morris Halle (<i>The Sound Pattern of English</i>, 1968), but a Sanskrit grammarian will see that Pāṇini's rules say the same thing in his own notation.</p><p>Take 6.1.77, <i>iko yaṇ aci</i>. It has three parts, each marked by a case ending, as an earlier page explained. In the modern format it becomes <i>ik → yaṇ / _ ac</i>.</p><table class="ex"><tr><td>Pāṇini's case</td><td>Role in the rule</td><td>6.1.77</td></tr><tr><td>genitive</td><td>the item changed (A)</td><td>ikaḥ</td></tr><tr><td>nominative</td><td>what it becomes (B)</td><td>yaṇ</td></tr><tr><td>locative</td><td>what must follow (D)</td><td>aci</td></tr><tr><td>ablative</td><td>what must precede (C)</td><td>(not used here)</td></tr></table><p>The two notations are equivalent for this rule. What Pāṇini adds is a rule-writing language of his own, with the roles carried by the endings of Sanskrit, so that the order of words in a rule does not matter. A programmer might compare it to named arguments in a function call. Because the roles are named, a sūtra can be reduced to a few syllables and still be read without doubt.</p>`],
['Formal Languages and Rewriting','The Chomsky Hierarchy',`<p>In 1956 and 1959 Noam Chomsky classified grammars by the kind of rules they use. The result, the <b>Chomsky hierarchy</b>, has four levels. Each level describes a larger set of languages and needs a more powerful machine to recognise it.</p><table class="ex sm"><tr><td>Type</td><td>Rule form</td><td>Machine</td><td>Typical use</td></tr><tr><td>3 regular</td><td>A → aB or A → a</td><td>finite automaton</td><td>tokens, simple patterns</td></tr><tr><td>2 context-free</td><td>A → any string</td><td>pushdown automaton</td><td>programming-language syntax</td></tr><tr><td>1 context-sensitive</td><td>αAβ → αγβ</td><td>linear-bounded automaton</td><td>some natural-language features</td></tr><tr><td>0 unrestricted</td><td>any rewriting</td><td>Turing machine</td><td>all computation</td></tr></table><p>Programming languages are written, for syntax, in context-free grammars, and checks such as "this variable was declared" are added afterwards. Pāṇini's rules are context-sensitive in form: they say what happens to a sound depending on its neighbours, and they also delete and insert material. A full formal model of his system therefore needs the more general levels.</p><p>This does not make the grammar hard to run. Many context-sensitive systems are applied in a fixed order with limited repetition, and the next pages show that large parts of the sandhi rules can be run by very simple machines.</p>`],
['Formal Languages and Rewriting','Regular Expressions and Pratyāhāras',`<p>A <b>regular expression</b> is a compact pattern for a set of strings. Stephen Kleene described the regular sets in the 1950s, and Ken Thompson put regular expressions into a text editor and a search program in 1968. Today every programming language has them.</p><p>A pratyāhāra is a character class. In a regular expression, the class of all vowels is written in brackets, and the rule <i>iko yaṇ aci</i> becomes a pattern that finds the places where it could apply: an <i>ik</i> vowel followed by any vowel, with an optional space between words.</p><pre class="code">import re

IK_ACI = re.compile(r"[iuṛḷ](?= ?[aāiīuūṛṝḷeo])")
text = "iti ādi su āgata deva indra"
print([m.start() for m in IK_ACI.finditer(text)])
print(IK_ACI.sub(lambda m: {"i": "y", "u": "v", "ṛ": "r", "ḷ": "l"}[m.group()], "iti ādi"))</pre><pre class="code out">[2, 9]
ity ādi</pre><p>The first line prints the positions in the text where the rule applies. The second shows the replacement of <i>i</i> by <i>y</i>. The second output keeps the space, since this snippet does the sound change but not the joining of the words, which a full tool must also do.</p><p>The point to take away is that pratyāhāras are the same idea as the character classes of modern pattern matching, defined here by two endpoints in an ordered list instead of by a list of members.</p>`],
['Formal Languages and Rewriting','Finite-State Transducers and Sandhi',`<p>A finite-state machine reads a string one symbol at a time and changes its state. A <b>transducer</b> also writes an output symbol at each step. If a rule changes one string into another, and the change can be described by looking at a bounded neighbourhood, a transducer can do it. The sandhi rules are of this kind.</p><p>The link with phonology was made precise in the twentieth century. C. Douglas Johnson showed in 1972 that a set of ordered rewrite rules, as used in generative phonology, defines a finite-state mapping provided that no rule applies again to its own output. Ronald Kaplan and Martin Kay set this out in full for computing in 1994. Kimmo Koskenniemi's "two-level morphology" of 1983 gave a practical way to build such systems for languages with rich word-formation, and it was first used for Finnish.</p><p>The important point for this book is how rule order is handled. If each rule is a transducer, then applying the rules in order is the same as passing the string through a chain of transducers, each one's output being the next one's input. This is the pipeline design that Pāṇini's last three chapters already describe, with the rules of the tripādī working as a final set of stages.</p><p>Finite-state tools of this kind, such as the Xerox finite-state toolkit, have been used to build Sanskrit and other Indian-language analysers, as the next chapters describe.</p>`],
['Formal Languages and Rewriting','Context-Free Grammars and Nested Compounds',`<p>A <b>context-free grammar</b> has rules whose left side is a single symbol. It is the standard tool for describing nested structure, such as parentheses or the clauses of a programming language. The notation was popularised by Backus and Naur, as the earlier chapter described. A grammar for compounds is simple to write.</p><pre class="code">COMPOUND -> WORD
COMPOUND -> COMPOUND COMPOUND</pre><p>The second rule says that two compounds may join to make a compound, and it can be used again and again. Sanskrit prose uses this freedom, and a compound of five members may be grouped in several ways. The word <i>rājaputramitra</i> has three members: <i>rāja</i>, <i>putra</i>, <i>mitra</i>. One grouping is <i>(rājaputra) mitra</i>, "the friend of the king's son". The other is <i>rāja (putramitra)</i>, a less natural reading, "the king of a son-friend". The two groupings are two different <b>parse trees</b> of the same string.</p><p>A grammar that gives more than one tree for a string is called <b>ambiguous</b>. Natural languages are full of ambiguity and programming languages are designed to avoid it. Sanskrit compounds are a clear case in which the writer leaves the choice to the reader's knowledge of the world.</p><p>The grammarians' answer to such cases is the requirement of <i>sāmarthya</i>, mutual fitness of meaning (2.1.1). It plays the role that a type system plays in a compiler, by rejecting groupings that make no sense.</p>`],
['Formal Languages and Rewriting','Parse Trees and Splitting Strings',`<p>To read a long compound, one must first cut it into words. A string of <i>n</i> letters can be cut in <i>2<sup>n−1</sup></i> ways, since at each gap between letters one may cut or not. Even a short word has many cuts, and a long compound has more than anyone can enumerate. The task is therefore to find the cuts that give real words, and to prune the rest at once.</p><p>Computer scientists use a dictionary to prune, and a method called <b>dynamic programming</b> to avoid repeating work. The idea is to solve the problem for each prefix of the string once, using the answers for shorter prefixes. A classic algorithm for context-free grammars, due to Cocke, Kasami, and Younger, runs in time proportional to the cube of the string's length and builds all the parse trees at once in compact form.</p><p>With sandhi the task is harder. The letters at the cut may have changed, so the program must first undo the rules in reverse, asking "which pairs of words could give this joint?" The result is not a list but a <b>lattice</b>, a graph of all the possible words and the ways they connect. A later stage chooses the best path through the lattice by frequency or by grammar.</p><p>This is how modern Sanskrit segmenters work, and it is also how speech recognisers choose among possible words.</p>`],
['Formal Languages and Rewriting','Ambiguity and Priority',`<p>All grammars that have rules must say what to do when two rules apply. Programming languages face this daily. The classic example is the <b>dangling else</b>: in <i>if a then if b then x else y</i>, the <i>else</i> could belong to either <i>if</i>. Language definitions resolve it by a rule: the <i>else</i> belongs to the nearest <i>if</i>. Another example is the expression <i>1 + 2 * 3</i>. The tools that build parsers, such as <i>yacc</i>, allow the designer to state the <b>precedence</b> of operators, so that multiplication is chosen before addition.</p><p>These are the same problems that Pāṇini's rule-ordering principles solve. His first answer is the specific over the general, which resembles the rule that the most specific pattern should win. His second is that the later rule wins, which resembles the ordering of clauses in a program, where the first or last match is taken. His third is that some rules are invisible to the earlier ones, which resembles the passes of a compiler, each of which sees only the output of the one before.</p><p>In compilers the designer states these choices outside the grammar, in a table. In the <i>Aṣṭādhyāyī</i> they are part of the text itself, in the order of the rules and a few general sūtras. That is a point of real difference and a reason why the grammar is hard to implement by simply copying its rules.</p>`],
['Formal Languages and Rewriting','Attribute Grammars and the Kārakas',`<p>A bare grammar says which strings are allowed but not what they mean. In 1968 Donald Knuth proposed <b>attribute grammars</b>, in which each symbol carries values, called attributes, that are computed from its parts and from its surroundings. A compiler uses them to attach types to expressions and to check that a variable is declared before use.</p><p>Pāṇini's treatment of meaning has the same shape. The verb has a meaning and a set of roles, and each noun in the sentence is assigned a role, a <i>kāraka</i>, according to its relation to the action. The case ending of the noun is then chosen from the role. In the sentence <i>Rāmaḥ vane bāṇena mṛgaṃ hanti</i>, the verb <i>han</i> carries the roles agent, object, instrument, and location, and the nouns fill them. The role is an attribute of the noun, computed from the verb and from the other words.</p><table class="ex"><tr><td>Word</td><td>Role attribute</td><td>Case</td></tr><tr><td>Rāmaḥ</td><td>kartṛ (agent)</td><td>1st</td></tr><tr><td>mṛgam</td><td>karman (object)</td><td>2nd</td></tr><tr><td>bāṇena</td><td>karaṇa (instrument)</td><td>3rd</td></tr><tr><td>vane</td><td>adhikaraṇa (location)</td><td>7th</td></tr></table><p>The analogy is useful for teaching and for software design. The kāraka theory has indeed been used as the basis of parsers for Indian languages, as a later chapter describes.</p>`],
['Formal Languages and Rewriting','What the Theory Does and Does Not Show',`<p>The theory of formal languages gives a precise vocabulary for what Pāṇini did. His grammar is a finite set of rewriting rules, with ordering and markers, that generates the correct words of a language. It separates a metalanguage from an object language, and it names classes of sounds by short labels. These are not accidental likenesses. They arise because anyone who wants to describe a language exactly must make the same kinds of choices.</p><p>The theory does not show that Pāṇini's grammar is the same as a modern formalism, or that it has a known computational power. The grammar was written for people and relies on conventions, commentary, and the judgement of a trained reader. Turning it into a machine-checkable system requires decisions that the text itself leaves open, and different implementers have decided differently. The exact formal class of the whole system has not been settled.</p><p>Nor does the theory show that modern computing owes a debt to Pāṇini. The formal languages of the twentieth century came from logic, mathematics, and linguistics in Europe and America. The parallels are for the student's benefit. They show that an old tradition solved problems that later engineers met again.</p><p>With this vocabulary in hand, the next chapter turns from the theory to code, and shows how the rules can be written as small programs that run.</p>`]
);

PP.push(
['Pāṇini in Code','Modelling a Word',`<p>A program that applies Pāṇini's rules needs a way to hold a word in the middle of a derivation. A string is not enough, because the word is not yet a finished word. It is a sequence of pieces, each with a kind (root, affix, augment) and a set of markers that later rules will read and remove.</p><p>In Python such a piece can be a small record. The example below builds the stage <i>bhū + śap + ti</i> from the derivation of <i>bhavati</i>.</p><pre class="code">from dataclasses import dataclass, field

@dataclass
class Morph:
    form: str
    kind: str = "root"
    markers: set = field(default_factory=set)

word = [Morph("bhū"), Morph("śap", "vikaraṇa", {"ś", "p"}),
        Morph("ti", "tiṅ")]
print([m.form for m in word])
print([sorted(m.markers) for m in word])</pre><pre class="code out">['bhū', 'śap', 'ti']
[[], ['p', 'ś'], []]</pre><p>The list holds three pieces. The second carries the markers <i>ś</i> and <i>p</i>, which tell other rules how it behaves. After the rules have used the markers, a step removes them. The design copies the grammar's own: instructions are written with markers attached, and the markers are deleted before the form is spoken.</p><p>Keeping the pieces separate also makes it easy to print a trace of the derivation, as a later page shows.</p>`],
['Pāṇini in Code','The Śiva Sūtras and Pratyāhāras',`<p>The first thing a program needs is the ordered alphabet of the fourteen Śiva Sūtras. Each line is stored as its sounds and its marker. A pratyāhāra is then a slice of this list, from a starting sound to a marker, as rule 1.1.71 says.</p><pre class="code">SUTRAS = [("a i u", "ṇ"), ("ṛ ḷ", "k"), ("e o", "ṅ"), ("ai au", "c"),
          ("h y v r", "ṭ"), ("l", "ṇ"), ("ñ m ṅ ṇ n", "m"),
          ("jh bh", "ñ"), ("gh ḍh dh", "ṣ"), ("j b g ḍ d", "ś"),
          ("kh ph ch ṭh th c ṭ t", "v"), ("k p", "y"),
          ("ś ṣ s", "r"), ("h", "l")]

def pratyahara(first, marker, start=1):
    out, on = [], False
    for i, (sounds, m) in enumerate(SUTRAS, 1):
        if i &lt; start:
            continue
        for s in sounds.split():
            on = on or s == first
            if on:
                out.append(s)
        if on and m == marker:
            break
    return out</pre><p>The function walks through the lines from a chosen starting line, begins collecting when it meets the first sound, and stops at the line that ends with the marker. The optional <i>start</i> value handles the sounds that appear twice, <i>h</i> and the marker <i>ṇ</i>.</p><pre class="code out">pratyahara("a", "c")      a i u ṛ ḷ e o ai au      (ac)
pratyahara("i", "k")      i u ṛ ḷ                  (ik)
pratyahara("y", "ṇ", 5)   y v r l                  (yaṇ)</pre><p>The output matches the traditional definitions. Thirty lines of code reproduce a device that the grammar uses on almost every page.</p>`],
['Pāṇini in Code','Writing One Rule: iko yaṇ aci',`<p>A single sūtra becomes a short function. The function below implements 6.1.77. The dictionary <i>YAN</i> pairs each <i>ik</i> vowel with its semivowel in the same order as the pratyāhāras <i>ik</i> and <i>yaṇ</i>, and the function tests the two conditions the rule states: the left word ends in an <i>ik</i> vowel, and the right word begins with a vowel.</p><pre class="code">from vsandhi import VOWELS

YAN = {"i": "y", "u": "v", "ṛ": "r", "ḷ": "l"}

def iko_yan_aci(left, right):
    """6.1.77: ik is replaced by yaṇ before a vowel"""
    if left[-1] in YAN and right[0] in VOWELS:
        return left[:-1] + YAN[left[-1]] + right
    return None

print(iko_yan_aci("iti", "ādi"))
print(iko_yan_aci("su", "āgata"))
print(iko_yan_aci("deva", "indra"))</pre><pre class="code out">ityādi
svāgata
None</pre><p>The third call returns nothing, because <i>deva</i> does not end in an <i>ik</i> vowel, so the rule does not apply and some other rule must handle the pair. This is how rules behave in the grammar. A rule either matches and changes the form, or it stays silent.</p><p>Returning "no result" instead of the unchanged text is a useful habit. It lets the caller tell the difference between a rule that applied and a rule that did not, which is essential for tracing and for choosing between rules.</p>`],
['Pāṇini in Code','Vowel Sandhi in One Function (I)',`<p>The rules for vowel sandhi can be written together in a single function. First the helper code: a table of long vowels, a function that returns the vowel without its length, and one that finds the vowel at each side of the joint, including the two-letter vowels <i>ai</i> and <i>au</i>.</p><pre class="code">LONG = {"a": "ā", "i": "ī", "u": "ū", "ṛ": "ṝ"}
BASE = {v: k for k, v in LONG.items()}
VOWELS = "aāiīuūṛṝḷeo"

def base(v):
    return BASE.get(v, v)

def edge(a, b):
    """last vowel of a, first vowel of b"""
    x = a[-2:] if a[-2:] in ("ai", "au") else a[-1]
    y = b[:2] if b[:2] in ("ai", "au") else b[0]
    return x, y

def join(a, b):
    x, y = edge(a, b)</pre><p>The function <i>base</i> removes length, so that <i>ā</i> counts as <i>a</i>. This is the idea of <i>savarṇa</i>, "of the same kind", which treats short and long vowels as one class for the purposes of the rules. The function <i>edge</i> picks the two vowels that meet. The next page gives the rules themselves.</p>`],
['Pāṇini in Code','Vowel Sandhi in One Function (II)',`<p>The rules follow, in the order the earlier pages gave them. Each comment shows the sūtra that the line stands for.</p><pre class="code">    A, B = a[:-len(x)], b[len(y):]
    if base(x) == base(y):                          # 6.1.101
        return A + LONG[base(x)] + B
    if base(x) == "a":
        if y in ("i", "ī"): return A + "e" + B      # 6.1.87
        if y in ("u", "ū"): return A + "o" + B
        if y == "ṛ":        return A + "ar" + B
        if y in ("e", "ai"): return A + "ai" + B    # 6.1.88
        if y in ("o", "au"): return A + "au" + B
    if base(x) in "iuṛ":                            # 6.1.77
        return A + {"i": "y", "u": "v", "ṛ": "r"}[base(x)] + y + B
    if x in ("e", "o", "ai", "au"):                 # 6.1.78
        return A + {"e": "ay", "o": "av", "ai": "āy", "au": "āv"}[x] + y + B
    return a + b</pre><p>The first condition catches similar vowels (6.1.101). The block that follows handles <i>a</i> or <i>ā</i> meeting a different vowel, giving <i>guṇa</i> (6.1.87) or <i>vṛddhi</i> (6.1.88). The next catches <i>i, u, ṛ</i> before a vowel (6.1.77), and the last the diphthongs (6.1.78). If none applies the words are simply put together.</p><p>The order of the tests matters. The check for similar vowels comes first because <i>a + a</i> must give long <i>ā</i> and not any of the later results. This is a small instance of the ordering principle of the grammar. The program does not need a separate conflict-resolution step, because the order of the code settles each conflict, as the order of the sūtras settles it in the text.</p>`],
['Pāṇini in Code','Choosing Between Rules',`<p>In a larger program, several rules may apply to the same input, and the order of the code is no longer enough. The ranking from the commentators can then be written as a table. Each rule is given a kind, and a function picks the strongest, with the later rule in the text winning a tie.</p><pre class="code">RANK = {"purva": 1, "para": 2, "nitya": 3, "antaranga": 4, "apavada": 5}

def choose(candidates):
    """Pick one rule: higher kind wins, then the later rule in the text."""
    return max(candidates, key=lambda r: (RANK[r["kind"]], r["pos"]))

general = {"id": "general rule",  "kind": "nitya",   "pos": 10}
special = {"id": "exception",     "kind": "apavada", "pos": 5}
later   = {"id": "later rule",    "kind": "para",    "pos": 20}
earlier = {"id": "earlier rule",  "kind": "para",    "pos": 3}
print(choose([general, special])["id"])
print(choose([later, earlier])["id"])</pre><pre class="code out">exception
later rule</pre><p>The first call shows the principle of the special over the general: the exception beats a rule that applies in every case. The second shows 1.4.2: between two rules of equal kind, the later one wins.</p><p>This is a toy, and it should not be taken for a full model. The real conflicts in the grammar involve more subtle questions, such as whether one rule's condition is more specific than another's, and the commentators sometimes disagree. But the structure of the problem is visible. A set of candidate rules, a scoring rule, and a choice. The same structure appears in routing tables, style sheets, and rule engines, as a later chapter shows.</p>`],
['Pāṇini in Code','Tracing a Derivation',`<p>The great advantage of a rule-based system is that it can explain itself. A program that records each rule it applies can print the full derivation. The table below is the derivation of <i>bhavati</i> as the program prints it.</p><pre class="code">STEPS = [
    ("bhū + laṭ",       "present meaning",            "3.2.123"),
    ("bhū + tip",       "laṭ becomes tip",            "3.4.78"),
    ("bhū + śap + ti",  "śap inserted",               "3.1.68"),
    ("bhū + a + ti",    "markers removed",            "1.3.3, 1.3.9"),
    ("bho + a + ti",    "guṇa of the root vowel",     "7.3.84"),
    ("bhav + a + ti",   "o before a vowel is av",     "6.1.78"),
    ("bhavati",         "joined",                     ""),
]
for form, why, rule in STEPS:
    print(f"{form:16} {rule:14} {why}")</pre><pre class="code out">bhū + laṭ        3.2.123        present meaning
bhū + tip        3.4.78         laṭ becomes tip
bhū + śap + ti   3.1.68         śap inserted
bhū + a + ti     1.3.3, 1.3.9   markers removed
bho + a + ti     7.3.84         guṇa of the root vowel
bhav + a + ti    6.1.78         o before a vowel is av
bhavati                         joined</pre><p>Here the steps are written out by hand, to show the format. In a working engine each line would be produced by the rule that made the change. A trace of this kind is useful for teaching, for debugging a grammar, and for checking against the commentaries. A statistical system that only returns an answer cannot give the reason for it.</p>`],
['Pāṇini in Code','Optional Rules and Several Answers',`<p>Some rules are optional, marked in the grammar by <i>vā</i> or <i>vibhāṣā</i>. When a rule is optional, the grammar allows two outputs, and a program must produce both. This is the same problem as a choice point in a search: the program branches, and each branch gives a result.</p><pre class="code">NASAL = {"k": "ṅ", "g": "ṅ", "c": "ñ", "j": "ñ", "ṭ": "ṇ", "ḍ": "ṇ",
         "t": "n", "d": "n", "p": "m", "b": "m"}

def sam_options(a, b):
    """final m before a stop: anusvāra, or the nasal of b's class"""
    out = [a[:-1] + "ṃ" + b]
    if b[0] in NASAL:
        out.append(a[:-1] + NASAL[b[0]] + b)
    return out

print(sam_options("sam", "gati"))
print(sam_options("sam", "tāpa"))
print(sam_options("sam", "yoga"))</pre><pre class="code out">['saṃgati', 'saṅgati']
['saṃtāpa', 'santāpa']
['saṃyoga']</pre><p>The rule here is the change of final <i>m</i> to the anusvāra (8.3.23), followed by the optional change of the anusvāra to the nasal of the next consonant's class (8.4.58). Before <i>g</i> the nasal is <i>ṅ</i>, and before <i>t</i> it is <i>n</i>. Before <i>y</i> there is no such option in the written word, so only one answer comes out.</p><p>Returning a list of results, even when there is only one, keeps the program honest. A caller must then decide what to do when the grammar allows more than one form, whether to show all of them, ask the user, or choose by frequency. Many errors in language software come from assuming that every rule gives exactly one answer.</p>`],
['Pāṇini in Code','Testing a Grammar Program',`<p>A grammar implementation is only as good as its tests. The best test data is the set of examples that the commentators give for each rule, since these have been checked for centuries. A test suite lists inputs and the expected outputs and compares them with what the program returns.</p><pre class="code">from vsandhi import join

CASES = [("deva", "ālaya", "devālaya"), ("deva", "indra", "devendra"),
         ("mahā", "ṛṣi", "maharṣi"), ("sadā", "eva", "sadaiva"),
         ("iti", "ādi", "ityādi"), ("su", "āgata", "svāgata"),
         ("ne", "ana", "nayana"), ("pau", "aka", "pāvaka")]

for a, b, want in CASES:
    got = join(a, b)
    print("ok  " if got == want else "FAIL", a, "+", b, "-&gt;", got)</pre><pre class="code out">ok   deva + ālaya -> devālaya
ok   deva + indra -> devendra
ok   mahā + ṛṣi -> maharṣi
ok   sadā + eva -> sadaiva
ok   iti + ādi -> ityādi
ok   su + āgata -> svāgata
ok   ne + ana -> nayana
ok   pau + aka -> pāvaka</pre><p>Three habits help. Write the test before the rule, so that the rule is built to meet a known case. Keep a separate list of cases that must <i>not</i> change. And when the program disagrees with a commentary, investigate: either the program or the reading of the rule is wrong, and either way something has been learned.</p>`],
['Pāṇini in Code','Speed and Scale',`<p>The programs so far are for learning, and they test every rule in turn. A real system may handle millions of words and must be quicker. Several ideas from computer science apply.</p><p><b>Indexing.</b> Instead of trying every rule, store the rules in a table keyed by the sounds they need, such as the last letter of the left word. The program then looks up the few rules that could apply. The same idea is used in search engines and in compilers.</p><p><b>Caching.</b> The same pair of words may be joined many times. Python's <i>lru_cache</i> stores each result the first time it is computed.</p><pre class="code">from functools import lru_cache
from vsandhi import join
cached_join = lru_cache(maxsize=None)(join)</pre><p><b>Compilation.</b> A set of rules can be translated once into a faster form, such as a finite-state machine, and then run many times. This is the strategy of the Xerox tools mentioned earlier.</p><p>It is wise to measure before optimising. A program that is clear and correct is worth more than one that is fast and uncertain, and for the sizes of data in most Sanskrit work, a plain implementation is fast enough. The tuning is needed mainly in tools that process whole libraries of text.</p>`]
);

PP.push(
['Compilers and Language Design','What a Compiler Does',`<p>A <b>compiler</b> translates a program from one language, such as C or Java, into another, usually the instructions of a machine. It does this in stages, and every stage has a counterpart in the study of natural language.</p><table class="ex"><tr><td>Stage</td><td>Task</td><td>Grammar counterpart</td></tr><tr><td>Lexical analysis</td><td>cut text into tokens</td><td>splitting words, undoing sandhi</td></tr><tr><td>Parsing</td><td>build a tree from tokens</td><td>analysing compounds and sentences</td></tr><tr><td>Semantic analysis</td><td>check types and meanings</td><td>sāmarthya, kāraka roles</td></tr><tr><td>Optimisation</td><td>rewrite for speed</td><td>ordered rewriting of forms</td></tr><tr><td>Code generation</td><td>produce output</td><td>deriving the spoken word</td></tr></table><p>The <i>Aṣṭādhyāyī</i> works mainly in the opposite direction. A compiler goes from the written form toward meaning and output. Pāṇini goes from meaning and basic elements toward the correct word, which is called <b>generation</b>. A parser for Sanskrit, by contrast, goes the same way as a compiler, and must reverse the grammar's rules.</p><p>Both directions need the same knowledge, and the rules of the grammar can be used for both if they are written carefully. The following pages take each compiler stage in turn and ask what, if anything, it can learn from the grammar.</p>`],
['Compilers and Language Design','Lexical Analysis and Splitting Words',`<p>The first stage of a compiler, the <b>lexer</b>, reads characters and groups them into tokens such as numbers, names, and operators. It uses regular expressions, and where two patterns could match, it takes the longest, a rule called <b>maximal munch</b>. The code <i>count <= 10 + n</i> must give the operator <i>&lt;=</i> and not <i>&lt;</i> followed by <i>=</i>.</p><pre class="code">import re

TOKEN = re.compile(r"(?P&lt;NUM&gt;\\d+)|(?P&lt;ID&gt;[a-zA-Z_]\\w*)|(?P&lt;OP&gt;&lt;=|&lt;|=|\\+)")
for m in TOKEN.finditer("count &lt;= 10 + n"):
    print(m.lastgroup, m.group())</pre><pre class="code out">ID count
OP <=
NUM 10
OP +
ID n</pre><p>For a programming language this works because the boundaries between tokens are clear: spaces and punctuation mark them. Sanskrit text has no such clarity, because sandhi merges the end of one word into the start of the next. The string <i>ityādi</i> contains no mark to show where <i>iti</i> ends. A lexer for Sanskrit must therefore treat each cut as a hypothesis, test it against a dictionary and the sandhi rules, and keep several possibilities open. The result is a lattice rather than a list, as the previous chapter described.</p><p>The lesson runs both ways. Language designers avoid such ambiguity on purpose, by making token boundaries clear. A grammar that writes words together must pay for it in analysis.</p>`],
['Compilers and Language Design','Grammar Notation: BNF and Pāṇini',`<p>Backus–Naur Form defines a language by rules in which a symbol is defined by what it may contain. A tiny grammar for arithmetic shows it.</p><pre class="code">EXPR   ::= TERM | EXPR "+" TERM
TERM   ::= FACTOR | TERM "*" FACTOR
FACTOR ::= NUMBER | "(" EXPR ")"</pre><p>Each line is a rule, and the symbol on the left may be replaced by anything on the right. The rules are written in a metalanguage, separate from the language they describe, as Pāṇini's are. They are also recursive: an <i>EXPR</i> can contain an <i>EXPR</i> inside brackets, so a short grammar describes an infinite set of expressions.</p><p>The notation says <i>what is allowed</i>. Pāṇini's rules say <i>what to do</i>: they are instructions to build a word, with conditions and order. So BNF is closer to a description, and the <i>Aṣṭādhyāyī</i> to a procedure. This is the main difference, and it is why the grammar cannot simply be pasted into a parser generator.</p><p>One feature of the notation has a close parallel in the grammar. The way the three lines above give <i>*</i> a higher precedence than <i>+</i>, by placing <i>TERM</i> inside <i>EXPR</i>, is an arrangement by levels, just as the ordering of the Sanskrit rules arranges the derivation by levels. In both, the structure of the rules carries the priorities.</p>`],
['Compilers and Language Design','Symbol Tables and the Word-Lists',`<p>A compiler keeps a <b>symbol table</b>, a lookup structure that records everything it knows about each name: its type, its scope, and where it was declared. Whenever the parser meets a name, it consults the table.</p><p>Pāṇini's grammar has the same need and the same solution. Many rules apply only to certain roots or certain words, and the grammar does not list them in the rules themselves. It refers to named lists, the <i>Gaṇapāṭha</i> for words and the <i>Dhātupāṭha</i> for roots. A rule that says "after a word of the <i>sarvādi</i> group" is a table lookup. The markers on a root in the <i>Dhātupāṭha</i> are its attributes, stored with it in the table, and the rules read them as needed.</p><table class="ex"><tr><td>Compiler</td><td>Grammar</td></tr><tr><td>symbol table</td><td>Dhātupāṭha, Gaṇapāṭha</td></tr><tr><td>variable's type</td><td>root's class and markers</td></tr><tr><td>keyword list</td><td>list of pronouns or prefixes</td></tr><tr><td>scope</td><td>adhikāra (a rule's range)</td></tr></table><p>The design principle is the separation of <b>rules</b> from <b>data</b>. Keeping the lists apart from the rules makes the rules short and lets the data grow without changing the rules. Programmers call this good engineering. It is also a reason why the grammar has lasted, since new roots and words could be added to the lists by later scholars without rewriting the sūtras.</p>`],
['Compilers and Language Design','Metalanguages and Small Languages',`<p>Pāṇini invented a metalanguage, a restricted form of Sanskrit with its own conventions, to describe Sanskrit. Computer scientists do this constantly. A <b>domain-specific language</b> (DSL) is a small language made for one task: SQL for databases, regular expressions for patterns, CSS for styling, Make for builds. Each is simpler than a general language and better suited to its job.</p><p>The qualities of a good DSL are the qualities of Pāṇini's metalanguage. It has a small vocabulary and fixed conventions. It says things briefly, with defaults so that common cases need little writing. It separates what is described from how it is processed. And it can be learned by a specialist in a modest time, though it may seem opaque to an outsider.</p><p>Pāṇini's economy went far. The tradition says that grammarians value a saving of half a short vowel as much as the birth of a son. Modern engineers know the cost of that attitude. Compressed code is hard to read and to change. The grammar depends on a long tradition of commentary to stay usable, and a modern equivalent would have documentation and tests.</p><p>The next pages explore a small DSL of rewriting rules, in the spirit of the grammar, and then lessons that language designers can draw from the comparison.</p>`],
['Compilers and Language Design','Rewriting and Optimisation',`<p>Many compilers improve code by <b>rewriting</b>. A rule says that one pattern of instructions can be replaced by a cheaper one. This is called peephole or algebraic optimisation. For instance <i>x * 1</i> can be replaced by <i>x</i>, and <i>x + 0</i> by <i>x</i>. Collections of such rules are kept in a table and applied until nothing more changes.</p><pre class="code">RULES = [("*", "1", "left"), ("+", "0", "left"), ("*", "0", "0")]

def simplify(expr):
    left, op, right = expr.split()
    for o, const, result in RULES:         # first matching rule wins
        if op == o and right == const:
            return left if result == "left" else result
    return expr

for e in ["a * 1", "b + 0", "c * 0", "d - 2"]:
    print(e, "-&gt;", simplify(e))</pre><pre class="code out">a * 1 -> a
b + 0 -> b
c * 0 -> 0
d - 2 -> d - 2</pre><p>The first matching rule is used, as in the ordered systems of Markov and Pāṇini.</p><p>The field that studies this is <b>term rewriting</b>, and it asks questions that the grammarians also faced. Does it always stop? Does order change the answer? Which of two overlapping rules applies? Pāṇini's system is deliberately order-dependent: the order of the rules is part of its meaning, which is why the grammar spends so much effort on conflict resolution.</p>`],
