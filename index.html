['Projects: Build It Yourself','Project 1: A Pratyāhāra Calculator',`<p><b>Goal.</b> Given a first sound and a marker, list the sounds of the pratyāhāra. <b>Skills.</b> lists, loops, tuples, the idea of an ordered alphabet.</p><pre class="code">SUTRAS = [("a i u", "ṇ"), ("ṛ ḷ", "k"), ("e o", "ṅ"), ("ai au", "c"),
          ("h y v r", "ṭ"), ("l", "ṇ"), ("ñ m ṅ ṇ n", "m"),
          ("jh bh", "ñ"), ("gh ḍh dh", "ṣ"), ("j b g ḍ d", "ś"),
          ("kh ph ch ṭh th c ṭ t", "v"), ("k p", "y"),
          ("ś ṣ s", "r"), ("h", "l")]

def pratyahara(first, marker, start=1):
    out, on = [], False
    for i, (sounds, m) in enumerate(SUTRAS, 1):
        if i &lt; start:
            continue
        for s in sounds.split():
            on = on or s == first
            if on:
                out.append(s)
        if on and m == marker:
            break
    return out</pre><p>Run it for a few of the traditional names and compare with the earlier table.</p><pre class="code out">jaś   j b g ḍ d
khar  kh ph ch ṭh th c ṭ t k p ś ṣ s
yaṇ   y v r l  (start at line 5)</pre><p><b>Extensions.</b> (1) Write the reverse function, which finds a short name for a given set of sounds, if one exists. (2) Print every pratyāhāra that the grammar uses and the number of sounds in each. (3) Explain why <i>h</i> and <i>ṇ</i> need the <i>start</i> argument, and write it in a comment.</p>`],
['Projects: Build It Yourself','Project 2: A Vowel Sandhi Joiner',`<p><b>Goal.</b> Join two Sanskrit words by the vowel sandhi rules. <b>Skills.</b> functions, conditionals, string slicing, reading a rule as code.</p><p>The module <i>vsandhi.py</i> from the earlier chapter does the work. Use it from a short script and try new pairs.</p><pre class="code">from vsandhi import join

for a, b in [("hari", "iha"), ("rāma", "īśa"), ("vadhū", "āgama")]:
    print(a, "+", b, "-&gt;", join(a, b))</pre><pre class="code out">hari + iha -> harīha
rāma + īśa -> rāmeśa
vadhū + āgama -> vadhvāgama</pre><p>The three results use three different rules: similar vowels merge into a long vowel, <i>a</i> and <i>ī</i> give <i>e</i>, and <i>ū</i> before a vowel becomes <i>v</i>.</p><p><b>Extensions.</b> (1) Add a rule for <i>a + ḷ</i>. (2) Make the function return the rule number as well as the result. (3) Handle the exceptions of 1.1.11, where dual endings do not join, with an extra argument. (4) Join three words in a row and say whether the order of joining changes the answer.</p>`],
['Projects: Build It Yourself','Project 3: A Visarga Joiner',`<p><b>Goal.</b> Join a word ending in visarga to the next word, following the rules of visarga sandhi. <b>Skills.</b> chains of conditions, tuples of sounds, comments that cite rules.</p><pre class="code">from vsandhi import VOWELS

VOICED = ("g", "j", "ḍ", "d", "b", "n", "m", "y", "r", "l", "v", "h")

def visarga(a, b):
    stem = a[:-1]                      # drop ḥ
    vowel = b[0] in VOWELS
    voiced = vowel or b[0] in VOICED
    if stem.endswith("a"):
        if b[0] == "a":
            return stem[:-1] + "o '" + b[1:]          # rāmo 'tra
        if vowel:
            return stem + " " + b                     # rāma iti
        if voiced:
            return stem[:-1] + "o " + b               # rāmo gacchati
    elif voiced:
        return stem + "r " + b                        # harir api
    if b[0] == "c":
        return stem + "ś " + b                        # rāmaś ca
    if b[0] == "t":
        return stem + "s " + b                        # rāmas tatra
    return a + " " + b
</pre><p>The logic follows the earlier page: <i>aḥ</i> before a voiced sound gives <i>o</i>, <i>aḥ</i> before <i>a</i> gives <i>o</i> and an apostrophe, other vowels with <i>ḥ</i> give <i>r</i>, and <i>ḥ</i> before <i>c</i> or <i>t</i> gives <i>ś</i> or <i>s</i>.</p>`],
['Projects: Build It Yourself','Project 3 (continued): Running the Joiner',`<p>The last lines of the file run six test pairs.</p><pre class="code">for a, b in [("rāmaḥ", "gacchati"), ("rāmaḥ", "iti"), ("rāmaḥ", "atra"),
             ("hariḥ", "api"), ("rāmaḥ", "ca"), ("rāmaḥ", "tatra")]:
    print(a, "+", b, "-&gt;", visarga(a, b))</pre><pre class="code out">rāmaḥ + gacchati -> rāmo gacchati
rāmaḥ + iti -> rāma iti
rāmaḥ + atra -> rāmo 'tra
hariḥ + api -> harir api
rāmaḥ + ca -> rāmaś ca
rāmaḥ + tatra -> rāmas tatra</pre><p>All six agree with the forms given in the earlier chapter. Notice that the function returns two words with a space, because visarga sandhi works between words. It does not handle every case. The words <i>punaḥ</i> and <i>antaḥ</i> end in <i>r</i> in the underlying form and behave differently, and the rules for <i>ḥ</i> before <i>k, p, ś, ṣ, s</i> are not included.</p><p><b>Extensions.</b> (1) Add the missing cases. (2) Add the rule for <i>saḥ</i> and <i>eṣaḥ</i>, which lose the visarga before a consonant. (3) Write five tests of your own, using examples from a printed grammar, and see which fail.</p>`],
['Projects: Build It Yourself','Project 4: Declining a-Stems',`<p><b>Goal.</b> Generate the instrumental, genitive, and locative forms of masculine nouns in <i>a</i>. <b>Skills.</b> dictionaries, a rule applied across a word (the change of <i>n</i> to <i>ṇ</i>).</p><pre class="code">TRIGGER = set("rṛṣ")
PASS = set("aāiīuūeohyvkgṅpbm")          # sounds that do not block ṇatva

def nattva(word):                         # 8.4.1: n becomes ṇ after r, ṣ
    out, armed = [], False
    for ch in word:
        if ch in TRIGGER:
            armed = True
        elif ch == "n" and armed:
            ch, armed = "ṇ", False
        elif ch not in PASS:
            armed = False
        out.append(ch)
    return "".join(out)</pre><p>The function <i>nattva</i> scans a word and changes <i>n</i> to <i>ṇ</i> after <i>r</i>, <i>ṛ</i>, or <i>ṣ</i>, unless a blocking sound comes between, as in 8.4.1 and the rules that follow it.</p>`],
['Projects: Build It Yourself','Project 4 (continued): Using the Declension',`<p>The second half of <i>decl.py</i> builds the forms.</p><pre class="code">
def decline_a(stem):
    b = stem[:-1]
    return {
        "instr": (nattva(b + "ena"), b + "ābhyām", b + "aiḥ"),
        "gen":   (b + "asya", b + "ayoḥ", nattva(b + "ānām")),
        "loc":   (b + "e", b + "ayoḥ", b + "eṣu"),
    }</pre><p>Now use it on three stems.</p><pre class="code">from decl import decline_a

for stem in ["rāma", "kṛṣṇa", "deva"]:
    print(stem, decline_a(stem)["instr"])</pre><pre class="code out">rāma ('rāmeṇa', 'rāmābhyām', 'rāmaiḥ')
kṛṣṇa ('kṛṣṇena', 'kṛṣṇābhyām', 'kṛṣṇaiḥ')
deva ('devena', 'devābhyām', 'devaiḥ')</pre><p>Notice <i>kṛṣṇena</i>, in which the <i>n</i> does not change because <i>ṇ</i> stands between the <i>ṣ</i> and the <i>n</i>. The program gets this right because <i>ṇ</i> is not in the set of passing sounds. <b>Extensions.</b> Complete the table with the other cases, add stems in <i>i</i> and <i>u</i>, and compare your output with a printed paradigm.</p>`],
['Projects: Build It Yourself','Project 5: Conjugating the Present Tense',`<p><b>Goal.</b> Generate the present tense of verbs of the first class. <b>Skills.</b> tuples, dictionaries keyed by person, string slicing.</p><pre class="code">def present(stem):                # stem ends in a, e.g. "bhava"
    s = stem
    return {
        3: (s + "ti", s + "taḥ", s[:-1] + "anti"),
        2: (s + "si", s + "thaḥ", s + "tha"),
        1: (s[:-1] + "āmi", s[:-1] + "āvaḥ", s[:-1] + "āmaḥ"),
    }</pre><p>The function takes the present stem, which ends in <i>a</i>. The ending <i>jhi</i> gives <i>anti</i> and swallows the stem vowel. Before <i>v</i> and <i>m</i> the stem vowel is lengthened, so the first person forms are <i>-āmi, -āvaḥ, -āmaḥ</i>.</p><pre class="code">from verbs import present

for stem in ["bhava", "paṭha", "gaccha"]:
    print(present(stem)[3], present(stem)[1])</pre><pre class="code out">('bhavati', 'bhavataḥ', 'bhavanti') ('bhavāmi', 'bhavāvaḥ', 'bhavāmaḥ')
('paṭhati', 'paṭhataḥ', 'paṭhanti') ('paṭhāmi', 'paṭhāvaḥ', 'paṭhāmaḥ')
('gacchati', 'gacchataḥ', 'gacchanti') ('gacchāmi', 'gacchāvaḥ', 'gacchāmaḥ')</pre><p><b>Extension.</b> Build the present stem from the root, using the root <i>bhū</i> to <i>bhav</i> and <i>gam</i> to <i>gaccha</i> by rule. The second is irregular, and the <i>Dhātupāṭha</i> marks it.</p>`],
['Projects: Build It Yourself','Project 6: A Compound Builder',`<p><b>Goal.</b> Join two words into a compound and give the explaining phrase, the <i>vigraha</i>. <b>Skills.</b> reuse of an earlier module, functions that return pairs.</p><pre class="code">from vsandhi import join

GEN = {"rāja": "rājñaḥ"}

def tatpurusha(a, b):
    return join(a, b), f"{GEN.get(a, a)} {b}ḥ"

def bahuvrihi(a, b):
    return join(a, b), f"{a}m {b}m yasya saḥ"

def dvandva(a, b):
    return join(a, b)[:-1] + "au", f"{a}ś ca {b}ś ca"

print(tatpurusha("rāja", "puruṣa"))
print(bahuvrihi("pīta", "ambara"))
print(dvandva("rāma", "lakṣmaṇa"))</pre><pre class="code out">('rājapuruṣa', 'rājñaḥ puruṣaḥ')
('pītāmbara', 'pītam ambaram yasya saḥ')
('rāmalakṣmaṇau', 'rāmaś ca lakṣmaṇaś ca')</pre><p>Each function calls <i>join</i> from the sandhi module, so the compound already has correct sandhi at the joint. The tatpuruṣa uses a small table for the genitive of <i>rāja</i>, since the genitive of <i>rājan</i> is irregular. The dvandva puts the result in the dual.</p><p><b>Extensions.</b> (1) Add avyayībhāva and dvigu builders. (2) Replace the table with a real noun declension. (3) Write a function that takes a finished compound and a type and checks the vigraha.</p>`],
['Projects: Build It Yourself','Project 7: A Derivation Tracer',`<p><b>Goal.</b> Derive <i>bhavati</i> by rules applied in order and print each step. <b>Skills.</b> lists of functions, lambda expressions, formatted output.</p><pre class="code">RULES = [
    ("3.4.78", lambda s: s.replace("laṭ", "tip")),
    ("3.1.68", lambda s: s.replace("tip", "śap tip")),
    ("1.3.9",  lambda s: s.replace("śap", "a").replace("tip", "ti")),
    ("7.3.84", lambda s: s.replace("bhū", "bho")),
    ("6.1.78", lambda s: s.replace("bho a", "bhav a")),
]

state = "bhū laṭ"
print(f"{state:16} start")
for rule, change in RULES:
    state = change(state)
    print(f"{state:16} {rule}")
print(state.replace(" ", ""))</pre><pre class="code out">bhū laṭ          start
bhū tip          3.4.78
bhū śap tip      3.1.68
bhū a ti         1.3.9
bho a ti         7.3.84
bhav a ti        6.1.78
bhavati</pre><p>Each rule is a pair of a sūtra number and a function that changes the state. The loop applies them in order and prints the result, so the output is a trace like those in the commentaries. The rules here are written as string replacements, which is crude, but it shows the design of a rule engine.</p><p><b>Extensions.</b> Add the choice of rule by the conditions it checks, derive <i>gacchati</i>, and make the program stop with a message if a rule does not apply when it should.</p>`],
['Projects: Build It Yourself','Project 8: A Sandhi Splitter',`<p><b>Goal.</b> Given a joined string and a small dictionary, find the pairs of words that join to give it. <b>Skills.</b> nested loops, importing a module, working backwards.</p><pre class="code">from vsandhi import join

def splits(s, lexicon):
    found = []
    for w1 in lexicon:
        for w2 in lexicon:
            if w1 + w2 == s or join(w1, w2) == s:
                found.append((w1, w2))
    return sorted(set(found))

print(splits("devendra", ["deva", "indra", "de", "ndra"]))
print(splits("maharṣi", ["mahā", "maha", "ṛṣi"]))</pre><pre class="code out">[('deva', 'indra')]
[('maha', 'ṛṣi'), ('mahā', 'ṛṣi')]</pre><p>The program tries every pair of words from the dictionary and keeps those whose join equals the string. It runs the sandhi program forwards and compares, which is the simplest way to undo sandhi. The second result is instructive. Both <i>maha</i> and <i>mahā</i> would join with <i>ṛṣi</i> to give <i>maharṣi</i>, since the rule does not distinguish short from long <i>a</i>. A splitter cannot tell which was meant without the dictionary and the context. This is the ambiguity that all Sanskrit segmenters face.</p><p><b>Extensions.</b> Rank the answers by the frequency of the words, split into three words, and speed it up with an index of word endings.</p>`],
['Projects: Build It Yourself','Project 9: A Checker and a Web Version',`<p><b>Goal.</b> Check whether a claimed sandhi result is correct, and write the same rule for a web page. <b>Skills.</b> reuse, a second programming language.</p><pre class="code">from vsandhi import join

def check(a, b, claimed):
    ok = join(a, b) == claimed
    return "valid" if ok else f"invalid, expected {join(a, b)}"

print(check("deva", "indra", "devendra"))
print(check("deva", "indra", "devindra"))</pre><pre class="code out">valid
invalid, expected devendra</pre><p>A checker uses the rules to verify someone else's work. The same rule can also run in the browser. Here is rule 6.1.77 in JavaScript.</p><pre class="code">const YAN = { i: "y", u: "v", "ṛ": "r", "ḷ": "l" };
const VOWELS = "aāiīuūṛṝḷeo";

function ikoYanAci(left, right) {
  const last = left.slice(-1);
  if (last in YAN &amp;&amp; VOWELS.includes(right[0])) {
    return left.slice(0, -1) + YAN[last] + right;
  }
  return null;
}
console.log(ikoYanAci("iti", "ādi"), ikoYanAci("deva", "indra"));</pre><pre class="code out">ityādi null</pre><p>Included in a web page, this code lets visitors try joins without installing anything. <b>Extension.</b> Build a page with two text boxes and a button that shows the joined word and the rule used.</p>`],
['Projects: Build It Yourself','Project 10: Testing, Packaging, and Sharing',`<p>A project becomes useful to others when it is tested, documented, and shared. A simple layout for the code in this chapter is:</p><pre class="code">panini-tools/
  README.md            what it is, how to run it
  LICENSE              terms of use
  pratyahara.py        Śiva Sūtras and pratyāhāras
  vsandhi.py           vowel sandhi
  visarga.py           visarga sandhi
  decl.py   verbs.py   compound.py   split.py
  tests/test_sandhi.py known cases, with rule numbers</pre><p><b>Tests first.</b> Keep the commentaries' own examples as the test data, and run them whenever the code changes. <b>Cite the rules.</b> Put the sūtra number in a comment beside each line, as the code in this book does, so that a reader can check the code against the grammar. <b>Say what is missing.</b> The README should list the rules that are not implemented, so that nobody mistakes the tool for a full grammar.</p><p><b>Share.</b> Choose a licence, such as the MIT licence for code, and publish the files on a site such as GitHub, where others can report errors and suggest changes. Credit the sources, including the editions of the grammar used. The Cultural Musings site, at www.culturalmusings.com, welcomes corrections to this book and to the examples in it.</p><p>A small, correct, well-documented tool is worth more than a large and untested one.</p>`]
);

PP.push(
['Beyond Sanskrit and Beyond Code','Telugu and the Pāṇinian Method',`<p>The methods of this book are not tied to Sanskrit. Telugu, like Sanskrit, has sandhi, compounds, and rich word-formation, and its grammarians borrowed Sanskrit's terms. A program for Telugu can use the same architecture: a lexicon, a set of ordered rewriting rules for the joints between words, and a lattice-based splitter.</p><p>Telugu sandhi (<i>sandhulu</i>) has its own rules. Three common cases show the pattern.</p><table class="ex"><tr><td>rāmuḍu + ani</td><td>rāmuḍani</td><td>the final <i>u</i> drops before a vowel</td></tr><tr><td>rāma + anna</td><td>rāmanna</td><td>two <i>a</i> sounds merge into one</td></tr><tr><td>mā + illu</td><td>mā yillu</td><td>a <i>y</i> is inserted between vowels</td></tr></table><p>The first two are rules of deletion and merging, the third of insertion, so all three kinds of rewriting appear. These rules can be encoded exactly as the Sanskrit ones were, with a table of conditions and results. A student at a Telugu-state university could write a small Telugu joiner as a project, test it against the school grammar of Chinnayasūri, and compare it with the Sanskrit one.</p><p>Research on Telugu morphology, including analysers built at the University of Hyderabad and IIIT Hyderabad, has used the Pāṇinian framework of roots, suffixes, and paradigms, and similar tools exist for Hindi, Marathi, Kannada, and other Indian languages.</p>`],
['Beyond Sanskrit and Beyond Code','Indian Language Technology in Practice',`<p>India has more than twenty scheduled languages and many more spoken ones, and a large share of its people read and write in languages that software has served poorly. Language technology therefore has a social purpose as well as a scientific one.</p><p>Government and academic programmes have supported work on machine translation, speech recognition, text-to-speech, spelling and grammar tools, and shared datasets. Public platforms for Indian-language translation and speech, such as those under the National Language Translation Mission, aim to make such tools available to developers. Universities, including the University of Hyderabad and IIIT Hyderabad, have trained many of the researchers in this field and have released analysers, treebanks, and corpora.</p><p>Much of this work faces the problems this book has described. Rich word-formation, free word order, and a shortage of digitised text call for methods that use linguistic knowledge as well as statistics. The Pāṇinian tradition of describing a language through roots, affixes, and roles has proved a useful starting point for several Indian languages, because their grammars share many features.</p><p>A student who wishes to enter the field can begin with the tools described here, read the open papers of these groups, and contribute small, correct datasets in their own language.</p>`],
['Beyond Sanskrit and Beyond Code','Generating Forms for Apps and Teaching',`<p>One practical use of a rule-based grammar is to generate forms. An app that teaches Sanskrit needs the full declension of any noun and conjugation of any verb, and a program built from the rules can supply them without a hand-written table for each word. Dictionary and flash-card applications, reading aids, and exercises for students can be built on such a generator.</p><p>The advantages are accuracy and completeness. A table made by hand may contain typing errors, and one made by rule can be checked against the rules. New words can be added by supplying a root and its class, and every form follows. The generator can also give the reason for a form, as the derivation tracer does.</p><p>The limits are the exceptions and the irregular words. Many common words, such as pronouns and the verb <i>as</i>, "be", do not follow the general patterns, and a generator needs a list of them. The program must also say clearly when it does not know a form, and not invent one.</p><p>An educational tool of this kind should show its sources and allow users to report mistakes, so that its tables improve over time. Combined with a teacher, it can give a student immediate and exact feedback on practice exercises, such as those at the end of the earlier chapter.</p>`],
['Beyond Sanskrit and Beyond Code','Rules and Language Models Together',`<p>Neural language models produce fluent text but cannot be trusted to follow rules exactly. A rule-based program follows rules exactly but cannot write fluently. A promising design uses each for what it does well: the model proposes, and the program checks.</p><p>The checker from the earlier project is a small example. Suppose a model says that <i>deva + indra</i> gives <i>devindra</i>. The program recomputes the join by the rules and finds the mistake.</p><pre class="code">from vsandhi import join

def check(a, b, claimed):
    ok = join(a, b) == claimed
    return "valid" if ok else f"invalid, expected {join(a, b)}"

print(check("deva", "indra", "devendra"))
print(check("deva", "indra", "devindra"))</pre><pre class="code out">valid
invalid, expected devendra</pre><p>On a larger scale, a system can ask a model to write a Sanskrit sentence and then pass every word through a morphological analyser, rejecting forms that do not exist. It can ask the model to split a compound and verify that the parts, joined by the rules, give back the original. It can ask for the rule number behind an answer and look the number up in a table, so that invented citations are caught.</p><p>The same approach works for any area in which correct answers can be checked by rules, such as dates, units, and grammar.</p>`],
['Beyond Sanskrit and Beyond Code','Spelling and Grammar Checkers',`<p>A spelling checker reports words that are not in a dictionary. For English this is a lookup, since the list of words is finite and fairly small. For a language like Sanskrit or Telugu, with many forms for each root, a plain word list is far too large, and a checker must be built on the rules instead.</p><p>A rule-based checker works in steps. It reads a word and tries to analyse it as a root and endings, using the rules and the lexicon. If no analysis is found, the word is flagged. A deeper checker also tests whether the endings agree, for example whether an adjective has the same case, number, and gender as the noun it describes, and whether a verb agrees with its subject. These checks use the same knowledge as the morphological analyser.</p><p>The user's experience matters. A checker that flags many correct words, because the lexicon is incomplete, quickly loses the user's trust. One that misses real errors is useless. The balance is struck by a good lexicon, a way for users to add words, and a clear display of the reason for each flag, such as "this ending does not match a feminine noun".</p><p>For learners, such a tool is a patient teacher that can point to the exact rule that was broken.</p>`],
['Beyond Sanskrit and Beyond Code','Teaching with Derivation Traces',`<p>The derivation of a word, step by step with the rule at each step, is one of the grammar's best teaching tools, and software can present it in a way a printed page cannot. A learner can enter a word and see the derivation unfold, one rule at a time, with the option to open the text of each sūtra and its commentary.</p><p>A teaching tool of this kind has several useful features. It can show the state of the word at each step, as the tracer does, and highlight the part that changed. It can let the learner guess the next rule before it is revealed, and score the guesses. It can show why a rule did not apply, by displaying the condition that failed. And it can show alternatives, such as the two forms of an optional rule, side by side.</p><p>Such tools also help teachers. A class can compare a student's hand derivation with the program's and find the step where they differ, which is often the best place to explain a concept. The records can be collected, with permission, to see which rules students find hard.</p><p>This is where a rule-based system has a clear advantage over a statistical one. It gives answers that can be questioned, and a student who learns to question them is learning the grammar.</p>`],
['Beyond Sanskrit and Beyond Code','Explanations and Black Boxes',`<p>Modern machine-learning systems are often called <b>black boxes</b>, because they give answers without reasons. As such systems are used for decisions that matter, such as medical advice, loans, and legal documents, there is a growing demand for <b>explanations</b>: a statement of why the system gave a certain answer.</p><p>A rule system has an explanation built in. Each answer comes from a chain of rules, and the chain can be printed. This is the strength of the Pāṇinian derivation: every form is justified by named steps that anyone can check. Some modern systems combine learning and rules for this reason, using learning for perception and rules for decisions that must be explained.</p><p>The comparison should not be pushed too far. A rule system can be explained only as far as its rules are understood, and a large rule base can itself become hard to follow, as the commentary on the <i>Aṣṭādhyāyī</i> shows. Rules written by people can also be wrong or incomplete, and they cannot learn from data by themselves.</p><p>The lesson from the grammar is a modest one. Where correct answers can be written as rules, the rules should be used, with traces and tests. Where they cannot, a learning system is the better tool, and its answers need independent checking.</p>`],
['Beyond Sanskrit and Beyond Code','Ethics, Credit, and Myths',`<p>Work that connects an ancient tradition with modern technology carries responsibilities. The first is accuracy. Claims that go beyond the evidence, such as that Pāṇini wrote the first compiler or that Sanskrit is the language of artificial intelligence, mislead readers and, in the end, harm the reputation of the tradition. A statement should be checked against a source before it is repeated.</p><p>The second is credit. The grammar was preserved and explained by many generations of teachers, and the modern research on it is the work of linguists, philologists, and computer scientists, in India and elsewhere. Software built on their work should name them and the editions used. Where a method comes from a particular researcher or group, the project should say so.</p><p>The third is openness. The knowledge of the grammar belongs to a community of learners, and tools built on it should be as open as possible, with licences that allow others to study and improve them. Data from living speakers, such as recordings and testimonies, should be gathered with consent, as the last chapter of the main book described.</p><p>The fourth is respect for the learner. A student who is told that the grammar is a computer program, or that a machine can replace a teacher, has been given less than the truth. The tradition deserves to be taught as it is: a great intellectual achievement of its own time and place.</p>`],
['Beyond Sanskrit and Beyond Code','Open Questions and Research Directions',`<p>Several questions about the grammar and its use in computing remain open, and some are attractive to students looking for a project.</p><p><b>Rule conflict.</b> How exactly should conflicts between rules be resolved? The proposal of Rishi Rajpopat in his 2022 Cambridge thesis, that the rule applying to the right-hand part of a word should win, has been debated, and implementations that test it against a large set of correct forms could help to decide.</p><p><b>Full implementation.</b> A complete, tested, openly available program that derives every form from the rules, with a trace, would be a major resource. Partial versions exist, and their coverage and design differ.</p><p><b>Formal properties.</b> The exact formal class of the whole system, and the status of its ordering and invisibility principles, are open to study by logicians and computer scientists.</p><p><b>Data.</b> Larger sets of gold-standard analyses for Sanskrit and for the regional languages would help every method.</p><p><b>Teaching.</b> Evidence on whether derivation traces help students learn would guide the design of tools.</p><p>A student can start small: choose one section of the grammar, implement it, test it against the commentary, and report what was found. Such work, carefully done and shared, is a real contribution to a living field of study.</p>`],
['Beyond Sanskrit and Beyond Code','A Developer\'s Checklist and Reading List',`<p><b>Checklist.</b> Before writing code, read the rule and one commentary. Write the test cases first. Cite the sūtra number beside each line. Return every possible result for optional rules. Keep rules and data apart. Print a trace. State what is not covered. Credit the sources. Publish with an open licence.</p><p><b>Computer science.</b> Aho, Lam, Sethi, and Ullman, <i>Compilers: Principles, Techniques, and Tools</i> (the "Dragon Book"). Hopcroft, Motwani, and Ullman, <i>Introduction to Automata Theory, Languages, and Computation</i>. Michael Sipser, <i>Introduction to the Theory of Computation</i>.</p><p><b>Language technology.</b> Jurafsky and Martin, <i>Speech and Language Processing</i>. Beesley and Karttunen, <i>Finite State Morphology</i> (2003). Kaplan and Kay, "Regular Models of Phonological Rule Systems" (1994).</p><p><b>Pāṇini and computing.</b> Bharati, Chaitanya, and Sangal, <i>Natural Language Processing: A Paninian Perspective</i> (1995). Briggs, "Knowledge Representation in Sanskrit and Artificial Intelligence" (1985). Kiparsky, "On the Architecture of Pāṇini's Grammar" (2009). Ingerman, "Pāṇini–Backus Form Suggested" (1967). Hellwig and Nehrdich, a 2018 paper on neural Sanskrit word segmentation.</p><p><b>The grammar.</b> Cardona, <i>Pāṇini: His Work and Its Traditions</i>, and the translations of Sharma and of Katre listed earlier.</p><p>For the wider work of Cultural Musings, visit www.culturalmusings.com.</p>`]
);

PP.push(
['Writing, Orality, and the Age of Sanskrit','Why Chronology Matters',`<p>When was Sanskrit first used, and when was Pāṇini's grammar composed? These look like questions for specialists, but they shape how the whole tradition is read. If the grammar is old, then Sanskrit had been spoken and analysed long before it was written. If it is late, a different story follows.</p><p>This chapter sets out the evidence in a plain order: what has been found, what each find can show, and what cannot be concluded from it. It also corrects a few statements that are often repeated in a simplified form. The chapter treats Sanskrit and Tamil evidence side by side, because both traditions are old, both have been the subject of recent discoveries, and both are sometimes discussed in the language of rivalry.</p><p>The book's three grades apply. A claim is <b>established</b> when it rests on dated objects and agreement among specialists, <b>suggestive</b> when the evidence is partial or still being published, and a <b>framework</b> when it is an interpretation that has not been tested. The summary at the end of the chapter sorts the main claims in this way.</p>`],
['Writing, Orality, and the Age of Sanskrit','Kinds of Evidence and Their Limits',`<p>Chronology rests on four kinds of evidence, and each answers a different question.</p><p><b>Inscriptions</b> (epigraphy) give written words on stone, metal, or pottery, dated by the rulers or eras they name or by the shape of the letters, a method called palaeography. They show that writing in a given language existed by a given time. They cannot show that the language did not exist before.</p><p><b>Archaeology</b> gives objects and layers of soil. Radiocarbon dating of organic material, such as charcoal or seeds, gives dates in calendar years with a margin of error. It dates the material, and one must still show that the material belongs to the object of interest.</p><p><b>Linguistics</b> compares forms across languages and across layers of one language, and can rank texts by age, and sometimes give approximate dates by comparison with datable material elsewhere.</p><p><b>Texts</b> themselves contain internal clues: names, places, events, and the language they use. Their dates are inferred, and tradition may differ from scholars.</p><p>No one kind of evidence settles everything. Reliable statements come from agreement among several.</p>`],
['Writing, Orality, and the Age of Sanskrit','The Indus Script',`<p>The oldest writing found in the Indian subcontinent belongs to the cities of the Indus civilisation, which flourished from about 2600 to 1900 BCE. More than four thousand objects, mostly small stamp seals, carry short sequences of signs, usually of five or six signs and seldom more than twenty-six. About four hundred distinct signs have been counted.</p><p>The script has not been deciphered. No long text and no bilingual inscription has been found, and the underlying language is unknown. Claims of decipherment, in favour of Dravidian, Indo-Aryan, or other languages, have been made repeatedly, and none has won general acceptance. Some scholars doubt that the signs record language at all.</p><p>This matters for the present chapter in two ways. First, it shows that writing, of some kind, existed in the subcontinent very early. Second, because the script cannot be read, it cannot be used to say anything about the age of Sanskrit, Tamil, or any other language. The Indus signs disappear after about 1900 BCE, and there is a long interval, of many centuries, before the next writing that can be read.</p>`],
['Writing, Orality, and the Age of Sanskrit','After the Indus: Brāhmī and Kharoṣṭhī',`<p>The next scripts that can be read are <b>Brāhmī</b> and <b>Kharoṣṭhī</b>. Kharoṣṭhī, written right to left, was used in the north-west and is derived from the Aramaic script, which came into the region with the Persian empire. Brāhmī, written left to right, is the ancestor of nearly all the scripts of India and of many in South-East Asia, including Telugu and Tamil.</p><p>The origin of Brāhmī is debated. Some scholars derive it from a Semitic script such as Aramaic; others argue for an Indian development, perhaps from the Indus signs, though the evidence for this is slight. The majority view is that it was shaped, with local features, in the fourth or early third century BCE, in a period of contact with the Persian empire and its Aramaic writing.</p><p>The earliest dated Brāhmī inscriptions are those of Aśoka, from about 260 BCE. Recent excavations in South India have produced pottery marked with Brāhmī letters that is dated by some excavators to earlier centuries, a claim discussed in a later page. If confirmed, it would show that the script was in use in the south by the sixth or fifth century BCE.</p>`],
['Writing, Orality, and the Age of Sanskrit','The Edicts of Aśoka',`<p>Emperor Aśoka of the Maurya dynasty had his messages carved on rocks and pillars across the empire, from about 260 BCE. The edicts speak of his remorse after the war in Kaliṅga, and urge compassion, tolerance, and respect for parents and teachers.</p><p>The edicts were written for the people, and so in the languages of the regions. In the east and centre they are in a Prakrit, a spoken Middle Indo-Aryan language, in Brāhmī script. In the north-west they are in Prakrit written in Kharoṣṭhī, and in the far west of the empire, at Kandahar in present-day Afghanistan, there are inscriptions in Greek and in Aramaic, some bilingual. A Greek-and-Aramaic inscription and a Greek philosophical inscription were found there.</p><p>The edicts thus show a ruler using several languages to reach several peoples. They do not contain Sanskrit. This is often cited to show that Sanskrit was not yet used in writing, which is true, but it does not show that Sanskrit was not spoken or learned. The edicts were public announcements to ordinary people, and a ruler who wished to be understood chose the speech they used. Sanskrit, the language of ritual and learned discourse, was not the language of such notices.</p>`],
['Writing, Orality, and the Age of Sanskrit','Prakrit in the Edicts: What It Tells Us',`<p>The word <i>prākṛta</i> means "natural" or "of common origin", and the Prakrits are the Middle Indo-Aryan languages that developed from the older speech of the same family as Sanskrit. They are not corruptions of Sanskrit, as some later grammarians suggested, but sister forms with a shared ancestry.</p><p>The edicts are valuable evidence that the Indo-Aryan languages had changed considerably by 260 BCE. A word such as the Sanskrit <i>dharma</i> appears as <i>dhamma</i>, the sounds having been simplified. This change implies centuries of earlier development, since the shift from the Vedic stage to the Prakrit stage took a long time.</p><p>The coexistence of Prakrit and Sanskrit is therefore the normal situation in early India. Prakrits were the daily speech, and Sanskrit was the language of the learned, the ritual, and the grammar. The earliest long inscriptions are in Prakrit because they were meant for common readers, and the use of Sanskrit in inscriptions begins later, when it also became a language of royal praise and public display.</p><p>That sequence, with Prakrit before Sanskrit in the written record, does not imply that Sanskrit was a later invention. It reflects what each language was used for.</p>`],
['Writing, Orality, and the Age of Sanskrit','The Earliest Sanskrit Inscriptions',`<p>It is often said that Sanskrit inscriptions begin at Junagadh, about 150 CE. This is a useful rule of thumb for the first <i>long</i> and <i>polished</i> Sanskrit inscription, but it is not accurate as a statement of the earliest. A few shorter Sanskrit inscriptions are older.</p><p>The <b>Ayodhyā inscription</b> of a ruler named Dhana (often read as Dhanadeva or Dhanadeva of Kosala) is in Sanskrit and is dated by most scholars to the first century BCE or the first century CE. It records the building of a memorial for his father. The <b>Hāthībāḍā–Ghosuṇḍī inscriptions</b> from Rajasthan, of about the first century BCE, are in Sanskrit and concern the worship of Saṅkarṣaṇa and Vāsudeva. The <b>Mora well inscription</b> near Mathurā is also early.</p><p>These inscriptions are short, and their Sanskrit is somewhat simple, with traces of Prakrit influence. They show that Sanskrit was being written in stone by the first century BCE, some two centuries before Junagadh. They do not change the larger pattern. Written Sanskrit was rare before the second century CE, and common after the fourth. The correction matters because a precise date should not be given to a rough tendency.</p>`],
['Writing, Orality, and the Age of Sanskrit','The Junagadh Inscription',`<p>The rock at Junagadh in Gujarat carries edicts of Aśoka in Prakrit, and also a long inscription, dated to about 150 CE, of the Śaka ruler Rudradāman. It records the repair of a dam, the Sudarśana lake, which had been built centuries earlier under the Mauryas and burst in a great storm.</p><p>The inscription is in Sanskrit, and it is written in a polished prose, with long compounds, rhetorical balance, and an elaborate list of the king's virtues, learning, and skills. It is the earliest surviving long inscription in the high literary style, <i>kāvya</i>, and a landmark in the history of Sanskrit as a language of public record.</p><p>Its importance for this chapter is twofold. First, it shows that by 150 CE the literary Sanskrit of the court had reached a developed style, which implies a long earlier training in the language, since such prose does not appear without a tradition behind it. Second, it was set up by a ruler of foreign origin, a Śaka, who chose Sanskrit to present himself to an Indian audience. That a newly arrived ruler used the language for this purpose shows its prestige and reach.</p>`],
['Writing, Orality, and the Age of Sanskrit','The Gupta Age and the Spread of Sanskrit Inscriptions',`<p>From the fourth century CE, under the Gupta dynasty and its contemporaries, Sanskrit becomes the usual language of royal inscriptions. The pillar at Prayāga (Allahabad) records the conquests of Samudragupta in a long poem and prose praise, the <i>praśasti</i>, composed by his court poet Hariṣeṇa. Land grants on copper plates, temple foundations, and records of gifts follow, in all parts of the subcontinent.</p><p>Several things changed. The Gupta court patronised Sanskrit poets, among them, by tradition, Kālidāsa. Sanskrit became the shared language of administration and culture across regions that spoke different vernaculars. In the following centuries it spread beyond India, and inscriptions in Sanskrit are found in Cambodia, Java, Champa, and elsewhere in South-East Asia, often alongside local languages.</p><p>The rise of Sanskrit in inscriptions after 400 CE is therefore a fact about the use of the language in public display, a social and political change. It tells us when Sanskrit became the language of writing for rulers. It tells us less about when the language began, for which other kinds of evidence are needed, as the next page explains.</p>`],
['Writing, Orality, and the Age of Sanskrit','A Late Inscription Does Not Mean a Late Language',`<p>The argument is simple, and it applies to any language. The date of the first written record of a language is later than the date of the language, often by a long time. English was spoken for centuries before the earliest English writing, and writing in Latin before the appearance of Latin inscriptions is attested by the grammarians' own accounts.</p><p>For Sanskrit the argument is stronger, for three reasons. First, the oldest Sanskrit texts, the hymns of the Ṛgveda, are in a language that is already highly developed and uses poetic conventions that took long to form. Second, comparison with related languages shows that Vedic Sanskrit preserves features of an older Indo-European stage, as in its pitch accent, and so is of great antiquity. Third, the tradition itself says that the texts were transmitted by mouth.</p><p>Against these, the absence of stone inscriptions before the first century BCE is weak evidence for the absence of the language. Inscriptions are made for particular purposes, and a society can have a rich literature and no practice of public writing. The correct conclusion is that Sanskrit was in use for many centuries before it was written in stone, and that we know this from internal and comparative evidence.</p>`],
['Writing, Orality, and the Age of Sanskrit','Oral Composition and Transmission',`<p>Ancient Indian culture gave the highest honour to the spoken word. The Vedas are called <i>śruti</i>, "what is heard", and a learned man was <i>śrotriya</i>, "one who has heard". Texts were learned from a teacher, by listening and reciting, and a pupil who read from a manuscript was thought to be at a lower level.</p><p>This preference is sometimes described as a rejection of writing for sacred texts. The truth is more careful. The tradition valued oral transmission as the proper way to learn and keep the Veda, and it developed methods of great precision to do so, as the next chapter describes. This does not mean that writing was unknown or forbidden in all contexts. Writing was used for accounts, letters, and records. Some later texts even regard the writing of the Veda as a lesser practice, which implies that writing existed.</p><p>The consequence for chronology is that the best evidence for the age of the early texts is internal, in language and content, and not in objects. A culture that keeps its literature in memory leaves few physical traces, and archaeologists will not find its books. This is a feature of the evidence, and it should be allowed for.</p>`],
['Writing, Orality, and the Age of Sanskrit','Did Pāṇini Know Writing?',`<p>Scholars disagree. The traditional and common view is that Pāṇini composed his grammar orally and that it was learned by heart. The compact style, with its devices for memory, supports it.</p><p>Against this, several observations suggest that Pāṇini knew writing. His grammar contains the words <i>lipi</i> and <i>lipikara</i>, "writing" and "writer" (3.2.21), and the term <i>yavanānī</i> (4.1.49), which commentators explain as the writing of the Yavanas, a name for Greeks or other people from the west. Some scholars, among them Harry Falk, argue that the structure of the grammar, with its lists, its cross-references, and its layout, would have been hard to build without some writing, and date the introduction of Brāhmī to a time near Pāṇini.</p><p>Others reply that the words may refer to writing in other scripts, such as Kharoṣṭhī, known in Gandhāra, where Pāṇini lived, and that a work of this kind could be composed in the mind, as were the great Vedic compilations. The debate is not settled. The honest statement is that Pāṇini probably knew of writing, as it existed around him in Gandhāra, and that the grammar's transmission was oral, whatever part writing played in its composition.</p>`],
['Writing, Orality, and the Age of Sanskrit','Pāṇini: Date and Place',`<p>The traditional account places Pāṇini in Śalātura, a village in the Gandhāra region, identified with a place near Attock in present-day Pakistan, not far from the ancient city of Taxila (Takṣaśilā), a great centre of learning. His grammar contains many references to the geography and customs of the north-west, which support this.</p><p>His date is uncertain. Estimates range from the seventh to the fourth century BCE, with the fifth or fourth century BCE the most common. Several kinds of evidence are used. He mentions Buddhist or Jain terms only slightly and does not seem to know the language of the later epics. He knows of the <i>yavanānī</i>, which suggests contact with Greeks or with Persian-ruled Aramaic writing, so not before the Achaemenid expansion in the sixth century BCE. And his grammar is cited by Kātyāyana and Patañjali, who lived by the second century BCE at the latest.</p><p>A reasonable summary is "about 500 to 350 BCE". The range is wide, and it would be a mistake to give a single year. What is secure is that Pāṇini wrote before the third century BCE, in the north-west, for a language that was already ancient.</p>`],
['Writing, Orality, and the Age of Sanskrit','What the Grammar Describes: Bhāṣā and Chandas',`<p>The grammar is itself evidence. Pāṇini describes two registers, as an earlier chapter said. <i>Bhāṣā</i>, the spoken language, is the main object of the rules. <i>Chandas</i>, the language of the Veda, is dealt with in the many rules marked "in the Veda", which record forms that the spoken language no longer used.</p><p>The way he marks these forms shows that by his time Vedic Sanskrit already seemed old. The Vedic forms needed special statement, and some, such as the subjunctive <i>leṭ</i>, had gone out of ordinary use. A language does not need such statement unless it has changed enough that the older forms are no longer natural. This fits an interval of several centuries between the later Ṛgvedic hymns and Pāṇini.</p><p>The spoken language he describes is not the Classical Sanskrit of the Gupta poets. It differs in details of vocabulary and form, and some of the epic usages he does not mention. His grammar therefore represents a stage between the Vedic and the Classical, which can be called pre-classical.</p><p>This is the internal evidence on which the grammar's place in the history of Sanskrit rests. It shows that a mature, studied Sanskrit existed by the fifth or fourth century BCE, when the oldest surviving Sanskrit inscriptions were still four centuries away.</p>`],
['Writing, Orality, and the Age of Sanskrit','A Language Before Its Grammar',`<p>A grammar describes a language that already exists and has been in use for a long time. This is a general rule. The first grammars of Greek and Latin were written centuries after their literatures, and the grammar of Tamil, as discussed later in this book, comes after a body of poetry. A written description needs a tradition of analysis, which in turn needs a stable body of usage to describe.</p><p>For Sanskrit, the sequence runs as follows. The Vedic hymns were composed over several centuries. Teachers developed methods of recitation and, later, studies of phonetics, metre, and word origins, the Vedāṅgas. The earlier grammarians, whom Pāṇini names, wrote before him. Pāṇini's system, which he refers to as improving on theirs, is therefore the culmination of an old line of work.</p><p>The consequence for the question of the antiquity of the language is clear. If the grammar belongs to about 500 to 350 BCE and presupposes earlier grammarians, the language it describes had been in use and studied for many generations before that. It is reasonable to speak of centuries.</p><p>The same logic is used for other languages, and it is a good example of how indirect evidence can support firm conclusions.</p>`],
['Writing, Orality, and the Age of Sanskrit','Stages of Sanskrit',`<p>Linguists divide the history of Sanskrit into stages, which overlap and are not exact.</p><table class="ex"><tr><td>Stage</td><td>Texts</td><td>Rough period</td></tr><tr><td>Early Vedic</td><td>Ṛgveda</td><td>c. 1500 to 1000 BCE</td></tr><tr><td>Middle Vedic</td><td>Atharvaveda, Yajurveda, Brāhmaṇas</td><td>c. 1000 to 600 BCE</td></tr><tr><td>Late Vedic</td><td>Upaniṣads, Sūtras</td><td>c. 600 to 300 BCE</td></tr><tr><td>Pre-classical</td><td>Pāṇini's described language</td><td>c. 500 to 350 BCE</td></tr><tr><td>Epic</td><td>Mahābhārata, Rāmāyaṇa</td><td>c. 400 BCE to 400 CE</td></tr><tr><td>Classical</td><td>Kālidāsa, inscriptions, treatises</td><td>c. 200 CE onward</td></tr></table><p>The dates are conventional and overlap. The Ṛgveda was composed over several centuries and was fixed in recitation later, and the Epics grew over a long time. The important point is the direction of change: the language of the Veda is older and differs in sounds, accents, and verb forms from that of the classics, and Pāṇini's description sits between them.</p><p>The term "Classical Sanskrit" is sometimes used for the language of the grammar as well, since the later language follows his rules. In that sense the Classical language was fixed by Pāṇini, and its later development is mainly a matter of vocabulary and style.</p>`],
['Writing, Orality, and the Age of Sanskrit','Dating the Ṛgveda',`<p>The oldest Sanskrit text is the Ṛgveda, a collection of 1,028 hymns. The usual estimate for its composition is about 1500 to 1000 BCE, and the evidence is of several kinds.</p><p><b>External evidence.</b> A treaty text from the Hittite and Mitanni kingdoms in what is now Turkey and Syria, from about 1380 BCE, names Indo-Aryan gods, including Mitra, Varuṇa, Indra, and the Nāsatyas, and Mitanni documents contain Indo-Aryan words for horses and numbers. This shows that speakers of a language close to Vedic Sanskrit were in West Asia by the fourteenth century BCE. The Ṛgveda must therefore be at least roughly of that age or earlier.</p><p><b>Internal evidence.</b> The hymns mention no iron, which appears in the later Vedic texts, and they show a society of cattle-herders and small chiefdoms. The language is older than that of the Atharvaveda and Brāhmaṇas, which are in turn older than the Upaniṣads.</p><p>These arguments give a range, not a date, and scholars differ at the edges, some preferring slightly earlier or later figures. The range is widely accepted by historical linguists, and it rests on evidence independent of the Indian tradition's own claims.</p>`],
['Writing, Orality, and the Age of Sanskrit','Tamil-Brāhmī: The Earliest Tamil Writing',`<p>The earliest Tamil writing is in a script called Tamil-Brāhmī, an adaptation of Brāhmī to the sounds of Tamil, with extra letters and conventions. It is found on cave beds and ledges in the Madurai region, on pottery, on coins and seals, and on rings. The language of the inscriptions is an early form of Tamil, with some Prakrit loanwords.</p><p>The inscriptions at the cave sites, such as Māngulam near Madurai, are generally dated by palaeography to the second or first century BCE. The oldest dated by scientific methods are the inscribed potsherds from excavations at several sites, which are the subject of the next pages.</p><p>The older name given to the script, <i>Damili</i> or <i>Dhamiḷi</i>, appears in some Prakrit inscriptions, including the Hāthīguṃphā inscription of Khāravela of Kaliṅga (first century BCE), which refers to a confederacy of Tamil states, <i>Tamira</i> or <i>Dramira</i>. The name was used by northern writers for the Tamil people and language.</p><p>The Tamil evidence therefore stands in a different relation to writing from Sanskrit. For Tamil, writing in a recognised form is attested early, and the earliest literature, the Sangam poems, was probably first written down in the early centuries CE, though composed earlier.</p>`],
['Writing, Orality, and the Age of Sanskrit','The Keeladi Excavations',`<p>Keeladi (Keezhadi), a village in Śivagaṅgā district near Madurai, has been excavated since 2014, first by the Archaeological Survey of India and later by the Tamil Nadu State Department of Archaeology. The site shows an urban settlement, with brick structures, drains, pottery, beads, and many pieces of pottery marked with letters or symbols.</p><p>A number of pieces with Tamil-Brāhmī letters have been found, along with large numbers of graffiti, or marks scratched on pots. The State Department of Archaeology reported radiocarbon dates from samples of charcoal found in the same layers as inscribed pottery, giving calendar dates around the sixth century BCE (a figure of about 580 BCE is often quoted) for the lowest levels. On this basis the department argues that Tamil-Brāhmī was in use in the sixth century BCE.</p><p>These findings are important and have been widely discussed. They show an advanced urban culture in the Vaigai river valley in the first millennium BCE. Some archaeologists have raised questions about how the dates relate to the inscribed pieces, the stratigraphy, and the interpretation of the graffiti, and have asked for the full data to be published and reviewed. The report of the first phases by the Archaeological Survey of India was submitted in 2023 and has itself been the subject of discussion, as the later page on reports explains.</p>`],
['Writing, Orality, and the Age of Sanskrit','Other Southern Sites',`<p>Keeladi is one of several sites that bear on early South Indian writing.</p><p><b>Porunthal</b>, in Dindigul district, produced pottery with Tamil-Brāhmī letters from a burial context, and a radiocarbon date on associated paddy husk was reported to the 5th century BCE (about 490 BCE). <b>Kodumanal</b>, in Erode district, a site known for iron and bead-making, has yielded many inscribed pots, and a date of around the fifth century BCE has been proposed for some. <b>Adichanallur</b>, in Thoothukudi district, is a large burial site with urns, iron objects, and bronzes, which the Archaeological Survey of India and others have dated to roughly the second and first millennia BCE. Inscribed or marked items there have been discussed, though their reading is debated.</p><p>The pattern from these sites is that literacy in a Tamil form of Brāhmī was present in the Tamil country by the fifth century BCE or soon after, according to the excavators. This is earlier than most older textbooks stated, and, if it holds up, it shifts the picture of early writing in South India.</p><p>As with any new evidence, the findings need to be published in full and checked, and the dates should be given with their margins of error. The next pages say how.</p>`],
['Writing, Orality, and the Age of Sanskrit','The Iron Age Claims',`<p>Iron working was a major technological change, and the date of its beginning in South India is a topic of recent announcement. In 2022 and again in January 2025, the Tamil Nadu State Department of Archaeology announced radiocarbon dates from several sites, including Mayiladumparai in Krishnagiri district and Sivagalai in Thoothukudi district. For Mayiladumparai the department reported a date for iron objects of about 2172 BCE, and for Sivagalai, a date of about 3345 BCE, from material found in a burial urn. The departments describe these as pushing the Iron Age in Tamil Nadu back to between about 2500 and 3300 BCE.</p><p>These are claims of great interest, and they have been presented as important to the history of metallurgy. They also differ widely from earlier accepted dates, which put the start of the Iron Age in South Asia at around 1800 to 1200 BCE, with the earliest dates in the Gangetic plains and in Karnataka. Archaeologists generally ask that such dates be published in peer-reviewed form, with details of how the samples were taken, which materials were dated, and how the context links the dated material to the iron object.</p><p>The responsible statement is that the announced dates are intriguing and under discussion. Until they are published and checked by others, they should be called <b>suggestive</b> and not established.</p>`],
['Writing, Orality, and the Age of Sanskrit','The Tolkāppiyam: Date and Layers',`<p>The <i>Tolkāppiyam</i> is the oldest surviving Tamil grammar, composed in sūtra-like verses (<i>nūṟpā</i>) and attributed to a sage named Tolkāppiyar. It is divided into three books on letters, words, and subject-matter, as a later chapter describes.</p><p>Its date is debated. Traditional accounts make it very old, from the time of a legendary academy. Modern scholars have proposed dates from the fifth century BCE to the fifth century CE. The Czech scholar Kamil Zvelebil, whose studies of Tamil literature are widely used, argued for the early centuries CE for its main body. A common summary is that the work took shape over several centuries, with its oldest layers possibly from about the third century BCE and later additions by about the third century CE, though some place the whole work later.</p><p>The evidence for dating includes the language, which is older than that of the later poems, the content, which presupposes a literature of the Sangam type, and references to Sanskrit grammatical ideas, which suggest contact with them. None of these is decisive, and the date is a range.</p><p>The summary "c. 300 BCE to 300 CE", given in many sources, is therefore reasonable if understood as a broad range for the formation of the text, and not a precise date.</p>`],
['Writing, Orality, and the Age of Sanskrit','Sangam Literature',`<p>Sangam literature is the earliest body of Tamil poetry, composed in the first few centuries of the Common Era, with some poems possibly older. It consists of eight anthologies, the <i>Eṭṭuttokai</i>, and ten long poems, the <i>Pattuppāṭṭu</i>, together with some later works. About 470 poets are known, among them many women, and the poems number over two thousand.</p><p>The poems are secular. They are divided into two main kinds, <i>akam</i>, "inner", poems of love, and <i>puṟam</i>, "outer", poems of war, kingship, charity, and death. They use a rich system of conventional settings, in which each landscape, such as hills, forests, farmland, seashore, and desert, stands for a kind of love, and each has its flowers, birds, and times of day.</p><p>The poems are famous for their directness and observation. They describe kings, chieftains, bards, merchants, and fishermen, and mention trade with the Roman world. They give valuable evidence of Tamil society and language of the period, and are the context in which the grammar, the <i>Tolkāppiyam</i>, is placed.</p><p>The date of the collections is based on the language, the mention of datable kings and foreign trade, and a comparison with inscriptions. Scholars typically give the range from the first to the third century CE for the main body, with possible older material.</p>`],
['Writing, Orality, and the Age of Sanskrit','Counting Inscriptions: A Page of Caution',`<p>A statistic often quoted is that more than half of the inscriptions found in India are in Tamil. Numbers of this kind need careful reading.</p><p>The first question is what is being counted. A figure of about 100,000 inscriptions for India has been given, and about 60,000 inscriptions are commonly said to have been recorded in Tamil Nadu. Not all of those are in Tamil, since some are in Sanskrit, Telugu, Kannada, and other languages, and many of the inscriptions in other parts of India have not yet been fully recorded or published. A count of those found in a region is not the same as a count by language.</p><p>The second question is how the count was made. The southern temples, with their long stone walls, carried thousands of inscriptions, and the climate and the habit of record-keeping in temples preserved them. In other regions, inscriptions were more often on copper plates, which may be in private hands, or on perishable materials. A count is affected by what survives and what has been surveyed.</p><p>The third question is what the count shows. A large number of Tamil inscriptions shows a strong tradition of recording gifts and decrees in stone, particularly in the medieval period, and is a fact of real importance to historians. It does not by itself show which language is older. For that the dates of the earliest inscriptions, and not the total, are what matter.</p>`],
['Writing, Orality, and the Age of Sanskrit','The Written Record Across Languages',`<p>A short table of the earliest securely dated writing in several Indian languages shows how varied the picture is.</p><table class="ex sm"><tr><td>Language</td><td>Earliest written record</td><td>Approximate date</td></tr><tr><td>Prakrit</td><td>Edicts of Aśoka</td><td>c. 260 BCE</td></tr><tr><td>Tamil</td><td>Tamil-Brāhmī inscriptions and pottery</td><td>c. 5th to 2nd century BCE (dating debated)</td></tr><tr><td>Sanskrit</td><td>Ayodhyā and Ghosuṇḍī inscriptions</td><td>c. 1st century BCE</td></tr><tr><td>Sanskrit (long literary)</td><td>Junagadh, Rudradāman</td><td>c. 150 CE</td></tr><tr><td>Kannada</td><td>Halmidi inscription</td><td>c. 450 CE</td></tr><tr><td>Telugu</td><td>Kalamalla inscription</td><td>c. 575 CE</td></tr><tr><td>Malayalam</td><td>Early inscriptions in Old Malayalam</td><td>c. 9th century CE</td></tr></table><p>The table shows the dates of the earliest writing, which says little about the age of the languages themselves. All of these languages were spoken long before they were written. For the Dravidian languages, the evidence that Tamil, Telugu, and Kannada had separated from a common ancestor by the early centuries CE comes from comparative linguistics and not from inscriptions.</p><p>The varied dates also remind us that writing was adopted for different purposes at different times. It would be a mistake to treat the date of the first inscription as the birth of a language.</p>`],
['Writing, Orality, and the Age of Sanskrit','Telugu in the Written Record',`<p>For readers in the Telugu country, the evidence of Telugu itself is of particular interest. The earliest records of the area are in Prakrit and Sanskrit. The Buddhist sites at Amaravati and Nagarjunakonda, of the Sātavāhana and Ikṣvāku periods, from about the second century BCE to the third century CE, have many inscriptions in Prakrit, mostly short records of gifts.</p><p>Telugu words appear in these records as personal names and place names, and in some inscriptions of the early centuries CE a few Telugu words are found embedded in Sanskrit or Prakrit text. The first inscription that is wholly in Telugu is generally taken to be the Kalamalla inscription of the Renāṇḍu Cōḻa king Dhanañjaya, dated to about 575 CE, in Cuddapah district. Other early records, such as the Erragudipadu inscription, are also discussed.</p><p>The first long Telugu literary work, Nannaya's rendering of the Mahābhārata, belongs to the eleventh century. By that time Telugu had a long spoken and, probably, oral literary history, as folk songs and songs of the bards show. The language was recognised as classical by the Government of India in 2008, on the basis of the antiquity of its records and its independent literary tradition.</p><p>As with Sanskrit and Tamil, the date of first writing sets a lower limit on the age of the language and does not fix its beginning.</p>`],
['Writing, Orality, and the Age of Sanskrit','Comparing Without Competing',`<p>It is tempting to treat the question of age as a contest, in which one language or one region must be the oldest. The evidence does not support this. Sanskrit, Tamil, and the other languages of India belong to different families, Indo-Aryan and Dravidian, with separate histories, and each has its own early record and its own methods of preserving texts.</p><p>The evidence for Sanskrit is mainly internal and comparative: a very old body of oral texts, a grammar that presupposes earlier work, and inscriptions beginning in the first century BCE. The evidence for Tamil includes early inscriptions and, according to recent excavations, pottery with letters from the fifth or sixth century BCE, together with a body of early poetry and a grammar. Both traditions have long, independent histories of writing, learning, and poetry.</p><p>Comparisons are most useful when they ask what each tradition did well. Sanskrit developed an exact system of oral transmission and a formal grammar of great precision. Tamil kept an early secular poetry of great directness and a grammar that treats the subject-matter of poetry as well as language. India's cultural history is richer for having both.</p><p>A fair account gives each tradition its own evidence, uses the same standards for both, and avoids language that makes one a rival to the other.</p>`],
['Writing, Orality, and the Age of Sanskrit','Common Errors in Chronology Claims',`<p>A few errors appear again and again in popular discussions of ancient languages.</p><p><b>Confusing the first inscription with the first language.</b> The earliest writing sets a lower limit, not an origin.</p><p><b>Using round numbers as if they were dates.</b> "Five thousand years old" is a rhetorical figure. A radiocarbon date has a margin, often a century or more, and a statement of date should include it.</p><p><b>Treating tradition as evidence of date.</b> Traditional accounts of authors and academies are valuable, but dates from tradition are often much older than those that other evidence supports.</p><p><b>Quoting a government announcement as a publication.</b> A press release is not a peer-reviewed article, and the data behind a claim should be checked.</p><p><b>Mixing material and text.</b> A date for a pot or a charcoal sample does not date a text or a language unless the link is shown.</p><p><b>Citing only the evidence that favours one side.</b> A claim should be tested against the best evidence that goes the other way.</p><p><b>Ignoring the margin of error and the calibration.</b> Radiocarbon years are not calendar years, and the conversion changes the date.</p><p>A reader who watches for these errors will find many popular claims easier to judge.</p>`],
['Writing, Orality, and the Age of Sanskrit','A Timeline: 3000 BCE to 600 CE',`<table class="ex sm"><tr><td>Date</td><td>Event</td><td>Standing</td></tr><tr><td>c. 2600 to 1900 BCE</td><td>Indus cities; undeciphered script</td><td>established</td></tr><tr><td>c. 1500 to 1000 BCE</td><td>Ṛgveda composed (oral)</td><td>widely accepted range</td></tr><tr><td>c. 1380 BCE</td><td>Indo-Aryan names in Mitanni treaties</td><td>established</td></tr><tr><td>c. 6th to 5th c. BCE</td><td>Tamil-Brāhmī pottery at Keeladi, Porunthal, Kodumanal</td><td>suggestive; under study</td></tr><tr><td>c. 500 to 350 BCE</td><td>Pāṇini's grammar (oral, possibly with writing)</td><td>accepted range</td></tr><tr><td>c. 260 BCE</td><td>Aśoka's edicts in Prakrit, Greek, Aramaic</td><td>established</td></tr><tr><td>c. 1st c. BCE</td><td>Early Sanskrit inscriptions: Ayodhyā, Ghosuṇḍī</td><td>established</td></tr><tr><td>c. 2nd c. BCE to 3rd c. CE</td><td>Sangam poetry; Tolkāppiyam forms</td><td>broad range, debated</td></tr><tr><td>c. 150 CE</td><td>Junagadh inscription of Rudradāman</td><td>established</td></tr><tr><td>c. 320 to 550 CE</td><td>Gupta age; Sanskrit inscriptions spread</td><td>established</td></tr><tr><td>c. 450 CE</td><td>Halmidi inscription, Kannada</td><td>established</td></tr><tr><td>c. 575 CE</td><td>Kalamalla inscription, Telugu</td><td>established</td></tr></table>`],
['Writing, Orality, and the Age of Sanskrit','Summary of the Chapter',`<p>This chapter has set out the evidence for the age of Sanskrit and Tamil and the place of writing in each. It began with the kinds of evidence, then the Indus script, Brāhmī and Kharoṣṭhī, the edicts of Aśoka, the earliest Sanskrit inscriptions, the Junagadh inscription, and the Gupta age. It argued that a late inscription does not mean a late language, described oral composition in India, and discussed whether Pāṇini knew writing, his date and place, and the evidence of his grammar. It then turned to the Tamil record, Keeladi and other sites, the Iron Age claims, the <i>Tolkāppiyam</i>, and Sangam poetry.</p><p>The conclusions are these. Sanskrit was spoken and studied for many centuries before it was written, and the earliest written Sanskrit is somewhat older than the commonly quoted date of 150 CE. Pāṇini wrote about 500 to 350 BCE, in the north-west. Tamil-Brāhmī writing is attested early, and recent excavations suggest an earlier start than once believed, though the dates are still being checked. The announced Iron Age dates are suggestive and not yet established. And counts of inscriptions must be read with care.</p><p>Both traditions have long and independent histories. The next chapter turns to how a text as complex as the Veda, or a grammar of thousands of rules, could be kept in memory without distortion.</p>`]
);

['Fidelity of Oral Transmission','The Problem: Keeping a Text Without Writing',`<p>A text of thousands of verses, kept only in human memory, must pass from teacher to pupil, generation after generation, over many centuries. Every step is a chance for error: a syllable misheard, a long vowel shortened, a pitch accent lost, a line skipped. A thousand copies in a thousand minds would drift apart, as stories do in the retelling.</p><p>The question for this chapter is whether the Indian tradition prevented this drift, and how. The answer, from the evidence, is that it largely did, by means of a training of great rigour and a set of recitation methods designed to catch mistakes. The claims made for it are sometimes exaggerated, and so the chapter keeps to what can be shown and marks what cannot.</p><p>The focus is the Vedic tradition, for which the evidence is richest, and the Pāṇinian grammar, which was handed on by similar methods. The methods are of interest to historians, linguists, and also to computer scientists, since they are an early example of <b>redundancy used for error detection</b>, a principle that modern data systems use constantly.</p>`],
['Fidelity of Oral Transmission','Memory as a Technology',`<p>The traditional Vedic student, the <i>brahmacārin</i>, lived with a teacher from about the age of eight, and the course of study, in the strict schools, lasted eight to twelve years, and more for a student who learned several Vedas. The student learned by repeating each line after the teacher, many times, with exact attention to sound, pitch, and rhythm. Understanding of the meaning was a separate and later study, and the first duty was to preserve the text as it was.</p><p>Several features supported memory. The texts are in verse and in measured prose, with rhythm and sound patterns that aid recall. Recitation was daily, and a trained reciter would go over the whole text again and again. Teaching was in small groups, so that pupils heard each other, and an error by one was heard by the others. And a reciter's standing depended on accuracy, so that there was a strong social reason not to make mistakes.</p><p>This system is better described as a technology than as a habit. It had trained specialists, standard methods, tests, and an institution, the school or <i>śākhā</i>, that kept a particular version. It was designed, as engineers say, to be robust.</p>`],
['Fidelity of Oral Transmission','Śruti and Smṛti',`<p>Indian tradition draws a line between two kinds of text. <i>Śruti</i>, "what is heard", is the Veda, regarded as revealed and to be kept unchanged in the form in which it was heard. <i>Smṛti</i>, "what is remembered", is everything else: law books, epics, and many later works, which are the work of human memory and may be revised.</p><p>This distinction explains the different care given to the two groups. The Veda was to be kept exactly. Its words, accents, and order were fixed, and a change was an offence. The later texts were passed on with less rigid control, and so they exist in several versions, with additions and variations. The Mahābhārata, for instance, has northern and southern recensions that differ in many verses, and the Critical Edition prepared at Pune had to choose among them.</p><p>The difference is useful for judging claims about fidelity. The strongest case for faithful transmission is made for the Vedic texts, which were guarded by the special methods in this chapter. It does not follow that every ancient text was kept with equal accuracy, and statements about "the Indian oral tradition" in general should be made with care.</p>`],
['Fidelity of Oral Transmission','The Eight Vikṛtis',`<p>The most remarkable device for keeping the Veda is a set of recitation orders called <i>vikṛtis</i>, "modifications", or <i>pāṭhas</i>, "recitations". The ordinary continuous text is called the <i>saṃhitā-pāṭha</i>. From it two primary forms are derived, and then eight modifications.</p><table class="ex sm"><tr><td>Form</td><td>Kind</td><td>Idea</td></tr><tr><td>Saṃhitā-pāṭha</td><td>continuous</td><td>words joined by sandhi, as in normal text</td></tr><tr><td>Pada-pāṭha</td><td>word by word</td><td>each word separate, sandhi undone</td></tr><tr><td>Krama-pāṭha</td><td>step by step</td><td>words taken in overlapping pairs</td></tr><tr><td>Jaṭā-pāṭha</td><td>braid</td><td>pairs recited forward, back, forward</td></tr><tr><td>Mālā, śikhā, rekhā, dhvaja, daṇḍa, ratha</td><td>garland, tuft, line, flag, staff, chariot</td><td>other woven patterns</td></tr><tr><td>Ghana-pāṭha</td><td>dense mass</td><td>triples woven back and forth</td></tr></table><p>The eight modifications are <i>jaṭā, mālā, śikhā, rekhā, dhvaja, daṇḍa, ratha,</i> and <i>ghana</i>. Of these, the jaṭā and ghana are the best known and the commonest in practice. The names suggest braided hair, a garland, a flag, and a dense cluster. The next pages describe the main ones in turn.</p>`],
['Fidelity of Oral Transmission','The Continuous Recitation: Saṃhitā-pāṭha',`<p>The <i>saṃhitā-pāṭha</i> is the text in its normal, continuous form, in which words are joined by sandhi. It is the form in which the Veda is chanted in ritual and in which it was composed. The word <i>saṃhitā</i> means "put together", the same word that Pāṇini uses for sounds in close contact.</p><p>Because words are joined, the saṃhitā-pāṭha does not show where one word ends and the next begins. In the first line of the Ṛgveda, <i>agnim īḷe purohitaṃ yajñasya devam ṛtvijam</i>, the words are separate here only because the space is conventional in print. A reciter in continuous chant joins them in sound, and a listener must know where the divisions are.</p><p>This form alone offers little protection against error. A wrong syllable would go unnoticed if the listener did not know the text. The other recitations exist to supply that protection. They are learned as separate exercises, but they are derived from the same words, and so each acts as a check on the others.</p><p>The student therefore learns the saṃhitā first, and then the others, so that the same material is stored in several different arrangements. This is the central idea of the system: the same content is held in many forms, so that damage to one shows up in another.</p>`],
['Fidelity of Oral Transmission','Word by Word: Pada-pāṭha',`<p>The <i>pada-pāṭha</i> presents the text one word at a time, with sandhi undone. Compound words are broken into their parts, and the break is marked. It is the earliest of the derived forms, and it is attributed in the Ṛgveda to the sage Śākalya.</p><p>The pada-pāṭha has two uses. First, it fixes the division of words, which sandhi hides. When the saṃhitā text of a verse can be read in more than one way, the pada-pāṭha records which division the tradition accepted. Second, it is a check on the continuous text. If the saṃhitā recited in a school gives a form that cannot be got from the pada text by the rules of sandhi, an error is detected.</p><p>The pada-pāṭha is also an early work of interpretation, and it has been studied by modern scholars for that reason. Sometimes it divides words in a way that later scholars question, and these places show how the tradition understood the hymns. In this respect it is an early commentary as well as a check.</p><p>The pada-pāṭha is used as the basis for the later recitation orders, which take its words, and arrange them in the patterns the next pages show. The idea of preserving a text in two forms, joined and separate, anticipates the way modern systems keep both raw and parsed versions of data.</p>`],
['Fidelity of Oral Transmission','Overlapping Pairs: Krama-pāṭha',`<p>In the <i>krama-pāṭha</i>, "step-by-step recitation", the words are taken two at a time, each word being paired with the next, and the pairs overlap. If the words of a phrase are numbered 1, 2, 3, 4, the krama is 1-2, 2-3, 3-4. Each word appears twice, once with the word before it and once with the word after.</p><p>The pattern, generated by a few lines of code, is as follows.</p><pre class="code">def krama(w):
    return [(w[i], w[i + 1]) for i in range(len(w) - 1)]</pre><pre class="code out">krama
   1-2
   2-3
   3-4</pre><p>The overlap is what gives the form its strength. Every junction between two words is recited, so that each word is heard in its relation to both neighbours. A wrong word in position 2 will spoil the pairs 1-2 and 2-3. A reciter who knows the text has a chance to notice twice.</p><p>For a verse of <i>n</i> words, the krama has <i>n − 1</i> pairs and recites <i>2(n − 1)</i> words, nearly twice the length of the original. This is the cost of the check: the text is recited about twice over in this form alone, and the cost grows in the later forms.</p>`],
['Fidelity of Oral Transmission','The Braid: Jaṭā-pāṭha',`<p>The <i>jaṭā-pāṭha</i>, "braided recitation", takes each overlapping pair and recites it forward, backward, and forward again. Writing the pair as <i>a b</i>, the pattern is <i>a b, b a, a b</i>. For words numbered 1, 2, 3, 4, the jaṭā is as follows.</p><pre class="code">def jata(w):
    return [(a, b, b, a, a, b) for a, b in krama(w)]</pre><pre class="code out">jaṭā
   1-2-2-1-1-2
   2-3-3-2-2-3
   3-4-4-3-3-4</pre><p>In each line the pair is turned around and then restored, the way a braid of hair is made by crossing strands. The reversal is the important part. In ordinary speech, a pair of words is heard in one order, and an error such as swapping two words or dropping one may not be noticed. When the pair is spoken backward as well, the forward and backward versions must agree with each other and with the pada-pāṭha, so that a changed word or order is likely to show.</p><p>The jaṭā uses six words for each pair, three times the length of the pair itself. For a verse of <i>n</i> words, it recites <i>6(n − 1)</i> words, about six times the original. Students learn it by heart, with the same accents and exact sounds, and the effort is considerable. It is one of the main reasons why the training of a Vedic reciter took many years.</p>`],
['Fidelity of Oral Transmission','The Dense Mass: Ghana-pāṭha',`<p>The <i>ghana-pāṭha</i>, "dense recitation", is the most complex of the usual forms. It works on triples of words, weaving them back and forth. For words 1, 2, 3, the pattern is 1-2-2-1-1-2-3-3-2-1-1-2-3. Then the pattern moves on by one word, to 2-3-4, and so on.</p><pre class="code">def ghana(w):
    out = []
    for i in range(len(w) - 2):
        a, b, c = w[i], w[i + 1], w[i + 2]
        out.append((a, b, b, a, a, b, c, c, b, a, a, b, c))
    return out</pre><pre class="code out">ghana
   1-2-2-1-1-2-3-3-2-1-1-2-3
