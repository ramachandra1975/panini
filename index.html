['Two Grammatical Traditions and Weighing Claims','The Sūtra Style in Tamil',`<p>The Tamil verse form, <i>nūṟpā</i>, plays the part of the sūtra. It is a short verse in a flexible metre, often a couple of lines, giving a rule or a definition. It is more flowing than Pāṇini's, which relies on case-ending conventions and abbreviations. The Tolkāppiyam's statements are generally in plain Tamil of the early period, with fewer devices of compression.</p><p>An example shows the style, in paraphrase: "The letters that are called vowels are twelve in number", followed by the list. A definition is given, a number stated, and the items are listed. This is the typical rhythm of a teaching verse that has to be memorised.</p><p>The devices that Pāṇini used for brevity, the markers, the pratyāhāras, and the carried-forward words, are not used in the same way. The Tamil work attains its economy in a different manner, by using a standard order of topics and by relying on the reader's knowledge of the idiom.</p><p>The result is a text that is easier for a modern reader to approach than the Sanskrit grammar but that still needs a commentary. Both traditions chose a memorisable verse form for a technical subject, which is notable in itself: in two languages and two regions, scholars found that the best way to keep an exact description of a language was in short, ordered, learnable statements.</p>`],
['Two Grammatical Traditions and Weighing Claims','Likenesses Between Pāṇini and Tolkāppiyam',`<p>Several likenesses are striking.</p><p><b>Form.</b> Both are works of brief rules, composed to be learned by heart, and explained in a commentary.</p><p><b>Scope.</b> Both describe the sounds and the forms of their languages: letters or sounds, their combination, nouns with cases, verbs with person and number.</p><p><b>Terminology.</b> The two have similar categories, such as the classification of sounds by place and length, and the cases in a fixed order, which agree in many points.</p><p><b>Attention to usage.</b> Both describe the speech of the learned or of the poets of their time, and mark variation and exception.</p><p><b>Ordered arrangement.</b> Both arrange topics in a deliberate sequence, from sounds to words.</p><p>These likenesses are what one would expect of two scholarly traditions that deal with the same kind of subject. Any serious description of a language has to classify sounds, give forms, and state rules. The question is how much of the likeness is due to the nature of the subject, how much to a shared inheritance of Indian scholarship, and how much to direct contact. The following pages consider the differences and then the question of influence.</p>`],
['Two Grammatical Traditions and Weighing Claims','Differences Between the Two',`<table class="ex sm"><tr><td>Feature</td><td>Pāṇini</td><td>Tolkāppiyam</td></tr><tr><td>Language</td><td>Sanskrit (inflecting)</td><td>Tamil (agglutinating)</td></tr><tr><td>Size</td><td>about 3,960 sūtras</td><td>about 1,600 nūṟpā</td></tr><tr><td>Structure</td><td>8 chapters, derivational layers</td><td>3 books of 9 chapters</td></tr><tr><td>Method</td><td>generative, ordered rules</td><td>descriptive, classified</td></tr><tr><td>Compression</td><td>extreme: markers, pratyāhāras</td><td>moderate</td></tr><tr><td>Metalanguage</td><td>special technical language</td><td>ordinary Tamil of the period</td></tr><tr><td>Poetics</td><td>outside the grammar</td><td>part of the grammar</td></tr><tr><td>Rule order and conflict</td><td>explicit principles</td><td>no comparable system</td></tr></table><p>The main difference is of method. Pāṇini wrote a derivational system with explicit rule ordering and a metalanguage, and that is what makes it attractive to computer scientists. The Tolkāppiyam is a systematic description and classification with rules, but it does not have the same generative machinery.</p><p>The other main difference is the inclusion of poetics in the Tamil work, which gives it a character of its own.</p><p>It would be a mistake to say that one is better. They are different kinds of achievement, each suited to its language and purpose.</p>`],
['Two Grammatical Traditions and Weighing Claims','Did One Influence the Other?',`<p>Scholars have long asked whether the Tamil grammarians knew the Sanskrit tradition, and whether the influence ran in either direction.</p><p>The evidence for Tamil knowledge of Sanskrit grammar includes the preface by Panamparanar, which says that Tolkāppiyar knew the Aindra grammar, and similarities of categories and terminology, such as the treatment of cases. Some Sanskrit loanwords appear in the text, and the later commentators freely used Sanskrit terms.</p><p>Against a strong claim of dependence, scholars note that the Tamil grammar is original in its main plan, especially the third book, and that the Tamil language has structures, such as the verb forms and the system of particles, that have no Sanskrit model. They also note that the Aindra school, to which the preface refers, is known only by report, so that the nature of the contact is hard to judge.</p><p>The question of influence in the other direction, from Tamil to Sanskrit, has been raised in connection with some words and some features of Sanskrit, and is also discussed. The evidence for it is slight in the area of grammar.</p><p>A fair conclusion is that the Tamil scholars knew something of the Sanskrit tradition of the study of language, and that they produced an independent work. The exact extent of the connection is not settled, and strong statements in either direction go beyond the evidence.</p>`],
['Two Grammatical Traditions and Weighing Claims','Tamil and Sanskrit in Contact',`<p>The grammars belong to a long history of contact between Tamil and Sanskrit speakers. The Tamil poems of the early centuries CE mention Sanskrit-speaking Brahmins and Vedic rites, and Tamil texts use some Sanskrit words. Sanskrit literature was composed in the Tamil country, from at least the time of the Pallavas, and many great Sanskrit scholars were Tamil.</p><p>The contact went both ways. A number of words in Sanskrit are thought to come from Dravidian languages, including some of the earliest, such as words in the Ṛgveda that scholars derive from a Dravidian source. The evidence for this is based on sound correspondences, and some of it is debated. The scholars Burrow and Emeneau, in their <i>Dravidian Etymological Dictionary</i> (1961), gave many examples, which are among the best evidence for the interaction.</p><p>The interaction is also visible in grammar. The Dravidian languages are marked by features, such as retroflex consonants, which also appear in Indo-Aryan and which some scholars believe spread through contact. This is one of the main areas of study in what is called the "Indian linguistic area".</p><p>The picture is one of a shared culture of learning, in which Tamil and Sanskrit each used the other's resources and kept its own character. It fits ill with a story of one tradition being the source of the other.</p>`],
['Two Grammatical Traditions and Weighing Claims','Dravidian Linguistics',`<p>The scientific study of the Dravidian family began in the nineteenth century. Robert Caldwell, a missionary and scholar, published in 1856 his <i>Comparative Grammar of the Dravidian or South-Indian Family of Languages</i>, in which he showed that Tamil, Telugu, Kannada, Malayalam, and others form a family distinct from Indo-Aryan. The family is estimated to have about eighty languages, with the four major literary languages of the south the best known.</p><p>Earlier, Francis Whyte Ellis, a British official in Madras, and the Telugu scholars who worked with him, such as those in the circle of Charles Philip Brown, had come to a similar view in the early 1800s, and the work of Indian scholars in this period is now better recognised.</p><p>Later work by Thomas Burrow and Murray Emeneau, in the <i>Dravidian Etymological Dictionary</i> (1961, with a revised edition in 1984), gave comparative word lists, and by Bh. Krishnamurti, a linguist from the Telugu country, whose <i>The Dravidian Languages</i> (2003) is the standard overview, set out the reconstruction of Proto-Dravidian and the grouping of the languages.</p><p>The family is divided into South, South-Central, Central, and North branches. Tamil, Malayalam, and Kannada belong to the South, and Telugu to the South-Central group.</p>`],
['Two Grammatical Traditions and Weighing Claims','Telugu in the Dravidian Family',`<p>Telugu, spoken by tens of millions, is the largest Dravidian language by number of speakers. It belongs to the South-Central group, together with Gondi and some smaller tribal languages, and is not a descendant of Tamil but a sister, with a common ancestor in Proto-Dravidian.</p><p>It has features that distinguish it from Tamil. Its words end in vowels, a feature that is said to give it a musical quality. It has a rich set of loans from Sanskrit and, in later centuries, from Persian, Arabic, and English, reflecting the history of the Deccan.</p><p>Its writing is the Telugu-Kannada script, which developed from Brāhmī through the scripts of the Deccan, and which separated into its present forms by about the thirteenth century. The first inscription entirely in Telugu is the Kalamalla inscription of about 575 CE, and the literary tradition begins with Nannaya in the eleventh century, though earlier oral literature must have existed.</p><p>Telugu was recognised as a classical language by the Government of India in 2008. The criteria included the antiquity of its records, over a thousand years, its independent literary tradition, and a body of ancient literature.</p><p>The recognition made Telugu the third Indian language, after Tamil and Sanskrit, to be so named, followed by Kannada in the same year.</p>`],
['Two Grammatical Traditions and Weighing Claims','Telugu Grammatical Tradition',`<p>The grammar of Telugu has its own line. The earliest work is attributed to Nannaya, the <i>Āndhra Śabda Cintāmaṇi</i>, in Sanskrit verses. It names Telugu sounds, cases, and compounds in Sanskrit terms. Later works include Kētana's <i>Āndhra Bhāṣā Bhūṣaṇamu</i> in the thirteenth century, Appakavi's <i>Appakavīyamu</i> of the seventeenth, and Chinnayasūri's <i>Bālavyākaraṇamu</i> of 1855, the standard school grammar.</p><p>These grammars are built on the Sanskrit model. They use the terms <i>sandhi, samāsa,</i> and <i>vibhakti</i> and divide topics in the Sanskrit way, but they describe Telugu sounds and forms. Some Telugu sandhi, such as the dropping of a final <i>u</i> before a vowel, has no Sanskrit counterpart and is described in its own terms.</p><p>The Telugu tradition shows a pattern common in India: a regional language whose grammarians took over a successful framework from Sanskrit and adjusted it. It contrasts with the Tamil tradition, in which the first grammar, the Tolkāppiyam, took a more independent course.</p><p>For students in the Telugu states, these facts make the study of Pāṇini directly useful. The terms and methods of the school grammars of Telugu are Pāṇinian in origin, and a reader who has followed this book will recognise much of the structure.</p>`],
['Two Grammatical Traditions and Weighing Claims','Prakrit Grammars and Inscriptions',`<p>Between Sanskrit and the modern languages stand the Prakrits, and these too had grammars. The oldest surviving Prakrit grammar is the <i>Prākṛtaprakāśa</i> attributed to Vararuci, of uncertain date, and another early one is Caṇḍa's <i>Prākṛtalakṣaṇa</i>. The great Jain scholar Hemacandra, in the twelfth century, wrote a full Prakrit grammar as part of his <i>Siddhahema</i>, which described Sanskrit, Prakrit, and Apabhraṃśa together.</p><p>These grammars are important for the relation of the languages. They describe the Prakrits by reference to Sanskrit, giving rules of change from Sanskrit forms to Prakrit ones, such as the simplification of consonant clusters. This approach, which treats Sanskrit as the base, reflects the status of the language of the learned, and it has been criticised by modern linguists, who see the Prakrits as developments of an older Indo-Aryan stage and not as changes from classical Sanskrit.</p><p>The inscriptions of the early centuries, such as those of Aśoka and of the Sātavāhanas, are in Prakrit, and they give the evidence of how the language was actually used. The Prakrit grammars, composed much later, describe the literary Prakrits of poetry and drama.</p><p>The Prakrit tradition is a reminder that the linguistic scene of ancient India included more languages than Sanskrit and Tamil, each with its own written record and, in time, its grammar.</p>`],
['Two Grammatical Traditions and Weighing Claims','Writing in the Grammars',`<p>Both grammars say something about writing, though in different ways. The <i>Tolkāppiyam</i> describes the Tamil letters, their shapes in a general way, and their sounds. It speaks of the letters as written forms, and the early inscriptions in Tamil-Brāhmī show a script adapted to Tamil, with signs added for the sounds of the language that Brāhmī lacked. The Tolkāppiyam also describes a feature of the old Tamil script, the dot placed over the consonant to show that it has no vowel, which is seen in the inscriptions.</p><p>Pāṇini, as an earlier chapter explained, mentions <i>lipi</i>, "writing", and a type of writing associated with the Yavanas. The grammar's treatment of the sounds of Sanskrit, however, is entirely in terms of speech: the places of articulation, the efforts, and the pitch.</p><p>Both grammars thus show awareness of writing, and both are concerned mainly with the spoken language. The suggestion that either grammar was written down at the time of its composition is a matter of debate, and the earliest evidence for each is in manuscripts and commentaries of much later date.</p><p>What the two traditions share is the view that language, spoken or written, can be analysed into its elements and described by rules, and that such a description is valuable enough to be kept for centuries.</p>`],
['Two Grammatical Traditions and Weighing Claims','How to Weigh a Claim',`<p>The notes used for this part of the book contain a mixture of well-established facts, accepted ranges, and claims that are still under discussion. Learning to tell them apart is a skill, and the rest of the chapter gives a method. It has five questions.</p><p><b>1. What is being claimed, exactly?</b> State the claim in a single sentence, with its numbers. "Tamil-Brāhmī was in use in the sixth century BCE" is a claim that can be tested. "Tamil is the oldest language" is not, because "oldest" is not defined.</p><p><b>2. What is the source?</b> Is it an excavation report, a peer-reviewed paper, a book by a specialist, a government announcement, or a post?</p><p><b>3. What is the evidence, and how direct is it?</b> A dated object is more direct than an inference from style, and an inference from language is more direct than a tradition.</p><p><b>4. What do independent experts say?</b> If specialists who have no stake in the matter agree, the claim is more secure.</p><p><b>5. What would change my mind?</b> A good claim can say what evidence would show it to be wrong.</p><p>The next pages apply these questions to the kinds of claim met in this part.</p>`],
['Two Grammatical Traditions and Weighing Claims','Primary, Secondary, and Popular Sources',`<p>Sources fall into types, and each has its uses.</p><p><b>Primary sources</b> are the things themselves: an inscription, a pot with letters, a manuscript, a radiocarbon laboratory report, the text of a grammar. They carry the greatest weight, but they must be read by those who know how.</p><p><b>Secondary sources</b> are studies by scholars that interpret the primary ones: an excavation report, an article in a journal of epigraphy, a book such as Cardona's on Pāṇini or Zvelebil's on Tamil literature. These carry the specialist's judgement, and they are reviewed by other specialists.</p><p><b>Tertiary sources</b> are summaries: encyclopaedias and textbooks. They are good for orientation.</p><p><b>Popular sources</b> include articles, videos, social media, and notes of the kind used for this part. They are valuable as pointers and as a record of what people believe, but they often repeat claims without checking and may round, simplify, or exaggerate.</p><p>The method is to follow a claim back from the popular statement to the secondary study, and from that to the primary evidence. Many errors disappear at the first step, when it turns out that there is no source, or that the source says something different. This book's treatment of the notes follows that method: each claim was checked against what the scholarly sources say, and several were corrected or qualified.</p>`],
['Two Grammatical Traditions and Weighing Claims','Radiocarbon Dating',`<p>Radiocarbon dating is the main scientific method for dating organic material, such as charcoal, seeds, bone, and shell, up to about fifty thousand years old. All living things take in carbon, including a small, known share of a radioactive form, carbon-14. When the organism dies, it stops taking in carbon, and the carbon-14 decays, with a half-life of about 5,730 years. The amount left measures the time since death.</p><p>Modern laboratories use accelerator mass spectrometry (AMS), which counts the atoms directly and needs only a very small sample, such as a few milligrams of charcoal or a single seed.</p><p>The raw result is reported in "radiocarbon years before present" (BP, with "present" fixed at 1950), with a margin of error. It is not yet a calendar date. The level of carbon-14 in the air has varied over time, so the result is <b>calibrated</b> against a curve built from tree rings, corals, and other records. The current standard curve is IntCal20, published in 2020.</p><p>The date applies to the sample. It dates the death of the plant or animal that the sample came from. To say that it dates an inscription, a pot, a building, or an iron object, one must show that the sample is closely connected with that object, for example that it lay in the same sealed layer, and was not older or younger material that had moved.</p>`],
['Two Grammatical Traditions and Weighing Claims','Reading a Radiocarbon Date',`<p>A reported date has three parts that a reader must look for: the central value, the margin of error, and the calibrated range.</p><p>Suppose a laboratory reports a sample as 2,500 ± 30 BP. This means that the measurement is 2,500 radiocarbon years before 1950, with a margin of 30 years at the usual one-sigma level. Calibration converts it into calendar years. For this particular value, the calibrated range is roughly from 800 to 540 BCE, a spread of more than two centuries, because the calibration curve is nearly flat in this period, a feature called the Hallstatt plateau. The example is illustrative and shows why a sample from this era cannot always be placed precisely.</p><p>Three lessons follow. First, a date has a range, and a statement such as "580 BCE" should be read as "somewhere near 580 BCE, within the stated range". Second, the range may be wide for particular periods because of the shape of the calibration curve, and in the middle of the first millennium BCE this is a real limitation. Third, the same sample can be calibrated with different curves or at different confidence levels, so that the report must say which was used.</p><p>When a news item says that a site is "2,600 years old", the reader should look for the original report, the sample, the laboratory, the range, and the link between the sample and the object of interest.</p>`],
['Two Grammatical Traditions and Weighing Claims','Reports, Announcements, and Peer Review',`<p>New discoveries in archaeology reach the public in several ways, with different levels of checking.</p><p><b>Press announcements</b> are statements by an organisation to the media. They are quick and may contain preliminary dates and interpretations. They are not reviewed by independent specialists.</p><p><b>Excavation reports</b> are detailed accounts by the excavators, with plans, finds, and dates. A government department may publish them as volumes. They give the primary information, though their interpretations are the excavators' own.</p><p><b>Peer-reviewed papers</b> in scientific or scholarly journals are checked by independent experts before publication. They are the usual standard for claims that change an accepted picture.</p><p>The discoveries at Keeladi, and the announcements of Iron Age dates, have gone through some of these stages. Excavation reports and radiocarbon dates have been released, and the first-phase report of the Archaeological Survey of India was submitted in 2023. Public discussion has asked about the publication of the full data, the interpretation of the stratigraphy, and the dating of the inscribed pieces. These are the usual questions asked of any important new finding, and they are a sign of a normal scholarly process, not of a dispute about the value of the work.</p><p>Until the key data are published and reviewed, the responsible description of such claims is "suggestive and under study".</p>`],
['Two Grammatical Traditions and Weighing Claims','Counting and Percentages',`<p>Statements of the form "X% of all inscriptions are in language Y" are easy to repeat and hard to check. Several questions help.</p><p><b>What is the total?</b> A figure of 100,000 inscriptions for India is an estimate, and it depends on which surveys are included. Many inscriptions have been copied but not published, and the numbers vary by source and by date.</p><p><b>What counts as one inscription?</b> A single temple wall may carry many records, and a set of copper plates may be counted as one or as several.</p><p><b>What is the unit of language?</b> Inscriptions in Tamil Nadu are in Tamil, Sanskrit, Telugu, Kannada, Grantha script, and others. A count of "inscriptions from Tamil Nadu" is not a count of "inscriptions in Tamil".</p><p><b>What is the bias in survival and survey?</b> Southern temples have stone walls with inscriptions that have lasted. Elsewhere inscriptions were on copper, wood, or palm leaf and are lost. Regions have also been surveyed to different degrees.</p><p><b>What does the number show?</b> It shows a pattern of recording, and not by itself the age of a language.</p><p>A careful writer states the source of the number, the definition, and the limits. For most such figures, it is safer to say "a large share" and to cite the survey.</p>`],
['Two Grammatical Traditions and Weighing Claims','A Checklist for Claims',`<p>The questions of the last pages can be put into a short checklist that a reader can carry.</p><table class="ex sm"><tr><td>Check</td><td>Ask</td></tr><tr><td>Statement</td><td>Is it clear, with numbers and a time range?</td></tr><tr><td>Source</td><td>Is it primary, secondary, or popular? Who is the author?</td></tr><tr><td>Evidence</td><td>Is it a dated object, a text, an inference, or a tradition?</td></tr><tr><td>Dating</td><td>What is the method? Is the margin given? Is the sample linked to the object?</td></tr><tr><td>Publication</td><td>Is the data published and reviewed?</td></tr><tr><td>Agreement</td><td>Do independent specialists agree?</td></tr><tr><td>Alternatives</td><td>Are other explanations considered?</td></tr><tr><td>Wording</td><td>"Proves" or "definitive": is the language stronger than the evidence?</td></tr><tr><td>Grade</td><td>Established, suggestive, or framework?</td></tr></table><p>Words such as <i>proof</i>, <i>definitive</i>, and <i>perfect</i> are warnings. Science and scholarship deal mostly in degrees of support, and a claim stated with certainty needs unusual evidence.</p><p>With this checklist the claims of the notes can be graded. The summary at the end of the chapter does so.</p>`],
['Two Grammatical Traditions and Weighing Claims','Rivalry and Pride',`<p>Discussions of the antiquity of Indian languages are often caught up in feelings of regional and linguistic pride. This is natural. Languages are bound up with identity, and the discovery of an ancient record can be a source of deep satisfaction to a community.</p><p>It is also a source of risk. When the aim becomes proving that a language is the oldest, or the best, the evidence is easily bent. Early dates are welcomed without question, and the findings of opponents are dismissed. Both sides may make exaggerated claims, and the public is left with a contest of slogans.</p><p>Scholars of all regions have warned against this. Their advice is to treat each language and tradition on its own evidence, and to be as strict with the evidence one likes as with the evidence one does not. A tradition that is truly old does not need an inflated date, and an inflated date, when it is corrected, can hurt the reputation of a good claim.</p><p>A reader in the Telugu states, who belongs to a third great tradition with its own long record, is well placed to take a balanced view. The Telugu language has an independent history of more than fourteen centuries of writing, and a classical status, and a student can appreciate the Sanskrit and Tamil traditions without feeling that any is diminished by the other.</p>`],
['Two Grammatical Traditions and Weighing Claims','What Each Tradition Teaches',`<p>Each tradition has strengths that the other does not, and they teach different lessons.</p><p><b>From the Sanskrit tradition:</b> the power of a rule-based description. Pāṇini shows how to build a complete, ordered, generative system, with a metalanguage, classes, markers, and principles for conflict. The Vedic transmission shows how to protect a text by redundancy. Āryabhaṭa shows how to state algorithms compactly and to encode numbers.</p><p><b>From the Tamil tradition:</b> the union of language and life. The Tolkāppiyam shows how a grammar can include the content and conventions of poetry. The Sangam poems show a literature of direct observation and of a refined system of landscape and feeling. Recent excavations show a society in which writing and urban life existed early.</p><p><b>From both:</b> the habit of keeping knowledge in short, ordered, learnable forms, and the practice of long commentary that explains and corrects. Both gave the world a body of careful thought about language.</p><p>A student can take from this a practical point. To understand the intellectual history of India one needs several languages and traditions, and the best accounts draw on all. Reading Pāṇini with the Tolkāppiyam, and the Veda with the Sangam poems, is a richer experience than reading either alone.</p>`],
['Two Grammatical Traditions and Weighing Claims','Open Questions',`<p>Several questions raised in this part remain open.</p><p><b>Chronology.</b> What is the full set of dates of the early Tamil-Brāhmī finds, once published and calibrated? How early was Brāhmī in use in the south, and how did it reach it?</p><p><b>Writing and Pāṇini.</b> What part did writing play in the composition of the <i>Aṣṭādhyāyī</i>? Is there more to learn from the structure of the text?</p><p><b>Iron.</b> When did iron working begin in South India, and how does it relate to the Gangetic and Karnataka sequences? The announced early dates need full publication and independent review.</p><p><b>The Tolkāppiyam.</b> What is the date of its layers? What is the nature and extent of its contact with Sanskrit grammar?</p><p><b>Transmission.</b> How much variation is there among Vedic recensions, and what do they show about the early history of the texts?</p><p><b>Āryabhaṭa.</b> What was his method for constructing the sine table, and what did he intend by his planetary models?</p><p><b>Computation.</b> What is the formal status of the whole <i>Aṣṭādhyāyī</i> as a rule system, and how are its rule conflicts to be resolved?</p><p>These are real questions, on which students of any region may do useful work. The approach given in this part of the book, to state the claim, find the source, test the evidence, and grade the result, is the way to begin.</p>`],
['Two Grammatical Traditions and Weighing Claims','Grading the Claims of the Notes',`<table class="ex sm"><tr><td>Claim</td><td>Grade</td></tr><tr><td>Ashokan edicts of about 260 BCE are in Prakrit, Greek, and Aramaic</td><td>established</td></tr><tr><td>Written Sanskrit appears "around 150 CE" at Junagadh</td><td>first long inscription only; shorter ones are earlier</td></tr><tr><td>Pāṇini lived c. 500 to 350 BCE near Taxila and Attock</td><td>accepted range; debated</td></tr><tr><td>Pāṇini composed orally</td><td>probable; role of writing debated</td></tr><tr><td>Tolkāppiyam core dated c. 300 BCE to 300 CE</td><td>a broad range; debated</td></tr><tr><td>Keeladi inscribed pottery from c. 580 BCE</td><td>reported; suggestive; under study</td></tr><tr><td>Iron Age in Tamil Nadu to 2500 to 3300 BCE</td><td>announced; suggestive; needs publication</td></tr><tr><td>Over 55% of Indian inscriptions are in Tamil</td><td>unverified; depends on definition</td></tr><tr><td>Pāṭhas work like checksums</td><td>analogy only</td></tr><tr><td>Archaic features prove distortion-free preservation</td><td>strong evidence; "distortion-free" overstated</td></tr></table>`],
['Two Grammatical Traditions and Weighing Claims','Summary of This Part',`<p>This part added six chapters to the study of Pāṇini's grammar. The first set out the evidence on writing, oral tradition, and the age of Sanskrit and Tamil, correcting the simple statement that Sanskrit inscriptions begin at about 150 CE and describing the Tamil excavations and their status. The second described the methods by which the Vedic texts and the grammar were preserved, with the recitation patterns shown in code, and the limits of the claim of perfect fidelity. The third presented the algorithms of Āryabhaṭa, which a short program can run. The fourth took thirty rules of the grammar apart one by one. The fifth described the architecture of the generative system, its layers, controls, and worked derivations. The sixth compared the grammar with the Tolkāppiyam and gave a method for weighing claims.</p><p>Three themes ran through the chapters. The first is that these traditions achieved a great deal, by methods of striking rigour: rule systems, error-detecting recitation, compact algorithms. The second is that the evidence for their dates and their fidelity is strong in some respects and uncertain in others, and that honest statements keep the two apart. The third is that old and new meet usefully when each is understood on its own terms, with code and archaeology serving as ways of testing and teaching.</p><p>For the wider work of Cultural Musings, the reader may visit www.culturalmusings.com. Readers are asked to check the claims in this book against the sources and to send corrections.</p>`]

var SRC=['Reference','Sources and Further Reading',`<p><b>The grammar and its study.</b> George Cardona, <i>Pāṇini: His Work and Its Traditions</i>, volume 1 (1988), and his survey <i>Pāṇini: A Survey of Research</i> (1976). Rama Nath Sharma, <i>The Aṣṭādhyāyī of Pāṇini</i>, a translation and commentary in several volumes (1987 to 2003). Sumitra Mangesh Katre, <i>Aṣṭādhyāyī of Pāṇini</i> (1987). Śrīśa Chandra Vasu's older translation (1891) is also widely available.</p><p><b>Commentary.</b> The <i>Kāśikā</i> of Vāmana and Jayāditya, Bhaṭṭoji Dīkṣita's <i>Siddhāntakaumudī</i>, and Patañjali's <i>Mahābhāṣya</i>, each in modern editions and translations.</p><p><b>Linguistics and computation.</b> Leonard Bloomfield, <i>Language</i> (1933). Frits Staal, <i>Universals</i> (1988). Paul Kiparsky, "On the Architecture of Pāṇini's Grammar", in <i>Sanskrit Computational Linguistics</i> (2009). John Backus, a 1959 paper on the syntax of the proposed international algebraic language. Peter Z. Ingerman, "Pāṇini–Backus Form Suggested", <i>Communications of the ACM</i> 10(3), 1967. Rishi Rajpopat, a doctoral thesis on rule conflict in the <i>Aṣṭādhyāyī</i>, University of Cambridge (2022).</p><p><b>Online.</b> Searchable editions of the sūtras and the <i>Kāśikā</i> are available on several Sanskrit websites, and the Sanskrit Heritage and Saṃsādhanī tools offer analysis of words. Addresses change, so please search for them by name and check any rule against a printed edition.</p>`];

var cover='<div class="pg cover" data-density="hard"><div class="in"><img class="logo" alt="Aesthetics of Society" src="'+LOGO+'"><h1>4,000 Rules</h1><p class="sub">The Ancient Indian Code Behind Every Compiler</p><p class="sm2">Pāṇini\'s Aṣṭādhyāyī in a flip book, with sandhi and samāsa explained</p><p class="sm2" style="margin-top:4cqw">Cultural Musings &middot; www.culturalmusings.com</p></div></div>';
var note='<div class="pg"><div class="in"><h2>A Note to the Reader</h2><p>This book is a study summary of the <i>Aṣṭādhyāyī</i> of Pāṇini, the Sanskrit grammar of about 3,960 rules. It summarises the grammar chapter by chapter and explains the main patterns of sandhi and samāsa with worked examples. It cannot replace the text itself.</p><p><b>Please verify.</b> Rule numbers follow the standard numbering used with the <i>Kāśikā</i>. Counts of rules and some details differ between editions and commentaries, and the examples are chosen for teaching. Check any rule or form that matters against the <i>Aṣṭādhyāyī</i>, a trusted commentary, or a qualified teacher of Sanskrit grammar.</p><p><b>About the title.</b> "The code behind every compiler" is a popular way of describing the grammar. The last part of this book sets out what is established about Pāṇini and computing, and what is not.</p><p><b>Spelling.</b> Sanskrit is written in the IAST transliteration, with marks for long vowels and special consonants. Corrections and comments are welcome through www.culturalmusings.com.</p></div></div>';
