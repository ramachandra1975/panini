<script>
var PP=[];
PP.push(
['The Text and Its Machinery','What the Aṣṭādhyāyī Is',`<p>The <i>Aṣṭādhyāyī</i>, "the eight chapters", is the Sanskrit grammar of Pāṇini, composed about the fifth or fourth century BCE, though some scholars place him earlier. Tradition says he came from Śalātura, a place identified with a village near Attock in present-day Pakistan, in the old region of Gandhāra.</p><p>The work has eight chapters (<i>adhyāya</i>), each divided into four sections (<i>pāda</i>), thirty-two sections in all. Its rules, called <i>sūtras</i>, number about 3,960 in the commonest count, and editions differ by a few. The popular title "4,000 rules" rounds this figure. A reference such as 6.1.77 means chapter 6, section 1, rule 77.</p><p>The grammar describes the Sanskrit of Pāṇini's own time, the speech of the learned (<i>bhāṣā</i>), together with Vedic forms that it marks as exceptions with the words <i>chandasi</i>, "in the Veda". It does not simply list forms. It derives them. It starts from roots, affixes, and meanings, and states, in order, the operations that produce a correct word. In this sense it is a generative system, and that is why computer scientists have found it interesting.</p><p>Its compression is extreme. Rules are often a few syllables long and cannot be read without knowing the conventions described in this part of the book.</p>`],
['The Text and Its Machinery','Pāṇini and the Grammatical Tradition',`<p>Pāṇini did not begin from nothing. He names about ten earlier grammarians, among them Śākaṭāyana, Śākalya, Gārgya, Gālava, Āpiśali, and Sphoṭāyana, and their works are lost. The <i>Nirukta</i> of Yāska, an earlier study of Vedic word origins, belongs to the same learned world. What survives is the work that absorbed or replaced the rest.</p><p>Two later authors completed what is called the triad of sages, the <i>munitraya</i>. Kātyāyana, perhaps of the third century BCE, wrote short notes called <i>vārttikas</i> that correct and extend Pāṇini's rules. Patañjali, in the second century BCE, wrote the <i>Mahābhāṣya</i>, "the great commentary", which discusses the rules and the notes in the form of debate. The tradition holds that where the three disagree, the later authority is to be followed.</p><p>The best known later commentary is the <i>Kāśikā</i> of Vāmana and Jayāditya, of about the seventh century CE, which gives a running explanation of every rule with examples. Bhaṭṭoji Dīkṣita, in the seventeenth century, rearranged the rules by topic in the <i>Siddhāntakaumudī</i>, so that a student could follow one subject, such as nouns or verbs, in a single place. Most students since then have learnt Pāṇini by this topical order and not by the order of the original text.</p>`],
['The Text and Its Machinery','The Supporting Lists',`<p>The <i>Aṣṭādhyāyī</i> is not complete without its companion texts, which the sūtras refer to but do not repeat. The first is the <i>Dhātupāṭha</i>, the list of verbal roots, about two thousand in number, each given with its meaning and with marker letters that tell the grammar how the root behaves. Roots are arranged in ten classes, named after the first root of each: <i>bhū, ad, hu, div, su, tud, rudh, tan, krī, cur</i>.</p><p>The second is the <i>Gaṇapāṭha</i>, a set of word-lists. A rule may say "after the words of the <i>sarvādi</i> group", and the group is defined by a list of pronouns and similar words, beginning with <i>sarva</i>, "all". This works like a named set in a program: the rule refers to the set and the list defines its members. Without the list, the rule cannot be applied.</p><p>Other companions are the <i>Uṇādisūtras</i>, which derive many common nouns from roots by irregular suffixes, the <i>Liṅgānuśāsana</i>, which assigns grammatical gender, and the phonetic treatises called <i>Śikṣā</i>. Pāṇini also leaves a final escape clause for words that fit no rule, at 6.3.109, which allows certain irregular forms "as they have been taught". The system therefore has a core of rules, a set of data tables, and a way to admit exceptions.</p>`],
['The Text and Its Machinery','The Śiva Sūtras',`<p>Before the first rule, the grammar uses an arrangement of the sounds of Sanskrit in fourteen short lines, the <i>Śiva Sūtras</i>, also called <i>Māheśvara Sūtras</i>. Tradition says they came from the drum of Śiva, which sounded them at the end of his dance. They are not rules but a tool, a specially ordered alphabet from which short names for groups of sounds can be made.</p><table class="ex sm"><tr><td>1</td><td>a i u Ṇ</td></tr><tr><td>2</td><td>ṛ ḷ K</td></tr><tr><td>3</td><td>e o Ṅ</td></tr><tr><td>4</td><td>ai au C</td></tr><tr><td>5</td><td>ha ya va ra Ṭ</td></tr><tr><td>6</td><td>la Ṇ</td></tr><tr><td>7</td><td>ña ma ṅa ṇa na M</td></tr></table><table class="ex sm"><tr><td>8</td><td>jha bha Ñ</td></tr><tr><td>9</td><td>gha ḍha dha Ṣ</td></tr><tr><td>10</td><td>ja ba ga ḍa da Ś</td></tr><tr><td>11</td><td>kha pha cha ṭha tha ca ṭa ta V</td></tr><tr><td>12</td><td>ka pa Y</td></tr><tr><td>13</td><td>śa ṣa sa R</td></tr><tr><td>14</td><td>ha L</td></tr></table><p>The capital letters are markers (<i>it</i>) that stand at the end of each line and are not sounds of the language. They are the hooks on which names are hung, as the next page shows.</p>`],
['The Text and Its Machinery','Pratyāhāras: Names for Groups of Sounds',`<p>A <i>pratyāhāra</i> is a short name for a stretch of sounds in the Śiva Sūtras. Rule 1.1.71, <i>ādir antyena sahetā</i>, says that a first letter together with a final marker stands for the first letter and everything between it and the marker. The marker itself is dropped. Pāṇini can then refer to a large group of sounds with two letters.</p><table class="ex"><tr><td><b>ac</b></td><td>a i u ṛ ḷ e o ai au</td><td>all vowels</td></tr><tr><td><b>hal</b></td><td>ha ya va ra la ña ... ha</td><td>all consonants</td></tr><tr><td><b>ak</b></td><td>a i u ṛ ḷ</td><td>simple vowels</td></tr><tr><td><b>ik</b></td><td>i u ṛ ḷ</td><td>vowels without a</td></tr><tr><td><b>yaṇ</b></td><td>y v r l</td><td>semivowels</td></tr><tr><td><b>jaś</b></td><td>j b g ḍ d</td><td>voiced unaspirated stops</td></tr><tr><td><b>khar</b></td><td>kh ph ch ṭh th c ṭ t k p ś ṣ s</td><td>voiceless sounds</td></tr><tr><td><b>jhal</b></td><td>all stops, sibilants, h</td><td>obstruents</td></tr></table><p>About forty such names are used. They make the rules short and also make them general: a rule about <i>ik</i> automatically covers four sounds. In programming terms, a pratyāhāra is a character class, like a pattern for "any vowel", defined by two endpoints in an ordered list. Because the marker <i>ṇ</i> appears twice, the commentators add conventions to say which one is meant.</p>`],
['The Text and Its Machinery','Places and Efforts: How Sounds Are Classed',`<p>The Śiva Sūtras give an order, but sounds are also classed by how they are made. Sanskrit phonetics, taught in the <i>Śikṣā</i> works and assumed by Pāṇini, names five main places of articulation: the throat (<i>kaṇṭhya</i>), the palate (<i>tālavya</i>), the roof of the mouth with the tongue curled back (<i>mūrdhanya</i>), the teeth (<i>dantya</i>), and the lips (<i>oṣṭhya</i>). The classes of consonants are named after their first member: the <i>ka</i> group is guttural, the <i>ca</i> group palatal, the <i>ṭa</i> group retroflex, the <i>ta</i> group dental, and the <i>pa</i> group labial.</p><table class="ex"><tr><td>throat</td><td>a, ā, k kh g gh ṅ, h, visarga</td></tr><tr><td>palate</td><td>i, ī, c ch j jh ñ, y, ś</td></tr><tr><td>retroflex</td><td>ṛ, ṭ ṭh ḍ ḍh ṇ, r, ṣ</td></tr><tr><td>teeth</td><td>ḷ, t th d dh n, l, s</td></tr><tr><td>lips</td><td>u, ū, p ph b bh m</td></tr><tr><td>throat and palate</td><td>e, ai</td></tr><tr><td>throat and lips</td><td>o, au</td></tr></table><p>Two sounds are called <i>savarṇa</i>, "of the same kind", when they share place and effort (1.1.9, <i>tulyāsyaprayatnaṃ savarṇam</i>). Short and long <i>a</i> are savarṇa, and so are <i>i</i> and <i>ī</i>. Many sandhi rules depend on this idea. The very last rule of the grammar, 8.4.68, is just <i>a a</i>: it says that the short <i>a</i> assumed throughout the text is pronounced closed, so that the grammar's own notation is made exact at the end.</p>`],
['The Text and Its Machinery','How a Sūtra Is Written',`<p>A sūtra is a formula, and every part of it carries information. Take 6.1.77: <i>iko yaṇ aci</i>. The word <i>ikaḥ</i>, here <i>iko</i>, is in the genitive and means "in place of <i>ik</i>". The word <i>yaṇ</i> is in the nominative and names what comes instead. The word <i>aci</i> is in the locative and sets the condition, "when a vowel follows". The rule therefore reads: in place of <i>i, u, ṛ, ḷ</i>, the semivowels <i>y, v, r, l</i> appear, when a vowel follows. The final <i>ṇ</i> of <i>yaṇ</i> is only a marker and is dropped.</p><p>The rule seems to say nothing about <i>when</i> it applies. The answer is <i>anuvṛtti</i>, "carrying along". A word from an earlier rule is understood to continue into later ones, so the heading <i>saṃhitāyām</i>, "in close contact" (6.1.72), is still in force at 6.1.77. This saves repetition. It works like a variable that keeps its value until another rule resets it.</p><p>A third device is the <i>adhikāra</i>, a heading that governs a whole run of rules. At 3.1.1 the single word <i>pratyayaḥ</i>, "an affix", opens a stretch that continues to the end of the fifth chapter. The reader must therefore always know which words are currently active. Commentators supply them, and modern software must keep a table of them.</p>`],
['The Text and Its Machinery','Case Endings as Instructions',`<p>Pāṇini writes his grammar in Sanskrit, using Sanskrit's own case endings as a code. A set of conventions says what each case means in a rule. Rule 1.1.49, <i>ṣaṣṭhī sthāneyogā</i>, says that a word in the genitive means "in place of". So "<i>ikaḥ yaṇ</i>" means yaṇ takes the place of ik. This is the grammar's assignment operator.</p><p>Rule 1.1.66, <i>tasminn iti nirdiṣṭe pūrvasya</i>, says that what is stated in the locative acts on the item just before it. So "<i>aci</i>", "when a vowel follows", sets a condition on what comes after. Rule 1.1.67, <i>tasmād ity uttarasya</i>, says that what is stated in the ablative acts on the item just after. The reader thus learns which side of a sound a rule changes by the case ending it uses.</p><p>Other conventions govern the marker letters. Rule 1.3.3, <i>halantyam</i>, says that a final consonant of an instruction is a marker, and 1.3.9, <i>tasya lopaḥ</i>, says that a marker is deleted. A letter such as <i>ṭ, k, ṅ</i> in an affix tells the grammar how the affix behaves: for example whether it blocks a vowel change. Markers act like flags attached to a data item, to be read by later rules and then removed before the word is spoken.</p><p>The result is a notation with no ambiguity once its conventions are known.</p>`],
['The Text and Its Machinery','Kinds of Rules',`<p>Traditional grammarians sort the sūtras into types, and knowing the type tells the reader how to use a rule. A <i>saṃjñā</i> rule gives a technical term. The first sūtra, 1.1.1, <i>vṛddhir ādaic</i>, defines <i>vṛddhi</i> as the vowels <i>ā, ai, au</i>, and 1.1.2, <i>adeṅ guṇaḥ</i>, defines <i>guṇa</i> as <i>a, e, o</i>. These two terms govern much of the grammar. Rule 1.4.14, <i>suptiṅantaṃ padam</i>, defines a word as something that ends in a noun or verb ending.</p><p>A <i>paribhāṣā</i> rule tells the reader how to interpret other rules, as 1.1.49 does for the genitive. A <i>vidhi</i> rule is an operation: it states that a change takes place. A <i>niyama</i> rule restricts a general operation to a narrower case. An <i>atideśa</i> rule extends: 1.1.56, <i>sthānivad ādeśo 'nalvidhau</i>, says that a replacement behaves like the item it replaced, except for rules about sounds, so that earlier conditions still apply after a substitution.</p><p>An <i>adhikāra</i> is a governing heading, a <i>niṣedha</i> is a prohibition, and a <i>vibhāṣā</i> makes an operation optional, usually by the word <i>vā</i> or <i>vibhāṣā</i>. An <i>apavāda</i> is an exception that overrides a general rule. A reader who asks of each sūtra, "is this a definition, an operation, a limit, or an exception?", will find the structure of the text much clearer.</p>`],
['The Text and Its Machinery','Conflicts and Rule Order',`<p>More than one rule can apply to the same form, and a grammar must say which wins. Pāṇini's answer has several parts. The first is the principle of the special over the general: an <i>apavāda</i>, a specific rule, blocks the general rule, the <i>utsarga</i>, in the cases it covers. Without this, almost every exception would be wrongly overridden by the rule it was meant to limit.</p><p>The second is the rule at 1.4.2, <i>vipratiṣedhe paraṃ kāryam</i>: where two rules are of equal strength and conflict, the later one in the text applies. The order of the rules in the book is therefore part of the program. The third is the idea of <i>asiddha</i>, "treated as not having happened". Rule 8.2.1, <i>pūrvatrāsiddham</i>, says that the rules from 8.2.2 to the end of the book are treated as not applied with respect to everything earlier. The last three sections form a final stage, the <i>tripādī</i>, where sound changes at word edges are done after all word-building is finished.</p><p>A similar rule at 6.4.22 does the same for a block inside the sixth chapter. This is a layered design, with later passes that earlier ones cannot see. In 2022 a Cambridge doctoral thesis by Rishi Rajpopat proposed that when rules conflict between the left and right parts of a word, Pāṇini meant the right-hand one to apply. The proposal was widely reported and also questioned by some Sanskritists, and debate continues.</p>`]
);

PP.push(
['The Eight Chapters','Chapter 1: Terms and Rules of Use',`<p>The first chapter sets up the vocabulary and the reading conventions for everything that follows. Section 1.1 defines technical terms: <i>vṛddhi</i> and <i>guṇa</i> (1.1.1 and 1.1.2), the replacement that restores a root's original vowel, <i>saṃprasāraṇa</i> (1.1.45), and many rules of interpretation such as 1.1.49 and 1.1.56 described earlier. It also holds the rule on <i>savarṇa</i> (1.1.9) and on the exception for dual endings in <i>ī, ū, e</i>, which block sandhi (1.1.11).</p><p>Section 1.2 deals with how certain affixes, marked <i>k</i> or <i>ṅ</i>, block or allow vowel strengthening. Section 1.3 gives the rules for marker letters and then chooses between the two voices of the verb, the active-type <i>parasmaipada</i> and the middle-type <i>ātmanepada</i>. For example, 1.3.12 gives the middle voice to roots marked with a low-pitch vowel or <i>ṅ</i>, and 1.3.78 gives the active voice to the rest.</p><p>Section 1.4 begins with the definition of a word (1.4.14) and of the stem to which operations apply (<i>aṅga</i>, 1.4.13), and introduces the <i>kāraka</i>, the roles that nouns play in relation to the verb, which are the subject of a later page. It also defines indeclinable particles, prefixes (<i>upasarga</i>), and the term <i>saṃhitā</i> for close contact of sounds (1.4.109), the basis for sandhi. In programming terms, the first chapter is the header file.</p>`],
['The Eight Chapters','Chapter 2: Compounds, Cases, and Deletions',`<p>The second chapter has three themes. Sections 2.1 and 2.2 treat <i>samāsa</i>, the formation of compound words, which is covered in its own part of this book. They define the four main types, the rule that members must be semantically connected (2.1.1), and the order of their members.</p><p>Section 2.3 deals with the assignment of case endings. Here the grammar separates the semantic role from the grammatical case. The rules tell which case a role normally takes when the role has not already been expressed by the verb: accusative for the object (2.3.2), instrumental for the agent or instrument (2.3.18), dative for the recipient (2.3.13), ablative for the point of separation (2.3.28), genitive for relations in general (2.3.50), and locative for the place (2.3.36). The word <i>anabhihite</i> (2.3.1), "when not already expressed", says that if the verb's own ending already shows the role, no further case is needed.</p><p>Section 2.4 states when affixes are deleted. In a compound the case endings of the first member are dropped by a rule at 2.4.71, and certain gender and number features of compounds are settled here. For example, 2.4.2 says that a dvandva compound of parts of the body or musical instruments takes the neuter singular. This chapter is where much of the grammar of nouns is controlled, and it is closely tied to the kāraka theory of the first chapter.</p>`],
['The Eight Chapters','Chapter 3: Roots, Verbs, and Derived Words',`<p>The third chapter is the heart of verbal derivation. It begins with the heading rules that govern the rest of the grammar up to the end of the fifth chapter: <i>pratyayaḥ</i>, "an affix" (3.1.1), <i>paraś ca</i>, "and it comes after" (3.1.2), and <i>ādyudāttaś ca</i>, "and it has the high pitch on its first vowel" (3.1.3). From here on, every operation is described as adding an affix to a base.</p><p>Section 3.1 gives the affixes that build secondary roots, such as the causative (<i>ṇic</i>, 3.1.26) and the desiderative, and the vowel (<i>vikaraṇa</i>) that is inserted between a root and its ending, such as <i>śap</i> for active verbs of the first class (3.1.68). Sections 3.2 and 3.3 give the <i>kṛt</i> affixes, which make nouns and adjectives from roots, such as the agent suffix that makes <i>kartṛ</i>, "doer", from <i>kṛ</i>, "do". They also give the rules for the abstract noun and for participles.</p><p>Section 3.4 deals with the finite verb. The ten tense-and-mood affixes, the <i>lakāras</i>, are first introduced and then replaced by the eighteen personal endings, the <i>tiṅ</i> set (3.4.77 and 3.4.78). The same chapter thus produces both the participial nouns and the conjugated verbs of Sanskrit from one list of roots, with a handful of affixes and conditions.</p><p>This design reuses a small number of building blocks to cover a very large vocabulary.</p>`],
['The Eight Chapters','Chapters 4 and 5: Secondary Derivation',`<p>Chapters 4 and 5 treat <i>taddhita</i>, "secondary" affixes, which make new nouns and adjectives from existing nouns. They begin with the case and number endings themselves. Rule 4.1.2 is a long compound of the twenty-one noun endings, three for each of seven cases, under the label <i>sup</i>. The rule 4.1.3 and the following sections add the feminine affixes, such as <i>ṭāp</i>, which turns <i>aja</i>, "he-goat", into <i>ajā</i>, "she-goat" (4.1.4).</p><p>The rest of chapter 4 and chapter 5 list the meanings that secondary affixes can carry. A famous example is 4.1.92, <i>tasyāpatyam</i>, "his offspring", which makes patronymics: from <i>Upagu</i> comes <i>Aupagava</i>, "descendant of Upagu". Other rules form names for places and times, things made of or belonging to something, inhabitants of a region, and people skilled at a thing.</p><p>Chapter 5 includes rules for the possessive suffix <i>mat</i> (5.2.94, "that which has it"), for comparison with <i>-tara</i> and <i>-tama</i> (5.3.57 and 5.3.55), and for abstract nouns with <i>-tva</i> and <i>-tā</i> (5.1.119), which turn <i>guru</i>, "heavy" or "teacher", into <i>gurutva</i> or <i>gurutā</i>, "heaviness". Chapter 5 ends with a long series of compound-final affixes, the <i>samāsānta</i> group, which adjust the end of compounds, for example making <i>rājan</i> into <i>rāja</i> inside <i>rājapuruṣa</i>.</p>`],
['The Eight Chapters','Chapter 6: Sandhi, Reduplication, and Accent',`<p>The sixth chapter is the first of the grammar's three chapters of word-level sound and form. Section 6.1 opens with reduplication, the doubling of part of a root in some forms (6.1.1, <i>ekāco dve prathamasya</i>), and then contains the central vowel-sandhi rules, from 6.1.77 on: <i>iko yaṇ aci</i> (6.1.77), <i>eco 'yavāyāvaḥ</i> (6.1.78), <i>ād guṇaḥ</i> (6.1.87), <i>vṛddhir eci</i> (6.1.88), and <i>akaḥ savarṇe dīrghaḥ</i> (6.1.101). The same section gives the rules on visarga that change it to <i>u</i> or <i>r</i> (6.1.113 and 6.1.114).</p><p>Section 6.2 assigns accent in compounds. Sanskrit, in its Vedic form, had a pitch accent that affects meaning, and the grammar gives accent as part of the shape of a word. A rule such as 6.2.1 says that in a bahuvrīhi compound the first member keeps its own accent. Section 6.3 deals with changes in the first member of compounds, such as lengthening, and ends with the escape clause 6.3.109 for irregular forms.</p><p>Section 6.4 treats the changes of the stem before endings. A block of its rules, from 6.4.22 on, is declared <i>asiddha</i> with respect to earlier rules, so that they apply as a later stage. The chapter is the main source for how words change shape when elements are joined.</p>`],
['The Eight Chapters','Chapter 7: Stems, Augments, and Substitutions',`<p>The seventh chapter continues the operations on the stem (<i>aṅga</i>). Section 7.1 gives replacements for the affixes themselves. Its first rule, 7.1.1, <i>yuvor anākau</i>, replaces the affix <i>yu</i> with <i>ana</i> and <i>vu</i> with <i>aka</i>, which is why <i>nand</i> gives <i>nandana</i>, "delight", and <i>pū</i> gives <i>pāvaka</i>, "purifier". Rule 7.1.9 makes the ending <i>bhis</i> become <i>ais</i> after stems in <i>a</i>, giving <i>rāmaiḥ</i>, "by the Rāmas".</p><p>Section 7.2 controls an inserted vowel, the <i>iṭ</i> augment, which is placed between a root and an ending beginning with certain consonants. Rule 7.2.35 states the general case, and many other rules list roots that take it, do not take it, or take it optionally. These rules explain why one verb has <i>-ita</i> in its participle and a similar verb does not.</p><p>Section 7.3 deals with the strengthening of vowels, <i>guṇa</i> and <i>vṛddhi</i>. The main rule, 7.3.84, <i>sārvadhātukārdhadhātukayoḥ</i>, strengthens the final vowel of a root before the two classes of verbal endings, so that <i>bhū</i> becomes <i>bho</i> before the vowel <i>a</i>. Section 7.4 completes the chapter with the doubling rules for stems and rules for certain root vowels. The chapter is long and detailed, and shows the grammar's habit of treating regularities and irregularities in the same notation.</p>`],
['The Eight Chapters','Chapter 8: Repetition, Final Sounds, and Assimilation',`<p>The eighth chapter has two layers. Section 8.1 deals with repetition of words and with the accent of words in sentences, with its opening rule 8.1.1, <i>sarvasya dve</i>, "doubling of the whole". Under it come forms such as <i>gṛhe gṛhe</i>, "in every house", showing a use of repetition as a grammatical device.</p><p>The remaining three sections, 8.2 to 8.4, are the <i>tripādī</i>, the final stage of the grammar, introduced by 8.2.1, <i>pūrvatrāsiddham</i>. In it are the rules that finish the sounds of a word and its edges: the deletion of final <i>n</i> in a stem (8.2.7), the change of final <i>s</i> to <i>ru</i> (8.2.66), and the change of final consonants to the unaspirated voiced stops (8.2.39). Section 8.3 gives the rules for visarga (8.3.15), for <i>m</i> before a consonant (8.3.23), and for the change of <i>s</i> to <i>ṣ</i> after certain vowels (8.3.59), as in <i>agni</i> with <i>su</i> becoming <i>agniṣu</i>.</p><p>Section 8.4 gives the changes of <i>n</i> to <i>ṇ</i> after <i>r</i> or <i>ṣ</i> (8.4.1, as in <i>rāmeṇa</i>), the assimilation of dentals to palatals and retroflexes (8.4.40 and 8.4.41), and the voicing and devoicing rules (8.4.53 to 8.4.55). Its last rule, 8.4.68, is <i>a a</i>. The final pass thus ends with phonetics, and the output is the spoken word.</p>`],
['The Eight Chapters','The Kārakas: Roles in a Sentence',`<p>Pāṇini does not describe a sentence by its cases alone. He defines six roles, the <i>kārakas</i>, in 1.4.23 to 1.4.55, and then, in 2.3, says which case each role takes. A role is defined by what the noun does in the action: the <i>kartṛ</i>, the independent agent (1.4.54); the <i>karman</i>, what the agent most wishes to reach (1.4.49); the <i>karaṇa</i>, the most effective means (1.4.42); the <i>sampradāna</i>, the recipient (1.4.32); the <i>apādāna</i>, the fixed point from which separation occurs (1.4.24); and the <i>adhikaraṇa</i>, the support or place (1.4.45).</p><table class="ex"><tr><td><i>Rāmaḥ vane bāṇena mṛgaṃ hanti</i></td></tr><tr><td>Rāma (kartṛ), in the forest (adhikaraṇa), with an arrow (karaṇa), kills a deer (karman).</td></tr></table><p>The roles are not the same as the cases. The same role can be shown by a different case under different conditions, and the same case can serve several roles. In "The deer is killed by Rāma", the agent is now in the instrumental, and the object, being already expressed by the passive verb ending, is in the nominative. The rule <i>anabhihite</i>, "when not already expressed", handles this.</p><p>The kāraka system is a model of meaning that connects syntax to the situation described. Modern linguists compare it to theories of semantic roles or thematic roles, and computational linguists have used it to link sentence structure to meaning. In software terms, the kārakas are the typed arguments of a function, and the cases are the way they are written in the call.</p>`],
['The Eight Chapters','Verbs: Ten Lakāras and Eighteen Endings',`<p>The finite verb is built from a root, a tense or mood, a person, a number, and a voice. Pāṇini names ten tense-and-mood affixes, the <i>lakāras</i>, because each name begins with <i>l</i>: <i>laṭ</i> (present), <i>liṭ</i> (perfect), <i>luṭ</i> (periphrastic future), <i>lṛṭ</i> (future), <i>leṭ</i> (a Vedic subjunctive), <i>loṭ</i> (imperative), <i>laṅ</i> (imperfect), <i>liṅ</i> (optative and benedictive), <i>luṅ</i> (aorist), and <i>lṛṅ</i> (conditional).</p><p>These are not the visible endings. They are abstract placeholders, and each is replaced, by 3.4.77 and 3.4.78, by one of eighteen personal endings, the <i>tiṅ</i> set. There are nine for the active voice and nine for the middle voice, in three persons and three numbers.</p><table class="ex"><tr><td></td><td>Singular</td><td>Dual</td><td>Plural</td></tr><tr><td>3rd</td><td>tip</td><td>tas</td><td>jhi</td></tr><tr><td>2nd</td><td>sip</td><td>thas</td><td>tha</td></tr><tr><td>1st</td><td>mip</td><td>vas</td><td>mas</td></tr></table><p>The same letters in the middle voice are <i>ta, ātām, jha, thās, āthām, dhvam, iṭ, vahi, mahiṅ</i>. The final letters of these names are markers, and the endings are shortened to their visible forms by later rules. For example, <i>jhi</i> becomes <i>anti</i>, as in <i>bhavanti</i>, "they are". The system thus separates meaning, the lakāra, from form, the ending, with the substitution rules between them acting as a translation layer.</p>`],
['The Eight Chapters','A Worked Derivation: bhavati',`<p>The grammar's method is clearest in one example, the form <i>bhavati</i>, "he, she, or it is", from the root <i>bhū</i>. Each step is justified by a rule. The steps below follow the order in which the grammar applies them.</p><table class="ex"><tr><td>1</td><td>Start with the root <i>bhū</i> and the meaning "present".</td><td></td></tr><tr><td>2</td><td>Present meaning calls for <i>laṭ</i> after the root.</td><td>3.2.123</td></tr><tr><td>3</td><td><i>laṭ</i> is replaced by the third-person singular ending <i>tip</i>.</td><td>3.4.78</td></tr><tr><td>4</td><td>The verbal vowel <i>śap</i> is inserted before it.</td><td>3.1.68</td></tr><tr><td>5</td><td>Markers go: <i>śap</i> leaves <i>a</i>, and <i>tip</i> leaves <i>ti</i>.</td><td>1.3.3, 1.3.8, 1.3.9</td></tr><tr><td>6</td><td>The root's vowel is strengthened: <i>bhū</i> becomes <i>bho</i>.</td><td>7.3.84</td></tr><tr><td>7</td><td><i>bho + a + ti</i>: <i>o</i> before a vowel becomes <i>av</i>.</td><td>6.1.78</td></tr><tr><td>8</td><td>The result is <i>bhavati</i>.</td><td></td></tr></table><p>Eight small steps, each stated once in the grammar, give a correct and complete word. The same steps, with different roots and endings, generate thousands of other forms. A computer implementation of this process needs the rules, the root list, the markers, and the order of application. It is, in effect, an interpreter for a rewriting system, which is why the example appeals to programmers.</p>`]
);

PP.push(
['Sandhi: Joining of Sounds','What Sandhi Is',`<p><i>Sandhi</i>, "putting together", is the change of sounds where two words, or a stem and an ending, meet. English has a little of it: <i>in</i> + <i>possible</i> becomes <i>impossible</i>. Sanskrit has a great deal, and it is written in the script, so that a Sanskrit sentence is often a chain of words fused at their edges. Learning to undo sandhi is the first skill of reading.</p><p>Pāṇini does not treat sandhi as a separate topic. He defines the condition for it, <i>saṃhitā</i>, as the closest contact of sounds (1.4.109, <i>paraḥ sannikarṣaḥ saṃhitā</i>), and a heading at 6.1.72, <i>saṃhitāyām</i>, makes the following rules apply "in close contact". The vowel changes are in 6.1, and the consonant and visarga changes mostly in the last three sections, 8.2 to 8.4.</p><p>Three kinds are usual. <i>Svara</i> sandhi concerns vowels meeting vowels. <i>Vyañjana</i> sandhi concerns consonants. <i>Visarga</i> sandhi concerns the breath-sound <i>ḥ</i> at the end of a word. Some changes occur inside a word, between stem and ending, and some between two words. Inside a word they are usually obligatory. Between words they are applied in continuous speech and in writing, and may be suspended in word-by-word recitation.</p><p>The next pages give each kind in turn, with a few examples and the rule in the grammar that produces them.</p>`],
['Sandhi: Joining of Sounds','Vowel Sandhi I: Lengthening and Guṇa',`<p>When two similar vowels meet, they merge into one long vowel. This is <i>savarṇa-dīrgha</i> sandhi, from 6.1.101, <i>akaḥ savarṇe dīrghaḥ</i>: an <i>ak</i> vowel followed by a similar vowel becomes long. "Similar" is defined by 1.1.9, as the earlier page explained.</p><table class="ex"><tr><td>deva + ālaya</td><td>devālaya</td><td>temple (abode of god)</td></tr><tr><td>kavi + indra</td><td>kavīndra</td><td>chief of poets</td></tr><tr><td>sādhu + ūrjita</td><td>sādhūrjita</td><td>a good man's strength</td></tr><tr><td>pitṛ + ṛṇam</td><td>pitṝṇam</td><td>debt to the father</td></tr></table><p>When <i>a</i> or <i>ā</i> meets a different simple vowel, the result is <i>guṇa</i>, the strengthened vowel, by 6.1.87, <i>ād guṇaḥ</i>. With <i>i</i> or <i>ī</i> the result is <i>e</i>; with <i>u</i> or <i>ū</i> it is <i>o</i>; with <i>ṛ</i> it is <i>ar</i>, because 1.1.51 says that a vowel that replaces <i>ṛ</i> or <i>ḷ</i> is followed by <i>r</i> or <i>l</i>.</p><table class="ex"><tr><td>deva + indra</td><td>devendra</td><td>chief of the gods</td></tr><tr><td>gaṇa + īśa</td><td>gaṇeśa</td><td>lord of the hosts</td></tr><tr><td>sūrya + udaya</td><td>sūryodaya</td><td>sunrise</td></tr><tr><td>mahā + ṛṣi</td><td>maharṣi</td><td>great sage</td></tr></table>`],
['Sandhi: Joining of Sounds','Vowel Sandhi II: Vṛddhi and Semivowels',`<p>When <i>a</i> or <i>ā</i> meets <i>e</i>, <i>ai</i>, <i>o</i>, or <i>au</i>, the result is <i>vṛddhi</i>, the second grade of strengthening, by 6.1.88, <i>vṛddhir eci</i>. A meeting with <i>e</i> or <i>ai</i> gives <i>ai</i>, and a meeting with <i>o</i> or <i>au</i> gives <i>au</i>.</p><table class="ex"><tr><td>sadā + eva</td><td>sadaiva</td><td>always indeed</td></tr><tr><td>eka + eka</td><td>ekaika</td><td>one by one</td></tr><tr><td>mahā + oṣadhi</td><td>mahauṣadhi</td><td>great herb</td></tr><tr><td>deva + aiśvarya</td><td>devaiśvarya</td><td>divine lordship</td></tr></table><p>When <i>i, u, ṛ,</i> or <i>ḷ</i> is followed by a different vowel, it turns into the matching semivowel <i>y, v, r,</i> or <i>l</i>. This is the rule used as the example of how to read a sūtra, 6.1.77, <i>iko yaṇ aci</i>. The word <i>ik</i> names the four vowels and <i>yaṇ</i> the four semivowels, in the same order, so one rule covers four cases.</p><table class="ex"><tr><td>iti + ādi</td><td>ityādi</td><td>and so on</td></tr><tr><td>su + āgata</td><td>svāgata</td><td>welcome</td></tr><tr><td>pitṛ + ājñā</td><td>pitrājñā</td><td>father's order</td></tr><tr><td>madhu + ari</td><td>madhvari</td><td>the enemy of Madhu</td></tr></table><p>The matching of the two lists by position, <i>i</i> to <i>y</i>, <i>u</i> to <i>v</i>, comes from the rule of correspondence in order of listing, and is another example of the grammar using the structure of its own alphabet.</p>`],
['Sandhi: Joining of Sounds','Vowel Sandhi III: Ayādi, Elision, and Exceptions',`<p>When <i>e, o, ai,</i> or <i>au</i> is followed by any vowel, it breaks into a syllable with a semivowel. Rule 6.1.78, <i>eco 'yavāyāvaḥ</i>, gives the replacements: <i>e</i> becomes <i>ay</i>, <i>o</i> becomes <i>av</i>, <i>ai</i> becomes <i>āy</i>, and <i>au</i> becomes <i>āv</i>. The group is called <i>ayādi</i> after the first replacement.</p><table class="ex"><tr><td>ne + ana</td><td>nayana</td><td>eye, "leading"</td></tr><tr><td>bho + ati</td><td>bhavati</td><td>he is</td></tr><tr><td>gai + aka</td><td>gāyaka</td><td>singer</td></tr><tr><td>pau + aka</td><td>pāvaka</td><td>purifier, fire</td></tr></table><p>When a word ends in <i>e</i> or <i>o</i> and the next word begins with short <i>a</i>, the <i>a</i> is dropped and an apostrophe-like sign, the <i>avagraha</i>, marks the loss. Rule 6.1.109, <i>eṅaḥ padāntād ati</i>, gives this: <i>te</i> + <i>atra</i> becomes <i>te 'tra</i>, "they here".</p><p>Not every meeting of vowels changes. Rule 1.1.11, <i>īdūded dvivacanaṃ pragṛhyam</i>, says that dual endings in <i>ī, ū,</i> and <i>e</i> are <i>pragṛhya</i>, "held apart", so no sandhi applies to them: <i>hari</i> + <i>etau</i> stays <i>hari etau</i>, "these two Haris". A related rule, 1.1.12, protects the demonstrative forms <i>amī</i> and <i>amū</i>. This is an example of a default operation with explicit exceptions, a pattern found everywhere in the grammar.</p><p>The vowel rules together leave no vowel meeting unresolved: every pair either merges, changes to a semivowel, drops, or is protected.</p>`],
['Sandhi: Joining of Sounds','Consonant Sandhi I: Final Stops',`<p>A Sanskrit word cannot end in just any consonant. A final stop is reduced to an unaspirated one, by 8.2.39, <i>jhalāṃ jaśo 'nte</i>: a final <i>jhal</i> sound becomes the matching <i>jaś</i>, the unaspirated voiced stop. Thus the stem <i>vāc</i>, "speech", appears as <i>vāk</i> at the end of a phrase. Before a voiced sound, the final is voiced as well.</p><table class="ex"><tr><td>vāk + īśa</td><td>vāgīśa</td><td>lord of speech</td></tr><tr><td>jagat + īśa</td><td>jagadīśa</td><td>lord of the world</td></tr><tr><td>ṣaṭ + ānana</td><td>ṣaḍānana</td><td>six-faced</td></tr><tr><td>ac + anta</td><td>ajanta</td><td>ending in a vowel</td></tr></table><p>The same voicing happens inside a word when two stops meet. The rule 8.4.53, <i>jhalāṃ jaś jhaśi</i>, replaces a <i>jhal</i> sound by a <i>jaś</i> sound before a voiced aspirated stop or similar, and 8.4.55, <i>khari ca</i>, makes a stop voiceless before a voiceless stop.</p><p>The letter <i>h</i> has a special effect, covered by 8.4.62, <i>jhayo ho 'nyatarasyām</i>: after a stop, <i>h</i> may be replaced by the aspirated stop of the same group. The result is that <i>tat</i> + <i>hi</i> may become <i>taddhi</i>, "that indeed", and the choice is optional.</p><p>The rule that does the voicing and the rule that devoices at a pause are separate, and the order of the rules in the last chapter ensures that each acts only on what it should.</p>`],
['Sandhi: Joining of Sounds','Consonant Sandhi II: Assimilation',`<p>When a dental stop meets a palatal, it becomes palatal, by 8.4.40, <i>stoḥ ścunā ścuḥ</i>: the dental <i>s</i> or <i>t</i>-group, next to the <i>ś</i> or <i>c</i>-group, is replaced by a member of the <i>c</i>-group. Similarly, by 8.4.41, <i>ṣṭunā ṣṭuḥ</i>, next to a retroflex it becomes retroflex.</p><table class="ex"><tr><td>sat + cit</td><td>saccit</td><td>being and consciousness</td></tr><tr><td>sat + jana</td><td>sajjana</td><td>good person</td></tr><tr><td>tat + ṭīkā</td><td>taṭṭīkā</td><td>that commentary</td></tr><tr><td>tat + līna</td><td>tallīna</td><td>absorbed in that</td></tr></table><p>The last of these is 8.4.60, <i>tor li</i>: a dental stop before <i>l</i> becomes <i>l</i>. The sibilant <i>ś</i> after a stop can become <i>ch</i> by 8.4.63, <i>śaś cho 'ṭi</i>. Together these two steps explain <i>tat</i> + <i>śiva</i>.</p><table class="ex"><tr><td>tat + śiva</td><td></td></tr><tr><td>step 1: t becomes c before ś</td><td>tac śiva</td></tr><tr><td>step 2: ś becomes ch after c</td><td>tac chiva</td></tr><tr><td>written together</td><td>tacchiva</td></tr></table><p>A separate rule, 6.1.73, <i>che ca</i>, inserts a <i>t</i> after a short vowel when <i>ch</i> follows, which is why <i>vṛkṣa</i> + <i>chāyā</i> becomes <i>vṛkṣacchāyā</i>, "tree's shade". This is the same device in a different position: a small piece of extra material added to make the joint easier to say.</p>`],
['Sandhi: Joining of Sounds','Nasals and Anusvāra',`<p>The nasal <i>m</i> at the end of a word changes before a consonant. By 8.3.23, <i>mo 'nusvāraḥ</i>, it becomes the <i>anusvāra</i> (<i>ṃ</i>), a nasal sound. Then, by 8.4.58, <i>anusvārasya yayi parasavarṇaḥ</i>, the anusvāra may be replaced by the nasal of the following consonant's own group, as an option. Before a vowel the <i>m</i> is left alone.</p><table class="ex"><tr><td>sam + gati</td><td>saṃgati or saṅgati</td><td>association</td></tr><tr><td>sam + tāpa</td><td>saṃtāpa or santāpa</td><td>heat, distress</td></tr><tr><td>tvam + asi</td><td>tvam asi</td><td>you are</td></tr></table><p>A final stop before a nasal can itself become the nasal of its group, by 8.4.45, <i>yaro 'nunāsike 'nunāsiko vā</i>. Thus <i>vāk</i> + <i>mayam</i> may become <i>vāṅmayam</i>, "made of speech", and <i>tat</i> + <i>mayam</i> may become <i>tanmayam</i>, "made of that" or "absorbed in that", both common words.</p><p>A short vowel before a final <i>ṅ</i> or <i>n</i> doubles that nasal when a vowel follows, by 8.3.32: <i>pratyaṅ</i> + <i>ātmā</i> becomes <i>pratyaṅṅātmā</i>. This keeps the syllable heavy.</p><p>Nasal rules show the main strategy of consonant sandhi: the sound at the edge takes on some feature, place, voicing, or nasality, of its neighbour. The grammar states each feature change separately and in order, so that the rules for voicing do not conflict with the rules for place.</p><p>The writing system follows the rules closely. A reader trained in sandhi can almost always recover the two original words.</p>`],
['Sandhi: Joining of Sounds','Visarga Sandhi',`<p>The visarga (<i>ḥ</i>) is a breath sound that comes from final <i>s</i> or <i>r</i> in a word. Pāṇini derives it by stages. A final <i>s</i> becomes an abstract unit <i>ru</i> (8.2.66, <i>sasajuṣo ruḥ</i>), and at the end of a phrase or before a voiceless consonant that unit becomes visarga (8.3.15, <i>kharavasānayor visarjanīyaḥ</i>). The visarga is thus a late product, not a basic sound.</p><p>Before a voiceless sibilant or stop the visarga may be replaced by a matching sibilant, by 8.3.34, <i>visarjanīyasya saḥ</i>, and then by the assimilation rules already seen. So <i>rāmaḥ</i> + <i>ca</i> becomes <i>rāmaś ca</i>, and <i>rāmaḥ</i> + <i>tatra</i> becomes <i>rāmas tatra</i>.</p><table class="ex"><tr><td>rāmaḥ + gacchati</td><td>rāmo gacchati</td><td>Rāma goes</td></tr><tr><td>manaḥ + ratha</td><td>manoratha</td><td>wish, "chariot of mind"</td></tr><tr><td>hariḥ + gacchati</td><td>harir gacchati</td><td>Hari goes</td></tr><tr><td>punaḥ + api</td><td>punarapi</td><td>again also</td></tr><tr><td>rāmaḥ + iti</td><td>rāma iti</td><td>"Rāma", thus</td></tr></table><p>After <i>a</i>, a visarga before a voiced sound becomes <i>o</i> (6.1.113 and 6.1.114). After other vowels it becomes <i>r</i>. After <i>a</i>, before a different vowel, it is dropped, and the vowels stay separate, as in <i>rāma iti</i>.</p><p>The paths are different, but the logic is the same. A basic form is transformed in steps, and each step is a separate rule with a clear condition. Following the steps in order is the only way to be sure of the result.</p>`],
['Sandhi: Joining of Sounds','Sandhi as a Pipeline',`<p>The sandhi rules show something about the whole design of the grammar. They are not applied at random, nor all at once. The vowel rules in 6.1 apply when a word has been assembled, and the consonant rules at the end of the book apply when all the vowels are settled. Because the last three sections are declared <i>asiddha</i>, earlier rules cannot "see" their results. This gives a one-way pipeline: build the word, join the parts, finish the sounds.</p><p>A single example shows the process. Starting from <i>tat</i> and <i>śiva</i>, the rules <i>stoḥ ścunā ścuḥ</i> and <i>śaś cho 'ṭi</i> give <i>tacchiva</i>. Starting from <i>rāmas</i> and <i>ca</i>, the rules turn <i>s</i> to <i>ru</i>, then to visarga, then to <i>ś</i>, and give <i>rāmaś ca</i>. Starting from <i>iti</i> and <i>ādi</i>, a single rule, 6.1.77, gives <i>ityādi</i>.</p><p>Programmers will see three things. The rules are local rewrites, each with a left context, a target, and a right context. The order matters, as in a compiler with several passes. And the system has no dead ends: any input gives an output.</p><p>One caution is needed. The traditional commentaries describe many cases where order and conflict must be argued, and the full set of interactions is complex. This book gives the common patterns only, and a reader who needs a particular form should consult the <i>Kāśikā</i> or a full Pāṇinian derivation tool.</p><p>With vowel, consonant, and visarga sandhi covered, the next part turns to the other major topic of the grammar's second chapter, the compounds called <i>samāsa</i>.</p>`]
);

PP.push(
['Samāsa: Compounds','What a Samāsa Is',`<p>A <i>samāsa</i> is a compound: two or more words joined into one, with a single set of endings. Sanskrit makes compounds freely, and a classical prose sentence may contain a single word of fifty syllables. A compound is a way of packing a phrase into a unit, leaving the relation between the parts to be understood from context.</p><p>Pāṇini treats compounds in 2.1 and 2.2. The first condition is meaning: 2.1.1, <i>samarthaḥ padavidhiḥ</i>, says that operations on words apply only to words that are semantically connected. A heading at 2.1.3, <i>prāk kaḍārāt samāsaḥ</i>, opens the topic, and four main types are introduced by name: <i>avyayībhāva</i> (2.1.5), <i>tatpuruṣa</i> (2.1.22), <i>bahuvrīhi</i> (2.2.23), and <i>dvandva</i> (2.2.29). Two further names are given as sub-types of the tatpuruṣa: <i>karmadhāraya</i> (1.2.42) and <i>dvigu</i> (2.1.52).</p><p>The traditional way of explaining a compound is to give its <i>vigraha</i>, a phrase that says in full what the compound says briefly. The compound <i>rājapuruṣa</i> has the vigraha <i>rājñaḥ puruṣaḥ</i>, "the king's man". The vigraha is not part of the grammar itself but is the commentators' method of showing the relation.</p><p>A useful question for any compound is: which member carries the meaning, or does neither? The answer sorts it into one of the four types, and the following pages take them one at a time.</p>`],
['Samāsa: Compounds','Avyayībhāva: The Adverbial Compound',`<p>In an <i>avyayībhāva</i> compound the first member is an indeclinable word, such as a prefix or particle, and it gives the meaning. The whole compound becomes an indeclinable word, which in practice usually ends in <i>-m</i> and works as an adverb. The name means "becoming indeclinable".</p><table class="ex"><tr><td>upa + kṛṣṇa</td><td>upakṛṣṇam</td><td>near Kṛṣṇa</td></tr><tr><td>yathā + śakti</td><td>yathāśakti</td><td>according to one's power</td></tr><tr><td>prati + dina</td><td>pratidinam</td><td>every day</td></tr><tr><td>adhi + hari</td><td>adhihari</td><td>on, about Hari</td></tr><tr><td>nir + makṣikā</td><td>nirmakṣikam</td><td>absence of flies</td></tr></table><p>The first member names a relation, such as nearness (<i>upa</i>), distribution (<i>prati</i>), conformity (<i>yathā</i>), or absence (<i>nir</i>), and the second member gives the thing related. The compound then fits easily into a sentence: <i>pratidinaṃ gacchati</i>, "he goes every day". No case ending changes it, since it is indeclinable.</p><p>This type is much less common than the others, but it is important for two reasons. It shows the grammar's habit of fixing the final form of a class by rule: the ending is dropped and replaced, so that the compound behaves in the same way every time. It also shows that the "head" of the compound, the member that determines its type, is the first one here, unlike in most compounds in English, where the last word is the head.</p>`],
['Samāsa: Compounds','Tatpuruṣa I: Compounds by Case',`<p>In a <i>tatpuruṣa</i> the last member is the main one, and the first member stands to it in a case relation, which is not stated. The name is itself an example: <i>tasya puruṣaḥ</i>, "his man". To give the vigraha of a tatpuruṣa one restores the missing case, and the tradition names the compound by the case: second, third, fourth, and so on.</p><table class="ex"><tr><td>2nd (object)</td><td>grāma-gata</td><td>gone to the village</td></tr><tr><td>3rd (by)</td><td>hari-trāta</td><td>protected by Hari</td></tr><tr><td>4th (for)</td><td>yūpa-dāru</td><td>wood for a sacrificial post</td></tr><tr><td>5th (from)</td><td>cora-bhaya</td><td>fear of thieves</td></tr><tr><td>6th (of)</td><td>rāja-puruṣa</td><td>the king's man</td></tr><tr><td>7th (in)</td><td>vana-vāsa</td><td>living in the forest</td></tr></table><p>The genitive type, the sixth, is by far the commonest, and it is covered by a short rule, 2.2.8, <i>ṣaṣṭhī</i>. Other relations are covered by rules at 2.1.24 and the following, which name the words and conditions for each case.</p><p>The compound is ambiguous in principle. <i>Rāja-puruṣa</i> could mean "the king's man" or "a man who is a king", and only context decides. Sanskrit writers often accept this ambiguity and use it for effect, and commentators on poetry sometimes list several resolutions of one compound. A tatpuruṣa is the usual tool for expressing relations between two concepts in a single word.</p>`],
['Samāsa: Compounds','Tatpuruṣa II: Negation, Dependents, and Retained Endings',`<p>The tatpuruṣa has several special kinds. The <i>nañ</i>-tatpuruṣa uses the negative prefix <i>a-</i> (or <i>an-</i> before a vowel): <i>a-brāhmaṇa</i>, "non-Brahmin", and <i>an-aśva</i>, "not a horse". The meaning may be simple negation, or difference, or a poor example of the kind, and the tradition lists six possible senses of the prefix.</p><p>The <i>upapada</i> tatpuruṣa has a verbal noun as its last member, which cannot stand alone in the same sense: <i>kumbha-kāra</i>, "pot-maker" (potter), and <i>dharma-jña</i>, "knower of duty". The <i>prādi</i> or <i>gati</i> type has a prefix as the first member: <i>ku-puruṣa</i>, "a bad man", from <i>ku</i> with the sense of badness.</p><table class="ex"><tr><td>yudhi + sthira</td><td>yudhiṣṭhira</td><td>steady in battle</td></tr><tr><td>manasi + ja</td><td>manasija</td><td>born in the mind (Kāma)</td></tr><tr><td>kumbha + kāra</td><td>kumbhakāra</td><td>potter</td></tr><tr><td>a + brāhmaṇa</td><td>abrāhmaṇa</td><td>non-Brahmin</td></tr></table><p>In the first two examples the locative ending of the first member is kept inside the compound, in contrast to the usual rule that the ending drops. This type is called <i>aluk</i>, "not deleted", and it is an exception to the deletion rule at 2.4.71. The name <i>Yudhiṣṭhira</i>, of the eldest Pāṇḍava, is the most famous such compound, and the sandhi <i>s</i> to <i>ṣ</i> inside it shows another rule at work.</p>`],
['Samāsa: Compounds','Karmadhāraya and Dvigu',`<p>The <i>karmadhāraya</i> is the compound in which the two members refer to the same thing, so that they stand in the same case. It is defined at 1.2.42 as a tatpuruṣa with the same reference, <i>samānādhikaraṇa</i>. The first member usually describes the second, as an adjective does a noun.</p><table class="ex"><tr><td>nīla + utpala</td><td>nīlotpala</td><td>blue lotus</td></tr><tr><td>mahā + rājan</td><td>mahārāja</td><td>great king</td></tr><tr><td>kṛṣṇa + sarpa</td><td>kṛṣṇasarpa</td><td>black snake</td></tr><tr><td>ghana + śyāma</td><td>ghanaśyāma</td><td>dark as a cloud</td></tr><tr><td>puruṣa + vyāghra</td><td>puruṣavyāghra</td><td>man who is a tiger</td></tr><tr><td>mukha + candra</td><td>mukhacandra</td><td>moon-like face</td></tr></table><p>The last three show a common poetic use. The compound states a comparison or identification in a single word, so that the face is the moon and the man is the tiger.</p><p>The <i>dvigu</i> is a karmadhāraya whose first member is a number (2.1.52, <i>saṅkhyāpūrvo dviguḥ</i>). It usually means a collection and is treated as singular, either neuter or feminine in <i>-ī</i>.</p><table class="ex"><tr><td>tri + loka</td><td>trilokī</td><td>the three worlds</td></tr><tr><td>sapta + ṛṣi</td><td>saptarṣi</td><td>the seven sages</td></tr><tr><td>pañca + gava</td><td>pañcagavam</td><td>a group of five cows</td></tr></table><p>Both types are, in the grammar's own terms, sub-species of the tatpuruṣa. The names are given because they have distinct effects on gender, number, and accent.</p>`],
['Samāsa: Compounds','Bahuvrīhi: The Compound That Points Outside',`<p>In a <i>bahuvrīhi</i> neither member is the head. The compound as a whole describes something else, which is not named. The word itself is an example: <i>bahu-vrīhi</i>, "much rice", means "one who has much rice", a rich man. Rule 2.2.23, <i>śeṣo bahuvrīhiḥ</i>, defines it as the compound that is left over after the other types have been defined.</p><table class="ex"><tr><td>pīta + ambara</td><td>pītāmbara</td><td>having yellow cloth, Viṣṇu</td></tr><tr><td>lamba + udara</td><td>lambodara</td><td>having a hanging belly, Gaṇeśa</td></tr><tr><td>daśa + ānana</td><td>daśānana</td><td>having ten faces, Rāvaṇa</td></tr><tr><td>mahā + bāhu</td><td>mahābāhu</td><td>long-armed</td></tr><tr><td>dvi + pada</td><td>dvipada</td><td>two-footed</td></tr><tr><td>sa + putra</td><td>saputra</td><td>with his son</td></tr></table><p>Most bahuvrīhis have members in the same case, as in <i>pītāmbara</i>, where "yellow" and "cloth" agree. A rarer type has members in different cases, the <i>vyadhikaraṇa</i> bahuvrīhi, such as <i>kaṇṭhe-kāla</i>, "having black in the throat", a name of Śiva.</p><p>The bahuvrīhi works as an adjective, and it takes the gender of the thing it describes. It is therefore a way of making names and epithets, and many of the names of Hindu gods are bahuvrīhis. A reader can often decide whether a compound is a bahuvrīhi by asking whether it refers to a person or thing that is not one of its parts.</p><p>The accent rule at 6.2.1 for the Vedic form says that the first member keeps its accent in this compound.</p>`],
['Samāsa: Compounds','Dvandva: The Compound of Coordination',`<p>A <i>dvandva</i> joins words as if with "and". Rule 2.2.29, <i>cārthe dvandvaḥ</i>, says that a compound is called dvandva when it has the sense of <i>ca</i>, "and". The name means "pair". Both members are equally important and neither is the head.</p><p>There are two main kinds. In the <i>itaretara</i> dvandva the members are counted separately, so the compound is dual or plural, and its gender is that of the last member: <i>Rāma-Lakṣmaṇau</i>, "Rāma and Lakṣmaṇa". In the <i>samāhāra</i> dvandva the members are taken as a collective, and the compound is neuter singular: <i>pāṇi-pādam</i>, "hands and feet", under 2.4.2.</p><table class="ex"><tr><td>Rāma + Lakṣmaṇa</td><td>Rāmalakṣmaṇau</td><td>Rāma and Lakṣmaṇa</td></tr><tr><td>deva + asura</td><td>devāsurāḥ</td><td>gods and demons</td></tr><tr><td>pāṇi + pāda</td><td>pāṇipādam</td><td>hands and feet</td></tr><tr><td>mātṛ + pitṛ</td><td>pitarau</td><td>mother and father</td></tr></table><p>The last example shows an unusual rule. In <i>pitarau</i>, 1.2.70 says that "father" alone may stand for both parents in the dual. Rule 2.2.34, <i>alpāctaram</i>, usually puts the member with fewer vowels first, which explains why <i>Rāma</i> precedes <i>Lakṣmaṇa</i>. The rule has exceptions, as with words of rank or dear persons, and tradition lists them.</p><p>Dvandvas can have many members, and in epic texts long lists of peoples or herbs are made in this way. The grammar also gives special forms for certain kinds of dvandva, so that the compound agrees correctly with the verb in number.</p>`],
['Samāsa: Compounds','Building a Compound Step by Step',`<p>The grammar derives a compound as it derives a verb, one step at a time. Take <i>rājapuruṣa</i>, "the king's man", whose vigraha is <i>rājñaḥ puruṣaḥ</i>.</p><table class="ex"><tr><td>1</td><td>Two words, <i>rājan</i> + genitive and <i>puruṣa</i> + nominative, are semantically connected.</td><td>2.1.1</td></tr><tr><td>2</td><td>The genitive relation licenses a compound.</td><td>2.2.8</td></tr><tr><td>3</td><td>The first member is placed first as the subordinate item.</td><td>2.2.30</td></tr><tr><td>4</td><td>The case ending of the first member is deleted.</td><td>2.4.71</td></tr><tr><td>5</td><td>The stem is now <i>rājan + puruṣa</i>.</td><td></td></tr><tr><td>6</td><td>The final <i>n</i> of a stem in the first member is dropped.</td><td>8.2.7</td></tr><tr><td>7</td><td>An affix at the end adjusts the compound where needed.</td><td>5.4.91</td></tr></table><p>The result is <i>rājapuruṣa</i>, with a new set of endings added to the whole, as with any noun. The details of the last steps depend on the compound. For example, <i>rājan</i> as the final member of a compound usually takes the affix <i>ṭac</i> (5.4.91) and appears as <i>rāja</i>, which is why <i>mahārāja</i> has no <i>n</i>.</p><p>The point of the exercise is to see that a compound is not a loose juxtaposition. It is a formed word with a recipe, and that recipe includes the same sort of ordering, markers, and deletions as the verb. An implementation of compounding in software must therefore treat <i>samāsa</i> as a transformation of a pair of words into one word with its own type, gender, and endings.</p>`],
['Samāsa: Compounds','Samāsa and Sandhi Together',`<p>Compounds and sandhi meet at every joint, and most long Sanskrit words are the result of both. A reader who has the types in mind and can undo the sandhi can take any compound apart.</p><table class="ex"><tr><td>hima + ālaya</td><td>himālaya</td><td>abode of snow: a + ā merge</td></tr><tr><td>mahā + indra</td><td>mahendra</td><td>great Indra: ā + i gives e</td></tr><tr><td>rāma + ayana</td><td>rāmāyaṇa</td><td>Rāma's journey</td></tr><tr><td>vidyā + ālaya</td><td>vidyālaya</td><td>house of learning</td></tr><tr><td>rāja + ṛṣi</td><td>rājarṣi</td><td>royal sage: a + ṛ gives ar</td></tr></table><p>The third example uses two rules. The vowels <i>a</i> and <i>a</i> merge into <i>ā</i> by <i>akaḥ savarṇe dīrghaḥ</i>, and the <i>n</i> of <i>ayana</i> becomes <i>ṇ</i> after the <i>r</i> in <i>rāma</i>, by 8.4.1, <i>raṣābhyāṃ no ṇaḥ samānapade</i>. The title of the epic, <i>Rāmāyaṇa</i>, thus shows a vowel rule from the sixth chapter and a consonant rule from the eighth.</p><p>The prose of the poet Bāṇa, of the seventh century, in works such as the <i>Kādambarī</i>, is famous for compounds that run to a full page, in which several types are nested. A compound can contain a bahuvrīhi inside a tatpuruṣa inside a dvandva. Readers resolve them from the outside in, asking at each level what the main relation is.</p><p>The rule is: first find the type, then undo the sandhi, then translate each part. This works for compounds of two words and also for those of twenty.</p>`]
);

PP.push(
['Pāṇini and Computation','The Ideas a Programmer Recognises',`<p>Readers who know programming languages find much that is familiar in the <i>Aṣṭādhyāyī</i>. It is written in a <b>metalanguage</b>, a special notation for talking about the language, which is distinct from the object language, Sanskrit itself. The metalanguage has its own technical terms, abbreviations, and conventions, set out in the first chapter.</p><p>It uses <b>named classes</b> in the pratyāhāras and the word-lists of the <i>Gaṇapāṭha</i>. It uses <b>flags</b> in the marker letters, which tell later rules how to treat an item and are removed before output. It has <b>inheritance of context</b> in anuvṛtti, where words carry forward into later rules, and <b>scoped blocks</b> in the adhikāra headings. It has <b>null operations</b>, the zero substitutes called <i>luk, ślu,</i> and <i>lup</i>, which delete an affix while leaving its effects, an early use of the idea of zero as an element of a system.</p><p>It has <b>rule ordering</b> and <b>conflict resolution</b>: specific over general, later over earlier, and later passes that earlier ones cannot see. It has <b>recursion</b> in compounds and derived roots, since the output of one operation can be the input of the next. And it aims at <b>economy</b>: the tradition says that a saving of half a short vowel in a rule is as welcome to a grammarian as the birth of a son.</p><p>These are structural parallels, not proof of influence. They are the reason the grammar is studied today as an early formal system.</p>`],
['Pāṇini and Computation','Backus–Naur Form and Pāṇini',`<p>In 1959 the American computer scientist John Backus used a notation to describe the syntax of the programming language ALGOL, and in 1960 Peter Naur used a version of it in the report that defined ALGOL 60. The notation, called Backus–Naur Form (BNF), writes a grammar as a set of rules in which a symbol on the left is defined by an arrangement of symbols on the right. It became the standard way to write the syntax of programming languages.</p><p>In 1967 the computer scientist Peter Zilahy Ingerman suggested in a short note that BNF be called Pāṇini–Backus Form, because of the resemblance to Pāṇini's way of defining a language by rules. The suggestion has been repeated often, and the name is sometimes used. Backus's own notation, however, was developed independently, from the work of the logician Emil Post and from mathematical ideas about rewriting systems, and there is no evidence that he knew of Pāṇini when he wrote it.</p><p>The two notations differ. BNF describes how a sentence may be built from parts, using rules that are context-free: each rule applies in any context. Pāṇini's rules are operations that act on strings, often depend on the sounds on either side, and apply in a fixed order. A better comparison is with rewriting systems and with the production systems of later linguistics.</p><p>The resemblance is real and useful, and the historical link is not shown. Both ideas arose from the wish to describe a language by a small number of precise rules.</p>`],
['Pāṇini and Computation','From Pāṇini to Modern Linguistics',`<p>European scholars discovered Pāṇini in the eighteenth and nineteenth centuries, when Sanskrit became known in the West. Their reaction was admiration. The American linguist Leonard Bloomfield, in his book <i>Language</i> of 1933, described the grammar as one of the greatest achievements of human intelligence, and the method of describing a language by its elements and rules, which he and his followers developed, owed something to it.</p><p>Noam Chomsky's work from the 1950s, which gave the name <i>generative grammar</i> to the idea of a finite set of rules that produces an infinite set of sentences, has been compared with Pāṇini's in many studies. Chomsky has acknowledged the influence of the older tradition. The scholar Frits Staal, in the 1960s and 1980s, argued that Pāṇini's grammar was the first full generative grammar and that its methods had been neglected.</p><p>The linguist Paul Kiparsky, in studies from 1979 and in a series of lectures given in 2002, examined the structure of the grammar and argued that its ordering principles solve problems that modern theories still face. He showed that the interplay of general rules and exceptions in the text is a deliberate design, in which the order of rules and the principle of the special case work together.</p><p>These scholars differ on how far the grammar is a precursor of modern formal methods and how far it must be understood in its own terms. All agree that it is a major achievement, and that it deserves to be read with attention to its own conventions.</p>`],
['Pāṇini and Computation','Pāṇini in Software Today',`<p>Computer scientists and linguists have tried to implement the grammar as a working program. A common approach is to encode the rules as a database and write an engine that applies them in the order the grammar prescribes. A user gives a root and an ending, and the program derives the word step by step, listing each rule used. Such a tool is both a check on the rules and a teaching aid, since it shows a derivation in detail.</p><p>Another approach is to analyse existing text. Programs called morphological analysers read a Sanskrit word and give its possible roots, endings, and meanings, and sandhi splitters find the likely points at which words were joined. The Sanskrit Heritage tools developed by Gérard Huet in France, and the Saṃsādhanī platform of Amba Kulkarni and her group at the University of Hyderabad, are well known examples. They are used for reading and for building searchable collections of Sanskrit texts.</p><p>These programs show difficulties as well as successes. The grammar's implicit conventions, such as the words carried forward by anuvṛtti, must be coded by hand. Conflicts between rules need judgement, and the study of the proper resolution, including the 2022 proposal mentioned earlier, is still going on. A full implementation, covering every rule and every exception in the text, is a long project, and most tools cover only part.</p><p>The work is a good example of a living tradition being studied with new methods, and it gives readers a practical way to test what the rules do.</p>`],
['Pāṇini and Computation','What Is Claimed and What Is Shown',`<p>The title of this book, "4,000 Rules: The Ancient Indian Code Behind Every Compiler", is a popular framing, and it deserves careful reading. Some of it is sound. The <i>Aṣṭādhyāyī</i> contains about four thousand rules. It is a formal system with a metalanguage, an ordering of rules, a means of resolving conflicts, and a way of generating correct forms from basic elements. It is the oldest such complete system known, and it is among the great intellectual works of the ancient world.</p><p>Some of the claim goes further than the evidence. A compiler is a program that translates one language into another, and its techniques, including lexical analysis, parsing, symbol tables, and code generation, were developed in the twentieth century, mostly in Europe and America, from mathematics and engineering. No historical chain links these methods to Pāṇini. The notation used in compilers, BNF, arose independently, though its resemblance to Pāṇini's approach has been noted.</p><p>It is fair to say that Pāṇini anticipated several ideas of formal language theory and showed that a natural language can be described by precise rules. It is not fair to say that modern compilers were built on his code, or that his grammar is a computer program in any literal sense.</p><p>The achievement does not need exaggeration. It stands as a work of great precision, and understanding it correctly is more interesting than a slogan. The reader is invited to check the claims in this book against the sources listed in the reference pages.</p>`],
['Reference','Key Sūtras I: Chapters 1 to 3',`<table class="ex sm"><tr><td>1.1.1</td><td>vṛddhir ādaic</td><td>vṛddhi = ā, ai, au</td></tr><tr><td>1.1.2</td><td>adeṅ guṇaḥ</td><td>guṇa = a, e, o</td></tr><tr><td>1.1.9</td><td>tulyāsyaprayatnaṃ savarṇam</td><td>same place and effort = savarṇa</td></tr><tr><td>1.1.11</td><td>īdūded dvivacanaṃ pragṛhyam</td><td>dual endings ī, ū, e are not joined</td></tr><tr><td>1.1.49</td><td>ṣaṣṭhī sthāneyogā</td><td>genitive means "in place of"</td></tr><tr><td>1.1.51</td><td>uraṇ raparaḥ</td><td>ṛ, ḷ replacements add r, l</td></tr><tr><td>1.1.56</td><td>sthānivad ādeśo 'nalvidhau</td><td>a replacement acts like the original</td></tr><tr><td>1.1.71</td><td>ādir antyena sahetā</td><td>defines pratyāhāra</td></tr><tr><td>1.3.3</td><td>halantyam</td><td>final consonant is a marker</td></tr><tr><td>1.3.9</td><td>tasya lopaḥ</td><td>a marker is deleted</td></tr><tr><td>1.4.2</td><td>vipratiṣedhe paraṃ kāryam</td><td>in conflict the later rule applies</td></tr><tr><td>1.4.14</td><td>suptiṅantaṃ padam</td><td>a word ends in sup or tiṅ</td></tr><tr><td>1.4.109</td><td>paraḥ sannikarṣaḥ saṃhitā</td><td>saṃhitā = closest contact</td></tr><tr><td>2.1.1</td><td>samarthaḥ padavidhiḥ</td><td>word operations need connected meaning</td></tr><tr><td>2.2.23</td><td>śeṣo bahuvrīhiḥ</td><td>the remainder is bahuvrīhi</td></tr><tr><td>2.2.29</td><td>cārthe dvandvaḥ</td><td>"and" sense gives dvandva</td></tr><tr><td>2.4.71</td><td>supo dhātuprātipadikayoḥ</td><td>case endings deleted in compounds</td></tr><tr><td>3.1.68</td><td>kartari śap</td><td>śap inserted for active verbs</td></tr><tr><td>3.4.78</td><td>tiptasjhisip...mahiṅ</td><td>the eighteen verb endings</td></tr></table>`],
['Reference','Key Sūtras II: Chapters 4 to 8',`<table class="ex sm"><tr><td>4.1.2</td><td>svaujasamauṭ...ṅyossup</td><td>the twenty-one noun endings</td></tr><tr><td>4.1.92</td><td>tasyāpatyam</td><td>"his offspring": patronymics</td></tr><tr><td>5.1.119</td><td>tasya bhāvas tvatalau</td><td>-tva, -tā make abstract nouns</td></tr><tr><td>5.4.91</td><td>rājāhaḥsakhibhyaṣ ṭac</td><td>ṭac at the end of certain compounds</td></tr><tr><td>6.1.77</td><td>iko yaṇ aci</td><td>i, u, ṛ, ḷ become y, v, r, l before a vowel</td></tr><tr><td>6.1.78</td><td>eco 'yavāyāvaḥ</td><td>e, o, ai, au become ay, av, āy, āv</td></tr><tr><td>6.1.87</td><td>ād guṇaḥ</td><td>a + simple vowel gives guṇa</td></tr><tr><td>6.1.88</td><td>vṛddhir eci</td><td>a + e, o, ai, au gives vṛddhi</td></tr><tr><td>6.1.101</td><td>akaḥ savarṇe dīrghaḥ</td><td>similar vowels merge long</td></tr><tr><td>6.3.109</td><td>pṛṣodarādīni yathopadiṣṭam</td><td>certain irregular forms as taught</td></tr><tr><td>7.1.1</td><td>yuvor anākau</td><td>yu, vu become ana, aka</td></tr><tr><td>7.3.84</td><td>sārvadhātukārdhadhātukayoḥ</td><td>guṇa before verbal endings</td></tr><tr><td>8.2.1</td><td>pūrvatrāsiddham</td><td>later block invisible to earlier rules</td></tr><tr><td>8.2.39</td><td>jhalāṃ jaśo 'nte</td><td>final stops become unaspirated voiced</td></tr><tr><td>8.2.66</td><td>sasajuṣo ruḥ</td><td>final s becomes ru</td></tr><tr><td>8.3.15</td><td>kharavasānayor visarjanīyaḥ</td><td>ru becomes visarga at a pause</td></tr><tr><td>8.3.23</td><td>mo 'nusvāraḥ</td><td>final m becomes anusvāra</td></tr><tr><td>8.4.1</td><td>raṣābhyāṃ no ṇaḥ samānapade</td><td>n becomes ṇ after r, ṣ</td></tr><tr><td>8.4.40</td><td>stoḥ ścunā ścuḥ</td><td>dentals become palatals near palatals</td></tr><tr><td>8.4.68</td><td>a a</td><td>the short a is closed in pronunciation</td></tr></table>`],
['Reference','Glossary of Terms',`<table class="ex sm"><tr><td><b>adhikāra</b></td><td>a heading whose force runs over a block of rules</td></tr><tr><td><b>aṅga</b></td><td>the stem to which an ending is added</td></tr><tr><td><b>anuvṛtti</b></td><td>carrying a word forward from an earlier rule</td></tr><tr><td><b>apavāda</b></td><td>a specific rule that overrides a general one</td></tr><tr><td><b>asiddha</b></td><td>treated as not having applied</td></tr><tr><td><b>guṇa, vṛddhi</b></td><td>first and second grades of vowel strengthening</td></tr><tr><td><b>it</b></td><td>a marker letter, removed before output</td></tr><tr><td><b>kāraka</b></td><td>a role of a noun in relation to the verb</td></tr><tr><td><b>kṛt, taddhita</b></td><td>affixes forming nouns from roots, and from nouns</td></tr><tr><td><b>lakāra</b></td><td>an abstract tense or mood affix</td></tr><tr><td><b>paribhāṣā</b></td><td>a rule of interpretation</td></tr><tr><td><b>pratyāhāra</b></td><td>a short name for a run of sounds</td></tr><tr><td><b>pratyaya</b></td><td>an affix</td></tr><tr><td><b>samāsa</b></td><td>a compound</td></tr><tr><td><b>sandhi</b></td><td>change of sounds where elements meet</td></tr><tr><td><b>saṃjñā</b></td><td>a technical term, or a rule defining one</td></tr><tr><td><b>sūtra</b></td><td>a rule, an aphorism</td></tr><tr><td><b>sup, tiṅ</b></td><td>noun endings and verb endings</td></tr><tr><td><b>tripādī</b></td><td>the last three sections, 8.2 to 8.4</td></tr><tr><td><b>utsarga</b></td><td>a general rule</td></tr><tr><td><b>vigraha</b></td><td>a phrase that explains a compound</td></tr></table>`],
['Reference','The Grammar and the Reader',`<p>This book has followed the <i>Aṣṭādhyāyī</i> from its framework to its parts, through nouns and cases, verbs, word formation, accent and the Veda, and the commentators, and then into formal languages, code, compilers, Sanskrit language technology, and ten projects, then into the evidence on writing and oral transmission, the algorithms of Āryabhaṭa, thirty rules taken apart, the generative architecture, and a comparison with the Tamil grammar, before turning to ways of learning the grammar. The tool-kit of the Śiva Sūtras and the pratyāhāras, the rules for reading a sūtra, the kinds of rule, and the principles of conflict and order explained how the system is built. The eight chapters were then summarised in turn, from the terms of the first to the final phonetics of the eighth.</p><p>Vowel sandhi, consonant sandhi, and visarga were set out with rule numbers and examples, and the four types of compound, with their sub-types, were shown with the steps of a derivation. The last part placed the work in the history of ideas about formal languages and corrected the popular claim that connects it with every compiler.</p><p>Four points are worth taking away. The grammar is a generative system, in which words are derived and not merely listed. Its notation is compressed but exact, and every convention can be learnt. The order of rules is part of its meaning. And its value does not depend on claims about modern technology.</p><p>For the wider work of Cultural Musings, the reader may visit www.culturalmusings.com.</p>`]
);


PP.push(
['Nouns and Cases','Stems and the Twenty-One Endings',`<p>A Sanskrit noun is a <i>prātipadika</i>, a stem, plus one of twenty-one endings. Rule 1.2.45, <i>arthavad adhātur apratyayaḥ prātipadikam</i>, defines a stem as a meaningful form that is neither a root nor an affix. The endings, named <i>sup</i>, are listed in the long rule 4.1.2 and are arranged in seven cases and three numbers: singular, dual, and plural.</p><table class="ex"><tr><td></td><td>Sing.</td><td>Dual</td><td>Plural</td></tr><tr><td>1st</td><td>su</td><td>au</td><td>jas</td></tr><tr><td>2nd</td><td>am</td><td>auṭ</td><td>śas</td></tr><tr><td>3rd</td><td>ṭā</td><td>bhyām</td><td>bhis</td></tr><tr><td>4th</td><td>ṅe</td><td>bhyām</td><td>bhyas</td></tr><tr><td>5th</td><td>ṅasi</td><td>bhyām</td><td>bhyas</td></tr><tr><td>6th</td><td>ṅas</td><td>os</td><td>ām</td></tr><tr><td>7th</td><td>ṅi</td><td>os</td><td>sup</td></tr></table><p>These are the abstract forms. The letters at their edges, such as <i>s</i> and <i>j</i> in <i>su</i> and <i>jas</i>, are markers that are deleted, and later rules turn the rest into visible endings. The name <i>sup</i> itself comes from the first letter <i>su</i> and the last letter <i>p</i>, a pratyāhāra that covers the whole list. The system thus names all twenty-one endings in one word, just as <i>tiṅ</i> names the verb endings.</p>`],
['Nouns and Cases','The Cases and Their Meanings',`<p>The cases are numbered in the grammar from the first to the seventh, and a separate form, the vocative, is added by 2.3.47, <i>sambodhane ca</i>. The first case is used by 2.3.46 for the bare meaning of the stem, its gender and number, and also for the agent when the verb has already expressed it. The later cases mark roles in relation to the verb or to another noun.</p><table class="ex"><tr><td>1st</td><td>rāmaḥ</td><td>the agent, or the subject</td></tr><tr><td>2nd</td><td>rāmam</td><td>the object; goal of motion</td></tr><tr><td>3rd</td><td>rāmeṇa</td><td>"by, with": agent or instrument</td></tr><tr><td>4th</td><td>rāmāya</td><td>"to, for": recipient or purpose</td></tr><tr><td>5th</td><td>rāmāt</td><td>"from": point of separation</td></tr><tr><td>6th</td><td>rāmasya</td><td>"of": relation in general</td></tr><tr><td>7th</td><td>rāme</td><td>"in, on": place or time</td></tr><tr><td>voc.</td><td>he rāma</td><td>"O Rāma": address</td></tr></table><p>The meanings listed are the commonest ones, not the only ones. As the page on the kārakas showed, a case does not equal a role. The second case, for example, also marks the duration of time ("for three days") and the object of verbs of motion. The sixth case is a catch-all, defined by 2.3.50, <i>ṣaṣṭhī śeṣe</i>, as the case for relations not covered by the others, which is why it translates so many English uses of "of".</p>`],
['Nouns and Cases','Declining rāma',`<p>The stem <i>rāma</i>, a masculine noun ending in short <i>a</i>, is the model for a very large class. Its forms are given below in the traditional order, case by case.</p><table class="ex sm"><tr><td></td><td>Singular</td><td>Dual</td><td>Plural</td></tr><tr><td>1st</td><td>rāmaḥ</td><td>rāmau</td><td>rāmāḥ</td></tr><tr><td>2nd</td><td>rāmam</td><td>rāmau</td><td>rāmān</td></tr><tr><td>3rd</td><td>rāmeṇa</td><td>rāmābhyām</td><td>rāmaiḥ</td></tr><tr><td>4th</td><td>rāmāya</td><td>rāmābhyām</td><td>rāmebhyaḥ</td></tr><tr><td>5th</td><td>rāmāt</td><td>rāmābhyām</td><td>rāmebhyaḥ</td></tr><tr><td>6th</td><td>rāmasya</td><td>rāmayoḥ</td><td>rāmāṇām</td></tr><tr><td>7th</td><td>rāme</td><td>rāmayoḥ</td><td>rāmeṣu</td></tr><tr><td>Voc.</td><td>he rāma</td><td>he rāmau</td><td>he rāmāḥ</td></tr></table><p>Each form has a derivation. In <i>rāmeṇa</i>, the ending <i>ṭā</i> is replaced by <i>ina</i> after a stem in <i>a</i> (7.1.12, <i>ṭāṅasiṅasām inātsyāḥ</i>), and <i>a</i> plus <i>i</i> gives <i>e</i> (6.1.87), so <i>rāma + ina</i> becomes <i>rāmena</i>. The <i>n</i> then becomes <i>ṇ</i> after the <i>r</i> (8.4.1), giving <i>rāmeṇa</i>. In the plural instrumental, <i>bhis</i> becomes <i>ais</i> (7.1.9). Before <i>bhyām</i> the vowel is lengthened (7.3.102), and before <i>bhyas</i> and <i>su</i> it becomes <i>e</i> (7.3.103). In the genitive plural, 6.4.3 lengthens the vowel before <i>ām</i>, and 8.4.1 changes the <i>n</i>, so <i>rāma + nām</i> becomes <i>rāmāṇām</i>.</p>`],
['Nouns and Cases','Other Kinds of Stem',`<p>Stems are grouped by their final sound, and each group follows a model. Learning a group means learning the changes before the endings, and the grammar states them by rule. A student who knows the model can decline any word of the group.</p><table class="ex sm"><tr><td>Model</td><td>Type</td><td>Nom. sg.</td><td>Gen. sg.</td></tr><tr><td>rāma</td><td>masc. in a</td><td>rāmaḥ</td><td>rāmasya</td></tr><tr><td>hari</td><td>masc. in i</td><td>hariḥ</td><td>hareḥ</td></tr><tr><td>guru</td><td>masc. in u</td><td>guruḥ</td><td>guroḥ</td></tr><tr><td>ramā</td><td>fem. in ā</td><td>ramā</td><td>ramāyāḥ</td></tr><tr><td>nadī</td><td>fem. in ī</td><td>nadī</td><td>nadyāḥ</td></tr><tr><td>phala</td><td>neuter in a</td><td>phalam</td><td>phalasya</td></tr><tr><td>rājan</td><td>masc. in an</td><td>rājā</td><td>rājñaḥ</td></tr><tr><td>marut</td><td>masc. in t</td><td>marut</td><td>marutaḥ</td></tr></table><p>The neuter forms differ in the nominative and accusative. After a stem in <i>a</i>, a neuter takes <i>am</i> there (7.1.24, <i>ato 'm</i>), giving <i>phalam</i>, while 7.1.23, <i>svamor napuṃsakāt</i>, deletes the ending after other neuter stems. The genitive of <i>rājan</i>, <i>rājñaḥ</i>, shows the loss of a vowel before an ending that begins with a vowel, a change the grammar states for stems in <i>an</i>.</p><p>The consonant stems, such as <i>marut</i>, show the sandhi rules at work in the declension itself: the final <i>t</i> is kept before vowels and changed before some consonants.</p>`],
['Nouns and Cases','Gender and Number',`<p>Sanskrit has three genders, masculine, feminine, and neuter, and three numbers. Gender is a property of the word and is learnt with it. Pāṇini does not assign it by rule in the <i>Aṣṭādhyāyī</i> but gives a separate list, the <i>Liṅgānuśāsana</i>, together with general indications by the final sound of the stem. Stems in <i>ā</i> and <i>ī</i> are usually feminine, and stems in <i>a</i> are masculine or neuter, but there are many exceptions.</p><p>Number is more regular. The dual is used for exactly two, and a verb agrees with its subject in number and person.</p><table class="ex"><tr><td>bālakaḥ gacchati</td><td>The boy goes.</td></tr><tr><td>bālakau gacchataḥ</td><td>The two boys go.</td></tr><tr><td>bālakāḥ gacchanti</td><td>The boys go.</td></tr><tr><td>phalāni patanti</td><td>Fruits fall.</td></tr></table><p>The neuter plural in the nominative and accusative is formed differently. The ending is replaced by <i>śi</i> (7.1.20, <i>jaśśasoḥ śiḥ</i>), and a nasal <i>n</i> is inserted before the last vowel of the stem (7.1.72), so that <i>phala</i> gives <i>phalāni</i>. A neuter plural subject is the one case where the verb is plural although the noun looks like a collective.</p><p>Some nouns are always plural or always singular, and some compounds change number, such as the samāhāra dvandva, which is neuter singular even though it refers to several things. These details are collected in the commentaries.</p>`],
['Nouns and Cases','Pronouns and Numerals',`<p>Pronouns follow their own patterns. Rule 1.1.27, <i>sarvādīni sarvanāmāni</i>, names the pronoun class by its first member, <i>sarva</i>, "all", and the word list, <i>sarvādi</i>, in the <i>Gaṇapāṭha</i> gives the others: <i>viśva, ubha, anya, anyatara, itara, tad, yad, etad, idam, adas, kim,</i> and more. This class has special endings. In the dative singular the ending <i>ṅe</i> becomes <i>smai</i> (7.1.14, <i>sarvanāmnaḥ smai</i>), and in the ablative and locative singular <i>ṅasi</i> and <i>ṅi</i> become <i>smāt</i> and <i>smin</i> (7.1.15), so <i>sarva</i> gives <i>sarvasmai, sarvasmāt, sarvasmin</i>.</p><table class="ex"><tr><td>saḥ, sā, tat</td><td>he, she, it; that</td></tr><tr><td>kaḥ, kā, kim</td><td>who, which, what</td></tr><tr><td>ayam, iyam, idam</td><td>this</td></tr><tr><td>aham</td><td>I</td></tr><tr><td>tvam</td><td>you</td></tr></table><p>The first and second person pronouns, <i>asmad</i> and <i>yuṣmad</i>, do not distinguish gender. The numerals have a pattern of their own. <i>Eka</i>, "one", is singular and a pronoun-like word, <i>dvi</i>, "two", is always dual, and <i>tri</i>, "three", and <i>catur</i>, "four", are plural and show all three genders. From five to ten the numerals do not change by gender, and they are declined like nouns, or not at all.</p><p>These forms are the ones a beginner meets most often, and they are the ones for which the traditional tables must be learnt by heart.</p>`],
